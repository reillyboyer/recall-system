/* ── Read a page body (recursive, paginated) ── */
async function ibReadBlocks(blockId, depth, out){
  let cursor = null, guard = 0;
  do{
    const qs = '?page_size=100' + (cursor ? '&start_cursor='+encodeURIComponent(cursor) : '');
    const res = await nGet('/blocks/'+fmtId(blockId)+'/children'+qs);
    for(const b of (res.results||[])){
      const t = b.type, data = b[t] || {};
      const text = t==='equation' ? '$$'+(data.expression||'')+'$$' : (data.rich_text || data.title || []).map(x=>x.type==='equation' && x.equation ? '$'+x.equation.expression+'$' : x.plain_text).join('');
      let kind = 'p';
      if(t==='heading_1') kind='h1'; else if(t==='heading_2') kind='h2'; else if(t==='heading_3') kind='h3';
      else if(t==='bulleted_list_item') kind='li'; else if(t==='numbered_list_item') kind='num';
      else if(t==='to_do') kind='todo'; else if(t==='quote') kind='quote'; else if(t==='callout') kind='callout';
      else if(t==='code') kind='code'; else if(t==='toggle') kind='toggle'; else if(t==='divider') kind='hr';
      else if(t==='image') kind='img';
      else if(t==='child_page'){ kind='p'; }
      if(kind==='img'){
        const f = data.file ? data.file.url : (data.external ? data.external.url : '');
        const cap = (data.caption||[]).map(x=>x.plain_text).join('');
        out.push({kind, text:cap, url:f, depth});
      } else if(kind==='hr' || text.trim()){
        out.push({kind, text, depth, checked: !!data.checked});
      }
      if(b.has_children && depth < 4 && t!=='child_page' && t!=='child_database'){
        try{ await ibReadBlocks(b.id, depth+1, out); }catch(e){}
      }
    }
    cursor = res.has_more ? res.next_cursor : null; guard++;
  } while(cursor && guard < 30);
  return out;
}
function ibBlocksToText(blocks){
  let num = 0;
  return blocks.map(b=>{
    const pad = '  '.repeat(b.depth||0);
    if(b.kind!=='num') num = 0;
    switch(b.kind){
      case 'h1': return '\n# '+b.text;
      case 'h2': return '\n## '+b.text;
      case 'h3': return '\n### '+b.text;
      case 'li': return pad+'- '+b.text;
      case 'num': num++; return pad+num+'. '+b.text;
      case 'todo': return pad+(b.checked?'[x] ':'[ ] ')+b.text;
      case 'quote': return pad+'> '+b.text;
      case 'hr': return '---';
      case 'img': return pad+'[image'+(b.text?': '+b.text:'')+']';
      default: return pad+b.text;
    }
  }).join('\n').trim();
}
async function ibEnsureBody(id, holder){
  if(holder.body && (holder.body.st==='ok' || holder.body.st==='loading')) return;
  holder.body = {st:'loading', blocks:[], text:''};
  render();
  try{
    const blocks = await ibReadBlocks(id, 0, []);
    holder.body = {st:'ok', blocks, text: ibBlocksToText(blocks)};
  }catch(e){ holder.body = {st:'error', msg:e.message, blocks:[], text:''}; }
  if(currentTab==='inbox') render();
}

/* ── Claude API (through your own Val Town endpoint; the key never lives in this file) ── */
function aiReady(){ return !!(creds.aiUrl && creds.aiKey); }
async function aiCall({system, user, maxTokens, onText}){
  if(!aiReady()) throw new Error('Claude is not set up. Add the AI endpoint URL and app key in Settings.');
  let r;
  try{
    r = await fetch(creds.aiUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-App-Key':creds.aiKey},
      body: JSON.stringify({model: creds.aiModel || AI_MODEL_DEFAULT, max_tokens: maxTokens||4000, stream:true, system, messages:[{role:'user', content:user}]})
    });
  }catch(e){ throw new Error('Could not reach the AI endpoint ('+e.message+'). Check the URL in Settings.'); }
  if(!r.ok){
    const t = await r.text(); let m = t;
    try{ const j = JSON.parse(t); m = (j.error && (j.error.message||j.error.type)) || t; }catch(e){}
    throw new Error(`AI endpoint ${r.status}: ${String(m).slice(0,300)}`);
  }
  const reader = r.body.getReader(); const dec = new TextDecoder();
  let buf = '', out = '', stop = '';
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let i;
    while((i = buf.indexOf('\n\n')) >= 0){
      const evt = buf.slice(0, i); buf = buf.slice(i+2);
      const line = evt.split('\n').find(l=>l.startsWith('data:'));
      if(!line) continue;
      let j; try{ j = JSON.parse(line.slice(5).trim()); }catch(e){ continue; }
      if(j.type==='content_block_delta' && j.delta && j.delta.type==='text_delta'){ out += j.delta.text; if(onText) onText(out); }
      else if(j.type==='message_delta' && j.delta && j.delta.stop_reason) stop = j.delta.stop_reason;
      else if(j.type==='error') throw new Error('Claude: '+((j.error&&j.error.message)||'stream error'));
    }
  }
  return {text: out, stop};
}
function aiJson(text){
  const clean = String(text||'').replace(/```json|```/g,'').trim();
  const a = clean.indexOf('['), b = clean.lastIndexOf(']');
  return JSON.parse(a>=0 && b>a ? clean.slice(a, b+1) : clean);
}


/* ════════════════════════════════════════════════════════════════════════
 *  INBOX, rebuilt around the Library.
 *  Thread Queue: Read (editable working copy) → Fragment (round trip through
 *  a Claude conversation, see the Fragmenting Round Trip KB) → Connect
 *  (Knowledge Bank topics, a peek into each topic's shelves, a short wander
 *  to neighbouring and distant topics) → Commit.
 *  Stand-alones: tag topics by hand, peek, link / dock / pair, save.
 * ════════════════════════════════════════════════════════════════════════ */
const LATTICE_EXCLUDED = new Set(['thread pending','stand alone ideas (processed)','thread queue','revisit','archived','look into (next up)','look into (future)','layout']);
function isLatticeType(t){
  if(!t || t==='(untyped)') return false;
  if(LATTICE_EXCLUDED.has(String(t).toLowerCase().trim())) return false;
  if(isSaInboxType(t)) return false;
  return true;
}
const IB_STEPS = [
  {v:'read',     label:'Read'},
  {v:'fragment', label:'Talk it through'},
  {v:'connect',  label:'Connect'},
  {v:'commit',   label:'Commit'}
];
const IB_DRAFT_V = 2;
const IB_KB_PROP = '🌐 Knowledge Bank';
const IB_START = '=== THREAD NOTES ===', IB_END = '=== END THREAD NOTES ===';

/* ── Knowledge Bank topic helpers ── */
function ibKbReady(){
  if(vs.loadSt==='idle'){ setTimeout(vizLoad, 0); vs.loadSt = 'loading'; }
  if(!lib.kbSt){ setTimeout(libLoadKb, 0); lib.kbSt = 'loading'; }
  return vs.loadSt==='ok' && lib.kbSt==='ok';
}
function ibTopicPath(id){ return libPath(id).map(p=>lib.topics[p].title).join(' / '); }
let _ibTopicIdx = null;
function ibTopicIdx(){
  if(_ibTopicIdx && _ibTopicIdx.topics===lib.topics) return _ibTopicIdx;
  const byPath = new Map(), byTitle = new Map();
  for(const t of Object.values(lib.topics)){
    byPath.set(ibTopicPath(t.id).toLowerCase(), t.id);
    const k = t.title.toLowerCase(); if(!byTitle.has(k)) byTitle.set(k, []); byTitle.get(k).push(t.id);
  }
  _ibTopicIdx = {topics: lib.topics, byPath, byTitle};
  return _ibTopicIdx;
}
function _ibNorm(s){ return String(s||'').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim().toLowerCase(); }
/* A topic reference is an existing topic id, 'new:<key>' (proposed this round), or 'x:<raw>' (unresolved). */
function ibResolveRef(raw, newTopics){
  const X = ibTopicIdx(); const n = _ibNorm(raw);
  if(!n) return null;
  if(X.byPath.has(n)) return X.byPath.get(n);
  const leaf = n.split(' / ').pop();
  const nt = (newTopics||[]).find(t=>t.title.toLowerCase()===n || t.title.toLowerCase()===leaf);
  if(nt) return 'new:'+nt.key;
  const hits = X.byTitle.get(leaf) || [];
  if(hits.length===1) return hits[0];
  if(hits.length>1){   // ambiguous leaf — prefer the one whose path ends with what was given
    const m = hits.find(id=>ibTopicPath(id).toLowerCase().endsWith(n)); if(m) return m;
  }
  return 'x:'+String(raw).trim();
}
function ibRefLabel(ref, d){
  if(!ref) return '';
  if(ref.startsWith('new:')){ const t = (d.newTopics||[]).find(x=>'new:'+x.key===ref); return t ? t.title : '(new topic)'; }
  if(ref.startsWith('x:')) return ref.slice(2);
  return lib.topics[ref] ? lib.topics[ref].title : '(missing topic)';
}
function ibRefTitlePath(ref, d){
  if(ref && !ref.startsWith('new:') && !ref.startsWith('x:') && lib.topics[ref]) return ibTopicPath(ref);
  return ibRefLabel(ref, d);
}
function ibRefColor(ref){
  if(!ref || ref.startsWith('new:') || ref.startsWith('x:') || !lib.topics[ref]) return '#9a8b78';
  const X = libIndex(); return X.color.get(X.rootOf(ref)) || '#9a8b78';
}
function ibTopicChip(ref, d, opts){
  opts = opts || {};
  const cls = ref.startsWith('x:') ? ' unres' : ref.startsWith('new:') ? ' isnew' : '';
  return `<span class="ib2-topic${cls}${opts.on?' on':''}" style="--cloth:${ibRefColor(ref)}" title="${esc(ibRefTitlePath(ref, d))}">
    ${opts.peek && !ref.startsWith('x:') && !ref.startsWith('new:') ? `<button class="ib2-topic-b" onclick="ibPeek('${opts.peek}','${ref}')">${esc(ibRefLabel(ref, d))}</button>` : `<span class="ib2-topic-b">${ref.startsWith('new:')?'new: ':''}${esc(ibRefLabel(ref, d))}</span>`}
    ${opts.remove ? `<button class="ib-x" onclick="${opts.remove}" aria-label="Remove topic">×</button>` : ''}
  </span>`;
}

/* ── Drafts ── */
function ibDraft(item){
  let d = ib.drafts[item.id];
  if(!d || d.v!==IB_DRAFT_V){
    const pageKb = ((item.rels||{})[IB_KB_PROP]||[]).map(fmtId);
    d = ib.drafts[item.id] = {v:IB_DRAFT_V, step:'read', method: item.method==='Retroactive'?'Retroactive':'Upfront',
      gist:'', threadName:'', work:null, editing:false, pasted:'', parseMsg:'',
      frags:[], threadTopics:pageKb, newTopics:[], links:[], notes:[], extraRels:{},
      teach:'', uses:[], bodyWritten:false,
      active:null, created:{}, createdTopics:{}, seq:0};
    ibSaveDrafts();
  }
  return d;
}
function ibCurDraft(){ const it = ibOpenItem(); return it && it.kind==='tq' ? ibDraft(it) : null; }
function ibFrag(d, uid){ return d.frags.find(f=>f.uid===uid); }
function ibFragNum(d, uid){ return d.frags.findIndex(f=>f.uid===uid) + 1; }
function ibSetStep(v){ const d = ibCurDraft(); if(!d) return; d.step = v; ib.compose = null; ib.pick = null; ibSaveDrafts(); render(); window.scrollTo(0,0); }
function ibSetMethod(m){ const d = ibCurDraft(); if(!d) return; d.method = m; ibSaveDrafts(); render(); }
function ibSetGist(v){ const d = ibCurDraft(); if(!d) return; d.gist = v; ibSaveDrafts(); }
function ibSetThreadName(v){ const d = ibCurDraft(); if(!d) return; d.threadName = v; ibSaveDrafts(); }
function ibOpen(id){
  ib.openId = id; ib.compose = null; ib.commit = null; ib.pick = null;
  const it = ibItem(id);
  if(it){ const holder = it.kind==='tq' ? ibDraft(it) : ibSaState(id); ibEnsureBody(id, holder); }
  render(); window.scrollTo(0,0);
}
function ibClose(){ ib.openId = null; ib.compose = null; ib.commit = null; ib.pick = null; render(); }
function ibSetLane(l){ ib.lane = l; ib.openId = null; ib.compose = null; render(); }
function ibNext(kind){ const next = ibPending(kind)[0]; if(next) ibOpen(next.id); else ibClose(); }
function ibExtraRelRemove(relProp, id){
  const d = ibCurDraft(); if(!d || !d.extraRels[relProp]) return;
  d.extraRels[relProp] = d.extraRels[relProp].filter(x=>x!==id);
  if(!d.extraRels[relProp].length) delete d.extraRels[relProp];
  ibSaveDrafts(); render();
}

/* ── Read: an editable working copy (Notion keeps the original until the page is archived) ── */
function ibWorkText(d){ return d.work!=null ? d.work : (d.body && d.body.text) || ''; }
function ibEditToggle(){
  const d = ibCurDraft(); if(!d) return;
  if(!d.editing && d.work==null) d.work = (d.body && d.body.text) || '';
  d.editing = !d.editing; ibSaveDrafts(); render();
  if(d.editing) setTimeout(()=>{ const el = document.getElementById('ib-work'); if(el) el.focus(); }, 30);
}
function ibWorkInput(v){ const d = ibCurDraft(); if(!d) return; d.work = v; ibSaveDrafts(); }
function ibWorkReset(){
  const d = ibCurDraft(); if(!d) return;
  if(!confirm('Throw away your edits and go back to the text on the Notion page?')) return;
  d.work = null; d.editing = false; ibSaveDrafts(); render();
}
function ibWorkHtml(text){
  // Light rendering of the markdown-ish working copy for reading.
  return text.split('\n').map(line=>{
    const t = esc(line.replace(/^\s+/,''));
    const pad = (line.match(/^\s*/)[0].length/2|0)*18;
    if(/^#\s/.test(line)) return `<h3 class="ib-h1">${t.slice(2)}</h3>`;
    if(/^##\s/.test(line)) return `<h4 class="ib-h2">${t.slice(3)}</h4>`;
    if(/^###\s/.test(line)) return `<h5 class="ib-h3">${t.slice(4)}</h5>`;
    if(/^\s*[-*]\s/.test(line)) return `<div class="ib-li" style="margin-left:${pad}px">${t.replace(/^[-*]\s/,'')}</div>`;
    if(/^\s*&gt;\s/.test(esc(line))) return `<blockquote class="ib-quote">${t.replace(/^&gt;\s/,'')}</blockquote>`;
    if(/^---$/.test(line.trim())) return `<hr class="ib-hr">`;
    return t.trim() ? `<p style="margin-left:${pad}px">${t}</p>` : '';
  }).join('');
}

/* ── Fragment: the round trip ── */
function ibPackage(it, d){
  const groups = ibRelGroups({...it.rels, ...d.extraRels}).filter(g=>g.relProp!==IB_KB_PROP);
  const relLines = groups.map(g=>`${g.kind==='goals'?'Purpose':'Source'} (${g.db}): ${g.ids.map(ibRelTitle).join('; ')}`);
  const pageTopics = d.threadTopics.filter(r=>lib.topics[r]).map(ibTopicPath);
  const all = Object.keys(lib.topics).map(ibTopicPath).sort((a,b)=>a.localeCompare(b));
  return [
    'Be my curious listener for this Thread Queue page, following the Processing Conversation knowledge base in this project.',
    'Ask me to explain it in my own words, ask follow-ups where my explanation is fuzzy, then ask what I want to keep and how I will use it.',
    'Do not write the ideas for me. When I say I am done, assemble MY words (grammar cleaned, filler trimmed) into the block:',
    `${IB_START} / --- TEACH-BACK --- … --- END TEACH-BACK --- / one kept item per line: <ID> | <text> | Builds On / Connected to / Topics / Use: <text> lines / Thread topics / New topic lines / ${IB_END}`,
    'IDs: C = idea, P = pattern, S = story, RC = context or example, RCQ = question answerable here, OL = open loop. Use topic paths exactly as listed at the end.',
    '',
    `TITLE: ${it.title}`,
    `METHOD: ${d.method}`,
    ...(relLines.length ? relLines : []),
    pageTopics.length ? `TOPICS ALREADY ON THE PAGE: ${pageTopics.join('; ')}` : 'TOPICS ALREADY ON THE PAGE: none',
    '',
    'MATERIAL:',
    '<<<',
    ibWorkText(d).trim(),
    '>>>',
    '',
    `KNOWLEDGE BANK TOPICS (${all.length}):`,
    ...all
  ].join('\n');
}
async function ibCopyPackage(){
  const it = ibOpenItem(); const d = ibCurDraft(); if(!it || !d) return;
  if(!ibKbReady()){ _mmToast('Still loading your Knowledge Bank. Try again in a moment.'); return; }
  if(!ibWorkText(d).trim()){ _mmToast('There is no material to send. Add it on the Notion page or in the Read step.'); return; }
  const text = ibPackage(it, d);
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){}
  if(!ok){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ ok = document.execCommand('copy'); }catch(e){} ta.remove();
  }
  ib.copied = ok ? it.id : null;
  _mmToast(ok ? 'Copied. Paste it into a conversation in your Threads project.' : 'Copy failed. Your browser blocked the clipboard.');
  render();
}
function ibPasteInput(v){ const d = ibCurDraft(); if(d){ d.pasted = v; ibSaveDrafts(); } }
function _ibTypeOf(id){
  const p = id.replace(/\d.*$/,'').toUpperCase();
  return p==='RCQ' ? 'Referential CQ' : p==='RC' ? 'Referential C' : p==='OL' ? 'Open Loop' : p==='C' ? 'Core Idea' : p==='P' ? 'Pattern' : p==='S' ? 'Story' : null;
}
function _ibSplitList(v){ return String(v||'').split(/\s*[,;]\s*/).map(s=>s.trim()).filter(Boolean); }
function ibParseReturn(raw){
  let text = String(raw||'');
  const a = text.lastIndexOf(IB_START);
  if(a>=0){ const b = text.indexOf(IB_END, a); text = text.slice(a+IB_START.length, b>a ? b : undefined); }
  let teach = '';
  const tm = text.match(/-{2,}\s*TEACH-?BACK\s*-{2,}([\s\S]*?)-{2,}\s*END\s+TEACH-?BACK\s*-{2,}/i);
  if(tm){ teach = tm[1].replace(/^\s*\n|\n\s*$/g,'').split('\n').map(l=>l.trimEnd()).join('\n').replace(/\n{3,}/g,'\n\n').trim(); text = text.replace(tm[0], '\n'); }
  const uses = [];
  const lines = text.split('\n').map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s+(?=[A-Za-z]{1,3}\d)/,'').trim()).filter(Boolean);
  const frags = [], threadRaw = [], newRaw = [], warnings = [];
  for(const line of lines){
    let m;
    if((m = line.match(/^(?:thread topics|suggested knowledge bank topics)\s*:\s*(.*)$/i))){ threadRaw.push(..._ibSplitList(m[1])); continue; }
    if((m = line.match(/^new topic\s*:\s*(.*)$/i))){
      const parts = m[1].split(/\s+\|\s+/);
      const nt = {title: parts[0].trim(), parentRaw:'', othersRaw:[], why:''};
      parts.slice(1).forEach(p=>{ const kv = p.match(/^([^:]+):\s*(.*)$/); if(!kv) return; const k = kv[1].trim().toLowerCase();
        if(k==='parent') nt.parentRaw = kv[2].trim(); else if(k.startsWith('other')) nt.othersRaw = _ibSplitList(kv[2]); else if(k==='why') nt.why = kv[2].trim(); });
      if(nt.title) newRaw.push(nt);
      continue;
    }
    if((m = line.match(/^([A-Za-z]{1,3}\d+[a-z]?)\s*\|\s*(.+)$/))){
      const type = _ibTypeOf(m[1]);
      const parts = m[2].split(/\s+\|\s+/);
      const f = {lid:m[1].toUpperCase(), type: type||'Core Idea', text: parts[0].trim(), b:[], c:[], topicsRaw:[], relation:''};
      if(!type) warnings.push(`${m[1]}: unknown ID prefix, treated as a Core Idea.`);
      parts.slice(1).forEach(p=>{ const kv = p.match(/^([^:]+):\s*(.*)$/); if(!kv){ f.text += ' | '+p; return; } const k = kv[1].trim().toLowerCase();
        if(k==='builds on') f.b = _ibSplitList(kv[2]).map(x=>x.toUpperCase());
        else if(k.startsWith('connected')) f.c = _ibSplitList(kv[2]).map(x=>x.toUpperCase());
        else if(k==='topics' || k==='topic') f.topicsRaw = _ibSplitList(kv[2]);
        else if(k==='relation') f.relation = kv[2].trim();
        else if(k!=='source' && k!=='goals') warnings.push(`${m[1]}: ignored unknown field "${kv[1].trim()}".`); });
      if(f.text) frags.push(f);
      continue;
    }
    if((m = line.match(/^use\s*:\s*(.+)$/i))){ uses.push(m[1].trim()); continue; }
    if(/^source\s*:/i.test(line)) continue;
    warnings.push('Skipped a line that isn\u2019t a fragment: \u201c'+tqShort(line, 60)+'\u201d');
  }
  return {frags, threadRaw, newRaw, warnings, teach, uses};
}
function ibApplyPaste(){
  const d = ibCurDraft(); if(!d) return;
  if(!ibKbReady()){ _mmToast('Still loading your Knowledge Bank. Try again in a moment.'); return; }
  const r = ibParseReturn(d.pasted);
  if(!r.frags.length){ d.parseMsg = 'No fragment lines found. Paste the whole block, including the "=== THREAD NOTES ===" marker lines.'; render(); return; }
  if(d.frags.length && (d.links.length || d.notes.length) && !confirm('Replace the current fragments? Links and notes you made in Connect will be cleared.')) return;
  d.seq = 0;
  const newTopics = r.newRaw.map(n=>({key: 'k'+(++d.seq), title:n.title, parentRaw:n.parentRaw, othersRaw:n.othersRaw, why:n.why, ok:true, parent:null, others:[]}));
  newTopics.forEach(n=>{ n.parent = n.parentRaw ? ibResolveRef(n.parentRaw, newTopics.filter(x=>x!==n)) : null; n.others = n.othersRaw.map(o=>ibResolveRef(o, newTopics.filter(x=>x!==n))).filter(Boolean); });
  const map = {};
  const frags = r.frags.map(f=>{ const uid = 'f'+(++d.seq); map[f.lid] = uid;
    let text = f.text;
    if(f.relation){ const title = f.relation.split(/\s+[—–-]\s+/).slice(1).join(' — ') || f.relation; if(!text.toLowerCase().includes(title.toLowerCase())) text += ' (' + title + ')'; }
    return {uid, type:f.type, text, _b:f.b, _c:f.c, topics: f.topicsRaw.map(t=>ibResolveRef(t, newTopics)).filter(Boolean)}; });
  const dangling = [];
  frags.forEach(f=>{
    f.buildsOn = Array.from(new Set(f._b.map(x=>map[x]).filter(Boolean))).filter(u=>u!==f.uid);
    f.connected = Array.from(new Set(f._c.map(x=>map[x]).filter(Boolean))).filter(u=>u!==f.uid && !f.buildsOn.includes(u));
    f._b.concat(f._c).forEach(x=>{ if(!map[x]) dangling.push(x); });
    delete f._b; delete f._c;
  });
  const thread = Array.from(new Set(r.threadRaw.map(t=>ibResolveRef(t, newTopics)).filter(Boolean)));
  d.frags = frags; d.newTopics = newTopics;
  d.threadTopics = Array.from(new Set([...d.threadTopics.filter(x=>lib.topics[x]), ...thread]));
  d.links = []; d.notes = []; d.active = frags[0] ? frags[0].uid : null;
  d.teach = r.teach || ''; d.uses = r.uses || []; d.bodyWritten = false;
  if(!d.teach) r.warnings.push('No teach-back section was found. You can write it below before continuing.');
  d.parseMsg = [...r.warnings, ...(dangling.length?[`References to missing IDs were dropped: ${Array.from(new Set(dangling)).join(', ')}.`]:[])].join(' ');
  ibSaveDrafts(); render();
}
function ibUnresolved(d){
  const out = [];
  d.threadTopics.forEach(r=>{ if(r.startsWith('x:')) out.push({where:'thread', ref:r}); });
  d.frags.forEach(f=>(f.topics||[]).forEach(r=>{ if(r.startsWith('x:')) out.push({where:f.uid, ref:r}); }));
  d.newTopics.filter(n=>n.ok).forEach(n=>{
    if(!n.parent || n.parent.startsWith('x:')) out.push({where:'parent', key:n.key, ref:n.parent||'x:(no parent)'});
    else if(n.parent.startsWith('new:')){ const p = d.newTopics.find(x=>'new:'+x.key===n.parent); if(!p || !p.ok) out.push({where:'parent', key:n.key, ref:'x:'+ibRefLabel(n.parent,d)+' (not approved)'}); }
  });
  return out;
}
function ibNewTopicToggle(key){ const d = ibCurDraft(); const n = d && d.newTopics.find(x=>x.key===key); if(!n) return; n.ok = !n.ok; ibSaveDrafts(); render(); }
function ibDropRef(where, ref){
  const d = ibCurDraft(); if(!d) return;
  if(where==='thread') d.threadTopics = d.threadTopics.filter(r=>r!==ref);
  else { const f = ibFrag(d, where); if(f) f.topics = f.topics.filter(r=>r!==ref); }
  ibSaveDrafts(); render();
}

/* ── Topic picker (thread topics, fragment topics, fixing unresolved refs, new-topic parents, stand-alones) ── */
function ibPickTopic(target){ ib.pick = {target, q:''}; render(); setTimeout(()=>{ const el = document.getElementById('ib-pick-q'); if(el) el.focus(); }, 30); }
function ibPickClose(){ ib.pick = null; render(); }
function ibPickInput(v){ if(ib.pick){ ib.pick.q = v; render(); } }
function ibPickResults(q){
  const toks = String(q||'').toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length) return [];
  const X = libIndex();
  return Object.values(lib.topics).map(t=>({id:t.id, path:ibTopicPath(t.id), n:X.subComps(t.id).size}))
    .filter(x=>toks.every(k=>x.path.toLowerCase().includes(k)))
    .sort((a,b)=>(b.n-a.n) || a.path.length-b.path.length).slice(0,12);
}
function _ibApplyRef(target, ref){
  const it = ibOpenItem(); if(!it) return;
  if(it.kind==='sa'){ const s = ibSaState(it.id); if(!s.topics.includes(ref)) s.topics.push(ref); return; }
  const d = ibDraft(it);
  const swap = (arr, from)=> from ? arr.map(r=>r===from?ref:r) : (arr.includes(ref)?arr:[...arr, ref]);
  if(target.kind==='thread') d.threadTopics = Array.from(new Set(swap(d.threadTopics, target.replace)));
  else if(target.kind==='frag'){ const f = ibFrag(d, target.uid); if(f) f.topics = Array.from(new Set(swap(f.topics||[], target.replace))); }
  else if(target.kind==='parent'){ const n = d.newTopics.find(x=>x.key===target.key); if(n) n.parent = ref; }
  ibSaveDrafts();
}
function ibPickApply(id){ const p = ib.pick; if(!p) return; _ibApplyRef(p.target, id); ib.pick = null; render(); }
function ibPickNew(){
  const p = ib.pick; const d = ibCurDraft(); if(!p || !d || !p.q.trim()) return;
  const title = p.q.trim().replace(/\s+/g,' ');
  const key = 'k'+(++d.seq);
  d.newTopics.push({key, title, parentRaw:'', othersRaw:[], why:'Added by hand', ok:true, parent:null, others:[]});
  _ibApplyRef(p.target, 'new:'+key);
  ib.pick = {target:{kind:'parent', key}, q:''};   // a new topic needs a home straight away
  render();
}
function renderIbPicker(allowNew){

ib.peek = ib.peek || {};   // itemId → {topic, open:[compIdx]}
function ibPeekState(itemId){ return ib.peek[itemId] || (ib.peek[itemId] = {topic:null, open:[]}); }
function ibPeek(itemId, topic){ const p = ibPeekState(itemId); p.topic = topic; p.open = []; ib.compose = null; render(); }
function ibPeekToggle(itemId, ci){ const p = ibPeekState(itemId); p.open = p.open.includes(ci) ? p.open.filter(x=>x!==ci) : [...p.open, ci]; render(); }
ib.wander = ib.wander || {};
function ibComputeWander(itemId, baseIds){
  const X = libIndex(), T = lib.topics;
  const has = id => X.subComps(id).size>0;
  const pick = a => a.length ? a[Math.floor(Math.random()*a.length)] : null;
  const bases = baseIds.filter(id=>T[id]);
  const b = pick(bases);
  const used = new Set(bases);
  let sib = null, cousin = null;
  if(b && T[b].parent){
    const p = T[b].parent;
    sib = pick(T[p].children.filter(c=>!used.has(c) && has(c)));
    const gp = T[p].parent;
    if(gp) cousin = pick(T[gp].children.filter(c=>c!==p).flatMap(u=>T[u].children).filter(c=>!used.has(c) && has(c)));
    if(!cousin && gp) cousin = pick(T[gp].children.filter(c=>c!==p && has(c)));
  }
  const myRoots = new Set(bases.map(x=>X.rootOf(x)));
  const farRoot = pick(X.roots.filter(r=>!myRoots.has(r)));
  let far = null;
  if(farRoot){ const deep = [...X.subtree(farRoot)].filter(t=>(X.topicComps.get(t)||new Set()).size>0); far = pick(deep) || farRoot; }
  ib.wander[itemId] = {sib, cousin, far};
}
function ibPeekAddTopic(itemId){
  const it = ibItem(itemId); const p = ibPeekState(itemId); if(!it || !p.topic) return;
  if(it.kind==='tq'){ const d = ibDraft(it); if(!d.threadTopics.includes(p.topic)) d.threadTopics.push(p.topic); ibSaveDrafts(); }
  else { const s = ibSaState(it.id); if(!s.topics.includes(p.topic)) s.topics.push(p.topic); }
  render();
}
function ibWanderAgain(itemId){ const it = ibItem(itemId); if(!it) return; ibComputeWander(itemId, ibItemTopicIds(it)); render(); }
function ibItemTopicIds(it){
  if(it.kind==='sa') return ibSaState(it.id).topics.filter(r=>lib.topics[r]);
  const d = ibDraft(it);
  return Array.from(new Set([...d.threadTopics, ...d.frags.flatMap(f=>f.topics||[])])).filter(r=>lib.topics[r]);
}
function ibModes(kind){

    {v:'join',   label:'Join threads', hint:'Merges this new thread with that one. Your why becomes an RC connected to both.'},
    {v:'builds', label:'Builds on it', hint:'That fragment is a prerequisite for yours (the threads merge). Your why becomes an RC beside it.'}
  ];
}

function ibPeekHtml(it){
  if(!ibKbReady()) return `<div class="ib2-peek"><div class="ib-muted"><span class="spin"></span> Loading your Library…</div></div>`;
  const X = libIndex(), T = lib.topics;
  const p = ibPeekState(it.id);
  const linked = ibLinkedTargets(it);
  if(!ib.wander[it.id]) ibComputeWander(it.id, ibItemTopicIds(it));
  const w = ib.wander[it.id];
  const door = (id, kind) => id && T[id] ? `<button class="ib2-door" style="--cloth:${X.color.get(X.rootOf(id))}" onclick="ibPeek('${it.id}','${id}')"><small>${kind}</small><span>${esc(T[id].title)}</span><em>${esc(ibTopicPath(id).split(' / ').slice(0,-1).join(' / ') || 'top-level wing')}</em></button>` : '';
  const doors = door(w.sib,'Next door') + door(w.cousin,'A cousin') + door(w.far,'Another wing');
  let h = `<div class="ib2-peek">`;
  if(!p.topic || !T[p.topic]){
    h += `<div class="ib2-peek-empty">Pick one of your topics to look along its shelves, or wander somewhere nearby or far away.</div>`;
  } else {
    const t = T[p.topic];
    const comps = libSort([...X.subComps(p.topic)]).filter(ci=>vs.comps[ci]);
    h += `<div class="ib2-peek-h" style="--cloth:${X.color.get(X.rootOf(p.topic))}">
      <div class="ib2-peek-path">${esc(ibTopicPath(p.topic).split(' / ').slice(0,-1).join(' / '))}</div>
      <div class="ib2-peek-t">${esc(t.title)}</div>
      <div class="ib2-peek-n">${comps.length} ${comps.length===1?'thread':'threads'}</div>
      ${ibItemTopicIds(it).includes(p.topic) ? '' : `<button class="ib2-peek-add" onclick="ibPeekAddTopic('${it.id}')">+ Use as ${it.kind==='tq'?'a thread':'a'} topic</button>`}
    </div>`;
    if(!comps.length) h += `<div class="ib-muted" style="padding:10px 0">Nothing on these shelves yet. Your thread will be the first.</div>`;
    h += comps.slice(0,30).map(ci=>{
      const comp = vs.comps[ci]; const open = p.open.includes(ci);
      let row = `<div class="ib2-book${open?' open':''}" style="--cloth:${libCompColor(ci)}">
        <button class="ib2-book-h" onclick="ibPeekToggle('${it.id}',${ci})" aria-expanded="${open}"><span class="ib2-spine"></span><span class="ib2-book-t">${esc(vizThreadLabel(comp))}</span><span class="ib2-book-n">${comp.total}</span></button>`;
      if(open){
        const order = FRAGMENT_TYPES;
        const ns = (comp.nodeIds||[]).map(id=>vs.byId[id]).filter(Boolean).sort((a,b)=>order.indexOf(a.type)-order.indexOf(b.type));
        row += `<div class="ib2-frs">` + ns.map(n=>{
          const isOpen = ib.compose && ib.compose.targetId===n.id;
          const done = linked.has(n.id);
          return `<div class="ib2-fr${isOpen?' open':''}"><button class="ib2-fr-b" data-ftype="${typeCssClass(n.type)}" onclick="ibComposeOpen('${n.id}')" ${done?'disabled':''}>${esc(n.title)}${done?' <b>linked</b>':''}</button>${isOpen?ibComposeHtml(it):''}</div>`;
        }).join('') + `</div>`;
      }
      return row + `</div>`;
    }).join('');
    if(comps.length>30) h += `<div class="ib-muted">and ${comps.length-30} more threads</div>`;
  }
  if(doors) h += `<div class="ib2-wander"><div class="ib2-wander-h"><span>Wander</span><button class="ib-mini" onclick="ibWanderAgain('${it.id}')" title="Different doors">↻</button></div><div class="ib2-doors">${doors}</div></div>`;
  return h + `</div>`;
}

/* ── Page creation helpers ── */
async function ibCreatePage(props){
  const dbId = fmtId(getIpDb());
  const SAFE = new Set([ib.titleProp, 'Type', 'Method', 'Primary Source']);
  try{ return await nPost('/pages', {parent:{database_id:dbId}, properties:props}); }
  catch(bulkErr){
    const core = {}, rest = {};
    for(const [k,v] of Object.entries(props)){ if(SAFE.has(k)) core[k]=v; else rest[k]=v; }
    const page = await nPost('/pages', {parent:{database_id:dbId}, properties:core});
    const skipped = [];
    for(const [k,v] of Object.entries(rest)){ try{ await nPatch('/pages/'+fmtId(page.id), {properties:{[k]:v}}); }catch(e){ skipped.push(k); } }
    page._skipped = skipped;
    return page;
  }
}
function ibPrimarySelect(it, rels){
  if(it.primarySource && relDbByName(it.primarySource)) return it.primarySource;
  const cap = ibRelGroups(rels).find(g=>g.kind==='capture' && g.db!=='Knowledge Bank');
  return cap ? cap.db : '';
}
function ibRelProps(rels){
  const out = {};
  for(const g of ibRelGroups(rels)) out[g.relProp] = {relation: g.ids.map(id=>({id:fmtId(id)}))};
  return out;
}
/* ── Commit ── */
function ibPlan(it, d){
  const live = d.frags.filter(f=>f.text.trim());
  const liveSet = new Set(live.map(f=>f.uid));
  const anchor = live.find(f=>f.type==='Core Idea' || f.type==='Pattern') || live.find(f=>f.type==='Story') || live[0];
  const nodes = live.map(f=>({key:f.uid, type:f.type, text:f.text.trim(), b:f.buildsOn.filter(u=>liveSet.has(u)), c:f.connected.filter(u=>liveSet.has(u)), xb:[], xc:[], xx:[],
    topics: Array.from(new Set([...(anchor && f.uid===anchor.uid ? d.threadTopics : []), ...(f.topics||[])])), origin:'frag'}));
  const byKey = {}; nodes.forEach(n=>byKey[n.key]=n);
  d.links.forEach(l=>{
    const f = byKey[l.uid]; if(!f) return;
    const rc = {key:'L'+l.uid+'_'+l.targetId.slice(0,8), type:'Referential C', text:l.why, b:[], c:[l.uid], xb:[], xc:[], xx:[], topics:[], origin:'bridge'};
    if(l.mode==='cross'){ if(ib.hasCross) rc.xx.push(l.targetId); }
    else if(l.mode==='join') rc.xc.push(l.targetId);
    else f.xb.push(l.targetId);
    nodes.push(rc);
  });
  d.notes.forEach(n=>{
    if(!n.text.trim()) return;
    const att = liveSet.has(n.attach) ? n.attach : (anchor && anchor.uid);
    nodes.push({key:'N'+n.nid, type:n.type, text:n.text.trim(), b:[], c: att?[att]:[], xb:[], xc:[], xx:[], topics:[], origin:n.origin});
  });
  const rels = {};
  for(const [k,v] of Object.entries({...it.rels})) if(k!==IB_KB_PROP) rels[k] = v.slice();
  for(const [k,v] of Object.entries(d.extraRels||{})) if(k!==IB_KB_PROP) rels[k] = Array.from(new Set([...(rels[k]||[]), ...v]));
  const warn = [];
  if(!d.threadTopics.filter(r=>!r.startsWith('x:')).length) warn.push('The thread has no topics, so it will land on the Unfiled shelf.');
  if(!d.links.length && !d.notes.length) warn.push('You haven\u2019t linked this thread to anything yet. It will land as an island.');
  if(!String(d.teach||'').trim()) warn.push('There is no teach-back. The thread will open without your explanation.');
  return {nodes, anchorKey: anchor ? anchor.uid : null, rels, warn};
}
let _kbTitleProp = null;
async function ibKbTitleProp(){
  if(_kbTitleProp) return _kbTitleProp;
  const reg = relDbByName('Knowledge Bank');
  const sch = await nGet('/databases/'+fmtId(reg.dbId));
  for(const [k,p] of Object.entries(sch.properties||{})) if(p.type==='title'){ _kbTitleProp = k; break; }
  return _kbTitleProp || 'Name';
}
/* Create the approved new topics (parents first). Returns false if any failed. */
async function ibCreateTopics(d, log){
  const reg = relDbByName('Knowledge Bank');
  const titleProp = await ibKbTitleProp();
  const pending = d.newTopics.filter(n=>n.ok && !d.createdTopics[n.key]);
  let guard = 0;
  while(pending.length && guard++ < 50){
    const i = pending.findIndex(n=>!n.parent.startsWith('new:') || d.createdTopics[n.parent.slice(4)]);
    if(i<0) break;
    const n = pending.splice(i,1)[0];
    const resolve = r => r.startsWith('new:') ? d.createdTopics[r.slice(4)] : (lib.topics[r] ? r : null);
    const parentId = resolve(n.parent);
    const others = (n.others||[]).map(resolve).filter(Boolean);
    const props = {[titleProp]:{title:[{type:'text', text:{content:n.title.slice(0,1990)}}]}, 'Parent item':{relation:[{id:fmtId(parentId)}]}};
    if(others.length) props['Other Parents'] = {relation: others.map(id=>({id:fmtId(id)}))};
    try{
      const pg = await nPost('/pages', {parent:{database_id:fmtId(reg.dbId)}, properties:props});
      const id = fmtId(pg.id); d.createdTopics[n.key] = id; ibSaveDrafts();
      lib.topics[id] = {id, url:pg.url, title:n.title, parent:parentId, others, children:[], crossKids:[]};
      if(lib.topics[parentId]) lib.topics[parentId].children.push(id);
      others.forEach(o=>lib.topics[o] && lib.topics[o].crossKids.push(id));
      log.push({ok:true, text:'New topic: '+n.title, note:'under '+ibTopicPath(parentId)});
    }catch(e){ log.push({ok:false, text:'New topic: '+n.title, note:e.message}); return false; }
  }
  if(pending.length){ log.push({ok:false, text:'New topics', note:'Some new topics could not be placed (their Parent was not created).'}); return false; }
  lib.topics = {...lib.topics}; lib._X = null; _ibTopicIdx = null;
  return true;
}
/* The teach-back becomes the anchor's page body: paragraphs, then how you'll use it. */
function ibTeachBlocks(teach, uses){
  const rt = t => { const out = []; for(let i=0; i<t.length; i+=1900) out.push({type:'text', text:{content:t.slice(i, i+1900)}}); return out; };
  const blocks = [];
  String(teach||'').split(/\n\s*\n/).map(p=>p.replace(/\s*\n\s*/g,' ').trim()).filter(Boolean)
    .forEach(p=>blocks.push({object:'block', type:'paragraph', paragraph:{rich_text:rt(p)}}));
  const u = (uses||[]).map(x=>String(x).trim()).filter(Boolean);
  if(u.length){
    blocks.push({object:'block', type:'heading_3', heading_3:{rich_text:rt('How I\u2019ll use this')}});
    u.forEach(x=>blocks.push({object:'block', type:'bulleted_list_item', bulleted_list_item:{rich_text:rt(x)}}));
  }
  return blocks.slice(0, 100);
}
function ibSetTeach(v){ const d = ibCurDraft(); if(!d) return; d.teach = v; ibSaveDrafts(); }
function ibSetUses(v){ const d = ibCurDraft(); if(!d) return; d.uses = v.split('\n').map(x=>x.replace(/^\s*[-*•]\s*/,'').trim()).filter(Boolean); ibSaveDrafts(); }
function _ibKbIds(d, refs){ return Array.from(new Set(refs.map(r=>r.startsWith('new:') ? d.createdTopics[r.slice(4)] : (lib.topics[r] ? r : null)).filter(Boolean))); }
async function ibCommitTq(){
  const it = ibOpenItem(); const d = ibCurDraft(); if(!it || !d) return;
  if(ibUnresolved(d).length){ _mmToast('Resolve the flagged topics in the Fragment step first.'); return; }
  const plan = ibPlan(it, d);
  if(!plan.nodes.length){ _mmToast('Nothing to create yet.'); return; }
  const threadName = (d.threadName || d.gist || it.title || '').trim();
  const primary = ibPrimarySelect(it, plan.rels);
  const relProps = ibRelProps(plan.rels);
  ib.commit = {st:'busy', msg:'Shelving new topics…', done:0, total:plan.nodes.length, log:[]};
  render();
  const log = ib.commit.log;
  if(!(await ibCreateTopics(d, log))){ ib.commit.st='error'; ib.commit.msg='A new topic could not be created. Nothing else was written; fix it and commit again.'; render(); return; }
  ib.commit.msg = 'Creating fragments…'; render();
  for(const n of plan.nodes){
    if(d.created[n.key]){ ib.commit.done++; continue; }
    const props = {
      [ib.titleProp]: {title:[{type:'text', text:{content: n.text.slice(0,1990)}}]},
      'Type':   {select:{name:n.type}},
      'Method': {select:{name:d.method}},
      ...relProps
    };
    const kb = _ibKbIds(d, n.topics);
    if(kb.length) props[IB_KB_PROP] = {relation: kb.map(id=>({id:fmtId(id)}))};
    if(primary) props['Primary Source'] = {select:{name:primary}};
    if(n.key===plan.anchorKey && threadName && ib.hasThreadName) props['Thread Name'] = {rich_text:[{type:'text', text:{content:threadName.slice(0,1990)}}]};
    try{
      const page = await ibCreatePage(props);
      d.created[n.key] = page.id; ibSaveDrafts();
      if(page._skipped && page._skipped.length) log.push({ok:true, text:n.text, note:'Skipped: '+page._skipped.join(', ')});
    }catch(e){ log.push({ok:false, text:n.text, note:e.message}); }
    ib.commit.done++; render();
  }
  const failed = plan.nodes.filter(n=>!d.created[n.key]);
  if(failed.length){ ib.commit.st='error'; ib.commit.msg=`${failed.length} fragment${failed.length>1?'s':''} could not be created. Your draft is kept; commit again to retry just those.`; render(); return; }
  if(!d.bodyWritten && plan.anchorKey && d.created[plan.anchorKey] && (String(d.teach||'').trim() || (d.uses||[]).length)){
    ib.commit.msg = 'Writing your teach-back…'; render();
    try{ await nPatch('/blocks/'+fmtId(d.created[plan.anchorKey])+'/children', {children: ibTeachBlocks(d.teach, d.uses)}); d.bodyWritten = true; ibSaveDrafts(); }
    catch(e){ log.push({ok:false, text:'Teach-back', note:'Could not write it to the anchor page: '+e.message}); }
  }
  ib.commit.msg = 'Wiring connections…'; render();
  const idOf = k => d.created[k];
  for(const n of plan.nodes){
    const patch = {};
    const b = n.b.map(idOf).filter(Boolean).concat(n.xb);
    const c = n.c.map(idOf).filter(Boolean).concat(n.xc);
    if(b.length) patch['Builds On'] = {relation: Array.from(new Set(b)).map(id=>({id:fmtId(id)}))};
    if(c.length) patch['Connected Fragments'] = {relation: Array.from(new Set(c)).map(id=>({id:fmtId(id)}))};
    if(n.xx.length && ib.hasCross) patch[CROSS_THREAD_PROP] = {relation: n.xx.map(id=>({id:fmtId(id)}))};
    if(!Object.keys(patch).length) continue;
    try{ await nPatch('/pages/'+fmtId(idOf(n.key)), {properties:patch}); }
    catch(e){ log.push({ok:false, text:n.text, note:'Wiring failed: '+e.message}); }
  }
  let archived = true;
  try{ await nPatch('/pages/'+fmtId(it.id), {properties:{'Type':{select:{name:ARCHIVED_TYPE}}}}); }
  catch(e){ archived = false; log.push({ok:false, text:it.title, note:'Could not archive the Thread Queue page: '+e.message}); }
  const nf = plan.nodes.filter(n=>n.origin==='frag').length;
  const nt = Object.keys(d.createdTopics).length;
  ib.commit.st = log.some(x=>!x.ok) ? 'error' : 'ok';
  ib.commit.msg = `${plan.nodes.length} fragments created (${nf} from the material, ${plan.nodes.length-nf} in your words)` + (nt ? `, plus ${nt} new topic${nt>1?'s':''}` : '') + '.' + (archived ? ' The Thread Queue page is archived.' : '');
  it.done = true;
  delete ib.drafts[it.id]; ibSaveDrafts();
  delete ib.peek[it.id]; delete ib.wander[it.id];
  ib.stale = true;
  render();
}

/* ════════ Stand-alone lane ════════ */
function ibSaState(id){
  if(ib.sa[id]) return ib.sa[id];
  const it = ibItem(id);
  return (ib.sa[id] = {links:[], pairWith:'', pairWhy:'', type:'Core Idea', topics: (((it&&it.rels)||{})[IB_KB_PROP]||[]).map(fmtId), body:null, st:null, msg:''});
}
function ibSaSet(id, k, v, rerender){ const s = ibSaState(id); s[k] = v; if(rerender) render(); }
function ibSaTopicRemove(ref){ const it = ibOpenItem(); if(!it) return; const s = ibSaState(it.id); s.topics = s.topics.filter(r=>r!==ref); render(); }
function ibSaOutcome(it, s){
  const dock = s.links.filter(l=>l.mode!=='cross');
  const pair = s.pairWith && ibItem(s.pairWith);
  if(dock.length){ const n = vs.byId[dock[0].targetId]; const c = n && vs.comps[n.comp];
    return `Becomes a ${s.type} in “${tqShort(c ? vizThreadLabel(c) : 'that thread', 60)}”` + (pair ? ', paired with another stand-alone' : '') + '.'; }
  if(pair) return `Becomes a ${s.type}, starting a new thread with “${tqShort(pair.title, 50)}”.`;
  const nc = s.links.length;
  return 'Stays in your stand-alone collection' + (nc ? `, with ${nc} cross-link${nc>1?'s':''}.` : '.');
}
async function _ibExistingSelf(pageId){
  const pg = await nGet('/pages/'+fmtId(pageId));
  const p = pg.properties || {};
  return {b: relIds(p['Builds On']), c: relIds(p['Connected Fragments']), x: relIds(p[CROSS_THREAD_PROP]), kb: relIds(p[IB_KB_PROP])};
}
async function ibSaSave(){
  const it = ibOpenItem(); if(!it || it.kind!=='sa') return;
  const s = ibSaState(it.id);
  const pair = s.pairWith ? ibItem(s.pairWith) : null;
  if(pair && !s.pairWhy.trim()){ _mmToast('Write one line on why the two ideas belong together.'); return; }
  const dock = s.links.filter(l=>l.mode!=='cross');
  const cross = s.links.filter(l=>l.mode==='cross');
  const becomesFrag = !!(dock.length || pair);
  s.st = 'busy'; s.msg = ''; render();
  try{
    const ex = await _ibExistingSelf(it.id);
    const U = a => Array.from(new Set(a.map(fmtId))).map(id=>({id}));
    const nonKb = {}; for(const [k,v] of Object.entries(it.rels||{})) if(k!==IB_KB_PROP) nonKb[k] = v;
    const primary = ibPrimarySelect(it, nonKb);
    const relProps = ibRelProps(nonKb);
    const kbIds = s.topics.filter(r=>lib.topics[r]);
    const bridge = async (text, connectedIds, crossIds)=>{
      const props = {[ib.titleProp]:{title:[{type:'text',text:{content:text.slice(0,1990)}}]}, 'Type':{select:{name:'Referential C'}}, ...relProps};
      if(it.method) props['Method'] = {select:{name:it.method}};
      if(primary) props['Primary Source'] = {select:{name:primary}};
      const pg = await ibCreatePage(props);
      const patch = {'Connected Fragments':{relation:U(connectedIds)}};
      if(crossIds && crossIds.length && ib.hasCross) patch[CROSS_THREAD_PROP] = {relation:U(crossIds)};
      await nPatch('/pages/'+fmtId(pg.id), {properties:patch});
    };
    const base = {};
    if(kbIds.length || ex.kb.length) base[IB_KB_PROP] = {relation:U(kbIds)};
    if(becomesFrag){
      const patch = {...base, 'Type':{select:{name:s.type}}};
      const b = ex.b.concat(dock.filter(l=>l.mode==='builds').map(l=>l.targetId));
      const c = ex.c.concat(dock.filter(l=>l.mode==='join').map(l=>l.targetId));
      if(pair) c.push(pair.id);
      if(b.length) patch['Builds On'] = {relation:U(b)};
      if(c.length) patch['Connected Fragments'] = {relation:U(c)};
      await nPatch('/pages/'+fmtId(it.id), {properties:patch});
      for(const l of dock) await bridge(l.why, [it.id], []);
      for(const l of cross) await bridge(l.why, [it.id], [l.targetId]);
      if(pair){
        await nPatch('/pages/'+fmtId(pair.id), {properties:{'Type':{select:{name:s.type}}}});
        await bridge(s.pairWhy.trim(), [it.id, pair.id], []);
        pair.done = true;
      }
    } else {
      const patch = {...base, 'Type':{select:{name:SA_COLLECTION_TYPE}}};
      if(cross.length && ib.hasCross) patch[CROSS_THREAD_PROP] = {relation:U(ex.x.concat(cross.map(l=>l.targetId)))};
      await nPatch('/pages/'+fmtId(it.id), {properties:patch});
      if(cross.length){
        const children = cross.map(l=>{ const n = vs.byId[l.targetId];
          return {object:'block', type:'paragraph', paragraph:{rich_text:[
            {type:'text', text:{content:'↔ '+(n?n.title:'linked fragment').slice(0,300)+': '}, annotations:{bold:true}},
            {type:'text', text:{content:l.why.slice(0,1500)}}]}}; });
        await nPatch('/blocks/'+fmtId(it.id)+'/children', {children});
      }
    }
    it.done = true; delete ib.sa[it.id]; delete ib.peek[it.id]; delete ib.wander[it.id];
    _mmToast(becomesFrag ? 'Added to the latticework.' : 'Kept in your stand-alone collection.');
    ib.stale = true;
    ibNext('sa');
  }catch(e){ s.st = 'error'; s.msg = e.message; render(); }
}
async function ibSaArchive(){
  const it = ibOpenItem(); if(!it) return;
  if(!confirm('Archive this idea? It stays in Notion but leaves the inbox and the latticework.')) return;
  const s = ibSaState(it.id); s.st = 'busy'; render();
  try{ await nPatch('/pages/'+fmtId(it.id), {properties:{'Type':{select:{name:ARCHIVED_TYPE}}}}); it.done = true; delete ib.sa[it.id]; ibNext('sa'); }
  catch(e){ s.st = 'error'; s.msg = e.message; render(); }
}
function ibSaSkip(){
  const it = ibOpenItem(); if(!it) return;
  const pend = ibPending('sa'); const i = pend.findIndex(x=>x.id===it.id);
  const next = pend[(i+1) % pend.length];
  if(next && next.id!==it.id) ibOpen(next.id); else ibClose();
}

/* ════════ Rendering ════════ */
function renderInbox(){
  let h = `<div class="section-hd"><div class="section-eye">Monthly processing</div><div class="section-title">Inbox</div></div>`;
  const g = gate(); if(g) return h + g;
  if(!ib.loadSt){ setTimeout(ibLoad, 0); ib.loadSt = 'loading'; }
  if(ib.loadSt==='loading') return h + `<div class="block"><div class="ib-muted"><span class="spin"></span> Loading Thread Queue pages and stand-alone ideas…</div></div>`;
  if(ib.loadSt==='error') return h + `<div class="block"><div class="pill pill-err" style="display:block;margin-bottom:10px">${esc(ib.loadMsg)}</div><button class="btn btn-sm" onclick="ibLoad()">Try again</button></div>`;
  ibKbReady();
  const it = ibOpenItem();
  if(it) return h + (it.kind==='tq' ? renderIbTq(it) : renderIbSa(it));
  const tq = ibPending('tq'), sa = ibPending('sa');
  h += `<div class="ib-lanes">
    <div class="viz-seg">
      <button class="${ib.lane==='tq'?'active':''}" onclick="ibSetLane('tq')">Thread Queue <span class="ib-count">${tq.length}</span></button>
      <button class="${ib.lane==='sa'?'active':''}" onclick="ibSetLane('sa')">Stand-alone ideas <span class="ib-count">${sa.length}</span></button>
    </div>
    <button class="btn btn-sm" onclick="ibLoad()">Refresh</button>
  </div>`;
  if(ib.lane==='tq'){
    if(!tq.length) return h + `<div class="block ib-empty"><b>Nothing to fragment.</b> During your weekly review, set an Info Processing page's Type to <i>Thread Queue</i>, link its source, purpose and topics, and gather the material in its body.</div>`;
    return h + `<div class="ib-list">` + tq.map(x=>{
      const d = ib.drafts[x.id] && ib.drafts[x.id].v===IB_DRAFT_V ? ib.drafts[x.id] : null;
      const st = d ? `${(IB_STEPS.find(s=>s.v===d.step)||{}).label||'Read'}${d.frags.length?`, ${d.frags.length} fragments`:''}` : 'Not started';
      return `<button class="ib-item" onclick="ibOpen('${x.id}')">
        <span class="ib-item-main"><span class="ib-item-t">${esc(x.title)}</span><span class="ib-item-rels">${ibRelChipsHtml(x.rels)}</span></span>
        <span class="ib-item-side"><span class="method-badge ${x.method==='Retroactive'?'method-retro':'method-upfront'}">${esc(x.method||'Upfront')}</span><span class="ib-item-st${d?' ib-item-draft':''}">${esc(st)}</span></span>
      </button>`;
    }).join('') + `</div>`;
  }
  if(!SA_INBOX_TYPE) return h + `<div class="block ib-empty">No Type option like <i>Stand Alone Ideas (Processed)</i> exists on Info Processing, so this lane is empty.</div>`;
  if(!sa.length) return h + `<div class="block ib-empty"><b>No stand-alone ideas waiting.</b> Ideas you file as <i>${esc(SA_INBOX_TYPE)}</i> during the weekly review show up here.</div>`;
  return h + `<div class="ib-lanehead"><span class="ib-muted">Give each idea its topics, then link it, dock it, pair it, or let it stand.</span><button class="btn btn-sm btn-primary" onclick="ibOpen('${sa[0].id}')">Start triage</button></div>
    <div class="ib-list">` + sa.map(x=>`<button class="ib-item" onclick="ibOpen('${x.id}')">
      <span class="ib-item-main"><span class="ib-item-t ib-item-idea">${esc(x.title)}</span><span class="ib-item-rels">${ibRelChipsHtml(x.rels)}</span></span>
    </button>`).join('') + `</div>`;
}
function ibBlocksHtml(blocks){
  let h = '';
  for(const b of blocks){
    const pad = (b.depth||0)*18; const t = esc(b.text);
    switch(b.kind){
      case 'h1': h += `<h3 class="ib-h1">${t}</h3>`; break;
      case 'h2': h += `<h4 class="ib-h2">${t}</h4>`; break;
      case 'h3': h += `<h5 class="ib-h3">${t}</h5>`; break;
      case 'li': case 'num': case 'todo': h += `<div class="ib-li" style="margin-left:${pad}px">${t}</div>`; break;
      case 'quote': case 'callout': h += `<blockquote class="ib-quote" style="margin-left:${pad}px">${t}</blockquote>`; break;
      case 'code': h += `<pre class="ib-code">${t}</pre>`; break;
      case 'hr': h += `<hr class="ib-hr">`; break;
      case 'img': h += b.url ? `<figure class="ib-fig"><img src="${esc(b.url)}" alt="${t}" loading="lazy">${t?`<figcaption>${t}</figcaption>`:''}</figure>` : ''; break;
      default: h += `<p style="margin-left:${pad}px">${t}</p>`;
    }
  }
  return h;
}
function ibBodyHtml(holder, emptyMsg){
  const b = holder.body;
  if(!b || b.st==='loading') return `<div class="ib-muted"><span class="spin"></span> Reading the page…</div>`;
  if(b.st==='error') return `<div class="pill pill-err" style="display:block">${esc(b.msg)}</div>`;
  if(!b.blocks.length) return emptyMsg ? `<div class="ib-muted">${emptyMsg}</div>` : '';
  return `<article class="ib-read">${ibBlocksHtml(b.blocks)}</article>`;
}
function ibHeader(it, extra){
  return `<div class="ib-head"><button class="ib-back" onclick="ibClose()">← Inbox</button><span class="ib-grow"></span>${extra||''}<a class="ib-notion" href="${esc(it.url)}" target="_blank" rel="noopener">Open in Notion</a></div>`;
}
function ibCommitLog(c){
  const bad = (c.log||[]).filter(x=>!x.ok || x.note);
  if(!bad.length) return '';
  return `<div class="ib-log">${bad.map(x=>`<div class="${x.ok?'':'ib-log-err'}"><b>${esc(tqShort(x.text,70))}</b> ${esc(x.note||'')}</div>`).join('')}</div>`;
}
function renderIbTq(it){
  if(it.done){
    const c = ib.commit || {}; const more = ibPending('tq').length;
    return ibHeader(it) + `<div class="block ib-done">
      <div class="ib-done-t">${esc(it.title)} is on the shelves.</div>
      <div class="helptext">${esc(c.msg||'')}</div>${ibCommitLog(c)}
      <div class="ib-row-end"><button class="btn" onclick="setTab('library')">Open the Library</button>
        ${more ? `<button class="btn btn-primary" onclick="ibNext('tq')">Next thread (${more} left)</button>` : `<button class="btn btn-primary" onclick="ibClose()">Back to the inbox</button>`}</div></div>`;
  }
  const d = ibDraft(it);
  const si = IB_STEPS.findIndex(s=>s.v===d.step);
  const unres = d.frags.length ? ibUnresolved(d).length : 0;
  let h = ibHeader(it) + `<div class="ib-title">${esc(it.title)}</div>`;
  h += `<nav class="ib-steps" aria-label="Processing steps">` + IB_STEPS.map((s,i)=>{
    const locked = (i>=2 && (!d.frags.length || unres));
    return `<button class="ib-step${i===si?' on':''}${i<si?' past':''}" onclick="ibSetStep('${s.v}')" ${locked?'disabled':''}><span class="ib-step-n">${i+1}</span>${s.label}</button>`;
  }).join('') + `</nav>`;
  if(d.step==='read') h += renderIbRead(it, d);
  else if(d.step==='fragment') h += renderIbFragment(it, d);
  else if(d.step==='connect') h += renderIbConnect(it, d);
  else h += renderIbCommit(it, d);
  return h;
}
function renderIbRead(it, d){
  const edited = d.work!=null && d.body && d.work!==d.body.text;
  return `<div class="block ib-readblock">
      <div class="ib2-readbar">
        ${ibRelGroups(it.rels).length?`<div class="ib-relrow">${ibRelChipsHtml(it.rels)}</div>`:'<span></span>'}
        <span class="ib-grow"></span>
        ${edited ? `<button class="btn btn-sm" onclick="ibWorkReset()">Use the page's text</button>` : ''}
        <button class="btn btn-sm${d.editing?' btn-primary':''}" onclick="ibEditToggle()" ${(!d.body||d.body.st!=='ok')?'disabled':''}>${d.editing?'Done editing':'Edit'}</button>
      </div>
      ${d.editing
        ? `<textarea id="ib-work" class="ib-auto ib2-work" oninput="ibWorkInput(this.value);tqAutoGrow(this)">${esc(ibWorkText(d))}</textarea>
           <div class="ib-hint">A working copy. The Notion page keeps its original text; this is what gets sent to Claude.</div>`

      <div class="ib-row-end"><button class="btn btn-primary" onclick="ibSetStep('fragment')">Continue to fragmenting</button></div>
    </div>`;
}
function renderIbFragment(it, d){
  const ready = ibKbReady();
  const hint = d.method==='Upfront'
    ? 'Your notes already include your own thinking. Claude starts from it and asks you to go further.'
    : 'The notes are source material without your interpretation yet. Claude starts by asking what it means to you.';
  let h = `<div class="block">
    <div class="ib2-stepline"><span class="ib2-num">1</span><div>
      <div class="ib-q">Talk it through with Claude</div>
      <div class="viz-seg" style="margin:6px 0 8px"><button class="${d.method==='Upfront'?'active':''}" onclick="ibSetMethod('Upfront')">Upfront</button><button class="${d.method==='Retroactive'?'active':''}" onclick="ibSetMethod('Retroactive')">Retroactive</button></div>
      <div class="ib-hint">${hint}</div>
      <div class="ib-actions"><button class="btn btn-primary" onclick="ibCopyPackage()" ${ready?'':'disabled'}>${ready?(ib.copied===it.id?'Copied. Copy again':'Copy for Claude'):'<span class="spin"></span> Loading topics…'}</button>
        <span class="ib-muted">Paste it into a conversation in your Threads project. Explain it in your own words; Claude asks the questions.</span></div>
    </div></div>
    <div class="ib2-stepline"><span class="ib2-num">2</span><div style="flex:1;min-width:0">
      <div class="ib-q">Paste the block Claude assembled from your words</div>
      <textarea id="ib-paste" class="ib2-paste" rows="5" placeholder="=== THREAD NOTES ===&#10;C1 | …&#10;=== END THREAD NOTES ===" oninput="ibPasteInput(this.value)">${esc(d.pasted||'')}</textarea>
      <div class="ib-actions"><button class="btn" onclick="ibApplyPaste()">${d.frags.length?'Read it again':'Read it'}</button></div>
      ${d.parseMsg ? `<div class="pill pill-warn" style="display:block;margin-top:8px">${esc(d.parseMsg)}</div>` : ''}
    </div></div>
  </div>`;
  if(!d.frags.length) return h;
  const unres = ibUnresolved(d);
  if(unres.length){
    h += `<div class="block ib2-issues"><div class="ib-q">Topics to sort out (${unres.length})</div><div class="ib-hint">These don't match anything in your Knowledge Bank. Pick the right one, make it a new topic, or drop it.</div>` +
      unres.map(u=>{
        if(u.where==='parent'){ const n = d.newTopics.find(x=>x.key===u.key);
          return `<div class="ib2-issue"><span>New topic <b>${esc(n.title)}</b> needs a Parent${u.ref && u.ref!=='x:(no parent)'?` (Claude said “${esc(u.ref.slice(2))}”)`:''}.</span>

        const where = u.where==='thread' ? 'thread topic' : 'on #'+ibFragNum(d,u.where);

          <button class="btn btn-sm" onclick="ibPickFix(${d.frags.length}, '${u.where}', ${unres.indexOf(u)})">Pick a topic</button>

          <button class="btn btn-sm" onclick="ibDropUnres('${u.where}', ${unres.indexOf(u)})">Drop</button></div>`;
      }).join('') + (ib.pick ? renderIbPicker(false) : '') + `</div>`;
  }
  if(d.newTopics.length){
    h += `<div class="block"><div class="ib-q">New topics Claude proposed</div><div class="ib-hint">Created in your Knowledge Bank only when you commit.</div>` +
      d.newTopics.map(n=>`<label class="ib2-newt${n.ok?'':' off'}"><input type="checkbox" ${n.ok?'checked':''} onchange="ibNewTopicToggle('${n.key}')">

const AI_MODEL_DEFAULT = 'claude-sonnet-5';
let aiTestSt = null;   // null | 'running' | {ok, msg}
const AI_VAL_CODE = `// Val Town HTTP val: forwards requests from the Recall app to the Claude API.
// Environment variables (Val Town → Settings → Environment variables):
//   ANTHROPIC_API_KEY  your key from console.anthropic.com
//   APP_KEY            any long random string; paste the same value into the app's Settings
export default async function (req: Request): Promise<Response> {
  const cors = {
    "Access-Control-Allow-Origin": req.headers.get("Origin") || "*",
    "Access-Control-Allow-Headers": "Content-Type, X-App-Key",
    "Access-Control-Allow-Methods": "POST, OPTIONS",
    "Vary": "Origin",
  };
  if (req.method === "OPTIONS") return new Response(null, { status: 204, headers: cors });
  const json = (status: number, message: string) =>
    new Response(JSON.stringify({ error: { message } }), { status, headers: { ...cors, "Content-Type": "application/json" } });
  if (req.method !== "POST") return json(405, "POST only");
  if (req.headers.get("X-App-Key") !== Deno.env.get("APP_KEY")) return json(401, "App key does not match APP_KEY on the val");
  const upstream = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": Deno.env.get("ANTHROPIC_API_KEY") ?? "",
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
    },
    body: await req.text(),
  });
  // Stream the response straight through so long fragmenting runs don't time out.
  return new Response(upstream.body, {
    status: upstream.status,
    headers: { ...cors, "Content-Type": upstream.headers.get("Content-Type") || "application/json" },
  });
}`;

async function libLoadKb(){

  if(!reg){ lib.kbSt='error'; lib.kbMsg='Knowledge Bank database is not configured.'; render(); return; }
  lib.kbSt = 'loading'; render();
  try{
    const topics = {};
    let cursor = null, guard = 0;
    do{
      const body = {page_size:100}; if(cursor) body.start_cursor = cursor;
      const data = await nPost('/databases/'+fmtId(reg.dbId)+'/query', body);
      for(const p of (data.results||[])){
        const pr = p.properties||{};
        const id = fmtId(p.id);
        topics[id] = {id, url:p.url, title: extractTitle(pr) || '(untitled)',
          parent: (relIds(pr['Parent item'])[0] ? fmtId(relIds(pr['Parent item'])[0]) : null),
          others: relIds(pr['Other Parents']).map(fmtId), children:[], crossKids:[]};
      }
      cursor = data.has_more ? data.next_cursor : null; guard++;
    } while(cursor && guard < 60);
    for(const t of Object.values(topics)){
      if(t.parent && topics[t.parent]) topics[t.parent].children.push(t.id); else t.parent = null;
      t.others = t.others.filter(o=>topics[o] && o!==t.parent);
      t.others.forEach(o=>topics[o].crossKids.push(t.id));
    }
    lib.topics = topics; lib.kbSt = 'ok'; lib._X = null;
    if(lib.sel && lib.sel!=='__unfiled' && !topics[lib.sel]) lib.sel = null;
  }catch(e){
    lib.kbSt = 'error';
    lib.kbMsg = /object_not_found|404/i.test(e.message) ? 'The Knowledge Bank database is not shared with the integration.' : e.message;
  }
  render();
}

/* ── Index: which threads live under which topics ── */
function libIndex(){
  if(lib._X && lib._X.nodes===vs.nodes && lib._X.topics===lib.topics) return lib._X;
  const T = lib.topics;
  const byTitle = new Map(); Object.values(T).forEach(t=>{ const k=t.title.toLowerCase(); if(!byTitle.has(k)) byTitle.set(k, t.id); });
  const compTopics = new Map(), topicComps = new Map(), recency = new Map();
  for(const n of vs.nodes){
    if(n.comp==null || n.comp<0) continue;
    recency.set(n.comp, Math.max(recency.get(n.comp)||0, n.createdAt||0));
    const ids = new Set();
    ((n.rels||{})[LIB_KB_PROP]||[]).forEach(x=>{ const k = fmtId(x); if(T[k]) ids.add(k); });
    (n.kb||[]).forEach(tt=>{ const k = byTitle.get(String(tt).toLowerCase()); if(k) ids.add(k); });
    for(const k of ids){
      if(!compTopics.has(n.comp)) compTopics.set(n.comp, new Map());
      const m = compTopics.get(n.comp); if(!m.has(k)) m.set(k, []); m.get(k).push(n.id);
      if(!topicComps.has(k)) topicComps.set(k, new Set()); topicComps.get(k).add(n.comp);
    }
  }
  const sub = new Map();
  const subtree = id => {
    if(sub.has(id)) return sub.get(id);
    const s = new Set([id]); sub.set(id, s);
    for(const c of (T[id] ? T[id].children : [])) for(const x of subtree(c)) s.add(x);
    return s;
  };
  const sc = new Map();
  const subComps = id => {
    if(sc.has(id)) return sc.get(id);
    const s = new Set(); for(const t of subtree(id)) (topicComps.get(t)||[]).forEach(c=>s.add(c));
    sc.set(id, s); return s;
  };
  const ro = new Map();
  const rootOf = id => {
    if(ro.has(id)) return ro.get(id);
    let cur = id, g = 0; while(T[cur] && T[cur].parent && g++ < 40) cur = T[cur].parent;
    ro.set(id, cur); return cur;
  };
  const allRoots = Object.values(T).filter(t=>!t.parent).map(t=>t.id).sort((a,b)=>T[a].title.localeCompare(T[b].title));
  const color = new Map(); allRoots.forEach((r,i)=>color.set(r, LIB_CLOTH[i % LIB_CLOTH.length]));
  const roots = allRoots.filter(r=>subComps(r).size>0);
  const unfiled = vs.comps.filter(c=>c && !compTopics.has(c.idx)).map(c=>c.idx);
  lib._X = {nodes:vs.nodes, topics:T, compTopics, topicComps, recency, subtree, subComps, rootOf, color, roots, unfiled};
  return lib._X;
}
function libKids(id){
  const X = libIndex(), T = lib.topics;
  return (T[id] ? T[id].children : []).filter(c=>X.subComps(c).size>0).sort((a,b)=>T[a].title.localeCompare(T[b].title));
}
function libPinKey(ci){ const c = vs.comps[ci]; const a = c && vizAnchorNode(c); return a ? a.id : String(ci); }
function libIsPinned(ci){ return lib.pins.has(libPinKey(ci)); }
function libSort(arr){
  const X = libIndex();
  return [...arr].sort((a,b)=>{
    const pa = libIsPinned(a)?1:0, pb = libIsPinned(b)?1:0;
    if(pa!==pb) return pb-pa;
    return (X.recency.get(b)||0) - (X.recency.get(a)||0);
  });
}
function libCompColor(ci){
  const X = libIndex(); const m = X.compTopics.get(ci);
  if(!m) return '#5a5048';
  const c = vs.comps[ci]; const a = c && vizAnchorNode(c);
  let pick = null;
  if(a) for(const [k, ids] of m) if(ids.includes(a.id)){ pick = k; break; }
  if(!pick) pick = [...m.keys()][0];
  return X.color.get(X.rootOf(pick)) || '#5a5048';
}
function libPath(id){
  const out = []; let cur = id, g = 0;
  while(cur && lib.topics[cur] && g++ < 40){ out.unshift(cur); cur = lib.topics[cur].parent; }
  return out;
}
function libDate(ms){ if(!ms) return ''; const d = new Date(ms); return d.toLocaleDateString(undefined,{month:'short', year:'numeric'}); }

/* ── Navigation ── */
function libGo(sel){
  libTransition(()=>{
    lib.sel = sel; lib.threadIdx = null; vs.reader = null; lib.justNav = true; vs.mm.inited = false;
    if(sel && sel!=='__unfiled'){ libPath(sel).slice(0,-1).forEach(x=>lib.open.add(x)); }
    if(window.innerWidth < 860) lib.stacksOpen = false;
    libSaveUi(); render(); window.scrollTo(0,0);
  });
}
function libSetView(v){ if(lib.view===v) return; libTransition(()=>{ lib.view = v; lib.justNav = true; vs.reader = null; if(v==='graph') vs.mm.inited = false; libSaveUi(); render(); }); }
function libToggle(id, btn){
  const node = btn.closest('.lt-node'); if(!node) return;
  const kids = node.querySelector(':scope > .lt-kids > .lt-kids-in');
  if(lib.open.has(id)){
    lib.open.delete(id); node.classList.remove('open'); btn.setAttribute('aria-expanded','false');
  } else {
    lib.open.add(id);
    if(kids && !kids.children.length) kids.innerHTML = libTreeHtml(libKids(id), (+node.dataset.d||0)+1);

}
function libToggleStacks(){ lib.stacksOpen = !lib.stacksOpen; render(); }
function libOpenThread(ci, el){
  if(el && el.style) el.style.viewTransitionName = 'lib-open';
  libTransition(()=>{
    lib.threadIdx = ci;
    vs.reader = {compIdx:ci, expanded:new Set()}; vs.edit = null; vs.sel = null;
    if(vs.selectedComp!==ci){ vs.selectedComp = ci; vs.mm.inited = false; }
    const comp = vs.comps[ci]; const a = comp && vizAnchorNode(comp);
    if(a) recordRecent(a.id, vizThreadLabel(comp));

}
function libCloseThread(){
  const ci = lib.threadIdx;
  libTransition(()=>{ lib.threadIdx = null; vs.reader = null; lib.closing = ci; render(); lib.closing = null; });
}
function libThreadMode(m){ if(lib.threadMode===m) return; libTransition(()=>{ lib.threadMode = m; if(vs.reader) delete vs.reader.cursorId; if(m==='map') vs.mm.inited = false; render(); }); }
function libTogglePin(ci){
  const before = new Map();
  document.querySelectorAll('.lib-book[data-ci]').forEach(el=>{ const k = el.dataset.ci; if(!before.has(k)) before.set(k, el.getBoundingClientRect()); });
  const key = libPinKey(ci);
  if(lib.pins.has(key)) lib.pins.delete(key); else lib.pins.add(key);
  libSavePins(); render();
  if(libReduced()) return;
  const seen = new Set();
  document.querySelectorAll('.lib-book[data-ci]').forEach(el=>{
    const k = el.dataset.ci; if(seen.has(k)) return; seen.add(k);
    const r0 = before.get(k); if(!r0) return;
    const r1 = el.getBoundingClientRect(); const dx = r0.left-r1.left, dy = r0.top-r1.top;
    if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}], {duration:420, easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}

/* ── Pieces ── */
function libTreeHtml(ids, depth){
  const X = libIndex(), T = lib.topics;
  return ids.map(id=>{
    const t = T[id]; const kids = libKids(id); const open = lib.open.has(id);
    return `<div class="lt-node${open?' open':''}" data-d="${depth}">
      <div class="lt-row${lib.sel===id?' sel':''}" style="--d:${depth}">
        ${kids.length ? `<button class="lt-chev" onclick="libToggle('${id}',this)" aria-label="Show subtopics of ${esc(t.title)}" aria-expanded="${open}"><svg viewBox="0 0 10 10" width="9" height="9"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : `<span class="lt-chev-sp"></span>`}
        <button class="lt-name" onclick="libGo('${id}')">${esc(t.title)}</button>
        <span class="lt-count">${X.subComps(id).size}</span>
      </div>
      ${kids.length ? `<div class="lt-kids"><div class="lt-kids-in">${open ? libTreeHtml(kids, depth+1) : ''}</div></div>` : ''}
    </div>`;
  }).join('');
}
function libDots(ci){
  const comp = vs.comps[ci]; const counts = {};
  (comp.nodeIds||[]).forEach(id=>{ const n = vs.byId[id]; if(n) counts[n.type] = (counts[n.type]||0)+1; });
  const order = FRAGMENT_TYPES;
  let out = '', k = 0;
  for(const t of order) for(let i=0; i<(counts[t]||0) && k<14; i++, k++) out += `<i class="ld ld-${typeCssClass(t)}"></i>`;
  return out;
}
let _libNamed = false;
function libBook(ci, i){
  const comp = vs.comps[ci]; if(!comp) return '';
  const pinned = libIsPinned(ci);
  const name = (!_libNamed && lib.closing===ci) ? (_libNamed = true, 'view-transition-name:lib-open;') : '';
  const X = libIndex();
  return `<div class="lib-book${pinned?' pinned':''}" data-ci="${ci}" style="--cloth:${libCompColor(ci)};--i:${i};${name}" role="button" tabindex="0"
      onclick="libOpenThread(${ci}, this)" onkeydown="if(event.key==='Enter'){libOpenThread(${ci}, this)}" title="${esc(vizThreadLabel(comp))}">
    <span class="lib-ribbon" aria-hidden="true"></span>
    <div class="lib-label"><div class="lib-book-t">${esc(vizThreadLabel(comp))}</div></div>

    <span class="lib-book-date">${esc(libDate(X.recency.get(ci)))}</span>
    <button class="lib-pin" onclick="event.stopPropagation();libTogglePin(${ci})" aria-label="${pinned?'Unpin':'Pin'} this thread" title="${pinned?'Unpin':'Pin to the front'}"><svg viewBox="0 0 12 16" width="11" height="14"><path d="M1.5 1h9v13.5L6 11 1.5 14.5Z" fill="${pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
  </div>`;
}
function libShelf(title, comps, opts){
  opts = opts || {};
  const cap = opts.cap || 12;
  const shown = comps.slice(0, cap), more = comps.length - shown.length;
  return `<section class="lib-shelf">
    <div class="lib-shelf-h">

}
function libListRows(comps, scope){

    const comp = vs.comps[ci]; if(!comp) return '';

      <span class="lib-card-dots">${libDots(ci)}</span>
    </button>`;
  }).join('') + `</div>`;
}
function libTick(n){ return `<span class="lib-tick" data-tick="${n}">${n}</span>`; }

/* ── Render ── */
function renderLibrary(){
  const g = gate(); if(g) return `<div class="section-hd"><div class="section-title">Library</div></div>` + g;
  if(vs.loadSt==='idle'){ setTimeout(vizLoad, 0); vs.loadSt = 'loading'; }
  if(!lib.kbSt){ setTimeout(libLoadKb, 0); lib.kbSt = 'loading'; }
  const wait = msg => `<div class="lib lib-wait"><div class="lib-wait-in"><span class="spin"></span> ${msg}</div></div>`;
  if(vs.loadSt==='error') return `<div class="block"><div class="pill pill-err" style="display:block;margin-bottom:10px">${esc(vs.loadMsg)}</div><button class="btn btn-sm" onclick="vizLoad()">Try again</button></div>`;
  if(lib.kbSt==='error') return `<div class="block"><div class="pill pill-err" style="display:block;margin-bottom:10px">${esc(lib.kbMsg)}</div><button class="btn btn-sm" onclick="libLoadKb()">Try again</button></div>`;
  if(vs.loadSt!=='ok' || lib.kbSt!=='ok') return wait('Taking the books down from the shelves…');
  const X = libIndex();
  if(lib.threadIdx!=null && !vs.comps[lib.threadIdx]) lib.threadIdx = null;
  if(lib.threadIdx!=null && !vs.reader){
    if(lib.threadMode==='map') vs.reader = {compIdx:lib.threadIdx, expanded:new Set()};
    else lib.threadIdx = null;
  }
  _libNamed = false;
  const room = lib.threadIdx!=null ? libThreadHtml(lib.threadIdx)
    : lib.sel==='__unfiled' ? libUnfiledHtml()
    : (lib.sel && lib.topics[lib.sel]) ? libHubHtml(lib.sel)
    : libReadingRoomHtml();
  return `<div class="lib${lib.stacksOpen?' stacks-open':''}">
    <aside class="lib-stacks" aria-label="Topics">
      <button class="lib-stacks-h${!lib.sel?' sel':''}" onclick="libGo(null)">The Reading Room</button>
      <div class="lt-tree">${libTreeHtml(X.roots, 0)}</div>
      ${X.unfiled.length ? `<button class="lt-unfiled${lib.sel==='__unfiled'?' sel':''}" onclick="libGo('__unfiled')"><span>Unfiled</span><span class="lt-count">${X.unfiled.length}</span></button>` : ''}
    </aside>
    <main class="lib-room${lib.justNav?' lib-enter':''}">
      <button class="lib-stacks-toggle" onclick="libToggleStacks()" aria-expanded="${lib.stacksOpen}">${lib.stacksOpen?'Close the stacks':'Browse the stacks'}</button>
      ${room}
    </main>
  </div>`;
}
function libCrumbHtml(id, extra){
  const parts = [`<button onclick="libGo(null)">Library</button>`];
  if(id==='__unfiled') parts.push(`<span>Unfiled</span>`);
  else if(id) libPath(id).forEach((p,i,a)=>parts.push(i===a.length-1 && !extra ? `<span>${esc(lib.topics[p].title)}</span>` : `<button onclick="libGo('${p}')">${esc(lib.topics[p].title)}</button>`));
  if(extra) parts.push(`<span>${esc(extra)}</span>`);
  return `<nav class="lib-crumb" aria-label="Breadcrumb">${parts.join('<i class="lib-sep" aria-hidden="true"></i>')}</nav>`;
}
function libReadingRoomHtml(){
  const X = libIndex(), T = lib.topics;
  const all = vs.comps.filter(Boolean).map(c=>c.idx);
  const frags = vs.nodes.length;
  const recent = libSort(all).slice(0, 10);
  const pinned = all.filter(libIsPinned);
  let h = `<div class="lib-hub" style="view-transition-name:lib-hub">
    ${libCrumbHtml(null)}
    <h1 class="lib-h1">The Reading Room</h1>
    <p class="lib-lede">${libTick(all.length)} threads and ${libTick(frags)} fragments, shelved across ${libTick(X.roots.length)} wings of your Knowledge Bank.</p>`;
  if(pinned.length) h += libShelf('Pinned', libSort(pinned));
  h += `<div class="lib-wings">` + X.roots.map((r,i)=>{
    const n = X.subComps(r).size;
    const spines = Math.min(n, 18);
    return `<button class="lib-wing" style="--cloth:${X.color.get(r)};--i:${i}" onclick="libGo('${r}')">
      <span class="lib-wing-t">${esc(T[r].title)}</span>
      <span class="lib-wing-n">${n} ${n===1?'thread':'threads'}</span>
      <span class="lib-wing-spines" aria-hidden="true">${Array.from({length:spines},(_,k)=>`<i style="--h:${62+((k*37)%34)}%;--s:${(k%3)*8}%"></i>`).join('')}</span>
    </button>`;
  }).join('') + `</div>`;
  h += libShelf('Recently added', recent, {cap:10});
  if(X.unfiled.length) h += `<p class="lib-note">${X.unfiled.length} ${X.unfiled.length===1?'thread has':'threads have'} no Knowledge Bank topic yet. <button class="lib-link" onclick="libGo('__unfiled')">See the unfiled shelf</button></p>`;
  return h + `</div>`;
}
function libUnfiledHtml(){
  const X = libIndex();
  const comps = libSort(X.unfiled);
  return `<div class="lib-hub" style="view-transition-name:lib-hub">
    ${libCrumbHtml('__unfiled')}
    <h1 class="lib-h1">Unfiled</h1>
    <p class="lib-lede">${libTick(comps.length)} threads without a Knowledge Bank topic. Give one of their fragments a topic and they'll move onto the right shelf.</p>
    ${lib.view==='list' ? libListRows(comps) : lib.view==='graph' ? libMapSplit(comps) : libShelf('Waiting for a home', comps, {cap:200})}
  </div>`;
}
function libHubHtml(id){
  const X = libIndex(), T = lib.topics, t = T[id];
  const scope = X.subtree(id);
  const comps = libSort([...X.subComps(id)]);
  const kids = libKids(id);
  const frags = comps.reduce((s,ci)=>s+((vs.comps[ci]||{}).total||0), 0);
  const descWithContent = [...scope].filter(k=>k!==id && X.subComps(k).size>0).length;
  const color = X.color.get(X.rootOf(id));
  let h = `<div class="lib-hub" style="view-transition-name:lib-hub;--wing:${color}">
    ${libCrumbHtml(id)}
    <div class="lib-hub-head">
      <h1 class="lib-h1">${esc(t.title)}</h1>
      <div class="lib-viewseg" role="group" aria-label="View">
        <button class="${lib.view==='map'?'on':''}" onclick="libSetView('map')">Shelves</button>
        <button class="${lib.view==='list'?'on':''}" onclick="libSetView('list')">Catalog</button>
        <button class="${lib.view==='graph'?'on':''}" onclick="libSetView('graph')">Map</button>
      </div>
    </div>
    <p class="lib-lede">${libTick(comps.length)} threads, ${libTick(frags)} fragments${descWithContent?`, across ${libTick(descWithContent)} subtopics`:''}.
      <a class="lib-link" href="${esc(t.url||'#')}" target="_blank" rel="noopener">Open in Notion</a></p>`;
  if(kids.length > 1){
    const tot = kids.reduce((s,k)=>s+X.subComps(k).size, 0) || 1;
    h += `<div class="lib-dist" role="list" aria-label="Subtopics by size">` + kids.map((k,i)=>{
      const n = X.subComps(k).size;
      return `<button role="listitem" class="lib-dist-seg" style="flex:${n};--k:${i}" onclick="libGo('${k}')" title="${esc(T[k].title)}: ${n}"><span>${esc(T[k].title)}</span></button>`;
    }).join('') + `</div>`;
  }

  /* Layer 1 — what I know */
  h += `<h2 class="lib-h2">What I know</h2>`;
  const pinned = comps.filter(libIsPinned);
  if(lib.view==='list'){
    h += libListRows(comps, scope);
  } else if(lib.view==='graph'){
    h += libMapSplit(comps);
  } else {
    if(pinned.length) h += libShelf('Pinned', pinned);
    const direct = libSort([...(X.topicComps.get(id)||[])]);
    if(!kids.length) h += libShelf(t.title, comps, {cap:60});
    else {
      if(direct.length) h += libShelf('Filed under '+t.title, direct);
      kids.forEach(k=>{ h += libShelf(T[k].title, libSort([...X.subComps(k)]), {go:k}); });
    }
  }

  /* Layer 2 — what I don't know yet */
  const loops = [];
  comps.forEach(ci=>{ (vs.comps[ci].nodeIds||[]).forEach(nid=>{ const n = vs.byId[nid];
    if(n && !n.resolved && (n.type==='Open Loop' || n.type==='Referential CQ')) loops.push({n, ci}); }); });
  const empty = [...scope].filter(k=>k!==id && X.subComps(k).size===0).sort((a,b)=>T[a].title.localeCompare(T[b].title));
  if(loops.length || empty.length){
    h += `<h2 class="lib-h2">What I don't know yet</h2>`;
    if(loops.length) h += `<div class="lib-loops">` + loops.slice(0,18).map(({n,ci})=>`<button class="lib-loop ${n.type==='Open Loop'?'is-ol':'is-q'}" onclick="libOpenThread(${ci}, null)">
        <span class="lib-loop-t">${esc(n.title)}</span><span class="lib-loop-m">${esc(tqShort(vizThreadLabel(vs.comps[ci]), 60))}</span></button>`).join('')
      + (loops.length>18 ? `<div class="lib-more">and ${loops.length-18} more</div>` : '') + `</div>`;
    if(empty.length) h += `<div class="lib-empties"><span class="lib-empties-h">Empty shelves</span>${empty.slice(0,40).map(k=>`<a class="lib-empty" href="${esc(T[k].url||'#')}" target="_blank" rel="noopener" title="Open this topic in Notion">${esc(T[k].title)}</a>`).join('')}${empty.length>40?`<span class="lib-more">+${empty.length-40}</span>`:''}</div>`;
  }

  /* Layer 3 — where it reaches */
  const myRoot = X.rootOf(id);
  const crossings = new Map();
  comps.forEach(ci=>{ const m = X.compTopics.get(ci); if(!m) return;
    for(const k of m.keys()){ const r = X.rootOf(k); if(r!==myRoot){ if(!crossings.has(r)) crossings.set(r, new Set()); crossings.get(r).add(ci); } } });
  const crossListed = new Map();
  for(const s of scope) for(const x of ((T[s]||{}).crossKids||[])){
    if(scope.has(x)) continue;
    const cs = X.subComps(x); if(cs.size) crossListed.set(x, cs);
  }
  if(crossings.size || crossListed.size){
    h += `<h2 class="lib-h2">Where it reaches</h2>`;
    if(crossings.size){

/* ════════════════════════════════════════════════════════════════════════
 *  NOTION-FIRST KNOWLEDGE BANK (Nov 2026 redesign)
 *  Notion is where things are written, connected and tagged. This app is a
 *  lens over it, for the things Notion can't do well:
 *    • Topics  — everything in every database, grouped by Knowledge Bank topic
 *    • Tagging — what was edited lately and has no topic, with the whole
 *                directory at hand (and an optional Claude round trip)
 *    • Export  — one-click markdown for any set of topics, to think with
 *  Nothing here keeps its own copy of your content.
 * ════════════════════════════════════════════════════════════════════════ */
const AT_UI_KEY = 'rs_atlas_ui_v1';
let at = {
  st:null, msg:'', prog:{}, dbs:[], items:[], byId:{}, bodies:{}, _X:null,
  sel:null, open:new Set(), group:'all', expand:new Set(), stacksOpen:false, justNav:false
