          <button class="btn btn-sm" onclick="rvSetDateRange(7)">Last 7 days</button>
          <button class="btn btn-sm" onclick="rvSetDateRange(30)">Last 30 days</button>
          <button class="btn btn-sm" onclick="rvSetDateRange(90)">Last 90 days</button>
          <button class="btn btn-sm" onclick="rvSetDateRange(365)">Last year</button>
        </div>

        <button class="btn btn-primary btn-full" style="margin-top:18px" onclick="rvStartTimeDeck()">
          Build deck
        </button>
      </div>
    </div>`;
  }

  if(s.phase==='loading'){
    const label = describeDeck(s.deckSpec);
    return `
    <div class="empty">
      <div class="empty-icon"><span class="spin" style="width:30px;height:30px;border-width:3px"></span></div>
      <div class="empty-h" style="margin-top:16px">Loading deck…</div>
      <p class="empty-p">${esc(label)} — fetching from Notion.</p>
    </div>`;
  }

  if(s.phase==='preview'){
    const items     = s.previewItems || [];
    const cardCount = items.reduce((n,it) => n + (it.type === 'string' ? it.cards.length : 1), 0);
    const stringCount = items.filter(it => it.type === 'string').length;

    if(items.length === 0){
      // Everything was removed — let the user start over from the dashboard
      return `
      <div class="empty">
        <div class="empty-icon">🗑️</div>
        <div class="empty-h">Deck is empty</div>
        <p class="empty-p">All items have been removed. Back to the dashboard?</p>
        <button class="btn btn-sm" onclick="rvBackToDashboard()">Back to dashboard</button>
      </div>`;
    }

    let h = `
    <div class="deck-bar">
      <span class="deck-bar-label">${esc(describeDeck(s.deckSpec))}</span>
      <button class="deck-bar-change" onclick="rvBackToDashboard()">Change deck</button>
    </div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">
      ${cardCount} card${cardCount!==1?'s':''}${stringCount>0 ? ` across ${stringCount} string${stringCount!==1?'s':''}` : ''} · tap a row to move it, × to remove
    </div>`;

    // Move-mode banner — only visible while an item is selected for tap-move
    if(s.moveIdx >= 0 && s.moveIdx < items.length){
      const selected = items[s.moveIdx];
      const selName = selected.type === 'string' ? selected.stringTitle : selected.card.name;
      h += `<div class="prev-move-hint">
        <span>Moving "<strong>${esc(selName||'(untitled)')}</strong>" — tap an insert slot below</span>
        <button class="btn-link" onclick="rvTapCancelMove()">Cancel</button>
      </div>`;
    }

    h += `<div class="prev-list">`;

    // Render each row, with insertion slots between when in move mode.
    // Slot N appears before item N. A final slot appears after the last item.
    items.forEach((it, idx) => {
      // Insertion slot before this row (when move mode active and slot is meaningful)
      if(s.moveIdx >= 0 && idx !== s.moveIdx && idx !== s.moveIdx + 1){
        h += `<div class="prev-move-insert" onclick="rvTapInsertAt(${idx})">↓ Insert here ↓</div>`;
      }

      const dragging = s.dragIdx === idx ? ' prev-dragging' : '';
      const selectedCls = s.moveIdx === idx ? ' prev-selected-for-move' : '';

      if(it.type === 'string'){
        h += `<div class="prev-row prev-string${dragging}${selectedCls}"
                draggable="true"
                data-idx="${idx}"
                ondragstart="rvDragStart(event, ${idx})"
                ondragover="rvDragOver(event, ${idx})"
                ondragleave="rvDragLeave(event)"
                ondrop="rvDrop(event, ${idx})"
                ondragend="rvDragEnd(event)">
          <div class="prev-row-head" onclick="rvTapMove(${idx})">
            <span class="prev-handle">⋮⋮</span>
            <span class="prev-icon">🔗</span>
            <span class="prev-title">${esc(it.stringTitle)}</span>
            <span class="prev-count">${it.cards.length} card${it.cards.length!==1?'s':''}</span>
            <button class="prev-remove" onclick="event.stopPropagation();rvRemovePreviewItem(${idx})" title="Remove this string">×</button>
          </div>
          <div class="prev-substrings">
            ${it.cards.map((c, ci) => `
              <div class="prev-subcard">
                <span class="prev-subnum">${c.stringNumber ?? '·'}</span>
                <span class="prev-subname">${esc(c.name || '(untitled)')}</span>
                <span class="prev-substage">${esc(c.stage)}</span>
                <button class="prev-subcard-del" onclick="event.stopPropagation();rvRemoveCardFromString(${idx}, ${ci})" title="Archive this card">×</button>
              </div>
            `).join('')}
          </div>
          <button class="prev-edit-btn" onclick="event.stopPropagation();rvOpenEditString(${idx})" title="Edit cards or add new ones to this string">
            <span>✏️</span><span>Edit / add cards</span>
          </button>
        </div>`;
      } else {
        const c = it.card;
        h += `<div class="prev-row prev-solo${dragging}${selectedCls}"
                draggable="true"
                data-idx="${idx}"
                ondragstart="rvDragStart(event, ${idx})"
                ondragover="rvDragOver(event, ${idx})"
                ondragleave="rvDragLeave(event)"
                ondrop="rvDrop(event, ${idx})"
                ondragend="rvDragEnd(event)">
          <div class="prev-row-head" onclick="rvTapMove(${idx})">
            <span class="prev-handle">⋮⋮</span>
            <span class="prev-icon">📄</span>
            <span class="prev-title">${esc(c.name || '(untitled)')}</span>
            <span class="prev-count">${esc(c.stage)}</span>
            <button class="prev-remove" onclick="event.stopPropagation();rvRemovePreviewItem(${idx})" title="Remove this card">×</button>
          </div>
        </div>`;
      }
    });

    // Trailing insertion slot (for "move to end") — only when in move mode and
    // selected isn't already the last item
    if(s.moveIdx >= 0 && s.moveIdx !== items.length - 1){
      h += `<div class="prev-move-insert" onclick="rvTapInsertAt(${items.length})">↓ Move to end ↓</div>`;
    }

    h += `</div>
    <button class="btn btn-primary btn-full" style="margin-top:18px" onclick="rvStartReview()">
      Start review — ${cardCount} card${cardCount!==1?'s':''}
    </button>`;
    return h;
  }

  if(s.phase === 'editString' && s.editString){
    return renderEditString(s.editString);
  }

  if(s.phase==='error') return `
    <div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-h">Failed to load</div>
      <p class="empty-p">${esc(s.errMsg)}</p>
      <button class="btn" onclick="rvBackToDashboard()">Back to dashboard</button>
    </div>`;

  if(!s.cards.length) return `
    <div class="empty">
      <div class="empty-icon">✅</div>
      <div class="empty-h">No cards in this deck</div>
      <p class="empty-p">${esc(describeDeckEmpty(s.deckSpec))}</p>
      <button class="btn btn-sm" onclick="rvBackToDashboard()">Back to dashboard</button>
    </div>`;

  if(s.phase === 'stringReview' && s.stringBuffer){
    const buf  = s.stringBuffer;
    const saving = s.saveSt === 'loading';
    // First card in the buffer carries the string title
    const firstCard = s.cards[buf.items[0].cardIdx];
    const stringTitle = firstCard?.stringTitle || '(Untitled String)';
    const cardCount = buf.items.length;

    // Color helpers for grade pills
    const pillCls = score =>
      score === '🟢 Solid'   ? 's-green'  :
      score === '🟡 Partial' ? 's-yellow' :
      score === '🔴 Blank'   ? 's-red'    : '';

    let h = `
    <div class="deck-bar">
      <span class="deck-bar-label">${esc(describeDeck(s.deckSpec))}</span>
      <button class="deck-bar-change" onclick="rvBackToDashboard()">Change deck</button>
    </div>
    <div class="str-rev-head">
      <div class="str-rev-icon">🔗</div>
      <div>
        <div class="str-rev-title">${esc(stringTitle)}</div>
        <div class="str-rev-sub">String complete — review your per-card grades, then grade the string as a whole.</div>
      </div>
    </div>

    <div class="str-rev-list">`;

    buf.items.forEach((item, i) => {
      const card     = s.cards[item.cardIdx];
      if(!card) return;
      const cardNum  = i + 1;
      const isOpen   = buf.openScopes.has(item.cardIdx);

      h += `
      <div class="str-rev-card">
        <div class="str-rev-card-head">
          <span class="str-rev-card-num">${cardNum}</span>
          <span class="str-rev-card-name">${esc(card.name || '(untitled)')}</span>
          <span class="str-rev-card-stage">${esc(card.stage)}</span>
          <span class="score-btn ${pillCls(item.score)} str-rev-grade-pill">${esc(item.score)}</span>
        </div>
        <div class="str-rev-card-q">${esc(card.question || card.name)}</div>
        <button class="str-rev-scope-toggle" onclick="rvToggleStringScope(${item.cardIdx})">
          ${isOpen ? '▾ Hide scope documentation' : '▸ Show scope documentation'}
        </button>
        ${isOpen ? `
          <div class="str-rev-scope">
            ${card.scope
              ? `<div class="scope-body">${esc(card.scope)}</div>`
              : `<div class="scope-notion">No scope captured. ${card.url ? `<a href="${esc(card.url)}" target="_blank">Open card in Notion ↗</a>` : ''}</div>`
            }
          </div>` : ''}
      </div>`;
    });

    h += `</div>

    <div class="str-rev-footer">
      <div style="margin-bottom:8px"><button class="rv-nav-btn" onclick="rvBack()" title="Back to the last card of this string">← Back to last card</button></div>
      <div class="str-rev-prompt">Grade this entire string</div>
      <div class="str-rev-prompt-sub">This grade is what gets written to Notion for all ${cardCount} card${cardCount!==1?'s':''}. Per-card grades above are not saved.</div>
      <div class="score-row">
        <button class="score-btn s-red"    onclick="rvStringScore('🔴 Blank')"   ${saving?'disabled':''}><span class="sval">🔴 Blank</span><span class="ssub">Step back</span></button>
        <button class="score-btn s-yellow" onclick="rvStringScore('🟡 Partial')" ${saving?'disabled':''}><span class="sval">🟡 Partial</span><span class="ssub">Repeat stage</span></button>
        <button class="score-btn s-green"  onclick="rvStringScore('🟢 Solid')"   ${saving?'disabled':''}><span class="sval">🟢 Solid</span><span class="ssub">Advance stage</span></button>
      </div>
      ${saving ? `<div style="margin-top:10px;font-size:13px;color:var(--muted)"><span class="spin"></span> Saving ${cardCount} card${cardCount!==1?'s':''} to Notion…</div>` : ''}
      ${s.saveSt==='error' ? `
        <div style="margin-top:8px">
          <span class="pill pill-err">Save failed — tap a score again to retry</span>
          ${s.saveErr ? `<div style="font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--danger);margin-top:6px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all">${esc(s.saveErr)}</div>` : ''}
        </div>` : ''}
    </div>`;
    return h;
  }

  if(s.done){
    const solid   = s.results.filter(r=>r==='🟢 Solid').length;
    const partial = s.results.filter(r=>r==='🟡 Partial').length;
    const blank   = s.results.filter(r=>r==='🔴 Blank').length;
    const pct     = s.results.length ? Math.round((solid/s.results.length)*100) : 0;
    return `<div class="session-done">
      <div class="done-pct">${pct}%</div>
      <div class="done-lbl">Session recall rate</div>
      <div class="done-stats">
        <div><div class="stat-val" style="color:var(--success)">${solid}</div><div class="stat-key">Solid</div></div>
        <div><div class="stat-val" style="color:var(--warning)">${partial}</div><div class="stat-key">Partial</div></div>
        <div><div class="stat-val" style="color:var(--danger)">${blank}</div><div class="stat-key">Blank</div></div>
      </div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:24px">All stages and next review dates updated in Notion.</p>
      <button class="btn" onclick="rvReset()" style="padding:10px 24px">New session</button>
      <button class="btn" onclick="rvBack()" style="padding:10px 24px;margin-left:8px" title="Look back through the cards you just did">← Review cards</button>
    </div>`;
  }

  const card   = s.cards[s.idx];
  const pct    = Math.round((s.idx/s.cards.length)*100);
  const saving = s.saveSt==='loading';

  // String context for this card
  const inString = !!card.stringId;

  let h = `
    <div class="deck-bar">
      <span class="deck-bar-label">${esc(describeDeck(s.deckSpec))}</span>
      <button class="deck-bar-change" onclick="rvBackToDashboard()">Change deck</button>
    </div>
    <div class="prog-wrap">
      <button class="rv-nav-btn" onclick="rvBack()" ${s.idx>0?'':'disabled'} title="Back to the previous card">← Back</button>
      <span class="prog-txt">${s.idx+1} / ${s.cards.length}</span>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="prog-txt" style="color:var(--success)">${s.results.filter(r=>r==='🟢 Solid').length} solid</span>
      ${_rvViewingDone()?`<button class="rv-nav-btn" onclick="rvForward()" title="Skip forward without changing the grade">Forward →</button>`:''}
    </div>
    ${_rvViewingDone()?`<div class="rv-done-banner">Already graded${(s.graded&&s.graded[s.idx])?`: <b>${esc(s.graded[s.idx])}</b>`:''}${card.stringId && s.stringScores && s.stringScores[card.stringId]?` · string scored <b>${esc(s.stringScores[card.stringId])}</b>`:''} — flip and pick a score to replace it, or skip forward.</div>`:''}
    ${inString ? `
    <div style="display:flex;align-items:center;justify-content:space-between;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 14px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:13px">🔗</span>
        <span style="font-size:13px;font-weight:600;color:#1e40af">${esc(card.stringTitle)}</span>
      </div>
      <span style="font-size:12px;font-weight:600;color:#2563eb;background:white;border:1px solid #bfdbfe;padding:2px 10px;border-radius:10px">${card.stringPos} / ${card.stringTotal}</span>
    </div>` : ''}
    <div class="flashcard">
      <div class="fc-meta">
        <span>${esc(card.stage)}${card.ipPageTitle ? ` · ${esc(card.ipPageTitle)}` : ''}</span>
        ${card.url ? `<a href="${esc(card.url)}" target="_blank" class="fc-notion-link">Open in Notion ↗</a>` : ''}
      </div>
      <div class="fc-last-grade-row">
        <span class="fc-last-grade-label">Last grade:</span>
        ${card.lastScore
          ? `<span class="fc-last-grade-pill ${
              card.lastScore === '🟢 Solid'   ? 's-green'  :
              card.lastScore === '🟡 Partial' ? 's-yellow' :
              card.lastScore === '🔴 Blank'   ? 's-red'    : ''
            }">${esc(card.lastScore)}</span>`
          : `<span class="fc-last-grade-none">Never reviewed</span>`}
      </div>
      ${!s.revealed ? `
        <!-- FRONT OF CARD: question + optional hints -->
        ${(s.editing && s.editing.cardIdx === s.idx && s.editing.field === 'question')
          ? renderEditArea('question', s.editing)
          : `<div class="fc-q-row">
              <div class="fc-q">${esc(card.question || card.name)}</div>
              <button class="fc-edit-btn" title="Edit question"
                onclick="rvStartEdit('question', ${s.idx})"
                ${card.questionBlockId ? '' : 'data-noedit="1"'}>✏️</button>
            </div>
            ${!card.questionBlockId ? `<div class="fc-edit-hint">No editable question block found — opens in Notion when clicked.</div>` : ''}`}
        ${(card.hints||[]).length ? `
          <div class="fc-hints">
            <button class="hint-toggle" onclick="rvToggleHints()">${s.showHints?'▾ Hide hints':'▸ Show hints'}</button>
            ${s.showHints ? card.hints.map(hh=>`<div class="hint-line">${esc(hh)}</div>`).join('') : ''}
          </div>` : ''}
      ` : `
        <!-- BACK OF CARD: scope documentation -->
        ${(s.editing && s.editing.cardIdx === s.idx && s.editing.field === 'scope')
          ? `<div class="fc-scope" style="border-top:none;padding-top:0;margin-top:0">
              <div class="scope-lbl">Scope Documentation</div>
              ${renderEditArea('scope', s.editing)}
            </div>`
          : (card.scope ? `
            <div class="fc-scope" style="border-top:none;padding-top:0;margin-top:0">
              <div class="scope-lbl-row">
                <div class="scope-lbl">Scope Documentation</div>
                <button class="fc-edit-btn" title="Edit scope"
                  onclick="rvStartEdit('scope', ${s.idx})"
                  ${card.scopeBlockId ? '' : 'data-noedit="1"'}>✏️</button>
              </div>
              <div class="scope-body">${esc(card.scope)}</div>
              ${!card.scopeBlockId ? `<div class="fc-edit-hint">No editable scope block found — opens in Notion when clicked.</div>` : ''}
              ${card.url ? `<div class="scope-notion">View full scope in Notion: <a href="${esc(card.url)}" target="_blank">Open card ↗</a></div>` : ''}
            </div>
          ` : `
            <div class="fc-scope" style="border-top:none;padding-top:0;margin-top:0">
              <div class="scope-lbl-row">
                <div class="scope-lbl">Full content in Notion</div>
                ${card.scopeBlockId
                  ? `<button class="fc-edit-btn" title="Add scope" onclick="rvStartEdit('scope', ${s.idx})">✏️</button>`
                  : ''}
              </div>
              <div class="scope-notion"><a href="${esc(card.url)}" target="_blank">Open card in Notion ↗</a> to see scope documentation.</div>
            </div>
          `)}
        <button class="flip-back" onclick="rvUnreveal()">↺ Back to question</button>
      `}
    </div>`;

  if(!s.revealed){
    h += `<button class="reveal-btn" onclick="rvReveal()">Click here to flip card</button>`;
  } else {
    h += `<div class="score-row">
      <button class="score-btn s-red"    onclick="rvScore('🔴 Blank')"   ${saving?'disabled':''}><span class="sval">🔴 Blank</span><span class="ssub">Step back</span></button>
      <button class="score-btn s-yellow" onclick="rvScore('🟡 Partial')" ${saving?'disabled':''}><span class="sval">🟡 Partial</span><span class="ssub">Repeat stage</span></button>
      <button class="score-btn s-green"  onclick="rvScore('🟢 Solid')"   ${saving?'disabled':''}><span class="sval">🟢 Solid</span><span class="ssub">Advance stage</span></button>
    </div>`;
    if(saving) h += `<div style="margin-top:10px;font-size:13px;color:var(--muted)"><span class="spin"></span> Saving to Notion…</div>`;
    if(s.saveSt==='error') h += `
      <div style="margin-top:8px">
        <span class="pill pill-err">Save failed — tap a score again to retry</span>
        ${s.saveErr ? `<div style="font-family:'SF Mono','Fira Code',monospace;font-size:11px;color:var(--danger);margin-top:6px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all">${esc(s.saveErr)}</div>` : ''}
      </div>`;
  }
  return h;
}

function bindReviewInputs(){
  const ps = document.getElementById('rv-picker-search');
  if(ps) ps.oninput = () => { rs.pickerSearch = ps.value; render(); };
  const df = document.getElementById('rv-date-from');
  if(df) df.onchange = () => { rs.dateFrom = df.value; };
  const dt = document.getElementById('rv-date-to');
  if(dt) dt.onchange = () => { rs.dateTo = dt.value; };
  rvBindEditArea();
  bindEditStringInputs();
}

/* Render the inline edit textarea + Save / Cancel controls. */
function renderEditArea(field, editing){
  const fieldLabel = field === 'question' ? 'Question' : 'Scope Documentation';
  const placeholder = field === 'question'
    ? 'Open-ended synthesis question…'
    : 'Definitive 2–4 paragraph reference account…';
  const rows = field === 'question' ? 3 : 8;
  const saving = editing.saveSt === 'loading';
  return `
    <div class="fc-edit-block">
      <div class="fc-edit-head">
        <span class="fc-edit-label">Editing ${fieldLabel}</span>
        <span class="fc-edit-hint" style="margin-left:auto">Saves to Notion on save.</span>
      </div>
      <textarea id="rv-edit-area" rows="${rows}" placeholder="${esc(placeholder)}" ${saving?'disabled':''}>${esc(editing.value)}</textarea>
      ${editing.saveSt === 'error' ? `
        <div style="margin-top:6px"><span class="pill pill-err">Save failed: ${esc(editing.saveErr || 'unknown error')}</span></div>
      ` : ''}
      <div class="fc-edit-actions">
        <button class="btn btn-sm" onclick="rvCancelEdit()" ${saving?'disabled':''}>Cancel</button>
        <button class="btn btn-sm btn-primary" onclick="rvSaveEdit()" ${saving?'disabled':''}>
          ${saving ? '<span class="spin"></span> Saving…' : 'Save to Notion'}
        </button>
      </div>
    </div>
  `;
}

/* Render the edit-string editor. */
function renderEditString(es){
  if(es.loadSt === 'loading'){
    return `
    <div class="empty">
      <div class="empty-icon"><span class="spin" style="width:30px;height:30px;border-width:3px"></span></div>
      <div class="empty-h" style="margin-top:16px">Loading string…</div>
      <p class="empty-p">Reading existing cards and donor relations from Notion.</p>
    </div>`;
  }
  if(es.loadSt === 'error'){
    return `
    <div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-h">Failed to load string</div>
      <p class="empty-p">${esc(es.loadErr)}</p>
      <button class="btn" onclick="rvCancelEditString()">← Back to preview</button>
    </div>`;
  }

  const totalCount = es.existingCards.length + es.newCards.length;
  const newCount   = es.newCards.length;
  const saving     = es.saveSt === 'saving';
  const inheritedKeys = Object.keys(es.donorRelations || {})
    .filter(k => k !== 'String Name' && k !== 'Active Recall' && (es.donorRelations[k]||[]).length);

  let h = `
    <button class="picker-back" onclick="rvCancelEditString()">← Back to preview</button>
    <div style="font-size:18px;font-weight:600;margin:8px 0 4px">Edit string: ${esc(es.stringTitle)}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:14px">
      ${es.existingCards.length} existing card${es.existingCards.length!==1?'s':''}${newCount?`, ${newCount} new`:''}.
      ${inheritedKeys.length ? `New cards inherit: ${esc(inheritedKeys.join(', '))}` : 'No relations to inherit (donor card had none).'}
    </div>`;

  // Existing cards section
  if(es.existingCards.length){
    h += `<div class="es-section">
      <div class="es-section-h">Existing cards <span style="font-weight:400;color:var(--muted);font-size:11px">(edits patch in place)</span></div>`;
    es.existingCards.forEach((c, i) => {
      h += `
        <div class="es-card">
          <div class="es-card-head">
            <span class="es-card-pos">${c.stringNumber ?? '?'}</span>
            <span class="es-card-id" title="Card page ID">${esc(c.id.slice(0,8))}…</span>
            <button class="prev-remove" style="margin-left:auto" onclick="rvEsDeleteExisting(${i})" title="Archive this card permanently">×</button>
          </div>
          <label class="flabel">Name</label>

      for(let p=1; p<=maxPos; p++){
        positionOptions.push(`<option value="${p}" ${p===c.insertAt?'selected':''}>Position ${p}${p===maxPos?' (end)':''}</option>`);
      }
      h += `
        <div class="es-card es-card-new">
          <div class="es-card-head">
            <span class="es-card-pos es-card-pos-new">NEW</span>
            <select data-es-new data-idx="${i}" data-field="insertAt" class="es-pos-select">
              ${positionOptions.join('')}
            </select>
            <button class="prev-remove" onclick="rvEsRemoveNewCard(${i})" style="margin-left:auto" title="Remove this new card">×</button>
          </div>
          <label class="flabel">Name</label>
          <input type="text" data-es-new data-idx="${i}" data-field="name" value="${esc(c.name)}" placeholder="Short concept label (3–7 words)…">

          <textarea data-es-new data-idx="${i}" data-field="question" rows="2" placeholder="Open-ended synthesis question…">${esc(c.question)}</textarea>
          <label class="flabel">Hints</label>
          ${(c.hints||[]).map((hh, j) => `
            <div class="hint-row">
              <input type="text" data-es-new-hint data-ci="${i}" data-hi="${j}" value="${esc(hh)}" placeholder="Hint ${j+1}…">
              <button class="hint-del" onclick="rvEsNewRemoveHint(${i},${j})">×</button>
            </div>
          `).join('')}
          <button class="btn btn-dashed" onclick="rvEsNewAddHint(${i})">+ Add hint</button>
          <label class="flabel">Scope Documentation</label>
          <textarea data-es-new data-idx="${i}" data-field="scope" rows="5" placeholder="Definitive 2–4 paragraph reference account…">${esc(c.scope)}</textarea>
        </div>`;
    });
  }
  h += `<button class="btn btn-dashed" style="padding:10px;margin-top:10px;width:100%" onclick="rvEsAddNewCard()">+ Add new card</button>
  </div>`;

  // Save / cancel
  h += `<div style="margin-top:18px;display:flex;gap:10px;align-items:center">
    <button class="btn" onclick="rvCancelEditString()" ${saving?'disabled':''}>Cancel</button>
    <button class="btn btn-primary" style="flex:1" onclick="rvSaveEditString()" ${saving?'disabled':''}>
      ${saving ? '<span class="spin"></span> Saving to Notion…' : `Save changes${newCount?` & create ${newCount} new card${newCount!==1?'s':''}`:''}`}
    </button>
  </div>`;

  if(es.saveSt === 'error'){
    h += `<div style="margin-top:10px"><span class="pill pill-err">${esc(es.saveErr)}</span></div>`;
  }
  if(es.saveResults && es.saveResults.length){
    h += `<div style="margin-top:14px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px">
      <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin-bottom:8px">Save log</div>

        </div>
      `).join('')}

  }

  return h;
}

/* ── Describe a deck spec for status text ── */
function describeDeck(spec){
  if(!spec) return 'Loading…';
  if(spec.type === 'due')      return '🔥 Due Today';
  if(spec.type === 'relation') return `${spec.relPropLabel || spec.relProp}: ${spec.relPageTitle}`;
  if(spec.type === 'time'){
    const f = spec.dateFrom || '…';
    const t = spec.dateTo   || '…';
    return `🗓️ Created ${f} → ${t}`;
  }
  return 'Deck';
}
function describeDeckEmpty(spec){
  if(!spec) return '';
  if(spec.type === 'due')      return 'No cards due today. Come back tomorrow!';
  if(spec.type === 'relation') return `No active cards linked to "${spec.relPageTitle}".`;
  if(spec.type === 'time')     return 'No cards were created in that range.';
  return '';
}

async function runDeck(spec){
  rs = {...rs,
    phase:'loading', deckSpec:spec,
    previewItems:[], dragIdx:-1, moveIdx:-1,
    cards:[], idx:0, revealed:false, showHints:false,
    saveSt:null, saveErr:'', results:[], done:false, errMsg:''
  };
  render();
  try{
    const cards = await loadDeck(spec);
    if(cards.length === 0){
      // No cards at all — go to the empty-deck screen via 'loaded' branch
      rs = {...rs, phase:'loaded', cards};
    } else {
      const previewItems = buildPreviewItems(cards);
      rs = {...rs, phase:'preview', cards, previewItems};
    }
  }catch(e){
    rs = {...rs, phase:'error', errMsg: e.message || 'Unknown error'};
  }
  render();
}

/* ── Group flat cards into preview items, preserving their loaded order. ──
 * Walks the sorted cards list once. When a card is part of a string,
 * the first card to reference that string opens a string item; subsequent
 * cards in the same string append to it. Solo cards become their own items.
 * loadDeck already sorts string cards by String Number within each group, so
 * this just needs to bucket cards into items in encounter order.
 */
function buildPreviewItems(cards){
  const items = [];
  const stringIdxById = new Map();   // stringId → items[] index
  for(const card of cards){
    if(card.stringId){
      if(stringIdxById.has(card.stringId)){
        items[stringIdxById.get(card.stringId)].cards.push(card);
      } else {
        stringIdxById.set(card.stringId, items.length);
        items.push({
          type: 'string',
          stringId:    card.stringId,
          stringTitle: card.stringTitle || '(Untitled String)',
          cards:       [card]
        });
      }
    } else {
      items.push({type:'solo', card});
    }
  }
  return items;
}

/* ── Flatten preview items back into a flat cards list for the review. ── */
function flattenPreviewItems(items){
  const out = [];
  for(const it of items){
    if(it.type === 'string') for(const c of it.cards) out.push(c);
    else                     out.push(it.card);
  }
  // Re-stamp stringPos / stringTotal in case strings were reordered or trimmed
  const groups = {};
  out.forEach((c,i) => {
    if(c.stringId){
      if(!groups[c.stringId]) groups[c.stringId] = [];
      groups[c.stringId].push(i);
    }
  });
  out.forEach((c,i) => {
    if(c.stringId){
      const grp = groups[c.stringId];
      c.stringPos   = grp.indexOf(i) + 1;
      c.stringTotal = grp.length;
    }
  });
  return out;
}

/* ── Preview-screen handlers ── */
/* ── Delete from preview ──
 * Archives the card(s) in Notion and removes them from the in-memory deck.
 * Confirmation is required because archive is irreversible from this UI
 * (recoverable from Notion trash for 30 days, but the user can't undo here).
 */
async function rvRemovePreviewItem(idx){
  if(idx < 0 || idx >= rs.previewItems.length) return;
  const item = rs.previewItems[idx];

  // Build the confirm prompt
  let prompt;
  if(item.type === 'string'){
    const n = item.cards.length;
    prompt = `Archive the entire string "${item.stringTitle}" — all ${n} card${n!==1?'s':''}?\n\nThe cards will move to Notion's trash (recoverable for 30 days). They won't appear in future decks.`;
  } else {
    prompt = `Archive the card "${item.card.name||'(untitled)'}"?\n\nIt will move to Notion's trash (recoverable for 30 days). It won't appear in future decks.`;
  }
  if(!confirm(prompt)) return;

  // Collect the page IDs to archive
  const ids = item.type === 'string'
    ? item.cards.map(c => c.id)
    : [item.card.id];

  // Optimistically remove from UI; if archive fails, the next deck load will
  // surface the card again (we'll surface an error if any individual call fails)
  rs.previewItems = rs.previewItems.filter((_, i) => i !== idx);
  rs.dragIdx = -1; rs.moveIdx = -1;
  render();

  // Archive in parallel
  const archResults = await mapPool(ids, async (id) => {
    try{ await nArchivePage(id); return {ok: true}; }
    catch(e){ return {ok: false, err: e.message}; }
  }, 5);
  const failed = archResults.filter(r => !r.ok);
  if(failed.length){
    alert(`Couldn't archive ${failed.length} of ${ids.length} cards. The first error: ${failed[0].err}`);
  }
}

/* Delete a single card from within a string row on the preview.
 * If it was the last card in the string, the whole string entry is removed. */
async function rvRemoveCardFromString(stringIdx, cardIdxInString){
  if(stringIdx < 0 || stringIdx >= rs.previewItems.length) return;
  const item = rs.previewItems[stringIdx];
  if(item.type !== 'string') return;
  const card = item.cards[cardIdxInString];
  if(!card) return;

  if(!confirm(`Archive the card "${card.name||'(untitled)'}" from string "${item.stringTitle}"?\n\nIt will move to Notion's trash (recoverable for 30 days). It won't appear in future decks.`)) return;

  // Optimistically remove from the local string
  const newCards = item.cards.filter((_, i) => i !== cardIdxInString);
  if(newCards.length === 0){
    // Last card in string — drop the whole string entry from preview
    rs.previewItems = rs.previewItems.filter((_, i) => i !== stringIdx);
  } else {
    rs.previewItems = rs.previewItems.map((it, i) => i === stringIdx ? {...it, cards: newCards} : it);
  }
  rs.dragIdx = -1; rs.moveIdx = -1;
  render();

  // Archive in Notion
  try{ await nArchivePage(card.id); }
  catch(e){ alert(`Couldn't archive "${card.name||'(untitled)'}" in Notion: ${e.message}`); }
}

function rvDragStart(ev, idx){
  rs.dragIdx = idx;
  // Some browsers require setData for drag to work
  try{ ev.dataTransfer.setData('text/plain', String(idx)); }catch(e){}
  ev.dataTransfer.effectAllowed = 'move';
  // Apply dragging visual directly — don't re-render mid-drag
  const row = ev.currentTarget;
  if(row) row.classList.add('prev-dragging');
}
function rvDragOver(ev, idx){
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  // Visual feedback: mark the row being hovered
  const row = ev.currentTarget;
  if(row && !row.classList.contains('prev-drop-target')){
    document.querySelectorAll('.prev-drop-target').forEach(el => el.classList.remove('prev-drop-target'));
    if(rs.dragIdx !== idx) row.classList.add('prev-drop-target');
  }
}
function rvDragLeave(ev){
  // Only clear when actually leaving the row, not when entering a child
  const row = ev.currentTarget;
  if(row && !row.contains(ev.relatedTarget)){
    row.classList.remove('prev-drop-target');
  }
}
function rvDrop(ev, targetIdx){
  ev.preventDefault();
  document.querySelectorAll('.prev-drop-target').forEach(el => el.classList.remove('prev-drop-target'));
  const fromIdx = rs.dragIdx;
  rs.dragIdx = -1;
  if(fromIdx < 0 || fromIdx === targetIdx) { render(); return; }
  // Splice from the original position, then insert at the target
  const items = rs.previewItems.slice();
  const [moved] = items.splice(fromIdx, 1);
  // After splicing, indices >= fromIdx shifted left by 1
  const insertAt = targetIdx > fromIdx ? targetIdx - 1 : targetIdx;
  items.splice(insertAt, 0, moved);
  rs.previewItems = items;
  render();
}
function rvDragEnd(ev){
  // If drop already cleared dragIdx, nothing to do — drop already re-rendered.
  // If drop didn't fire (drag cancelled outside any target), reset state here.
  document.querySelectorAll('.prev-drop-target').forEach(el => el.classList.remove('prev-drop-target'));
  document.querySelectorAll('.prev-dragging').forEach(el => el.classList.remove('prev-dragging'));
  if(rs.dragIdx !== -1){
    rs.dragIdx = -1;
    render();
  }
}

/* ── Tap-to-move (mobile-friendly alternative to drag) ─────────────────
 * Lives alongside HTML5 drag-and-drop, not replacing it. Tap a row to
 * "select for move" — the row gets a dashed outline and insertion slots
 * appear between every other row. Tap any slot to drop the selected row
 * there. Tap the selected row again (or hit Cancel in the hint banner)
 * to clear the selection.
 *
 * Works on desktop too, but mobile users for whom drag is unusable get a
 * functional reorder path without any compromise to the desktop experience.
 */
function rvTapMove(idx){
  if(rs.moveIdx === idx){
    rs.moveIdx = -1;          // tap the selected row again → cancel
  } else {
    rs.moveIdx = idx;
  }
  render();
}
function rvTapInsertAt(targetSlot){
  // targetSlot ranges over 0..previewItems.length. targetSlot=N means "insert
  // before the row currently at index N"; targetSlot=length means "append."
  const fromIdx = rs.moveIdx;
  rs.moveIdx = -1;
  if(fromIdx < 0){ render(); return; }
  if(targetSlot === fromIdx || targetSlot === fromIdx + 1){ render(); return; }  // no-op slots
  const items = rs.previewItems.slice();
  const [moved] = items.splice(fromIdx, 1);
  const insertAt = targetSlot > fromIdx ? targetSlot - 1 : targetSlot;
  items.splice(insertAt, 0, moved);
  rs.previewItems = items;
  render();
}
function rvTapCancelMove(){
  rs.moveIdx = -1;
  render();
}

/* ── Session persistence (localStorage) ────────────────────────────────
 * Saves an in-progress review so the user can close the tab and come back.
 * Single-key model: only one paused session can exist at a time. New session
 * starts overwrite the checkpoint as soon as the user grades their first card.
 *
 * Schema (v1):
 *   { v: 1,
 *     deckSpec, deckLabel,
 *     savedAt: ISO string,
 *     cards: [...],     // full snapshot — questions/scope/hints/blockIds
 *     idx: number,      // already-rewound to start of current string if mid-string
 *     results: [...]    // grades of solo cards (string per-card grades omitted)
 *   }
 *
 * Deliberately omitted from snapshot:
 *   - stringBuffer (string buffer is reset on resume; per-card grades didn't
 *     write to Notion anyway, so no data loss — user re-grades from card 1)
 *   - editing (in-flight inline edits are discarded on unload)
 *   - previewItems (preview is for deck-build; resume jumps straight to play)
 */
const SESSION_STORAGE_KEY = 'recall-system.session.v1';

const sessionStore = {
  save(state){
    try{
      localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(state));
      return true;
    }catch(e){
      console.warn('Session save failed:', e.message);
      return false;
    }
  },
  load(){
    try{
      const raw = localStorage.getItem(SESSION_STORAGE_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      if(!parsed || parsed.v !== 1) { this.clear(); return null; }
      return parsed;
    }catch(e){
      console.warn('Session load failed, clearing:', e.message);
      this.clear();
      return null;
    }
  },
  clear(){
    try{ localStorage.removeItem(SESSION_STORAGE_KEY); }catch(e){}
  },
  has(){
    try{ return !!localStorage.getItem(SESSION_STORAGE_KEY); }catch(e){ return false; }
  }
};

/* Take a snapshot of the active session and persist. Skips when nothing's
 * worth saving (no deck loaded, no progress yet, or session is finished). */
function checkpointSession(){
  // Only checkpoint during an active loaded session
  if(rs.phase !== 'loaded' && rs.phase !== 'stringReview') return;
  if(!rs.deckSpec || !rs.cards || !rs.cards.length) return;
  if(rs.done) return;
  // No progress yet → nothing to resume
  if(rs.idx === 0 && (!rs.results || rs.results.length === 0)) return;

  // If we're mid-string (string-graded grades buffered but string-level not yet
  // applied), rewind the saved idx to the start of the current string, since we
  // discard the buffer on resume per the design.
  let saveIdx = rs.idx;
  if(rs.stringBuffer && rs.stringBuffer.items && rs.stringBuffer.items.length){
    saveIdx = rs.stringBuffer.items[0].cardIdx;
  } else if(rs.phase === 'stringReview' && rs.stringBuffer){
    // We're at the string-review screen — also rewind to the string's first card
    saveIdx = rs.stringBuffer.items[0].cardIdx;
  }

  // Trim down each card to just what we need to play it back
  const slim = rs.cards.map(c => ({
    id: c.id, name: c.name, stage: c.stage, count: c.count, url: c.url,
    stringId: c.stringId, stringNumber: c.stringNumber,
    stringTitle: c.stringTitle, stringPos: c.stringPos, stringTotal: c.stringTotal,
    ipId: c.ipId, ipPageTitle: c.ipPageTitle,
    lastScore: c.lastScore,
    question: c.question, hints: c.hints, scope: c.scope,
    questionBlockId: c.questionBlockId, scopeBlockId: c.scopeBlockId
  }));

  // Filter results: only keep solo-card grades. String per-card grades
  // happened in the buffer that we're discarding, so they shouldn't survive.
  // Trim results to the saveIdx — entries up to that point either wrote
  // to Notion (solo cards) or were buffered grades that we're rewinding.
  const slimResults = (rs.results || []).slice(0, saveIdx);

  sessionStore.save({
    v: 1,
    deckSpec:   rs.deckSpec,
    deckLabel:  describeDeck(rs.deckSpec),
    savedAt:    new Date().toISOString(),
    cards:      slim,
    idx:        saveIdx,
    results:    slimResults
  });
}

/* Wire up beforeunload save (called once at page load). */
function installSessionAutoSave(){
  window.addEventListener('beforeunload', () => {
    // Synchronous save on unload — localStorage is sync so this works
    checkpointSession();
  });
}

// Dismiss the Visualize facet suggestion dropdown when the user clicks anywhere
// outside the picker (the input + its dropdown both live inside .viz-pick-wrap).

/* Format relative time for the resume banner. */
function fmtAge(isoStr){
  try{
    const ms   = Date.now() - new Date(isoStr).getTime();
    const mins = Math.floor(ms / 60000);
    if(mins < 1)   return 'just now';
    if(mins < 60)  return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if(hrs < 24)   return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    return `${days}d ago`;
  }catch(e){ return ''; }
}

/* Resume-banner handlers ───────────────────────────── */
async function rvResumeSavedSession(rebuild){
  const saved = sessionStore.load();
  if(!saved){ render(); return; }

  // Set up loading state
  rs = {...rs, phase:'loading', deckSpec: saved.deckSpec, errMsg:''};
  render();

  if(rebuild){
    // Throw away saved cards; rebuild deck from current Notion state
    sessionStore.clear();
    try{
      const cards = await loadDeck(saved.deckSpec);
      if(cards.length === 0){
        rs = {...rs, phase:'loaded', cards};
      } else {
        const previewItems = buildPreviewItems(cards);
        rs = {...rs, phase:'preview', cards, previewItems};
      }
    }catch(e){
      rs = {...rs, phase:'error', errMsg: e.message || 'Rebuild failed'};
    }
    render();
    return;
  }

  // Continue saved: refetch each remaining card's current state from Notion,
  // skip ones that 404 / are now Mastered, and land on phase 'loaded'.
  try{
    const remaining = saved.cards.slice(saved.idx);
    // Fetch all remaining cards in parallel — biggest win for resume time
    const liveArr = await mapPool(remaining, async (c) => {
      try{
        const live = await nGet('/pages/'+fmtId(c.id));
        return {ok: true, live};
      }catch(e){
        return {ok: false, err: e};
      }
    }, 5);

    const validated = [];
    remaining.forEach((c, i) => {
      const r = liveArr[i];
      if(!r || !r.ok || r.__err) return;          // network error → skip
      const live = r.live;
      if(live.archived) return;                    // archived → skip
      const rawStage = live.properties?.Stage?.select?.name;
      const stage = normalizeStage(rawStage || c.stage);
      if(stage === '🏆 Mastered') return;          // already done elsewhere
      const count = live.properties?.['Review Count']?.number ?? c.count;
      const lastScore = live.properties?.['Recall Score']?.select?.name ?? c.lastScore ?? null;
      validated.push({...c, stage, count, lastScore});
    });

    if(validated.length === 0){
      // Nothing left to play — clear and go to dashboard
      sessionStore.clear();
      rs = {...rs, phase:'idle', deckSpec:null, cards:[], idx:0,
            results:[], done:false, errMsg:''};
      render();
      return;
    }

    // Reattach already-played cards as a head so rs.cards/rs.idx still align
    const played = saved.cards.slice(0, saved.idx);
    const allCards = [...played, ...validated];

    rs = {...rs,
      phase:'loaded',
      deckSpec: saved.deckSpec,
      cards: allCards,
      idx: saved.idx,           // resume at the first un-graded card
      frontier: saved.idx, graded:{}, stringScores:{},   // earlier cards can be revisited; their grades aren't in the snapshot
      revealed: false,
      showHints: false,
      stringBuffer: null,       // discarded by design
      editing: null,
      saveSt: null, saveErr: '',
      results: saved.results || [],
      done: false,
      errMsg: ''
    };
    render();
  }catch(e){
    rs = {...rs, phase:'error', errMsg: e.message || 'Resume failed'};
    render();
  }
}

function rvDiscardSavedSession(){
  if(!confirm('Discard your saved session? Cards already graded stay in Notion, but the in-progress order will be lost.')) return;
  sessionStore.clear();
  render();
}


/* ── Edit-string sub-flow ────────────────────────────────────────────────
 * Triggered from the "+ Add card" button on a string row in the preview.
 * Loads the donor card's relations (so new cards inherit them), pulls the
 * full block content of every existing card (Name, Question, Scope, Hints),
 * shows an editor, and on save patches existing cards + creates new ones,
 * then re-stamps String Number on every card so the final order is right.
 */
async function rvOpenEditString(previewIdx){
  const item = rs.previewItems[previewIdx];
  if(!item || item.type !== 'string') return;
  rs.editString = {
    stringPreviewIdx: previewIdx,
    stringId: item.stringId,
    stringTitle: item.stringTitle,
    existingCards: [],
    newCards: [],
    donorRelations: null,
    loadSt: 'loading', loadErr: '',
    saveSt: null, saveErr: '',
    saveResults: []
  };
  rs.phase = 'editString';
  render();

  try{
    // Fetch full content for every existing card AND the donor's relations
    // in parallel. Each card's content fetch is independent; the donor fetch
    // is a separate independent call that we kick off at the same time.
    const donor = item.cards[0];
    const [contentArr, donorPage] = await Promise.all([
      mapPool(item.cards, c => readCardFullContent(c.id), 4),
      donor ? fetchPage(donor.id).catch(e => {
        console.warn('Donor relation fetch failed:', e.message);
        return null;
      }) : Promise.resolve(null)
    ]);

    const existingCards = item.cards.map((c, i) => {
      const detail = contentArr[i] && !contentArr[i].__err
        ? contentArr[i]
        : {question:'',scope:'',hints:[],questionBlockId:null,scopeBlockId:null,hintsToggleId:null};
      const finalQuestion = detail.question || c.question || '';
      const finalScope    = detail.scope    || c.scope    || '';
      const finalHints    = detail.hints && detail.hints.length ? detail.hints : (c.hints || []);
      return {
        id:           c.id,
        name:         c.name || '',
        question:     finalQuestion,
        scope:        finalScope,
        hints:        finalHints,
        stringNumber: c.stringNumber ?? null,
        // Originals for change detection at save time
        origName:     c.name || '',
        origQuestion: finalQuestion,
        origScope:    finalScope,
        origHints:    finalHints.slice(),
        // Block IDs for in-place patching
        questionBlockId: detail.questionBlockId,
        scopeBlockId:    detail.scopeBlockId,
        hintsToggleId:   detail.hintsToggleId
      };
    });

    // Sort by current String Number (ascending), nulls to end
    existingCards.sort((a,b) => {
      const an = a.stringNumber ?? 9999;
      const bn = b.stringNumber ?? 9999;
      return an - bn;
    });

    const donorRelations = (donorPage && donorPage.relations) || {};

    rs.editString.existingCards  = existingCards;
    rs.editString.donorRelations = donorRelations;
    rs.editString.loadSt = 'ok';
    render();
  }catch(e){
    rs.editString.loadSt  = 'error';
    rs.editString.loadErr = e.message || 'Failed to load string contents';
    render();
  }
}

function rvCancelEditString(){
  rs.editString = null;
  rs.phase = 'preview';
  render();
}

/* Read full block content of a card, including hints toggle ID. */
async function readCardFullContent(pageId){
  let question='', hints=[], scope='';
  let questionBlockId=null, scopeBlockId=null, hintsToggleId=null;
  try{
    const blocksRes = await nGet('/blocks/'+fmtId(pageId)+'/children?page_size=100');
    const blocks = blocksRes.results || [];
    let nextBlockIsScope = false;

    for(let i=0; i<blocks.length; i++){
      const b  = blocks[i];
      const bt = b.type;
      const btxt = ((b[bt]?.rich_text)||[]).map(x=>x.plain_text).join('');

      if(bt==='numbered_list_item' && btxt && !question){
        question = btxt;
        questionBlockId = b.id;
      }
      if(bt==='toggle' && /hint/i.test(btxt)){
        hintsToggleId = b.id;
        try{
          const ch = await nGet('/blocks/'+b.id+'/children?page_size=20');
          hints = (ch.results||[]).map(c=>((c[c.type]?.rich_text)||[]).map(x=>x.plain_text).join('')).filter(Boolean);
        }catch(e){}
      }
      if(bt==='heading_3' && /scope/i.test(btxt)){
        nextBlockIsScope = true;
        continue;
      }
      if(nextBlockIsScope){
        if(bt === 'paragraph' || bt === 'numbered_list_item' || bt === 'bulleted_list_item'){
          scope = btxt;
          scopeBlockId = b.id;
          nextBlockIsScope = false;
        } else {
          nextBlockIsScope = false;
        }
      }
    }
  }catch(e){}
  return {question, hints, scope, questionBlockId, scopeBlockId, hintsToggleId};
}

/* Archive an existing card from the edit-string editor. Removes it from the
 * editor's working copy AND from the underlying preview-items entry so the
 * preview reflects the deletion after Cancel/Save. Notion archive happens
 * immediately and is irreversible from this UI. */
async function rvEsDeleteExisting(idx){
  const es = rs.editString; if(!es) return;
  const card = es.existingCards[idx];
  if(!card) return;
  if(!confirm(`Archive the card "${card.name||'(untitled)'}" from string "${es.stringTitle}"?\n\nIt will move to Notion's trash (recoverable for 30 days). It won't appear in future decks.`)) return;

  // Remove from the editor's working copy
  es.existingCards.splice(idx, 1);

  // Also remove from the underlying previewItems entry so the preview list
  // reflects the deletion when we return. If this leaves the string empty,
  // drop the whole string row from previewItems.
  const psIdx = es.stringPreviewIdx;
  if(typeof psIdx === 'number' && psIdx >= 0 && psIdx < rs.previewItems.length){
    const stringItem = rs.previewItems[psIdx];
    if(stringItem && stringItem.type === 'string'){
      const newCards = stringItem.cards.filter(c => c.id !== card.id);
      if(newCards.length === 0){
        rs.previewItems = rs.previewItems.filter((_, i) => i !== psIdx);
        // Editor's pointer is stale, but we're about to close it
      } else {
        rs.previewItems = rs.previewItems.map((it, i) =>
          i === psIdx ? {...it, cards: newCards} : it
        );
      }
    }
  }

  render();

  // Archive in Notion (don't block UI)
  try{ await nArchivePage(card.id); }
  catch(e){ alert(`Couldn't archive "${card.name||'(untitled)'}" in Notion: ${e.message}`); }
}

/* ── Save edits & new cards back to Notion. ──
 *
 * Algorithm:
 *   1. Patch existing cards' Name/Question/Scope/Hints where changed.
 *   2. Create each new (non-empty) card in AR with full inheritance from donor.
 *   3. Compute the final order: existing cards by their current stringNumber,
 *      with new cards inserted at their requested insertAt position.
 *      (Earlier-listed new cards go first when two share the same insertAt.)
 *   4. Re-stamp String Number on every card whose final position differs.
 *   5. Refetch the deck & rebuild preview items so the UI reflects reality.
 */
async function rvSaveEditString(){
  const es = rs.editString; if(!es) return;
  es.saveSt = 'saving'; es.saveErr = ''; es.saveResults = [];
  render();

  const results = [];
  const newlyCreated = [];   // [{tempIdx, id, insertAt}] for ordering pass

  try{
    // Step 1: patch existing cards' edited fields
    for(let i=0; i<es.existingCards.length; i++){
      const c = es.existingCards[i];
      const changes = [];

      // Name (page title property)
      if((c.name||'') !== (c.origName||'')){
        try{
          await nPatch('/pages/'+fmtId(c.id), {properties:{
            'Name': {title:[{type:'text', text:{content: c.name||''}}]}
          }});
          changes.push('Name');
        }catch(e){ throw new Error(`Card ${i+1} Name: ${e.message}`); }
      }

      // Question (block patch)
      if((c.question||'') !== (c.origQuestion||'')){
        if(c.questionBlockId){
          await patchBlockText(c.questionBlockId, c.question||'');
          changes.push('Question');
        } else {
          results.push({label:`Card ${i+1} Question: skipped`, ok:false, err:'No question block found (legacy template card?)'});
        }
      }

      // Scope (block patch)
      if((c.scope||'') !== (c.origScope||'')){
        if(c.scopeBlockId){
          await patchBlockText(c.scopeBlockId, c.scope||'');
          changes.push('Scope');
        } else {
          results.push({label:`Card ${i+1} Scope: skipped`, ok:false, err:'No scope block found (legacy template card?)'});
        }
      }

      // Hints (replace toggle children if changed)
      const cleanedHints = (c.hints||[]).filter(h => (h||'').trim() !== '');
      const cleanedOrig  = (c.origHints||[]).filter(h => (h||'').trim() !== '');
      if(JSON.stringify(cleanedHints) !== JSON.stringify(cleanedOrig)){
        if(c.hintsToggleId){
          await replaceToggleChildren(c.hintsToggleId, cleanedHints);
          changes.push('Hints');
        } else {
          results.push({label:`Card ${i+1} Hints: skipped`, ok:false, err:'No hints toggle found (legacy template card?)'});
        }
      }

      if(changes.length){
        results.push({label:`Card ${i+1} (${esc(c.name)||'(untitled)'}) updated: ${changes.join(', ')}`, ok:true});
      }
    }

    // Step 2: create new cards (skip ones with no name)
    for(let i=0; i<es.newCards.length; i++){
      const nc = es.newCards[i];
      const trimmedName = (nc.name||'').trim();
      if(!trimmedName){
        results.push({label:`New card ${i+1}: skipped (no name)`, ok:true});
        continue;
      }
      try{
        const created = await createCardInString(nc, es.stringId, es.donorRelations);
        newlyCreated.push({tempIdx:i, id:created.id, insertAt: nc.insertAt});
        results.push({label:`New card "${esc(trimmedName)}" created`, ok:true});
      }catch(e){
        results.push({label:`New card "${esc(trimmedName)}" failed`, ok:false, err:e.message});
      }
    }

    // Step 3: compute final order
    // Build a list of {kind:'existing'|'new', cardId, originalNumber, insertAt}
    // then sort: existing by stringNumber, new spliced at insertAt.
    const existingEntries = es.existingCards
      .map(c => ({kind:'existing', id: c.id, currentNumber: c.stringNumber ?? 9999}));
    existingEntries.sort((a,b) => a.currentNumber - b.currentNumber);

    const ordered = existingEntries.slice();
    // Insert new cards by their requested position. Earlier-processed new
    // cards get spliced first, so a later-listed card inserting at the same
    // position will land at that position and bump earlier ones down.
    // (User can adjust per-card insertAt to disambiguate.)
    for(const nc of newlyCreated){
      // Clamp 1..ordered.length+1
      const pos = Math.max(1, Math.min(nc.insertAt|0 || (ordered.length+1), ordered.length+1));
      ordered.splice(pos-1, 0, {kind:'new', id: nc.id, currentNumber: null});
    }

    // Step 4: re-stamp String Number on every card whose final position differs
    for(let i=0; i<ordered.length; i++){
      const targetNumber = i + 1;
      const entry = ordered[i];
      if(entry.kind === 'existing' && entry.currentNumber === targetNumber) continue;
      try{
        await nPatch('/pages/'+fmtId(entry.id), {properties:{
          'String Number': {number: targetNumber}
        }});
      }catch(e){
        results.push({label:`String Number patch for ${entry.id.slice(0,8)} failed`, ok:false, err:e.message});
      }
    }

    es.saveResults = results;
    es.saveSt = 'ok';

    // Step 5: refetch the deck so the preview reflects all changes, then return to preview
    setTimeout(async () => {
      try{
        const cards = await loadDeck(rs.deckSpec);
        const previewItems = buildPreviewItems(cards);
        rs.cards        = cards;
        rs.previewItems = previewItems;
        rs.editString   = null;
        rs.phase        = 'preview';
        render();
      }catch(e){
        rs.editString.saveSt  = 'error';
        rs.editString.saveErr = `Saved, but failed to refresh preview: ${e.message}`;
        render();
      }
    }, 800);
  }catch(e){
    es.saveSt  = 'error';
    es.saveErr = e.message || String(e);
    es.saveResults = results;
    render();
  }
}

/* Helper: patch a single block's rich_text, detecting its current type. */
async function patchBlockText(blockId, text){
  const blockInfo = await nGet('/blocks/'+blockId);
  const t = blockInfo.type;
  if(!t || !['paragraph','numbered_list_item','bulleted_list_item','heading_1','heading_2','heading_3','quote','callout'].includes(t)){
    throw new Error(`Unsupported block type: ${t||'unknown'}`);
  }
  const body = {};
  body[t] = { rich_text: text ? [{type:'text', text:{content: text}}] : [] };
  await nPatch('/blocks/'+blockId, body);
}

/* Helper: replace a toggle's children with new bulleted list items. */
async function replaceToggleChildren(toggleId, hintLines){
  // Read current children
  const childRes = await nGet('/blocks/'+toggleId+'/children?page_size=50');
  const oldKids = childRes.results || [];
  // Delete each existing child
  for(const k of oldKids){
    try{ await nDelete('/blocks/'+k.id); }catch(e){ /* archived blocks can fail; continue */ }
  }
  // Append new bulleted_list_item children if any
  if(hintLines.length){
    await nPost('/blocks/'+toggleId+'/children', {
      children: hintLines.map(h => ({
        object:'block', type:'bulleted_list_item',
        bulleted_list_item: {rich_text: [{type:'text', text:{content: h}}]}
      }))
    });
  }
}

/* Helper: create a new AR card inside a string with full relation inheritance. */
async function createCardInString(card, stringPageId, donorRelations){
  const props = {
    'Name':         {title:[{type:'text', text:{content: card.name||''}}]},
    'Stage':        {select:{name: STAGES[0]}},
    'Next Review':  {date:{start: today()}},
    'Review Count': {number: 0},
    'String Name':  {relation:[{id: fmtId(stringPageId)}]}
  };

  // Inherit all relation properties from donor (skip String Name which we set above
  // and back-relations that would create loops)
  if(donorRelations){
    for(const [key, relArray] of Object.entries(donorRelations)){
      if(key === 'String Name')   continue;  // already set
      if(key === 'Active Recall') continue;  // back-relation
      if(!relArray || relArray.length === 0) continue;
      props[key] = {relation: relArray.map(r => ({id: r.id}))};
    }
  }

  const children = buildBodyBlocks(card);
  const page = await nPost('/pages', {
    parent: {database_id: fmtId(AR_DB)},
    properties: props,
    children
  });
  return page;
}


function rvStartReview(){
  if(!rs.previewItems.length) return;
  const orderedCards = flattenPreviewItems(rs.previewItems);
  rs = {...rs, phase:'loaded', cards: orderedCards, idx:0, revealed:false, showHints:false, stringBuffer:null, editing:null, saveSt:null, saveErr:'', results:[], done:false, frontier:0, graded:{}, stringScores:{}};
  render();
}

/* ── Score the active card. ──
 * For solo cards (no stringId), writes through to Notion immediately,
 * advances to the next deck item.
 * For string cards, buffers the grade in memory only — no Notion write — and
 * advances. When the last card of the string is graded, transitions to the
 * stringReview phase so the user can apply a single canonical string-level grade.
 */
async function rvScore(score){
  const card = rs.cards[rs.idx]; if(!card) return;
  rs.graded = rs.graded || {}; rs.stringScores = rs.stringScores || {};

  if(_rvViewingDone()){
    // ── Re-grading a card we went back to ──
    // Solo card: rewrite its stage / next review from the pre-review snapshot
    // (updateCard derives everything from card.stage/card.count, so this
    // replaces the earlier write rather than compounding it). Card of an
    // already-scored string: keep the string grade, rewrite its Recall Score.
    rs.saveSt='loading'; rs.saveErr=''; render();
    try{
      if(card.stringId) await updateCard(card.id, rs.stringScores[card.stringId] || score, card.stage, card.count, score);
      else              await updateCard(card.id, score, card.stage, card.count);
      rs.graded[rs.idx]=score;
      if(rs.results && rs.results.length > rs.idx) rs.results[rs.idx]=score;
      rs.saveSt='ok';
      setTimeout(()=>{ rs.saveSt=null; rvForward(); }, 350);
    }catch(e){ rs.saveSt='error'; rs.saveErr=e.message||String(e); render(); }
    return;
  }

  if(card.stringId){
    // ── String card: buffer the grade, don't write to Notion ──
    if(!rs.stringBuffer || rs.stringBuffer.stringId !== card.stringId){
      // Starting a new string buffer
      rs.stringBuffer = {stringId: card.stringId, items: [], openScopes: new Set()};
    }
    rs.stringBuffer.items.push({cardIdx: rs.idx, score});
    rs.results = [...rs.results, score]; // record for session-summary stats
    rs.graded[rs.idx]=score;

    // Is this the last card of the string?
    const next = rs.cards[rs.idx + 1];
    const isLastInString = !next || next.stringId !== card.stringId;

    if(isLastInString){
      // Transition to string-review screen
      rs.phase = 'stringReview';
      rs.revealed = false; rs.showHints = false;
      rs.editing = null;
      checkpointSession();
      render();
    } else {
      // Advance to the next card in the string
      rs.idx++; rs.frontier=rs.idx;
      rs.revealed = false; rs.showHints = false;
      rs.editing = null;
      checkpointSession();
      render();
    }
    return;
  }

  // ── Solo card: write through immediately (current behavior) ──
  rs.saveSt='loading'; rs.saveErr=''; render();
  try{
    await updateCard(card.id, score, card.stage, card.count);
    rs.results = [...rs.results, score];
    rs.graded[rs.idx]=score;
    rs.saveSt = 'ok';
    setTimeout(()=>{
      if(rs.idx+1>=rs.cards.length){
        rs.done=true; rs.frontier=rs.cards.length;
        sessionStore.clear();   // session complete — nothing to resume
      } else {
        rs.idx++; rs.frontier=rs.idx;
        rs.revealed=false; rs.showHints=false; rs.editing=null;
        rs.saveSt=null; rs.saveErr='';
        checkpointSession();
      }
      render();
    }, 400);
  }catch(e){
    rs.saveSt='error'; rs.saveErr=e.message||String(e); render();
  }
}

/* ── Apply the string-level grade. ──
 * Writes the same score to every card in the string buffer using each card's
 * pre-review stage and Review Count. Then advances past the string in the deck.
 * The per-card grades buffered in memory remain visible in `rs.results` for
 * session statistics, but the canonical Notion record reflects only the
 * string-level grade.
 */
async function rvStringScore(stringScore){
  const buf = rs.stringBuffer;
  if(!buf || !buf.items.length) return;
  rs.saveSt='loading'; rs.saveErr=''; render();

  try{
    // Apply the grade to every card in the buffer.
    // Stage/count come from the deck-load snapshot (per-card grades never
    // wrote to Notion, so card.stage/card.count are unchanged).
    // String-level grade drives Stage/Next Review/Last Reviewed/Review Count.
    // Per-card grade is written to Recall Score so the canonical record of
    // each card's individual performance survives — visible next time as the
    // "Last grade" strip on that card's front.
    for(const item of buf.items){
      const card = rs.cards[item.cardIdx];
      if(!card) continue;
      await updateCard(card.id, stringScore, card.stage, card.count, item.score);
    }

    // Last cardIdx in the buffer is the string's last card in the deck.
    const lastIdx = buf.items[buf.items.length - 1].cardIdx;
    rs.stringScores = rs.stringScores || {}; rs.stringScores[buf.stringId] = stringScore;
    rs.stringBuffer = null;
    rs.saveSt = 'ok';

    setTimeout(()=>{
      if(lastIdx + 1 >= rs.cards.length){
        rs.done = true; rs.frontier = rs.cards.length;
        sessionStore.clear();   // session complete
      } else {
        rs.idx       = lastIdx + 1; rs.frontier = rs.idx;
        rs.phase     = 'loaded';
        rs.revealed  = false;
        rs.showHints = false;
        rs.editing   = null;
        rs.saveSt    = null;
        rs.saveErr   = '';
        checkpointSession();
      }
      render();
    }, 400);
  }catch(e){
    rs.saveSt='error'; rs.saveErr=e.message||String(e); render();
  }
}

/* ── Go back / forward through cards already done ──────────────────────
 * Back steps to the previous card. If that card's grade is still buffered in
 * the current string (not yet written), the buffered grade is popped so the
 * card simply plays again. Otherwise the card opens in "already graded" mode:
 * its grade is shown and can be replaced (see rvScore), or you skip forward. */
function rvBack(){
  if(rs.done){ rs.done=false; rs.frontier=rs.cards.length; rs.idx=rs.cards.length-1; rs.revealed=false; rs.showHints=false; rs.editing=null; render(); return; }
  if(rs.phase==='stringReview' && rs.stringBuffer && rs.stringBuffer.items.length){
    const it = rs.stringBuffer.items.pop();
    if(rs.results.length) rs.results = rs.results.slice(0,-1);
    delete rs.graded[it.cardIdx];
    if(!rs.stringBuffer.items.length) rs.stringBuffer=null;
    rs.phase='loaded'; rs.idx=it.cardIdx; rs.frontier=rs.idx;
    rs.revealed=false; rs.showHints=false; rs.editing=null; render(); return;
  }
  if(rs.idx<=0) return;
  const prev = rs.idx-1;
  const buf = rs.stringBuffer;
  if(!_rvViewingDone() && buf && buf.items.length && buf.items[buf.items.length-1].cardIdx===prev){
    buf.items.pop();
    if(rs.results.length) rs.results = rs.results.slice(0,-1);
    delete rs.graded[prev];
    if(!buf.items.length) rs.stringBuffer=null;
    rs.idx=prev; rs.frontier=prev;
  } else {
    if(rs.frontier==null) rs.frontier=rs.idx;
    rs.idx=prev;
  }
  rs.revealed=false; rs.showHints=false; rs.editing=null;
  checkpointSession(); render();
}
function rvForward(){
  const f=_rvFrontier();
  if(rs.idx>=f){ render(); return; }
  rs.idx++;
  if(rs.idx>=rs.cards.length){ rs.done=true; rs.idx=rs.cards.length-1; }
  rs.revealed=false; rs.showHints=false; rs.editing=null;
  render();
}

/* ── Toggle the scope panel for a card on the string review screen. ── */
function rvToggleStringScope(cardIdx){
  if(!rs.stringBuffer) return;
  const open = rs.stringBuffer.openScopes;
  if(open.has(cardIdx)) open.delete(cardIdx); else open.add(cardIdx);
  render();
}

/* ── Inline editing of question and scope ── */
function rvStartEdit(field, cardIdx){
  // field: 'question' | 'scope'
  const card = rs.cards[cardIdx];
  if(!card) return;
  const blockId = field === 'question' ? card.questionBlockId : card.scopeBlockId;
  if(!blockId){
    // Tab-format card or missing block — defer to Notion
    if(card.url) window.open(card.url, '_blank');
    return;
  }
  const value = field === 'question' ? (card.question || '') : (card.scope || '');
  rs.editing = {field, cardIdx, blockId, value, saveSt:null, saveErr:''};
  render();
  // Focus the textarea after render
  setTimeout(()=>{
    const el = document.getElementById('rv-edit-area');
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 50);
}
function rvCancelEdit(){
  rs.editing = null;
  render();
}
async function rvSaveEdit(){
  if(!rs.editing) return;
  // Pull the latest value from the live textarea in case onInput didn't fire
  const el = document.getElementById('rv-edit-area');
  if(el) rs.editing.value = el.value;
  const {field, cardIdx, blockId, value} = rs.editing;
  rs.editing.saveSt = 'loading'; rs.editing.saveErr = '';
  render();

  try{
    // Discover the block's current type so we can patch with the right key.
    // Notion's PATCH /blocks/{id} requires the body to use the same type key
    // (paragraph / numbered_list_item / bulleted_list_item) that the block
    // already has — sending the wrong key returns 400.
    const blockInfo = await nGet('/blocks/'+blockId);
    const blockType = blockInfo.type;
    if(!blockType || !['paragraph','numbered_list_item','bulleted_list_item','heading_1','heading_2','heading_3','quote','callout'].includes(blockType)){
      throw new Error(`Unsupported block type: ${blockType||'unknown'}`);
    }

    const patchBody = {};
    patchBody[blockType] = {
      rich_text: value
        ? [{type:'text', text:{content: value}}]
        : []
    };
    await nPatch('/blocks/'+blockId, patchBody);

    // Mirror the change into the in-memory card so the UI shows the new value
    const card = rs.cards[cardIdx];
    if(card){
      if(field === 'question') card.question = value;
      else if(field === 'scope') card.scope = value;
    }
    rs.editing = null;
    render();
  }catch(e){
    rs.editing.saveSt  = 'error';
    rs.editing.saveErr = e.message || String(e);
    render();
  }
}
function rvBindEditArea(){
  const el = document.getElementById('rv-edit-area');
  if(el && rs.editing){
    el.oninput = () => { rs.editing.value = el.value; };
  }
}

/* ── Upcoming tab — projected review calendar ────────────────────────── */
function renderUpcoming(){
  const g = gate(); if(g) return g;
  const s = us;

  if(s.phase === 'loading'){
    return `
    <div class="empty">
      <div class="empty-icon"><span class="spin" style="width:30px;height:30px;border-width:3px"></span></div>
      <div class="empty-h" style="margin-top:16px">Building forecast…</div>
      <p class="empty-p">Projecting Solid grades forward through every active card.</p>
    </div>`;
  }
  if(s.phase === 'error'){
    return `
    <div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-h">Failed to load</div>
      <p class="empty-p">${esc(s.errMsg)}</p>
      <button class="btn" onclick="loadUpcoming()">Retry</button>
    </div>`;
  }
  if(s.phase === 'idle'){
    return `
    <div class="empty">
      <div class="empty-icon">🗓️</div>
      <div class="empty-h">Upcoming reviews</div>
      <p class="empty-p">Loading your schedule…</p>
    </div>`;
  }

  // ── Group entries by date for fast lookup ──
  const byDate = new Map();           // iso → [entries]
  for(const e of s.entries){
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  }

  // ── Count entries per day (string-grouped: 1 string = 1 count) ──
  const dayCount = (iso) => {
    const arr = byDate.get(iso) || [];
    const seen = new Set();
    let n = 0;
    for(const e of arr){
      const key = e.stringId || e.cardId;
      if(seen.has(key)) continue;
      seen.add(key);
      n++;
    }
    return n;
  };

  // ── Week strip: next 7 days starting today ──
  const todayIso = today();
  const weekDays = [];
  for(let i=0; i<7; i++) weekDays.push(addDays(i));
  const weekCounts = weekDays.map(dayCount);
  const weekMax    = Math.max(1, ...weekCounts);
  const weekStrip = `
    <div class="up-week-strip">
      <div class="up-week-header">Next 7 days</div>
      <div class="up-week-bars">
        ${weekDays.map((iso, i) => {
          const d = new Date(iso+'T12:00:00');
          const dayName = d.toLocaleDateString(undefined, {weekday:'short'});
          const dayNum  = d.getDate();
          const c       = weekCounts[i];
          const heightPct = c > 0 ? Math.max(8, Math.round((c/weekMax)*100)) : 0;
          const isToday = iso === todayIso;
          return `
            <button class="up-week-day${isToday?' up-week-today':''}" onclick="rvUpcomingSelectDay('${iso}')">
              <div class="up-week-bar-wrap"><div class="up-week-bar" style="height:${heightPct}%"></div></div>
              <div class="up-week-count">${c || ''}</div>
              <div class="up-week-dow">${esc(dayName)}</div>
              <div class="up-week-dnum">${dayNum}</div>
            </button>
          `;
        }).join('')}
      </div>
    </div>`;

  // ── Month grid for the currently shown month ──
  const ref = new Date();
  ref.setDate(1);
  ref.setMonth(ref.getMonth() + s.monthOffset);
  const yr = ref.getFullYear();
  const mo = ref.getMonth();
  const monthLabel = ref.toLocaleDateString(undefined, {month:'long', year:'numeric'});

  // First and last day of the month
  const first = new Date(yr, mo, 1);
  const lastDay = new Date(yr, mo+1, 0).getDate();
  // Calendar leading offset: weekday of the 1st (0=Sun)
  const leadOffset = first.getDay();

  const cells = [];
  // Empty leading cells
  for(let i=0; i<leadOffset; i++) cells.push({empty:true});
  // Day cells
  for(let d=1; d<=lastDay; d++){
    const isoMonth = String(mo+1).padStart(2,'0');
    const isoDay   = String(d).padStart(2,'0');
    const iso      = `${yr}-${isoMonth}-${isoDay}`;
    cells.push({iso, day:d, count: dayCount(iso), isToday: iso === todayIso});
  }
  // Trailing pad to a 7-multiple
  while(cells.length % 7 !== 0) cells.push({empty:true});

  const monthGrid = `
    <div class="up-month-head">
      <div class="up-month-nav">
        <button class="btn btn-sm" onclick="rvUpcomingPrevMonth()" title="Previous month">‹</button>
        <div class="up-month-label">${esc(monthLabel)}</div>
        <button class="btn btn-sm" onclick="rvUpcomingNextMonth()" title="Next month">›</button>
      </div>
      <button class="btn btn-sm" onclick="rvUpcomingToday()">Today</button>
    </div>
    <div class="up-grid">
      <div class="up-grid-dows">
        ${['S','M','T','W','T','F','S'].map(d=>`<div class="up-grid-dow">${d}</div>`).join('')}
      </div>
      <div class="up-grid-cells">
        ${cells.map(c => {
          if(c.empty) return `<div class="up-cell up-cell-empty"></div>`;
          const selected = s.selectedDay === c.iso;
          const cls = [
            'up-cell',
            c.isToday   ? 'up-cell-today'    : '',
            selected    ? 'up-cell-selected' : '',
            c.count===0 ? 'up-cell-empty-count' : ''
          ].filter(Boolean).join(' ');
          return `
            <button class="${cls}" onclick="rvUpcomingSelectDay('${c.iso}')">
              <span class="up-cell-num">${c.day}</span>
              ${c.count ? `<span class="up-cell-dot">${c.count}</span>` : ''}
            </button>`;
        }).join('')}
      </div>
    </div>`;

  // ── Selected day expansion ──
  let dayPanel = '';
  if(s.selectedDay){
    const arr = (byDate.get(s.selectedDay) || []).slice();
    // Group by string id; entries without a string id become solo rows
    const groups = new Map(); // key → {key, isString, name, count, fromStage, toStage, url, members:[entries]}
    for(const e of arr){
      const key = e.stringId || `solo:${e.cardId}`;
      if(!groups.has(key)){
        groups.set(key, {
          key,
          isString:  !!e.stringId,
          name:      e.stringId ? e.stringName : e.cardName,
          fromStage: e.fromStage,
          toStage:   e.toStage,
          url:       e.stringId ? null : e.url,
          members:   []
        });
      }
      groups.get(key).members.push(e);
    }
    const dayDate = new Date(s.selectedDay+'T12:00:00');
    const dayLabel = dayDate.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});

    const groupList = [...groups.values()].sort((a,b) => {
      // Strings first, then by name
      if(a.isString !== b.isString) return a.isString ? -1 : 1;
      return (a.name||'').localeCompare(b.name||'');
    });

    if(groupList.length === 0){
      dayPanel = `
        <div class="up-day-panel">
          <div class="up-day-head">
            <div class="up-day-label">${esc(dayLabel)}</div>
            <button class="btn-link" onclick="rvUpcomingSelectDay('${s.selectedDay}')">Close</button>
          </div>
          <div style="text-align:center;color:var(--muted);padding:20px;font-size:13px">No reviews on this day.</div>
        </div>`;
    } else {
      dayPanel = `
        <div class="up-day-panel">
          <div class="up-day-head">
            <div class="up-day-label">${esc(dayLabel)} <span class="up-day-count">${groupList.length} item${groupList.length!==1?'s':''}</span></div>
            <button class="btn-link" onclick="rvUpcomingSelectDay('${s.selectedDay}')">Close</button>
          </div>
          <div class="up-day-list">
            ${groupList.map(g => {
              const cnt    = g.members.length;
              const subtxt = g.isString ? `${cnt} card${cnt!==1?'s':''}` : '';
              return `
                <div class="up-day-row${g.isString?' up-day-row-string':''}">
                  <div class="up-day-row-icon">${g.isString?'🔗':'📄'}</div>
                  <div class="up-day-row-body">
                    <div class="up-day-row-name">${esc(g.name||'(untitled)')}</div>
                    <div class="up-day-row-meta">
                      ${subtxt ? `<span>${esc(subtxt)}</span> · ` : ''}
                      <span>${esc(g.fromStage)} → ${esc(g.toStage)}</span>
                    </div>
                  </div>
                  ${g.url ? `<a class="up-day-row-link" href="${esc(g.url)}" target="_blank">↗</a>` : ''}
                </div>`;
            }).join('')}
          </div>
        </div>`;
    }
  }

  // ── Range selector ──
  const totalEntries = s.entries.length;
  const rangeBtn = (k, label) => `
    <button class="up-range-btn${s.range===k?' on':''}" onclick="rvSetUpcomingRange('${k}')">${label}</button>`;

  return `
    <div class="up-head">
      <div class="up-head-title">Projected reviews</div>
      <div class="up-head-sub">Assuming you grade every card 🟢 Solid. ${totalEntries} projected review${totalEntries!==1?'s':''} within range.</div>
      <div class="up-range">
        ${rangeBtn('30d', 'Next 30 days')}
        ${rangeBtn('90d', 'Next 90 days')}
        ${rangeBtn('all', 'All to Mastered')}
      </div>
    </div>
    ${weekStrip}
    ${monthGrid}
    ${dayPanel}
  `;
}


/* ════════════════════════════════════════════════════════════════════════
 *  THREAD QUEUE TAB
 * ════════════════════════════════════════════════════════════════════════ */

/* ── Option-C line parser ──
 * One fragment per pipe-delimited line:
 *   <ID> | <idea text> | Key: Value | Key: Value ...
 * Field 1 = local ID (prefix → Type). Field 2 = idea text → Name.
 * Remaining "Key: Value" fields → notation. Recognized keys (case-insensitive):
 *   Builds On / Connected to / Source / Relation / Type (explicit override)
 * Lines that don't start with a known ID prefix and aren't "Suggested Knowledge
 * Bank topics:" are collected as warnings so nothing is silently dropped.
 */
function makeRel(kind, db, instance){
  // kind: 'primary' | 'capture' | 'goals'. For primary/capture, db resolves via
  // PRIMARY_SOURCE_MAP/registry; for goals, via GOALS_DBS.
  const reg = relDbByName(db);
  return {
    kind,
    db,
    instance: (instance||'').trim(),
    relProp: reg ? reg.relProp : null,
    dsId:    reg ? reg.dsId : null,
    dbId:    reg ? reg.dbId : null,
    status: reg ? (instance ? 'pending' : 'needsinstance') : 'baddb',
    matchId:null, matchTitle:null,
    options:[], picking:false,
    query:'', results:null, searchSt:null,
    fromInherit:false
  };
}

// Parse a "<DB> — <instance>" value into {db, instance} or null.
function splitRelValue(v){
  const cleaned = (v||'').replace(/\s*\(primary\)\s*$/i,'').trim();
  const m = cleaned.split(/\s+[—–-]\s+/);
  if(m.length >= 2){
    return {db: canonicalSourceName(m[0]), instance: m.slice(1).join(' — ').trim()};
  }
  return {db:'', instance: cleaned};
}

function parseThreadLine(raw){
  const parts = raw.split('|').map(s=>s.trim());
  if(parts.length < 2) return null;
  const localId = parts[0];
  // Must look like a fragment id: letters then digits (C1, RC2a, RCQ3, OL1)
  if(!/^[A-Za-z]{1,3}\d+[a-z]?$/.test(localId)) return null;

  const frag = {
    localId,
    type: typeFromLocalId(localId),
    title: parts[1] || '',
    buildsOn: [],
    connected: [],
    rels: [],          // unified relation list: primary + capture + goals
    excluded: false
  };
