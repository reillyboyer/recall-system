  try{ const u = JSON.parse(localStorage.getItem(AT_UI_KEY)||'{}')||{};
    if(u.sel!==undefined) at.sel = u.sel; (u.open||[]).forEach(x=>at.open.add(x)); if(u.since) tg.since = u.since; }catch(e){}
  if(!tg.since){ const d = new Date(Date.now()-7*864e5); tg.since = d.toISOString().slice(0,10); }
})();
function atSaveUi(){ try{ localStorage.setItem(AT_UI_KEY, JSON.stringify({sel:at.sel, open:[...at.open], since:tg.since})); }catch(e){} }
function atKbReg(){ return relDbByName('Knowledge Bank'); }
function atDbList(){
  const out = REL_DB_REGISTRY.filter(d=>d.name!=='Knowledge Bank').map(d=>({name:d.name, kind:d.kind, dbId:d.dbId}));
  out.push({name:'Recall Cards', kind:'ip', dbId:getIpDb()});
  return out;
}
const AT_GROUPS = [{v:'goals', label:'Goals system'}, {v:'capture', label:'Capture system'}, {v:'ip', label:'Recall Cards'}];
const AT_DB_EMOJI = {'Recall Cards':'🗂️'};
function atEmoji(name){ return AT_DB_EMOJI[name] || REL_EMOJI[name] || '•'; }

/* ── Reading Notion ── */
function atVal(p){
  if(!p) return '';
  switch(p.type){
    case 'select': return p.select ? p.select.name : '';
    case 'status': return p.status ? p.status.name : '';
    case 'multi_select': return (p.multi_select||[]).map(x=>x.name).join(', ');
    case 'date': return p.date ? (p.date.start||'').slice(0,10) + (p.date.end ? ' → '+p.date.end.slice(0,10) : '') : '';
    case 'number': return p.number==null ? '' : String(p.number);
    case 'checkbox': return p.checkbox ? 'Yes' : '';
    case 'url': return p.url || '';
    case 'email': return p.email || '';
    case 'phone_number': return p.phone_number || '';
    case 'rich_text': return (p.rich_text||[]).map(x=>x.plain_text).join('');
    case 'people': return (p.people||[]).map(x=>x.name||'').filter(Boolean).join(', ');
    case 'formula': { const f = p.formula||{}; return f.type==='string' ? (f.string||'') : f.type==='number' ? (f.number==null?'':String(f.number)) : f.type==='boolean' ? (f.boolean?'Yes':'') : f.type==='date' ? ((f.date&&f.date.start)||'').slice(0,10) : ''; }
    default: return '';
  }
}
function atSchema(db, sch){
  const kb = atKbReg(); const kbIds = new Set([fmtId(kb.dbId), fmtId(kb.dsId)]);
  const out = {titleProp:'Name', kbProp:null, show:[], all:[], rels:[]};
  const rank = {status:0, select:1, multi_select:2, date:3, number:4, checkbox:5, people:6, url:7, rich_text:8, formula:9, email:10, phone_number:10};
  const cands = [];
  for(const [k,p] of Object.entries(sch.properties||{})){
    if(p.type==='title'){ out.titleProp = k; continue; }
    if(p.type==='relation'){
      const r = p.relation||{}; const tgt = fmtId(r.database_id||''); const ds = fmtId(r.data_source_id||'');
      if(kbIds.has(tgt) || kbIds.has(ds) || /knowledge\s*bank/i.test(k)){ if(!out.kbProp || /knowledge\s*bank/i.test(k)) out.kbProp = k; }
      else out.rels.push({prop:k, target:tgt, ds});
      continue;
    }
    if(p.type in rank){ out.all.push(k); cands.push({k, r:rank[p.type], t:p.type}); }
  }
  // Best-judgment default: the few properties that say what state a thing is in, when, and what kind it is.
  const skip = /^(id|created|last edited|order|sort|icon|cover|#)/i;
  out.show = cands.filter(c=>c.r<=5 && !skip.test(c.k)).sort((a,b)=>a.r-b.r || a.k.localeCompare(b.k)).slice(0,5).map(c=>c.k);
  return out;
}
async function atLoad(){
  if(!creds.proxyUrl || !creds.notionToken){ at.st='error'; at.msg='Set your proxy URL and Notion token in Settings first.'; render(); return; }
  at.st = 'loading'; at.msg = ''; at.prog = {}; render();
  try{
    if(lib.kbSt!=='ok'){ lib.kbSt = null; await libLoadKb(); if(lib.kbSt!=='ok') throw new Error(lib.kbMsg||'Could not load the Knowledge Bank.'); }
    const dbs = atDbList(); const items = [];
    await mapPool(dbs, async db=>{
      at.prog[db.name] = 'reading'; if(currentTab!=='settings') render();
      try{
        const sch = await nGet('/databases/'+fmtId(db.dbId));
        db.schema = atSchema(db, sch);
        if(db.kind==='ip'){   // decks only: cards live inside their deck, and its own bookkeeping relations are noise here
          db.schema.show = ['Cards','Commitment','Next Review'];
          db.schema.rels = db.schema.rels.filter(r=>!['Parent item','Sub-item','Builds On','Refined By','Related Decks'].includes(r.prop) && !/Active Recall/.test(r.prop));
        }
        let cursor = null, guard = 0, n = 0;
        do{
          const body = {page_size:100}; if(cursor) body.start_cursor = cursor;
          const data = await nPost('/databases/'+fmtId(db.dbId)+'/query', body);
          for(const p of (data.results||[])){
            const pr = p.properties||{};
            if(db.kind==='ip' && relIds(pr['Parent item']).length) continue;
            const props = {}; db.schema.all.forEach(k=>{ const v = atVal(pr[k]); if(v) props[k] = v; });
            if(db.kind==='ip'){ const n = relIds(pr['Sub-item']).length; const cn = relIds(pr['Custom Deck Cards']).length;
              if(n) props['Cards'] = n + (pr['Sub-item'].has_more?'+':'') + (n===1?' card':' cards');
              else if(cn) props['Cards'] = cn + (pr['Custom Deck Cards'].has_more?'+':'') + (cn===1?' card':' cards') + ' (custom deck)'; }
            const rels = {}; db.schema.rels.forEach(r=>{ const ids = relIds(pr[r.prop]).map(fmtId); if(ids.length) rels[r.prop] = ids; });
            items.push({id:fmtId(p.id), url:p.url, db:db.name, kind:db.kind, title: richText(pr[db.schema.titleProp]) || extractTitle(pr) || '(untitled)',
              edited: Date.parse(p.last_edited_time||'')||0, created: Date.parse(p.created_time||'')||0,
              topics: db.schema.kbProp ? relIds(pr[db.schema.kbProp]).map(fmtId) : [], props, rels});
            n++;
          }
          cursor = data.has_more ? data.next_cursor : null; guard++;
          at.prog[db.name] = n+'…'; 
        } while(cursor && guard < 80);
        db.count = n; at.prog[db.name] = String(n);
      }catch(e){ db.error = e.message; at.prog[db.name] = 'failed'; }
      if(currentTab!=='settings') render();
    }, 3);
    at.dbs = dbs; at.items = items; at.byId = {}; items.forEach(i=>at.byId[i.id]=i);
    at._X = null; at.st = 'ok';
    if(at.sel && at.sel!=='__untagged' && !lib.topics[at.sel]) at.sel = null;
  }catch(e){ at.st='error'; at.msg=e.message; }
  render();
}
function atReady(){
  if(!at.st){ setTimeout(atLoad, 0); at.st = 'loading'; }
  return at.st==='ok';
}
function atDb(name){ return at.dbs.find(d=>d.name===name); }
function atWaitHtml(title){
  if(at.st==='error') return `<div class="block"><div class="pill pill-err" style="display:block;margin-bottom:10px">${esc(at.msg)}</div><button class="btn btn-sm" onclick="atLoad()">Try again</button></div>`;
  const rows = atDbList().map(d=>`<div class="at-prog-row"><span>${esc(atEmoji(d.name))} ${esc(d.name)}</span><span>${esc(at.prog[d.name]||'waiting')}</span></div>`).join('');
  return `<div class="lib lib-single"><main class="lib-room"><h1 class="lib-h1">${esc(title)}</h1><p class="lib-lede"><span class="spin"></span> Reading your Notion databases…</p><div class="at-prog">${rows}</div></main></div>`;
}

/* ── Index ── */
function atIndex(){
  if(at._X && at._X.items===at.items && at._X.topics===lib.topics) return at._X;
  const T = lib.topics;
  const direct = new Map();
  at.items.forEach((it,i)=>it.topics.forEach(t=>{ if(!T[t]) return; if(!direct.has(t)) direct.set(t, []); direct.get(t).push(i); }));
  const sub = new Map();
  const subtree = id => { if(sub.has(id)) return sub.get(id); const s = new Set([id]); sub.set(id, s); for(const c of (T[id]?T[id].children:[])) for(const x of subtree(c)) s.add(x); return s; };
  const sc = new Map();
  const subItems = id => { if(sc.has(id)) return sc.get(id); const s = new Set(); for(const t of subtree(id)) (direct.get(t)||[]).forEach(i=>s.add(i)); sc.set(id, s); return s; };
  const ro = new Map();
  const rootOf = id => { if(ro.has(id)) return ro.get(id); let cur = id, g = 0; while(T[cur] && T[cur].parent && g++<40) cur = T[cur].parent; ro.set(id, cur); return cur; };
  const allRoots = Object.values(T).filter(t=>!t.parent).map(t=>t.id).sort((a,b)=>T[a].title.localeCompare(T[b].title));
  const color = new Map(); allRoots.forEach((r,i)=>color.set(r, LIB_CLOTH[i % LIB_CLOTH.length]));
  const roots = allRoots.filter(r=>subItems(r).size>0);
  const untagged = at.items.map((it,i)=>i).filter(i=>!at.items[i].topics.some(t=>T[t]));
  const byPath = new Map(), byTitle = new Map();
  for(const t of Object.values(T)){ byPath.set(atPath(t.id).toLowerCase(), t.id); const k = t.title.toLowerCase(); if(!byTitle.has(k)) byTitle.set(k, []); byTitle.get(k).push(t.id); }
  at._X = {items:at.items, topics:T, direct, subtree, subItems, rootOf, color, roots, allRoots, untagged, byPath, byTitle};
  return at._X;
}
function atPath(id){ return libPath(id).map(p=>lib.topics[p].title).join(' / '); }
function atKids(id, withContentOnly){
  const X = atIndex(), T = lib.topics;
  return (T[id]?T[id].children:[]).filter(c=>!withContentOnly || X.subItems(c).size>0).sort((a,b)=>T[a].title.localeCompare(T[b].title));
}
function atDate(ms){ return ms ? new Date(ms).toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}) : ''; }
function atResolve(raw){
  const X = atIndex(); const n = String(raw||'').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim().toLowerCase();
  if(!n) return null;
  if(X.byPath.has(n)) return X.byPath.get(n);
  const leaf = n.split(' / ').pop(); const hits = X.byTitle.get(leaf)||[];
  if(hits.length===1) return hits[0];
  if(hits.length>1){ const m = hits.find(id=>atPath(id).toLowerCase().endsWith(n)); if(m) return m; }
  return null;
}
function atTopicSearch(q, limit){
  const toks = String(q||'').toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const X = atIndex();
  return Object.values(lib.topics).map(t=>({id:t.id, path:atPath(t.id), n:X.subItems(t.id).size}))
    .filter(x=>toks.every(k=>x.path.toLowerCase().includes(k)))
    .sort((a,b)=>{ const al = a.path.split(' / ').pop().toLowerCase().startsWith(toks[0])?0:1, bl = b.path.split(' / ').pop().toLowerCase().startsWith(toks[0])?0:1; return (al-bl) || (b.n-a.n) || a.path.length-b.path.length; })
    .slice(0, limit||12);
}

/* ── Writing topics back to Notion ── */
async function atSetTopics(item, ids){
  const db = atDb(item.db);
  if(!db || !db.schema || !db.schema.kbProp){ _mmToast(`${item.db} has no Knowledge Bank relation the app can find.`); return false; }
  const prev = item.topics; item.topics = Array.from(new Set(ids)); at._X = null;
  try{ await nPatch('/pages/'+fmtId(item.id), {properties:{[db.schema.kbProp]:{relation:item.topics.map(id=>({id:fmtId(id)}))}}}); return true; }
  catch(e){ item.topics = prev; at._X = null; _mmToast('Notion refused the change: '+e.message); return false; }
}
let _atKbTitle = null;
async function atCreateTopic(title, parentId, otherIds){
  const reg = atKbReg();
  if(!_atKbTitle){ const sch = await nGet('/databases/'+fmtId(reg.dbId)); for(const [k,p] of Object.entries(sch.properties||{})) if(p.type==='title'){ _atKbTitle = k; break; } }
  const props = {[_atKbTitle||'Name']:{title:[{type:'text', text:{content:title.slice(0,1990)}}]}};
  if(parentId) props['Parent item'] = {relation:[{id:fmtId(parentId)}]};
  if(otherIds && otherIds.length) props['Other Parents'] = {relation:otherIds.map(id=>({id:fmtId(id)}))};
  const pg = await nPost('/pages', {parent:{database_id:fmtId(reg.dbId)}, properties:props});
  const id = fmtId(pg.id);
  lib.topics[id] = {id, url:pg.url, title, parent:parentId||null, others:otherIds||[], children:[], crossKids:[]};
  if(parentId && lib.topics[parentId]) lib.topics[parentId].children.push(id);
  (otherIds||[]).forEach(o=>lib.topics[o] && lib.topics[o].crossKids.push(id));
  lib.topics = {...lib.topics}; at._X = null;
  return id;
}

/* ════════ Topics view ════════ */
function atGo(sel){
  libTransition(()=>{
    at.sel = sel; at.justNav = true; at.expand = new Set();
    if(sel && sel!=='__untagged') libPath(sel).slice(0,-1).forEach(x=>at.open.add(x));
    if(window.innerWidth<860) at.stacksOpen = false;
    atSaveUi(); render(); window.scrollTo(0,0);
  });
}
function atToggle(id, btn){
  const node = btn.closest('.lt-node'); if(!node) return;
  const kids = node.querySelector(':scope > .lt-kids > .lt-kids-in');
  if(at.open.has(id)){ at.open.delete(id); node.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
  else {
    at.open.add(id);
    if(kids && !kids.children.length) kids.innerHTML = atTreeHtml(atKids(id, false), (+node.dataset.d||0)+1);
    btn.setAttribute('aria-expanded','true');
    requestAnimationFrame(()=>requestAnimationFrame(()=>node.classList.add('open')));
  }
  atSaveUi();
}
function atTreeHtml(ids, depth){
  const X = atIndex(), T = lib.topics;
  return ids.map(id=>{
    const kids = atKids(id, false); const open = at.open.has(id); const n = X.subItems(id).size;
    return `<div class="lt-node${open?' open':''}" data-d="${depth}">
      <div class="lt-row${at.sel===id?' sel':''}${n?'':' lt-empty'}" style="--d:${depth}"${n?'':' title="Empty shelf: nothing is tagged here yet"'}>
        ${kids.length ? `<button class="lt-chev" onclick="atToggle('${id}',this)" aria-label="Show subtopics" aria-expanded="${open}"><svg viewBox="0 0 10 10" width="9" height="9"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : `<span class="lt-chev-sp"></span>`}
        <button class="lt-name" onclick="atGo('${id}')">${esc(T[id].title)}</button>${n?`<span class="lt-count">${n}</span>`:''}
      </div>
      ${kids.length ? `<div class="lt-kids"><div class="lt-kids-in">${open ? atTreeHtml(kids, depth+1) : ''}</div></div>` : ''}
    </div>`;
  }).join('');
}
function atCrumb(id){
  const parts = [`<button onclick="atGo(null)">Knowledge Bank</button>`];
  if(id==='__untagged') parts.push(`<span>No topic yet</span>`);
  else if(id) libPath(id).forEach((p,i,a)=>parts.push(i===a.length-1 ? `<span>${esc(lib.topics[p].title)}</span>` : `<button onclick="atGo('${p}')">${esc(lib.topics[p].title)}</button>`));
  return `<nav class="lib-crumb" aria-label="Breadcrumb">${parts.join('<i class="lib-sep" aria-hidden="true"></i>')}</nav>`;
}
function atRelLines(it){
  const db = atDb(it.db); if(!db || !db.schema) return '';
  const out = [];
  for(const r of db.schema.rels){
    const ids = it.rels[r.prop]; if(!ids) continue;
    const known = ids.map(id=>at.byId[id]).filter(Boolean);

function tgReadPaste(){
  let text = tg.paste||''; const a = text.lastIndexOf('=== TOPICS ==='); if(a>=0){ const b = text.indexOf('=== END TOPICS ===', a); text = text.slice(a+14, b>a?b:undefined); }
  const order = tg.order || tgList().map(i=>i.id);
  const sugg = {}, news = []; let n = 0, miss = 0;
  for(const raw of text.split('\n')){
    const line = raw.trim(); let m;
    if((m = line.match(/^new topic\s*:\s*(.+)$/i))){ const parts = m[1].split(/\s+\|\s+/); const nt = {title:parts[0].trim(), parentRaw:'', why:'', items:[]};
      parts.slice(1).forEach(p=>{ const kv = p.match(/^([^:]+):\s*(.*)$/); if(!kv) return; const k = kv[1].trim().toLowerCase(); if(k==='parent') nt.parentRaw = kv[2].trim(); else if(k==='why') nt.why = kv[2].trim(); });
      nt.parent = atResolve(nt.parentRaw); news.push(nt); continue; }
    if((m = line.match(/^#?(\d+)\s*\|\s*(.+)$/))){
      const id = order[(+m[1])-1]; if(!id) continue;
      m[2].split(/\s*;\s*/).map(s=>s.trim()).filter(Boolean).forEach(ref=>{
        const t = atResolve(ref);
        if(t){ if(!at.byId[id].topics.includes(t)){ (sugg[id] = sugg[id]||[]).push(t); n++; } }
        else { const nt = news.find(x=>x.title.toLowerCase()===ref.split(/\s*\/\s*/).pop().toLowerCase()); if(nt) nt.items.push(id); else miss++; }
      });
    }
  }
  tg.sugg = sugg; tg.newSugg = news; tg.pasteOpen = false;
  tg.msg = `${n} suggestion${n===1?'':'s'} ready` + (news.length?`, ${news.length} new topic${news.length>1?'s':''} proposed`:'') + (miss?`, ${miss} topic name${miss>1?'s':''} didn't match anything and were skipped`:'') + '.';
  render();
}

async function exBuild(){

  const need = new Map(); sets.forEach(s=>{ if(s.r.bodies) s.items.forEach(it=>need.set(it.id, it)); });
  let done = 0; const todo = [...need.values()].filter(it=>at.bodies[it.id]==null);
  await mapPool(todo, async it=>{ await exBody(it); done++; if(done%5===0 || done===todo.length){ ex.prog = `Reading page bodies: ${done} of ${todo.length}`; if(currentTab==='export') render(); } }, 3);

  const out = [`# Knowledge Bank export`, ``, `Exported ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}. Time frame: ${tdesc}.`, ``];

    for(const g of AT_GROUPS) for(const db of at.dbs.filter(d=>d.kind===g.v)){
      const its = items.filter(it=>it.db===db.name).sort((a,b)=>b.edited-a.edited); if(!its.length) continue;
      out.push(`### ${db.name} (${g.label})`, ``);
      for(const it of its){
        out.push(`#### ${it.title}`, ``);
        const meta = [`- Topics: ${it.topics.filter(t=>T[t]).map(atPath).join('; ') || 'none'}`];
        if(r.props){ const ps = Object.entries(it.props).filter(([k,v])=>v && String(v).length<300).map(([k,v])=>`${k}: ${v}`); if(ps.length) meta.push(`- Properties: ${ps.join('; ')}`); }
        if(r.rels){ const dbx = atDb(it.db); (dbx&&dbx.schema?dbx.schema.rels:[]).forEach(rel=>{ const ids = it.rels[rel.prop]; if(!ids) return; const names = ids.map(id=>at.byId[id]).filter(Boolean).map(k=>`${k.title} (${k.db})`); if(names.length) meta.push(`- ${rel.prop.replace(/^[^\w(]+/,'').trim()||rel.prop}: ${names.join('; ')}`); }); }

        out.push(...meta, ``);

      }
    }
  }

}

/* ════════════════════════════════════════════════════════════════════════
 *  RECALL CARDS — everything lives in the one Recall database.
 *    Deck  = a page with sub-items. Its name is the learning goal; its body
 *            holds the recall notes; it carries topics, source and goals.
 *    Card  = a sub-item. Name is the cue, "Answer" the answer, "Image" any
 *            photos, "Builds On" the card before it.
 *  The schedule sits on the deck (Commitment, Stage, Next Review), because a
 *  deck is reviewed in one sitting. Each card keeps its last grade.
 *    Custom deck = a top-level page whose "Custom Deck Cards" relation lists
 *            cards from any deck, in review order. A card can sit in many.
 *    Miss notes  = "Miss Notes" on a card: one line per note, "date | grade | text".
 * ════════════════════════════════════════════════════════════════════════ */
const RC_LEVELS = {
  'Glance':  {gaps:[2,14,60],        blurb:'Three passes. Enough to recognise it.'},
  'Solid':   {gaps:[1,4,14,45],      blurb:'Four passes. Enough to explain it.'},
  'Mastery': {gaps:[0,1,3,7,21,60],  blurb:'Six passes. Exam material.'},
  'Ad hoc':  {gaps:[],               blurb:'No schedule. Review it when you choose.'}
};
const RC_P = {answer:'Answer', level:'Commitment', stage:'Stage', next:'Next Review', last:'Last Reviewed', grade:'Last Grade', count:'Review Count', parent:'Parent item', sub:'Sub-item', prev:'Builds On', related:'Related Decks', set:'Custom Deck Cards', notes:'Miss Notes'};
const RC_MAX_SET = 100;   // Notion accepts at most 100 pages in one relation write
const RC_NEED = {
  'Answer':{rich_text:{}}, 'Miss Notes':{rich_text:{}}, 'Stage':{number:{}}, 'Review Count':{number:{}}, 'Next Review':{date:{}}, 'Last Reviewed':{date:{}},
  'Commitment':{select:{options:[{name:'Glance',color:'blue'},{name:'Solid',color:'green'},{name:'Mastery',color:'purple'},{name:'Ad hoc',color:'gray'}]}},
  'Last Grade':{select:{options:[{name:'Got it',color:'green'},{name:'Shaky',color:'yellow'},{name:'Missed',color:'red'}]}}
};
const RC_GRADES = [{v:'Missed', key:'1', cls:'miss'}, {v:'Shaky', key:'2', cls:'shaky'}, {v:'Got it', key:'3', cls:'got'}];
const RC_SETS_KEY = 'rs_recall_sets_v1';
let rc = { st:null, msg:'', S:null, decks:[], waiting:[], byId:{}, deckId:null, topic:null, openCard:null, edit:null, session:null,
  sets:[], add:null, mig:null, relPick:null, busy:'', bld:null };
try{ rc.sets = JSON.parse(localStorage.getItem(RC_SETS_KEY)||'[]') || []; }catch(e){ rc.sets = []; }
function rcSaveSets(){ try{ localStorage.setItem(RC_SETS_KEY, JSON.stringify(rc.sets)); }catch(e){} }

/* ── dates (local time, so "today" doesn't flip at 7pm) ── */
function _rcIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rcToday(){ return _rcIso(new Date()); }
function rcAddDays(iso, n){ const [y,m,d] = iso.split('-').map(Number); return _rcIso(new Date(y, m-1, d+n)); }
function rcDiff(iso){ const [y,m,d] = iso.split('-').map(Number); const t = new Date(); return Math.round((new Date(y,m-1,d) - new Date(t.getFullYear(),t.getMonth(),t.getDate()))/864e5); }
function rcNice(iso){ if(!iso) return ''; const [y,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function rcWhen(iso){ if(!iso) return ''; const n = rcDiff(iso); return n===0?'today':n===1?'tomorrow':n===-1?'yesterday':n>0?`in ${n} days`:`${-n} days ago`; }

/* ── loading ── */
function rcPage(p){
  const pr = p.properties||{}; const S = rc.S;
  const dt = k => ((pr[k] && pr[k].date && pr[k].date.start) || '').slice(0,10);
  const num = k => (pr[k] && typeof pr[k].number==='number') ? pr[k].number : 0;
  const par = relIds(pr[RC_P.parent])[0];
  return {id:fmtId(p.id), url:p.url, title: richText({type:'rich_text', rich_text:(pr[S.titleProp]&&pr[S.titleProp].title)||[]}) || '',
    parent: par ? fmtId(par) : null, prev: relIds(pr[RC_P.prev]).map(fmtId), related: relIds(pr[RC_P.related]).map(fmtId),
    setIds: relIds(pr[RC_P.set]).map(fmtId), setMore: !!(pr[RC_P.set] && pr[RC_P.set].has_more), notes: richText(pr[RC_P.notes]),
    topics: S.kbProp ? relIds(pr[S.kbProp]).map(fmtId) : [], answer: richText(pr[RC_P.answer]), level: selectName(pr[RC_P.level]),
    stage: num(RC_P.stage), count: num(RC_P.count), next: dt(RC_P.next), last: dt(RC_P.last), grade: selectName(pr[RC_P.grade]),
    remind: !!(pr[RC_REMIND.on] && pr[RC_REMIND.on].checkbox), images: filesProp(pr), imagesRaw: filesRaw(pr), created: Date.parse(p.created_time||'')||0, edited: Date.parse(p.last_edited_time||'')||0, cards:null};
}
function rcOrder(cards){
  const ids = new Set(cards.map(c=>c.id)); const after = new Map();
  cards.forEach(c=>{ c._p = c.prev.find(x=>ids.has(x)) || null; if(c._p){ if(!after.has(c._p)) after.set(c._p, []); after.get(c._p).push(c); } });
  const byAge = (a,b)=>a.created-b.created || a.title.localeCompare(b.title);
  const out = [], seen = new Set();
  const walk = c => { if(seen.has(c.id)) return; seen.add(c.id); out.push(c); (after.get(c.id)||[]).sort(byAge).forEach(walk); };
  cards.filter(c=>!c._p).sort(byAge).forEach(walk); cards.slice().sort(byAge).forEach(walk);
  return out;
}
function rcBuild(pages){
  const byId = {}; pages.forEach(p=>byId[p.id]=p);
  const kids = {}; pages.forEach(p=>{ if(p.parent && byId[p.parent]) (kids[p.parent] = kids[p.parent]||[]).push(p); });
  pages.forEach(p=>{ p.custom = false; p.inCustom = []; p.cards = null; });
  rc.decks = [];
  pages.forEach(p=>{
    if(kids[p.id]){ p.cards = rcOrder(kids[p.id]); rc.decks.push(p); }
    else if(!(p.parent && byId[p.parent]) && p.setIds.length){   // a custom deck: cards borrowed from other decks, in its own order
      p.custom = true; const seen = new Set();
      p.cards = p.setIds.map(id=>byId[id]).filter(c=>c && c.parent && kids[c.parent] && !seen.has(c.id) && seen.add(c.id));

    }
  });
  rc.decks.filter(d=>d.custom).forEach(d=>d.cards.forEach(c=>c.inCustom.push(d.id)));
  rc.waiting = pages.filter(p=>!p.cards && !(p.parent && byId[p.parent])).sort((a,b)=>b.edited-a.edited);

}
async function rcLoad(){
  if(!creds.proxyUrl || !creds.notionToken){ rc.st='error'; rc.msg='Set your proxy URL and Notion token in Settings first.'; render(); return; }
  rc.st = 'loading'; rc.msg = ''; render();
  try{
    if(lib.kbSt!=='ok'){ lib.kbSt = null; await libLoadKb(); }
    const dbId = fmtId(getIpDb());
    let sch = await nGet('/databases/'+dbId);
    const missing = Object.keys(RC_NEED).filter(k=>!(sch.properties||{})[k]);
    if(missing.length){ const add = {}; missing.forEach(k=>add[k]=RC_NEED[k]); sch = await nPatch('/databases/'+dbId, {properties:add}); }
    if(!(sch.properties||{})[RC_P.set]){   // the self-relation that lets one card sit in many custom decks
      try{ sch = await nPatch('/databases/'+dbId, {properties:{[RC_P.set]:{relation:{database_id:dbId, type:'single_property', single_property:{}}}}}); }catch(e){ console.warn('Could not add '+RC_P.set, e); }
    }
    const hard = [RC_P.parent, RC_P.prev].filter(k=>!(sch.properties||{})[k]);
    if(hard.length) throw new Error('The Recall database is missing the relation '+hard.map(h=>'“'+h+'”').join(' and ')+'.');
    const kb = atKbReg(); const kbIds = new Set([fmtId(kb.dbId), fmtId(kb.dsId)]);
    const S = {titleProp:'Name', kbProp:null, hasRelated: !!sch.properties[RC_P.related], relByDb:{}, setPropId: (sch.properties[RC_P.set]||{}).id || null};
    for(const [k,p] of Object.entries(sch.properties||{})){
      if(p.type==='title') S.titleProp = k;
      if(p.type==='relation'){ const r = p.relation||{}; const tgt = fmtId(r.database_id||'');
        if(kbIds.has(tgt) || kbIds.has(fmtId(r.data_source_id||'')) || /knowledge\s*bank/i.test(k)) S.kbProp = k; else if(tgt && k!==RC_P.set) S.relByDb[tgt] = k; }
    }
    const P = sch.properties||{};
    S.remind = P[RC_REMIND.on] && P[RC_REMIND.on].type==='checkbox' ? {trig: !!P[RC_REMIND.trig], freq: !!P[RC_REMIND.freq], prio: !!P[RC_REMIND.prio]} : null;
    rc.S = S;
    const pages = []; let cursor = null, guard = 0;
    do{ const body = {page_size:100}; if(cursor) body.start_cursor = cursor;
      const data = await nPost('/databases/'+dbId+'/query', body);
      (data.results||[]).forEach(p=>pages.push(rcPage(p)));
      cursor = data.has_more ? data.next_cursor : null; guard++;
    } while(cursor && guard<200);
    // Notion only returns the first 25 pages of a relation inline; read the rest of any long custom deck
    const long = pages.filter(p=>p.setMore && S.setPropId);
    if(long.length) await mapPool(long, async p=>{ p.setIds = await rcFullRel(p.id, S.setPropId); }, 3);
    rcBuild(pages); rc.st = 'ok';
    if(rc.deckId && !(rc.byId[rc.deckId] && rc.byId[rc.deckId].cards)) rc.deckId = null;
  }catch(e){ rc.st = 'error'; rc.msg = e.message; }
  render();
}
async function rcFullRel(pageId, propId){
  const ids = []; let cur = null, g = 0;
  do{ const r = await nGet('/pages/'+pageId+'/properties/'+encodeURIComponent(propId)+'?page_size=100'+(cur?'&start_cursor='+encodeURIComponent(cur):''));
    (r.results||[]).forEach(x=>{ if(x && x.relation && x.relation.id) ids.push(fmtId(x.relation.id)); });
    cur = r.has_more ? r.next_cursor : null; g++; } while(cur && g<20);
  return ids;
}
/* ════════ Formulas (TeX) ════════
 *  $…$ inline, $$…$$ on its own line, \( \) and \[ \] too. A $ followed by a digit and
 *  preceded by a space ("$5 and $10") is money, not math; \$ is always a literal dollar.   */
const RC_KATEX = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/';
let rcKatexSt = null;
function rcKatexLoad(){
  if(rcKatexSt) return; rcKatexSt = 'loading';
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = RC_KATEX+'katex.min.css'; document.head.appendChild(css);
  const js = document.createElement('script'); js.src = RC_KATEX+'katex.min.js';
  js.onload = ()=>{ rcKatexSt = 'ok'; render(); }; js.onerror = ()=>{ rcKatexSt = 'fail'; };
  document.head.appendChild(js);
}
const RC_MATH_RE = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|(?<![\\$])\$(?![\s$])((?:\\\$|[^$\n])+?)(?<![\s\\])\$(?!\d)/g;
function rcHasMath(t){ RC_MATH_RE.lastIndex = 0; return RC_MATH_RE.test(String(t||'')); }
function rcMath(text){   // escaped HTML with formulas typeset
  const t = String(text||''); let out = '', last = 0; RC_MATH_RE.lastIndex = 0; let m;
  while((m = RC_MATH_RE.exec(t))){
    const tex = m[1]||m[2]||m[3]||m[4]; const block = !!(m[1]||m[2]);
    out += esc(t.slice(last, m.index).replace(/\\\$/g,'$'));
    if(rcKatexSt==='ok' && window.katex){ try{ out += `<span class="rc-tex${block?' blk':''}">${katex.renderToString(tex.trim(), {displayMode:block, throwOnError:false, output:'html'})}</span>`; }catch(e){ out += `<code class="rc-tex-raw">${esc(m[0])}</code>`; } }
    else { if(!rcKatexSt) rcKatexLoad(); out += `<code class="rc-tex-raw">${esc(tex.trim())}</code>`; }
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last).replace(/\\\$/g,'$'));
}
/* Notion rich text with real equations, so formulas also read well in Notion */
function rcRichMath(text){
  const t = String(text||''); const out = []; let last = 0; RC_MATH_RE.lastIndex = 0; let m;
  const plain = x => { for(let i=0;i<x.length;i+=1900) out.push({type:'text', text:{content:x.slice(i,i+1900)}}); };
  while((m = RC_MATH_RE.exec(t))){ const tex = (m[1]||m[2]||m[3]||m[4]).trim(); if(m.index>last) plain(t.slice(last, m.index)); out.push({type:'equation', equation:{expression:tex.slice(0,1000)}}); last = m.index + m[0].length; }
  if(last<t.length) plain(t.slice(last));
  return out.slice(0,100);
}
function rcReady(){ if(!rc.st){ setTimeout(rcLoad, 0); rc.st = 'loading'; } return rc.st==='ok'; }
function rcShell(inner){ return `<div class="lib lib-single rc"><main class="lib-room">${inner}</main></div>`; }
function rcWait(title){

}

/* ── deck facts ── */
function rcGaps(d){ return (RC_LEVELS[d.level]||RC_LEVELS['Ad hoc']).gaps; }
function rcScheduled(d){ return rcGaps(d).length>0; }
function rcFinished(d){ return rcScheduled(d) && d.stage>=rcGaps(d).length; }
function rcDue(d){ return rcScheduled(d) && !rcFinished(d) && !!d.next && d.next<=rcToday(); }
function rcColor(d){ if(d.custom && !(d.topics||[]).some(x=>lib.topics[x])) return '#9a7a2e'; const X = atIndex(); const t = (d.topics||[]).find(x=>lib.topics[x]); return t ? (X.color.get(X.rootOf(t))||'#6b4a2b') : '#6b4a2b'; }
function rcTally(d){ const t = {'Got it':0,'Shaky':0,'Missed':0,none:0}; d.cards.forEach(c=>{ t[c.grade in t ? c.grade : 'none']++; }); return t; }
function rcNeedsPhoto(c){ return /\[(image|diagram|photo|sketch|graph|chart|picture)[^\]]*\]/i.test(c.answer||'') && !(c.images||[]).length; }
function rcPathHtml(d){
  const g = rcGaps(d); if(!g.length) return `<span class="rc-path adhoc">No schedule</span>`;
  return `<span class="rc-path" title="Step ${Math.min(d.stage+1,g.length)} of ${g.length}">${g.map((_,i)=>`<i class="${i<d.stage?'done':i===d.stage?'now':''}"></i>`).join('')}</span>`;
}
function rcStatus(d){
  if(!rcScheduled(d)) return d.last ? 'Reviewed '+rcWhen(d.last) : 'Not reviewed yet';
  if(rcFinished(d)) return 'Path finished';
  if(rcDue(d)) return d.next===rcToday() ? 'Due today' : 'Due '+rcWhen(d.next);
  return d.next ? 'Next '+rcNice(d.next) : 'Not scheduled';
}
function rcTile(d, extra){

  const bar = (t['Got it']+t['Shaky']+t['Missed']) ? `<span class="rc-bar">${['Got it','Shaky','Missed'].map((k,i)=>t[k]?`<i class="${RC_GRADES[2-i].cls}" style="flex:${t[k]}"></i>`:'').join('')}${t.none?`<i style="flex:${t.none}"></i>`:''}</span>` : '';
  const from = d.custom ? new Set(d.cards.map(c=>c.parent)).size : 0;
  return `<button class="rc-tile${due?' due':''}${d.custom?' custom':''}" style="--cloth:${rcColor(d)}" onclick="rcOpenDeck('${d.id}')">
    <span class="rc-tile-in">${d.custom?`<span class="rc-tile-k">Custom deck</span>`:''}<span class="rc-tile-t">${esc(d.title||'Untitled deck')}</span>
      <span class="rc-tile-m">${n} ${n===1?'card':'cards'}${d.custom?` from ${from} ${from===1?'deck':'decks'}`:''}${d.level?', '+esc(d.level):''}</span>
      ${bar}<span class="rc-tile-foot">${rcPathHtml(d)}<span class="rc-tile-when">${esc(extra||rcStatus(d))}</span></span></span>
    ${due?`<span class="rc-stamp" aria-hidden="true">Due</span>`:''}
  </button>`;
}

function rcToggleCard(id){ rc.openCard = rc.openCard===id ? null : id; rc.edit = null; render(); }

function rcRich(text){ const t = String(text||''); const out = []; for(let i=0;i<t.length;i+=1900) out.push({type:'text', text:{content:t.slice(i,i+1900)}}); return out; }
function rcCardProps(cue, answer){ return {[rc.S.titleProp]:{title:rcRich(String(cue).slice(0,1900))}, [RC_P.answer]:{rich_text:rcRichMath(answer)}}; }
async function rcSaveCard(){

async function rcMakeCard(deck, cue, answer, prevId){

  const pg = await nPost('/pages', {parent:{database_id:fmtId(getIpDb())}, properties:props});
  const c = rcPage(pg); c.title = cue; c.answer = answer; c.parent = deck.id; c.prev = prevId ? [prevId] : []; c.created = c.created || Date.now();

}
async function rcAddCard(deckId){

async function rcDeleteCard(id){
  const c = rc.byId[id]; const d = c && rc.byId[c.parent]; const k = (c && c.inCustom || []).length;
  if(!d || !confirm('Delete this card? It moves to the trash in Notion.' + (k ? ` It also leaves the ${k} custom ${k===1?'deck':'decks'} it sits in.` : ''))) return;
  try{
    const i = d.cards.indexOf(c); const next = d.cards[i+1]; const prev = d.cards[i-1];
    await nPatch('/pages/'+id, {archived:true});
    if(next){ next.prev = prev ? [prev.id] : []; try{ await nPatch('/pages/'+next.id, {properties:{[RC_P.prev]:{relation:next.prev.map(x=>({id:x}))}}}); }catch(e){} }
    d.cards.splice(i,1); (c.inCustom||[]).forEach(x=>{ const cd = rc.byId[x]; if(cd && cd.cards) cd.cards = cd.cards.filter(y=>y.id!==id); }); delete rc.byId[id]; rc.openCard = null;

async function rcDeleteDeck(id){

async function rcSetLevel(id, level){
  const d = rc.byId[id]; if(!d || d.level===level) return;
  const g = RC_LEVELS[level].gaps; const stage = Math.min(d.stage||0, g.length);
  let next = '';
  if(g.length && stage<g.length){ const base = d.last || _rcIso(new Date(d.created||Date.now())); next = rcAddDays(base, g[stage]); if(next<rcToday()) next = rcToday(); }
  const before = {level:d.level, stage:d.stage, next:d.next}; d.level = level; d.stage = stage; d.next = next; render();
  try{ await nPatch('/pages/'+id, {properties:{[RC_P.level]:{select:{name:level}}, [RC_P.stage]:{number:stage}, [RC_P.next]:{date: next ? {start:next} : null}}}); }
  catch(e){ Object.assign(d, before); _mmToast('Could not change it: '+e.message); render(); }

async function rcRelate(a, b){ const d = rc.byId[a]; d.related = [...d.related, b]; if(rc.byId[b] && !rc.byId[b].related.includes(a)) rc.byId[b].related.push(a); rc.relPick = null; render();

  try{ await nPatch('/pages/'+a, {properties:{[RC_P.related]:{relation:d.related.map(x=>({id:x}))}}}); }catch(e){ _mmToast('Could not unlink: '+e.message); } }
async function rcCustomRemove(deckId, cardId){
  const d = rc.byId[deckId]; const c = rc.byId[cardId]; if(!d || !c) return;
  const before = d.cards.slice(); d.cards = d.cards.filter(x=>x.id!==cardId); c.inCustom = (c.inCustom||[]).filter(x=>x!==deckId); rc.openCard = null; render();
  try{ await nPatch('/pages/'+deckId, {properties:{[RC_P.set]:{relation:d.cards.map(x=>({id:x.id}))}}}); d.setIds = d.cards.map(x=>x.id); }

async function rcSyncNotes(deckId){
  const d = rc.byId[deckId]; rc.busy = 'sync'; render();
  try{
    const parsed = rcParse(rcLinesFromBlocks(await ibReadBlocks(d.id, 0, [])));
    const have = new Map(d.cards.map(c=>[c.title.trim().toLowerCase(), c])); let added = 0, changed = 0;
    for(const n of parsed.cards){
      const c = have.get(n.cue.trim().toLowerCase()); const ans = n.lines.join('\n');
      if(c){ if(c.answer.trim()!==ans.trim()){ await nPatch('/pages/'+c.id, {properties:{[RC_P.answer]:{rich_text:rcRich(ans)}}}); c.answer = ans; changed++; } }
      else { const last = d.cards[d.cards.length-1]; d.cards.push(await rcMakeCard(d, n.cue, ans, last && last.id)); added++; }
    }
    _mmToast(added||changed ? `${added} added, ${changed} updated from the notes.` : (parsed.cards.length ? 'The cards already match the notes.' : 'No recall notes were found in the page body.'));
  }catch(e){ _mmToast('Sync failed: '+e.message); }
  rc.busy = ''; render();
}

/* ════════ Review session ════════ */
const RC_SESS_KEY = 'rs_recall_session_v1';
const RC_RETURN_GAP = 3;   // "Return to it" brings a card back this many cards later
function rcStash(){   // the sitting lives on this device until it is finished or discarded
  const s = rc.session; if(!s) return;
  const keep = {v:1, name:s.name, kind:s.kind, decks:s.decks, queue:s.queue, i:s.i, grades:s.grades, notes:s.notes, capped:s.capped, base:s.base,
    phase: s.phase==='saving' ? 'summary' : s.phase, redone:s.redone, counts:s.counts, out:s.out, saved:s.saved||{}, started:s.started, touched:Date.now()};
  try{ localStorage.setItem(RC_SESS_KEY, JSON.stringify(keep)); }catch(e){}
}
function rcStashed(){
  let k = null; try{ k = JSON.parse(localStorage.getItem(RC_SESS_KEY)||'null'); }catch(e){}
  if(!k || k.v!==1 || k.phase==='done') return null;
  k.queue = (k.queue||[]).filter(x=>rc.byId[x.card] && rc.byId[x.deck]); k.decks = (k.decks||[]).filter(id=>rc.byId[id] && rc.byId[id].cards);
  if(!k.decks.length || !k.queue.length) return null;
  return k;
}
function rcUnstash(){ try{ localStorage.removeItem(RC_SESS_KEY); }catch(e){} }
function rcResume(){
  const k = rcStashed(); if(!k){ rcUnstash(); render(); return; }
  rc.session = Object.assign({flipped:false, pending:null, pastOpen:false, err:'', menu:false, sync:{}}, k);
  rc.session.i = Math.min(rc.session.i, rc.session.queue.length-1);
  if(rc.session.phase==='summary' && !Object.keys(rc.session.out||{}).length) rcRecommend();
  rc.deckId = null; rc.topic = null; libTransition(()=>{ render(); window.scrollTo(0,0); });
}
function rcDiscardStash(){
  const k = rcStashed(); const n = k ? Object.keys(k.grades||{}).length : 0;
  if(!confirm('Discard the unfinished sitting?' + (n ? ` The ${n} card ${n===1?'grade':'grades'} already saved to Notion stay; the decks keep their schedules.` : ''))) return;
  rcUnstash(); render();
}
function rcStart(kind, arg){
  if(rcStashed() && !(rc.session) && !confirm('You have an unfinished sitting. Start a new one and drop it?')) return;
  let decks = [], name = '';
  if(kind==='due'){ decks = rc.decks.filter(rcDue).sort((a,b)=>a.next.localeCompare(b.next)); name = "Today's review"; }
  else if(kind==='deck'){ decks = [rc.byId[arg || rc.deckId]]; name = decks[0].title; }
  else if(kind==='topic'){ decks = rcTopicDecks(rc.topic); name = rc.topic==='__none' ? 'No topic yet' : lib.topics[rc.topic].title; }
  else if(kind==='set'){ const s = rc.sets[arg]; decks = s.deckIds.map(id=>rc.byId[id]).filter(d=>d&&d.cards); name = s.name; }
  else if(kind==='day'){ decks = (arg.ids||[]).map(id=>rc.byId[id]); name = arg.name || 'Early review'; }
  decks = decks.filter(d=>d && d.cards && d.cards.length);
  if(!decks.length){ _mmToast('There are no cards to review there.'); return; }
  const queue = [], seen = new Set();   // a card in two of these decks is asked once
  decks.forEach(d=>d.cards.forEach(c=>{ if(seen.has(c.id)) return; seen.add(c.id); queue.push({deck:d.id, card:c.id}); }));
  const out = {}; decks.forEach(d=>out[d.id]=null);
  const base = {}; queue.forEach(x=>{ base[x.card] = rc.byId[x.card].notes || ''; });
  rc.session = {name, kind, decks:decks.map(d=>d.id), queue, i:0, flipped:false, grades:{}, notes:{}, capped:{}, base, pending:null, pastOpen:false, phase:'cards', redone:false,
    counts: decks.some(rcDue) && (kind==='due' || kind==='deck'), out, err:'', saved:{}, sync:{}, menu:false, started:Date.now()};
  rcStash(); rc.deckId = rc.deckId && kind==='deck' ? rc.deckId : null;
  libTransition(()=>{ currentTab = 'recall'; render(); window.scrollTo(0,0); });
}
function rcExit(force){   // leaving keeps the sitting on this device, ready to resume
  const s = rc.session; if(!s) return;
  if(force || s.phase==='done') rcUnstash(); else { rcStash(); if(Object.keys(s.grades).length) _mmToast('Saved. Pick it up from the Cards page.'); }
  rc.session = null; rc.edit = null; render();
}
function rcFlip(){
  const s = rc.session; if(!s || s.phase!=='cards' || s.pending || s.menu) return; s.flipped = !s.flipped;
  const el = document.getElementById('rc-card'); if(el) el.classList.toggle('flipped', s.flipped);
  const g = document.getElementById('rc-grades'); if(g) g.classList.toggle('on', s.flipped);
}
/* save one card's grade (and its miss note) as soon as it is graded */
async function rcSaveCardGrade(cardId){
  const s = rc.session; if(!s) return; const c = rc.byId[cardId]; const g = s.grades[cardId]; if(!c || !g) return;
  const today = rcToday(); const n = s.notes[cardId];
  const notes = [s.base ? (s.base[cardId]||'') : (c.notes||''), n && n.text ? `${today} | ${n.grade} | ${n.text}` : ''].filter(Boolean).join('\n');
  const key = g + '|' + notes; if(s.sync[cardId]===key) return; s.sync[cardId] = key;
  try{ await nPatch('/pages/'+cardId, {properties:{[RC_P.grade]:{select:{name:g}}, [RC_P.last]:{date:{start:today}}, [RC_P.notes]:{rich_text:rcRich(notes)}}});
    c.grade = g; c.last = today; c.notes = notes; s.saved[cardId] = 1; if(s.failed) delete s.failed[cardId]; rcStash(); }
  catch(e){ s.sync[cardId] = null; (s.failed = s.failed||{})[cardId] = 1; }
}
function rcGrade(v){
  const s = rc.session; if(!s || s.phase!=='cards' || !s.flipped || s.pending || s.menu) return;
  const q = s.queue[s.i]; const chosen = v;
  if(!q.redo){ if(s.capped[q.card] && v==='Got it'){ v = 'Shaky'; _mmToast('Counted as Shaky, since you sent it back once.'); } s.grades[q.card] = v; }
  if(!q.redo && chosen!=='Got it'){   // ask what went wrong while the answer is still in view
    const had = s.notes[q.card]; s.pending = {card:q.card, grade:v, text: had ? had.text : ''}; render();

function rcDeckCounts(s, deckId){ const t = {'Got it':0,'Shaky':0,'Missed':0}; rc.byId[deckId].cards.forEach(c=>{ const g = s.grades[c.id]; if(g) t[g]++; }); return t; }

/* ── review sets, chosen with Claude ── */
async function rcClip(text, okMsg){

/* ── codes Claude can quote back: the tail of each Notion id, long enough to be unique ── */
function rcCodes(){
  if(rc._codes) return rc._codes;
  const hex = id => fmtId(id).replace(/-/g,'').toLowerCase(); const all = Object.keys(rc.byId);
  const tally = new Map(); all.forEach(id=>{ const k = hex(id).slice(-8); tally.set(k, (tally.get(k)||0)+1); });
  const code = {}; all.forEach(id=>{ const h = hex(id); code[id] = tally.get(h.slice(-8))>1 ? h.slice(-14) : h.slice(-8); });
  return rc._codes = code;
}
function rcCode(id){ const p = rc.byId[id]; return (p && p.cards ? 'D-' : 'C-') + rcCodes()[id]; }
function rcFromCode(kind, code){
  const k = code.toLowerCase(); const hits = Object.keys(rc.byId).filter(id=>fmtId(id).replace(/-/g,'').toLowerCase().endsWith(k));
  return hits.map(id=>rc.byId[id]).find(p=> kind==='D' ? !!p.cards : (!!p.parent && !p.cards)) || null;
}

/* ── every card, untrimmed, for a Claude conversation ── */
function rcCardsMd(){
  const T = lib.topics; const today = rcToday();
  const src = rc.decks.filter(d=>!d.custom), customs = rc.decks.filter(d=>d.custom);
  const tp0 = d => { const t = d.topics.find(x=>T[x]); return t ? atPath(t) : ''; };
  const order = (a,b) => (!tp0(a)) - (!tp0(b)) || tp0(a).localeCompare(tp0(b)) || a.title.localeCompare(b.title);
  const ansLines = text => String(text||'').split('\n').filter(l=>l.trim()).map(l=>'   ' + '  '.repeat(Math.floor(l.match(/^ */)[0].length/2)) + '- ' + l.trim());
  const sched = d => { const g = rcGaps(d); if(!g.length) return 'Ad hoc (no schedule)';
    return `${d.level}, ${rcFinished(d) ? 'path finished' : `step ${d.stage+1} of ${g.length}, next review ${d.next||'not set'}`}`; };
  const head = d => { const out = [`### ${d.title||'Untitled deck'} [${rcCode(d.id)}]`, `- Commitment: ${sched(d)}`, `- Last reviewed: ${d.last ? d.last + (d.count ? ` (${d.count} review${d.count>1?'s':''} in all)` : '') : 'never'}`];
    const tp = d.topics.filter(t=>T[t]).map(atPath); if(tp.length) out.push(`- Topics: ${tp.join('; ')}`);
    const rel = (d.related||[]).map(id=>rc.byId[id]).filter(Boolean).map(r=>r.title); if(rel.length) out.push(`- Related decks: ${rel.join('; ')}`);
    return out; };
  const L = [`# My recall cards`, ``, `Exported ${today}. ${src.length} ${src.length===1?'deck':'decks'} and ${customs.length} custom ${customs.length===1?'deck':'decks'}, ${rcCardCount()} cards. Nothing is trimmed.`, ``,
    `## For Claude`, ``, `Follow Part 5 of the Recall Notes knowledge base. Ask what I am preparing for, then choose and order the cards that serve it. Every deck and card below has a code in square brackets. Reply with the custom deck as plain lines between the markers, one card per line, starting with its code:`, ``,
    `=== CUSTOM DECK ===`, `Name: <short name for the goal>`, `Commitment: Ad hoc`, `- C-xxxxxxxx | <card cue>`, `- D-xxxxxxxx | <deck title> (adds every card in that deck, in its order)`, `=== END CUSTOM DECK ===`, ``,
    `Order matters: I review the cards in the order listed. A custom deck holds up to ${RC_MAX_SET} cards.`, ``, `## Decks`, ``];
  src.slice().sort(order).forEach(d=>{
    L.push(...head(d), '');
    d.cards.forEach((c,i)=>{
      L.push(`${i+1}. [${rcCode(c.id)}] ${c.title||'(no cue)'}`, ...ansLines(c.answer));
      const extra = [];
      if((c.images||[]).length) extra.push(`${c.images.length} photo${c.images.length>1?'s':''} attached`); else if(rcNeedsPhoto(c)) extra.push('needs a photo');
      if(c.grade) extra.push(`last grade: ${c.grade}${c.last?' ('+c.last+')':''}`);
      if(extra.length) L.push(`   _${extra.join('; ')}_`);
      const notes = rcNotesList(c); if(notes.length){ L.push(`   Notes from past misses:`); notes.forEach(n=>L.push(`     - ${[n.date, n.grade].filter(Boolean).join(', ')}${n.date||n.grade?': ':''}${n.text}`)); }
    });
    L.push('');
  });
  if(customs.length){
    L.push(`## Custom decks`, ``, `These borrow cards from the decks above; the answers are listed there.`, ``);
    customs.forEach(d=>{ L.push(...head(d), ''); d.cards.forEach((c,i)=>{ const sd = rcSrc(c); L.push(`${i+1}. [${rcCode(c.id)}] ${c.title||'(no cue)'}${sd?` (from: ${sd.title})`:''}`); }); L.push(''); });
  }
  return L.join('\n');
}
function rcExportCards(copy){

  const all = d.cards.every(c=>b.ids.includes(c.id));
  if(all) b.ids = b.ids.filter(x=>!d.cards.some(c=>c.id===x)); else { d.cards.forEach(c=>{ if(!b.ids.includes(c.id)) b.ids.push(c.id); }); b.fresh = d.cards[d.cards.length-1].id; }

/* paste back what Claude chose: codes first, then exact cue or deck titles */
function rcbParse(text){
  let t = String(text||'');
  for(const [s0,e0] of [['=== CUSTOM DECK ===','=== END CUSTOM DECK ==='],['=== REVIEW SET ===','=== END REVIEW SET ===']]){
    const a = t.lastIndexOf(s0); if(a>=0){ const b = t.indexOf(e0, a); t = t.slice(a+s0.length, b>a?b:undefined); break; } }
  const out = {name:'', level:'', ids:[], miss:[]};
  const norm = x => String(x||'').toLowerCase().replace(/[“”"'‘’*_`]/g,'').replace(/\s+/g,' ').trim();
  const cards = rc.decks.filter(d=>!d.custom).flatMap(d=>d.cards);
  const add = c => { if(c && !out.ids.includes(c.id)) out.ids.push(c.id); };
  for(const raw of t.split('\n')){
    const line = raw.trim(); if(!line || /^={3,}/.test(line) || /^```/.test(line)) continue; let m;
    if((m = line.match(/^name\s*:\s*(.+)$/i))){ out.name = m[1].trim(); continue; }
    if((m = line.match(/^commitment\s*:\s*(.+)$/i))){ const k = Object.keys(RC_LEVELS).find(x=>x.toLowerCase()===m[1].trim().toLowerCase()); if(k) out.level = k; continue; }
    const body = line.replace(/^(?:[-*•]|\d+[.)])\s+/, '');
    if((m = body.match(/^\[?\s*([CD])-([0-9a-f]{6,32})\s*\]?/i))){
      const hit = rcFromCode(m[1].toUpperCase(), m[2]);
      if(hit && hit.cards) hit.cards.forEach(add); else if(hit) add(hit); else out.miss.push(line);
      continue; }
    const txt = norm(body.split(/\s+\|\s+/)[0].replace(/\s*\((?:from|adds)[^)]*\)\s*$/i,''));
    if(!txt) continue;
    const c = cards.filter(x=>norm(x.title)===txt); if(c.length===1){ add(c[0]); continue; }
    const d = rc.decks.filter(x=>norm(x.title)===txt); if(d.length===1){ d[0].cards.forEach(add); continue; }
    out.miss.push(line);
  }
  return out;
}
function rcbLoadPaste(){
  const b = rc.bld; const r = rcbParse(b.paste);
  if(!r.ids.length){ _mmToast('None of those lines matched a card or deck. Paste the whole block from Claude, codes included.'); return; }
  if(b.ids.length && !confirm(`Replace the ${b.ids.length} cards in the builder with the ${r.ids.length} Claude chose?`)) return;
  b.ids = r.ids; if(r.name) b.name = r.name; if(r.level) b.level = r.level; b.miss = r.miss; b.paste = null;
  _mmToast(`Loaded ${r.ids.length} cards.` + (r.miss.length ? ` ${r.miss.length} line${r.miss.length>1?'s':''} did not match.` : ' Check the order, then create the deck.')); render();
}

/* ════════ Calendar: the month ahead ════════ */
rc.calDay = null;
function rcCalDue(){   // date -> decks due that day; anything overdue lands on today
  const today = rcToday(); const end = rcAddDays(today, 30); const by = {};
  rc.decks.forEach(d=>{ if(!rcScheduled(d) || rcFinished(d) || !d.next) return; const day = d.next<today ? today : d.next; if(day>end) return; (by[day] = by[day]||[]).push(d); });
  Object.values(by).forEach(list=>list.sort((a,b)=>(a.next.localeCompare(b.next)) || a.title.localeCompare(b.title)));
  return by;
}
function renderRecallCal(){
  const g = gate(); if(g) return `<div class="section-hd"><div class="section-title">Calendar</div></div>` + g;
  if(!rcReady()) return rcWait('Calendar');
  const today = rcToday(); const by = rcCalDue(); const end = rcAddDays(today, 30);
  const [y,m,d0] = today.split('-').map(Number); const dow = (new Date(y,m-1,d0).getDay()+6)%7;   // weeks start on Monday
  const start = rcAddDays(today, -dow); const days = []; for(let x=start; x<=end || days.length%7; x=rcAddDays(x,1)) days.push(x);
  const loads = Object.values(by).map(l=>rcCardCount(l)); const max = Math.max(1, ...loads);
  const total = Object.values(by).reduce((n,l)=>n+l.length, 0); const totalCards = loads.reduce((a,b)=>a+b, 0);
  const sel = rc.calDay && rc.calDay>=today && rc.calDay<=end ? rc.calDay : (by[today] ? today : Object.keys(by).sort()[0] || today);
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h = `<h1 class="lib-h1">The month ahead</h1>
    <p class="lib-lede">${total ? `${libTick(total)} deck reviews and about ${libTick(totalCards)} cards fall due in the next 30 days.` : 'Nothing is due in the next 30 days.'} Tap a day to see its decks or start them early.</p>
    <div class="rc-cal" role="grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="rc-cal-w" role="columnheader">${w}</div>`).join('')}
    ${days.map(day=>{ const out = day<today || day>end; const list = by[day]||[]; const n = rcCardCount(list); const dd = +day.slice(8); const first = dd===1 || day===days[0];
      const lvl = n ? Math.ceil(4*n/max) : 0; const over = day===today && list.some(x=>x.next<today);
      return `<button class="rc-cal-d${out?' out':''}${day===today?' today':''}${day===sel?' sel':''}${list.length?' has':''} l${lvl}" ${out?'disabled tabindex="-1"':`onclick="rc.calDay='${day}';render()"`} aria-label="${esc(rcNice(day))}: ${list.length} decks">
        <span class="rc-cal-n">${first?`<small>${MON[+day.slice(5,7)-1]}</small> `:''}${dd}</span>
        ${list.length?`<span class="rc-cal-dots">${list.slice(0,5).map(x=>`<i style="--cloth:${rcColor(x)}"></i>`).join('')}${list.length>5?'<b>+</b>':''}</span><span class="rc-cal-c">${n} ${n===1?'card':'cards'}</span>`:''}
        ${over?'<span class="rc-cal-over">overdue</span>':''}</button>`; }).join('')}</div>`;
  const list = by[sel]||[]; const n = rcCardCount(list);
  h += `<section class="rc-cal-pane"><div class="rc-cal-pane-h"><div><div class="rc-lbl">${sel===today?'Today':esc(rcWhen(sel).replace(/^in /,'In '))}</div><h2 class="rc-cal-title">${esc(rcNice(sel))}</h2></div>
      ${list.length?`<button class="rc-start sm" onclick="rcStart('day', {ids:${esc(JSON.stringify(list.map(x=>x.id)))}, name:${esc(JSON.stringify(sel===today?"Today's review":'Early review: '+rcNice(sel)))}})">${sel===today?'Review them':'Review them early'} <small>${n} cards</small></button>`:''}</div>
    ${list.length ? `<div class="rc-grid">${list.map(x=>rcTile(x)).join('')}</div>${sel!==today?`<p class="rc-note">Reviewing early is practice: the schedule stays put unless you tick “Move these decks along” at the end.</p>`:''}` : `<p class="rc-note">Nothing due that day.</p>`}</section>`;
  return rcShell(h);
}

/* ════════ Adding cards ════════ */
function _rcClean(t){ return String(t||'').replace(/\*\*(.+?)\*\*/g,'$1').replace(/(^|[\s(“"])\*(\S(?:.*?\S)?)\*(?=[\s).,;:!?”"]|$)/g,'$1$2').replace(/\s+/g,' ').trim(); }
function rcLinesFromText(text){
  let t = String(text||''); const a = t.lastIndexOf('=== RECALL NOTES ===');
  if(a>=0){ const b = t.indexOf('=== END RECALL NOTES ===', a); t = t.slice(a+20, b>a?b:undefined); }
  const raw = t.replace(/\t/g,'    ').split('\n').filter(l=>l.trim() && !/^\s*```/.test(l));
  const widths = raw.map(l=>l.match(/^ */)[0].length); const pos = widths.filter(w=>w>0); const unit = pos.length ? Math.min(...pos) : 2;

  if(!lines.some(l=>l.bullet)) lines.forEach(l=>{ if(!l.heading) l.bullet = true; });
  // Copying from a Claude chat often drops the indentation: every line arrives at the left edge.
  // Then a cue is a line that asks (ends in "?" or a count like "(3)"); the lines after it are its answer.
  const DIRECTIVE = /^(?:(?:knowledge bank\s+)?topics?|new topic|commitment|deck(?: name)?|related(?: decks?)?)\s*:/i;
  const CUE = /(\?["”’']?|\(\d+\))\s*$/;
  const body = lines.filter(l=>!l.heading && !/^={3,}/.test(l.text));
  if(body.length>1 && body.every(l=>l.depth===0) && body.some(l=>CUE.test(l.text) && !DIRECTIVE.test(l.text))){
    let seen = false;
    lines.forEach(l=>{ if(l.heading || /^={3,}/.test(l.text)) return;
      if(DIRECTIVE.test(l.text)){ l.depth = 0; seen = false; return; }
      if(CUE.test(l.text)){ l.depth = 0; l.bullet = true; seen = true; } else if(seen){ l.depth = 1; } else l.bullet = false; });

function rcLinesFromBlocks(blocks){

function rcParse(lines){
  const out = {cards:[], topicsRaw:[], newRaw:[], level:'', name:'', relatedRaw:[]};
  const list = v => (v.includes(';') ? v.split(';') : v.split(',')).map(s=>s.trim()).filter(Boolean);
  let cur = null;
  for(const l of lines){
    if(l.heading){ cur = null; continue; }
    if(l.depth===0){
      let m;
      if((m = l.text.match(/^(?:knowledge bank\s+)?topics?\s*:\s*(.*)$/i))){ out.topicsRaw.push(...list(m[1])); cur = null; continue; }
      if((m = l.text.match(/^new topic\s*:\s*(.+)$/i))){ const parts = m[1].split(/\s+\|\s+/); const nt = {title:parts[0].trim(), parentRaw:''}; parts.slice(1).forEach(p=>{ const kv = p.match(/^parent\s*:\s*(.*)$/i); if(kv) nt.parentRaw = kv[1].trim(); }); out.newRaw.push(nt); cur = null; continue; }

      if((m = l.text.match(/^deck(?: name)?\s*:\s*(.+)$/i))){ out.name = m[1].trim(); cur = null; continue; }
      if((m = l.text.match(/^related(?: decks?)?\s*:\s*(.*)$/i))){ out.relatedRaw.push(...list(m[1])); cur = null; continue; }
      if(/^={3,}/.test(l.text) || !l.bullet){ cur = null; continue; }
      cur = {cue:l.text, lines:[]}; out.cards.push(cur);
    } else if(cur){ cur.lines.push('  '.repeat(Math.max(0, l.depth-1)) + l.text); }

}
function rcNormTitle(t){ return String(t||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[“”"'‘’`*_\[\]]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9$]+/g,' ').trim(); }
function rcFindDeck(name){   // a deck (or a Recall page that will become one) by its title, forgiving case and punctuation

  const pool = Object.values(rc.byId).filter(p=>!(p.parent && rc.byId[p.parent]));
  const exact = pool.find(p=>rcNormTitle(p.title)===n); if(exact) return exact;
  if(n.length<8) return null;
  const near = pool.filter(p=>{ const t = rcNormTitle(p.title); return t.length>=8 && (t.startsWith(n) || n.startsWith(t)); });

}

function rcAddFill(parsed, src){

    do{ const body = {page_size:100}; if(cursor) body.start_cursor = cursor; const data = await nPost('/databases/'+fmtId(AR_DB)+'/query', body); old.push(...(data.results||[])); cursor = data.has_more ? data.next_cursor : null; guard++; } while(cursor && guard<50);
    const groups = new Map();
    for(const p of old){ const pr = p.properties||{}; const sid = relIds(pr['String Name'])[0] || 'solo:'+p.id; if(!groups.has(sid)) groups.set(sid, []); groups.get(sid).push(p); }
    const have = new Set(rc.decks.map(d=>d.title.trim().toLowerCase())); let made = 0, cardsMade = 0, skipped = 0, gi = 0;
    for(const [sid, list] of groups){
      gi++; const first = list[0].properties||{};
      const title = sid.startsWith('solo:') ? (extractTitle(first)||'Old card') : await fetchPageTitle(sid);
      if(have.has(title.trim().toLowerCase())){ skipped++; continue; }
      m.msg = `Deck ${gi} of ${groups.size}: ${tqShort(title,30)}`; render();
      list.sort((a,b)=>((a.properties['String Number']||{}).number||0) - ((b.properties['String Number']||{}).number||0));
      const stages = list.map(p=>Math.max(0, STAGES.indexOf(normalizeStage(selectName(p.properties.Stage)))));
      const stage = Math.min(...stages); const nexts = list.map(p=>((p.properties['Next Review']||{}).date||{}).start).filter(Boolean).sort();
      const lasts = list.map(p=>((p.properties['Last Reviewed']||{}).date||{}).start).filter(Boolean).sort();
      const props = {[rc.S.titleProp]:{title:rcRich(title)}, [RC_P.level]:{select:{name:'Mastery'}}, [RC_P.stage]:{number:stage}};
      if(stage<RC_LEVELS.Mastery.gaps.length) props[RC_P.next] = {date:{start:(nexts[0]||rcToday()).slice(0,10)}};
      if(lasts.length) props[RC_P.last] = {date:{start:lasts[lasts.length-1].slice(0,10)}};
      const rels = {}; list.forEach(p=>{ for(const [k,v] of Object.entries(p.properties||{})){ const to = k===kbOld ? rc.S.kbProp : relOf[k]; if(!to || v.type!=='relation') continue; rels[to] = rels[to]||new Set(); relIds(v).forEach(x=>rels[to].add(fmtId(x))); } });
      for(const [k,set] of Object.entries(rels)) if(set.size) props[k] = {relation:[...set].slice(0,90).map(id=>({id}))};
      const deck = rcPage(await nPost('/pages', {parent:{database_id:fmtId(getIpDb())}, properties:props}));
      const contents = await mapPool(list, p=>readCardFullContent(p.id), 3); let prev = null;
      for(let i=0;i<list.length;i++){ const c = contents[i] && !contents[i].__err ? contents[i] : {}; const name = extractTitle(list[i].properties)||'';
        const cue = (c.question||name||'Old card').trim(); const ans = [name && name.trim()!==cue ? name.trim() : '', (c.scope||'').trim(), ...((c.hints||[]).map(h=>'Hint: '+h))].filter(Boolean).join('\n');
        const made1 = await rcMakeCard(deck, cue, ans, prev); prev = made1.id; cardsMade++; }
      made++;
    }
    m.st = 'done'; m.msg = `Brought over ${made} decks and ${cardsMade} cards.` + (skipped?` ${skipped} were already here.`:'') + ' The old database is untouched; delete it in Notion when you are happy.';
    await rcLoad();
  }catch(e){ m.st = 'error'; m.msg = 'Stopped: '+e.message+' Running it again skips the decks already made.'; render(); }
}
