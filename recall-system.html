.tg-list { display:flex; flex-direction:column; gap:6px; }
.tg-row { display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:9px 12px; cursor:pointer; }
.tg-row.on { border-color:var(--brass); box-shadow:0 0 0 1px var(--brass); background:#fffdf6; }
.tg-row input { width:auto; margin-top:4px; }
.tg-row-b { flex:1; min-width:0; }
.tg-row-h a { font-family:var(--text); font-size:15px; color:var(--ink); text-decoration:none; font-weight:500; }
.tg-row-h a:hover { text-decoration:underline; text-decoration-color:var(--brass); }
.tg-row-m { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:5px; }
.tg-date { font-size:11px; color:var(--ink-faint); margin-right:4px; }
.tg-chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; border:1px solid var(--rule); background:var(--paper); border-radius:999px; padding:2px 6px 2px 8px; color:var(--ink); }
.tg-chip::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--cloth); }
.tg-chip.sug { border-style:dashed; border-color:var(--cloth); background:transparent; cursor:pointer; padding-right:9px; }
.tg-chip.sug:hover { background:var(--card); }
.tg-side { position:sticky; top:12px; max-height:calc(100vh - 30px); overflow:auto; background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:14px; }
.tg-side-h { font-family:var(--display); font-size:20px; font-weight:600; margin-bottom:10px; }
.tg-side input[type=text], .ex-pick input { width:100%; background:#fff; border:1px solid var(--rule); border-radius:4px; padding:8px 10px; font-size:13.5px; margin-bottom:6px; }
.tg-opt { display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left; border:none; background:none; padding:6px 8px; border-radius:4px; font-size:13px; color:var(--ink); cursor:pointer; }
.tg-opt:hover:not(:disabled) { background:var(--paper-2); }
.tg-opt small { color:var(--ink-faint); }
.tg-optnew { width:100%; margin-top:6px; border:1px dashed var(--brass); background:none; color:var(--ink); border-radius:4px; padding:7px; font-size:13px; cursor:pointer; }
.tg-newbox { display:flex; flex-direction:column; gap:6px; font-size:13.5px; }
.tg-tree { margin-top:8px; border-top:1px solid var(--rule); padding-top:8px; }
.tg-tree .lt-row:hover { background:var(--paper-2); }
.tg-tree .lt-name { color:var(--ink); font-size:13.5px; }
.tg-tree .lt-chev { color:var(--ink-faint); }

.ex-row { background:var(--card); border:1px solid var(--rule); border-left:5px solid var(--cloth); border-radius:3px; padding:14px 16px; margin-bottom:12px; max-width:820px; }
.ex-row-h { display:flex; align-items:baseline; gap:12px; }
.ex-topic { border:none; background:none; padding:0; font-family:var(--display); font-size:24px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left; }
.ex-topic:hover { text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:4px; }
.ex-n { font-size:12.5px; color:var(--ink-faint); }
.ex-pick { margin-top:8px; max-width:520px; }
.ex-opts { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin-top:10px; font-size:13px; color:var(--ink); }
.ex-opts label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
.ex-opts input { width:auto; }
.ex-sep { width:1px; height:16px; background:var(--rule); }
.ex-dbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; }
.ex-more { font-size:12.5px; color:var(--ink-soft); }
.ex-more summary { cursor:pointer; }
.ex-more .tg-dbs { margin:8px 0 0; }
.ex-time { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:18px 0; max-width:820px; }
.ex-time-h { font-family:var(--display); font-size:20px; font-weight:600; }
.ex-go { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:8px 0 16px; }
.ex-build { border:none; background:var(--ink); color:var(--paper); border-radius:999px; padding:10px 20px; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
.ex-build:disabled { opacity:.7; cursor:default; }
.ex-preview { max-width:820px; max-height:420px; overflow:auto; background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:14px 16px; font-family:'SF Mono','Fira Code',monospace; font-size:12px; line-height:1.55; white-space:pre-wrap; color:var(--ink); }

/* ════ Recall cards: index cards from a library catalog ════ */
.rc { --ink-red:#a5342b; --rule-blue:rgba(96,128,160,.2); --got:#3f7a4f; --shaky:#b98a1e; --miss:#a5342b; }
.rc-err { background:#fbeceb; border:1px solid #e3b7b2; color:#7c2620; border-radius:4px; padding:10px 12px; font-size:13.5px; margin:10px 0; max-width:820px; }
.rc-note { font-family:var(--text); font-size:14.5px; color:var(--ink-soft); margin:8px 0; max-width:60ch; }
.rc-lbl { display:block; font-size:12.5px; color:var(--ink-soft); margin:14px 0 5px; }
.rc input[type=text], .rc textarea { background:#fffdf7; border:1px solid var(--rule); border-radius:4px; color:var(--ink); padding:9px 11px; font-size:14.5px; width:100%; font-family:var(--text); }
.rc input[type=checkbox] { width:auto; }
.rc-start { border:none; background:var(--ink); color:var(--paper); border-radius:999px; padding:12px 24px; font-size:15px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:transform .2s, box-shadow .2s; }
.rc-start:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 18px -10px rgba(42,34,27,.7); }
.rc-start:disabled { opacity:.6; cursor:default; }
.rc-start.sm { padding:8px 18px; font-size:13.5px; }
.tg-btn.danger { color:#8c2b23; border-color:#dcb1ab; }
.rc-danger { margin-top:34px; padding-top:14px; border-top:1px solid var(--rule); }

/* today */
.rc-today { display:grid; grid-template-columns:minmax(210px, 260px) minmax(0,1fr); gap:26px; align-items:center; padding:24px 26px; margin:6px 0 4px; border-radius:6px;
  background: repeating-linear-gradient(92deg, rgba(255,255,255,.02) 0 2px, transparent 2px 9px), linear-gradient(180deg, var(--walnut), var(--walnut-2)); color:#f3e7cd; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3), 0 16px 26px -20px rgba(40,22,10,.8); }
.rc-today.clear { grid-template-columns:1fr; background:var(--paper-2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--rule); }
.rc-today-n { font-family:var(--display); font-size:92px; font-weight:600; line-height:.82; color:#f6dfa4; }
.rc-today-t { font-family:var(--display); font-size:27px; font-weight:600; line-height:1.1; margin-top:6px; }
.rc-today-s { font-size:13.5px; opacity:.75; margin:4px 0 16px; }
.rc-today.clear .rc-today-s { margin-bottom:0; }
.rc-today .rc-start { background:#f6dfa4; color:#2b1b13; }
.rc-fan { display:flex; gap:18px; overflow-x:auto; padding:14px 6px 16px; align-items:stretch; scrollbar-width:thin; }
.rc-fan .rc-tile { flex:0 0 210px; }
.rc-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(214px, 1fr)); gap:22px 20px; padding:10px 4px 6px; }

/* a deck: a small stack of index cards */
.rc-tile { position:relative; border:none; background:none; padding:0; text-align:left; cursor:pointer; color:var(--ink); font-family:inherit; min-height:148px; display:flex; }
.rc-tile::before, .rc-tile::after { content:''; position:absolute; inset:0; background:#f6efdf; border:1px solid #d6c8ab; border-radius:3px; transition:transform .28s cubic-bezier(.2,.8,.2,1); }
.rc-tile::before { transform:rotate(-2.2deg) translate(-2px, 3px); }
.rc-tile::after { transform:rotate(1.6deg) translate(3px, 2px); }
.rc-tile:hover::before { transform:rotate(-4deg) translate(-5px, 4px); }
.rc-tile:hover::after { transform:rotate(3.4deg) translate(6px, 3px); }
.rc-tile-in { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; gap:6px; padding:15px 14px 11px; border:1px solid #cfc0a1; border-top:4px solid var(--cloth); border-radius:3px;
  background:#fffdf6;
  box-shadow:0 8px 14px -11px rgba(60,35,18,.75); transition:transform .28s cubic-bezier(.2,.8,.2,1); }
.rc-tile:hover .rc-tile-in { transform:translateY(-4px); }
.rc-tile-t { font-family:var(--display); font-size:19px; font-weight:600; line-height:1.14; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; min-height:22px; }
.rc-tile-m { font-size:12px; color:var(--ink-soft); padding-top:7px; border-top:1px solid var(--ink-red); }
.rc-tile-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:6px; }
.rc-tile-when { font-size:11.5px; color:var(--ink-faint); white-space:nowrap; }
.rc-tile.due .rc-tile-when { color:var(--ink-red); font-weight:600; }
.rc-bar { display:flex; height:4px; border-radius:2px; overflow:hidden; background:#e6dcc6; gap:1px; }
.rc-bar i { background:#e6dcc6; } .rc-bar i.got { background:var(--got); } .rc-bar i.shaky { background:var(--shaky); } .rc-bar i.miss { background:var(--miss); }
.rc-path { display:inline-flex; gap:4px; align-items:center; }
.rc-path i { width:8px; height:8px; border-radius:50%; border:1.5px solid #b7a583; background:transparent; }
.rc-path i.done { background:var(--ink); border-color:var(--ink); }
.rc-path i.now { border-color:var(--ink-red); box-shadow:0 0 0 2px rgba(165,52,43,.18); }
.rc-path.adhoc { font-size:11px; color:var(--ink-faint); }
.rc-stamp { position:absolute; z-index:2; top:-9px; right:-6px; transform:rotate(9deg); font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.08em; color:var(--ink-red); border:2px solid var(--ink-red); border-radius:3px; padding:0 8px; background:rgba(255,253,246,.92); box-shadow:0 0 0 1px rgba(255,253,246,.9); }

/* review sets, coming up */
.rc-sets { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.rc-set { display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--rule); border-left:4px solid var(--brass); border-radius:3px; padding-right:6px; }
.rc-set-go { border:none; background:none; text-align:left; padding:9px 12px; cursor:pointer; color:var(--ink); display:flex; flex-direction:column; gap:1px; }
.rc-set-t { font-family:var(--display); font-size:18px; font-weight:600; }
.rc-set-m { font-size:11.5px; color:var(--ink-faint); }
.rc-set-tools { display:flex; gap:8px; flex-wrap:wrap; }
.rc-sets .tg-paste, .rc-sets .rc-note { flex-basis:100%; }
.rc-slip { max-width:720px; background:var(--card); border:1px solid var(--rule); border-radius:3px; }
.rc-slip-row { display:grid; grid-template-columns:76px 96px 1fr; gap:10px; align-items:baseline; padding:8px 14px; border-bottom:1px solid #ebe0c9; }
.rc-slip-row:last-child { border-bottom:none; }
.rc-slip-d { font-family:var(--display); font-size:18px; font-weight:600; color:var(--ink-red); }
.rc-slip-w { font-size:12px; color:var(--ink-faint); }
.rc-slip-decks { display:flex; flex-wrap:wrap; gap:4px 12px; }
.rc-slip-decks button { border:none; background:none; padding:0; font-family:var(--text); font-size:14.5px; color:var(--ink); cursor:pointer; text-align:left; }
.rc-slip-decks button:hover { text-decoration:underline; text-decoration-color:var(--brass); }
.rc-empty { text-align:center; padding:50px 10px; font-family:var(--text); color:var(--ink-soft); }
.rc-empty-card { display:inline-block; font-family:var(--display); font-size:26px; font-style:italic; color:var(--ink); background:#fffdf6; border:1px solid #cfc0a1; border-top:4px solid var(--ink-red); padding:26px 34px; transform:rotate(-2deg); box-shadow:0 12px 20px -14px rgba(60,35,18,.8); margin-bottom:22px; }
.rc-empty p { margin:0 auto 18px; max-width:44ch; font-size:15.5px; }

/* deck page */
.rc-deck-head { border-left:6px solid var(--cloth); padding-left:16px; margin-bottom:14px; }
.rc-deck-head .lib-h1 { font-size:clamp(30px, 3vw, 42px); margin-bottom:8px; max-width:26ch; }
.rc-plan { display:flex; flex-wrap:wrap; gap:18px 30px; justify-content:space-between; align-items:flex-start; background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:16px 18px; margin:10px 0; max-width:900px; }
.rc-plan-l { flex:1 1 380px; min-width:0; } .rc-plan-r { display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
.rc-plan-b { font-size:13px; color:var(--ink-soft); margin-top:8px; line-height:1.5; }
.rc-plan-st { font-family:var(--display); font-size:24px; font-weight:600; }
.rc-steps { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.rc-step { display:flex; flex-direction:column; align-items:center; gap:2px; width:54px; padding:6px 0 5px; border:1.5px dashed #c9b893; border-radius:4px; color:var(--ink-faint); }
.rc-step b { font-family:var(--display); font-size:19px; line-height:1; } .rc-step small { font-size:10.5px; }
.rc-step.done { border-style:solid; border-color:var(--ink); background:var(--ink); color:var(--paper); }
.rc-step.now { border-style:solid; border-color:var(--ink-red); color:var(--ink-red); transform:rotate(-3deg); background:#fffdf6; }
.rc-cards { display:flex; flex-direction:column; gap:6px; max-width:900px; }
.rc-row { background:#fffdf6; border:1px solid #d9ccb1; border-radius:3px; }
.rc-row.open { box-shadow:0 10px 20px -16px rgba(60,35,18,.8); border-color:#c2b08a; }
.rc-row-h { display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:none; background:none; padding:11px 14px; cursor:pointer; color:var(--ink); font-family:inherit; }
.rc-row-n { font-family:var(--display); font-size:17px; color:var(--ink-faint); min-width:20px; text-align:right; }
.rc-row-t { flex:1; min-width:0; font-family:var(--text); font-size:16px; line-height:1.4; }
.rc-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid #c9b893; flex:0 0 10px; }
.rc-dot.got { background:var(--got); border-color:var(--got); } .rc-dot.shaky { background:var(--shaky); border-color:var(--shaky); } .rc-dot.miss { background:var(--miss); border-color:var(--miss); }
.rc-flag { font-size:11px; color:#8a5a12; background:#f7e9c6; border-radius:3px; padding:2px 7px; white-space:nowrap; }
.rc-flag.pic { color:var(--ink-soft); background:var(--paper-2); }
.rc-row-b { padding:4px 16px 14px 46px; border-top:1px solid var(--ink-red); margin-top:-1px; background-image:repeating-linear-gradient(transparent 0 27px, var(--rule-blue) 27px 28px); }
.rc-row-b .rc-lbl { margin-top:10px; }
.rc-row-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
.rc-file { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:6px; }
.rc-file input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.rc-ans { list-style:none; margin:10px 0 0; padding:0; font-family:var(--text); font-size:16.5px; line-height:1.55; color:var(--ink); }
.rc-ans li { position:relative; padding-left:18px; margin-bottom:5px; }
.rc-ans li::before { content:''; position:absolute; left:3px; top:.62em; width:6px; height:6px; border-radius:50%; background:var(--brass); }
.rc-ans li.d1 { margin-left:20px; font-size:.94em; } .rc-ans li.d2, .rc-ans li.d3 { margin-left:40px; font-size:.9em; }
.rc-ans li.d1::before, .rc-ans li.d2::before, .rc-ans li.d3::before { background:none; border:1.5px solid var(--brass); }
.rc-noans { font-style:italic; color:var(--ink-faint); margin:10px 0 0; }
.rc-imgs { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.rc-img { position:relative; display:inline-block; background:#fff; padding:6px 6px 8px; border:1px solid #d9ccb1; box-shadow:0 8px 14px -10px rgba(60,35,18,.7); transform:rotate(-.6deg); }
.rc-img img { display:block; max-width:min(100%, 420px); max-height:300px; }
.rc-img .ib-x { position:absolute; top:2px; right:2px; background:rgba(255,255,255,.9); border-radius:50%; width:22px; height:22px; }
.rc-addcard { max-width:900px; margin-top:14px; padding:6px 16px 16px; border:1.5px dashed #c9b893; border-radius:4px; }
.rc-addcard textarea { margin-top:8px; }
.rc-relpick { display:flex; flex-wrap:wrap; gap:8px; align-items:center; max-width:560px; margin-top:8px; }
.rc-relpick input { flex-basis:100%; }

/* the review table */
.rc-stage { max-width:760px; margin:0 auto; }
.rc-s-top { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
.rc-s-name { flex:1; min-width:0; font-family:var(--display); font-size:21px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:4px solid var(--cloth); padding-left:10px; }
.rc-s-count { font-size:13px; color:var(--ink-soft); white-space:nowrap; }
.rc-prog { display:flex; gap:3px; margin-bottom:22px; }
.rc-prog i { flex:1; height:5px; border-radius:2px; background:#ddd0b4; max-width:44px; transition:background .3s; }
.rc-prog i.now { background:var(--ink); } .rc-prog i.got { background:var(--got); } .rc-prog i.shaky { background:var(--shaky); } .rc-prog i.miss { background:var(--miss); } .rc-prog i.seen { background:#9a8b78; }
.rc-scene { perspective:1600px; }
.rc-card { position:relative; display:grid; cursor:pointer; transform-style:preserve-3d; transition:transform .62s cubic-bezier(.3,.9,.3,1); border-radius:5px; }
.rc-card.flipped { transform:rotateY(180deg); }
.rc-scene.rc-in { animation:rcDeal .42s cubic-bezier(.2,.8,.2,1); }
@keyframes rcDeal { from { opacity:0; transform:translate(46px, -14px) rotate(3.5deg); } }
.rc-face { grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; min-height:340px; border-radius:5px; border:1px solid #cdbd9c; padding:66px 46px 40px;
  background-color:#fffdf6; background-image: linear-gradient(transparent 0 49px, var(--ink-red) 49px 51px, transparent 51px), repeating-linear-gradient(transparent 0 31px, var(--rule-blue) 31px 32px);
  box-shadow: 0 2px 0 #e9dfc9, 0 4px 0 #f6efdf, 0 5px 0 #d6c8ab, 0 26px 36px -24px rgba(60,35,18,.85); display:flex; flex-direction:column; }
.rc-front { justify-content:center; align-items:center; text-align:center; }
.rc-back { transform:rotateY(180deg); }
.rc-cue { font-family:var(--display); font-size:clamp(27px, 3.4vw, 38px); font-weight:600; line-height:1.16; max-width:22ch; }
.rc-tip { position:absolute; bottom:16px; left:0; right:0; text-align:center; font-size:12.5px; color:var(--ink-faint); font-style:italic; font-family:var(--text); }
.rc-cue-sm { position:absolute; top:15px; left:46px; right:46px; font-family:var(--display); font-size:17px; font-style:italic; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rc-back .rc-ans { font-size:19px; line-height:32px; margin-top:0; }
.rc-back .rc-ans li { margin-bottom:0; } .rc-back .rc-ans li::before { top:13px; }
.rc-grades { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; opacity:0; transform:translateY(8px); pointer-events:none; transition:opacity .3s .15s, transform .3s .15s; }
.rc-grades.on { opacity:1; transform:none; pointer-events:auto; }
.rc-g { --c:var(--ink); border:2px solid var(--c); background:#fffdf6; color:var(--c); border-radius:5px; padding:13px 10px; font-family:var(--display); font-size:22px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .18s, color .18s, transform .18s; }
.rc-g.got { --c:var(--got); } .rc-g.shaky { --c:var(--shaky); } .rc-g.miss { --c:var(--miss); }
.rc-g:hover, .rc-g:focus-visible { background:var(--c); color:#fffdf6; transform:rotate(-1.5deg) scale(1.02); }
.rc-g kbd { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:11px; font-weight:400; border:1px solid currentColor; border-radius:3px; padding:0 5px; opacity:.7; }
.rc-keys { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:16px; font-size:12px; color:var(--ink-faint); }
.rc-keys .lib-link { margin-left:0; font-size:12px; } .rc-keys .lib-link:disabled { opacity:.4; cursor:default; }

/* after the last card */
.rc-summary, .rc-done { max-width:820px; margin:0 auto; }
.rc-totals { display:flex; gap:12px; margin:16px 0 18px; }
.rc-totals span { flex:1; text-align:center; border:2px solid var(--c); color:var(--c); border-radius:5px; padding:10px 6px; font-size:13px; background:#fffdf6; }
.rc-totals b { display:block; font-family:var(--display); font-size:44px; line-height:1; }
.rc-totals .got { --c:var(--got); } .rc-totals .shaky { --c:var(--shaky); } .rc-totals .miss { --c:var(--miss); }
.rc-counts { display:inline-flex; align-items:center; gap:8px; font-size:14px; margin-bottom:10px; cursor:pointer; }
.rc-sum { display:flex; flex-direction:column; gap:8px; margin:6px 0 14px; }
.rc-sum-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 16px; background:var(--card); border:1px solid var(--rule); border-left:5px solid var(--cloth, var(--brass)); border-radius:3px; padding:11px 14px; }
.rc-sum-t { font-family:var(--display); font-size:20px; font-weight:600; display:flex; flex-direction:column; min-width:0; }
.rc-sum-t small { font-family:-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:400; color:var(--ink-faint); }
.rc-sum-pick { display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.rc-sum-o { font-size:12.5px; color:var(--ink-soft); }
.rc-done { text-align:center; padding-top:30px; }
.rc-done .lib-lede { margin-left:auto; margin-right:auto; } .rc-done .rc-sum { text-align:left; } .rc-done .ex-go { justify-content:center; }
.rc-done-stamp { display:inline-flex; flex-direction:column; font-family:var(--display); font-size:19px; letter-spacing:.14em; color:var(--ink-red); border:3px double var(--ink-red); border-radius:6px; padding:9px 22px 7px; transform:rotate(-7deg); margin-bottom:22px; animation:rcStamp .5s cubic-bezier(.2,1.4,.4,1) both; }
.rc-done-stamp b { font-size:30px; letter-spacing:.04em; line-height:1.1; }
@keyframes rcStamp { from { opacity:0; transform:rotate(-7deg) scale(2.2); } }

/* adding */
.rc-aname { font-family:var(--display) !important; font-size:25px !important; font-weight:600; max-width:820px; }
.rc-paste { max-width:820px; font-family:'SF Mono','Fira Code',monospace !important; font-size:13px !important; line-height:1.6; margin-top:10px; display:block; }
.rc-wait { display:flex; flex-direction:column; gap:6px; max-width:820px; }
.rc-wait-row { display:flex; align-items:baseline; justify-content:space-between; gap:12px; text-align:left; background:#fffdf6; border:1px solid #d9ccb1; border-left:4px solid var(--ink-red); border-radius:3px; padding:11px 14px; cursor:pointer; color:var(--ink); transition:transform .2s; }
.rc-wait-row:hover { transform:translateX(4px); }
.rc-wait-t { font-family:var(--display); font-size:20px; font-weight:600; } .rc-wait-m { font-size:12px; color:var(--ink-faint); white-space:nowrap; }
.rc-prev { background:#fffdf6; border:1px solid #d9ccb1; border-radius:3px; padding:10px 14px 12px; }
.rc-prev.off { opacity:.45; }
.rc-prev-h { display:flex; align-items:flex-start; gap:10px; cursor:pointer; } .rc-prev-h input { margin-top:5px; }
.rc-prev .rc-ans { margin:6px 0 0 24px; font-size:15px; }
.rc-house { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px 20px; max-width:820px; background:var(--card); border:1px solid var(--rule); border-radius:3px; padding:12px 14px; margin-bottom:8px; font-size:13.5px; color:var(--ink-soft); }
.rc-house > div { flex:1 1 300px; } .rc-house b { color:var(--ink); }

@media (max-width: 700px) {
  .rc-today { grid-template-columns:1fr; padding:18px; }
  .rc-today-n { font-size:68px; }
  .rc-face { padding:60px 22px 34px; min-height:300px; }
  .rc-cue-sm { left:22px; right:22px; }
  .rc-g { font-size:18px; padding:12px 4px; } .rc-g kbd { display:none; }
  .rc-row-b { padding-left:16px; }
  .rc-slip-row { grid-template-columns:70px 1fr; } .rc-slip-w { display:none; }
  .rc-sum-pick { align-items:flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .rc-card, .rc-tile::before, .rc-tile::after, .rc-tile-in, .rc-grades, .rc-g, .rc-start, .rc-wait-row { transition:none; }
  .rc-scene.rc-in, .rc-done-stamp { animation:none; }
}

/* ════ Empty shelves in topic trees: shown, but faded ════ */
.lt-row.lt-empty .lt-name { opacity:.42; font-style:italic; }
.lt-row.lt-empty:hover .lt-name, .lt-row.lt-empty.sel .lt-name { opacity:.8; }

/* ════ Custom decks ════ */
.rc-tile-k { display:inline-block; align-self:flex-start; font-family:var(--text); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:#7d5f1e; background:#f2e3bd; border:1px solid #dcc48b; border-radius:2px; padding:1px 7px; }
.rc-tile.custom .rc-tile-in { border-top-style:double; border-top-width:6px; background-image:repeating-linear-gradient(135deg, rgba(184,141,63,.05) 0 6px, transparent 6px 12px); }
.rc-deck-head.custom .rc-tile-k { margin-bottom:8px; }
.rc-oldsets { flex-basis:100%; display:flex; flex-direction:column; gap:8px; margin-top:16px; }
.rc-oldsets .rc-set { flex-wrap:wrap; }
.rc-row-t small, .rc-row-src { display:block; font-family:var(--text); font-size:12px; color:var(--ink-faint); margin-top:2px; }
.rc-flag.note { color:#7a2e26; background:#f5dcd5; }
.rc-also { margin:10px 0 0; font-size:13px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; }
.rc-s-name small { display:block; font-family:var(--text); font-size:12.5px; font-weight:400; color:var(--ink-faint); }

/* ════ Miss notes ════ */
.rc-missnote { margin-top:22px; padding:16px 18px 14px; background:#fffdf6; border:1px solid #d6c8ab; border-left:5px solid var(--miss); border-radius:4px; box-shadow:0 8px 22px -16px rgba(60,40,20,.5); animation:rcSlip .32s cubic-bezier(.2,.8,.2,1); }
.rc-missnote.shaky { border-left-color:var(--shaky); }
.rc-missnote label { display:block; font-family:var(--display); font-size:20px; font-weight:600; color:var(--ink); margin-bottom:8px; }
.rc-missnote label small { display:block; font-family:var(--text); font-size:13px; font-weight:400; color:var(--ink-soft); margin-top:2px; }
.rc-missnote-g { display:inline-block; font-family:var(--text); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#fff; background:var(--miss); border-radius:2px; padding:2px 7px; margin-right:6px; vertical-align:3px; }
.rc-missnote.shaky .rc-missnote-g { background:var(--shaky); }
.rc-missnote textarea { width:100%; box-sizing:border-box; font-family:var(--text); font-size:15.5px; line-height:1.5; padding:10px 12px; border:1px solid var(--rule); border-radius:3px; background:repeating-linear-gradient(#fffdf6 0 25px, rgba(96,128,160,.18) 25px 26px); resize:vertical; }
.rc-missnote textarea:focus { outline:2px solid var(--brass); outline-offset:1px; }
.rc-missnote-tools { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; }
.rc-missnote-tools .rc-note { margin:0 0 0 auto; font-size:12.5px; }
@keyframes rcSlip { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
.rc-past { margin-top:14px; font-size:14px; }
.rc-past summary { cursor:pointer; color:#7a2e26; font-family:var(--text); list-style:none; display:inline-flex; align-items:center; gap:7px; padding:5px 10px 5px 8px; border:1px dashed #d7a79c; border-radius:3px; background:#fbf1ec; }
.rc-past summary::-webkit-details-marker { display:none; }
.rc-past summary::before { content:''; width:0; height:0; border-left:5px solid currentColor; border-top:4px solid transparent; border-bottom:4px solid transparent; transition:transform .2s; }
.rc-past[open] summary::before { transform:rotate(90deg); }
.rc-past summary b { font-weight:600; background:#7a2e26; color:#fff; border-radius:9px; font-size:11px; padding:0 6px; line-height:17px; }
.rc-past ul { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
.rc-past li { background:#fffdf6; border:1px solid #e3d6bb; border-radius:3px; padding:8px 12px; line-height:1.45; }
.rc-past-d { display:block; font-size:11.5px; color:var(--ink-faint); margin-bottom:2px; }
.rc-past-d.miss { color:var(--miss); } .rc-past-d.shaky { color:#8a6512; }
.rc-past.in-session { text-align:center; margin-top:18px; }
.rc-past.in-session ul { text-align:left; max-width:620px; margin-left:auto; margin-right:auto; }

/* ════ Builder ════ */
.rcb .lib-room { max-width:none; }
.rcb-claude { display:grid; grid-template-columns:1fr auto; gap:10px 18px; align-items:center; background:linear-gradient(180deg,#3d281d,#2b1b13); color:#efe3c8; border-radius:6px; padding:16px 20px; margin:6px 0 20px; box-shadow:0 14px 30px -22px rgba(30,15,5,.8); }
.rcb-claude-t { font-size:15px; line-height:1.5; max-width:70ch; }
.rcb-claude-t b { font-family:var(--display); font-size:19px; color:#f6e7c2; margin-right:4px; }
.rcb-claude-b { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; }
.rcb-claude .tg-btn { background:#f3ecdd; }
.rcb-claude .lib-link { color:#e9d6a8; }
.rcb-paste, .rcb-miss { grid-column:1/-1; }
.rcb-paste textarea { background:#fbf7ee; }
.rcb-miss { background:rgba(255,240,220,.08); border:1px solid rgba(233,214,168,.35); border-radius:4px; padding:10px 14px; font-size:14px; }
.rcb-miss ul { margin:6px 0; padding-left:18px; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; }
.rcb-grid { display:grid; grid-template-columns:minmax(200px,250px) minmax(0,1fr) minmax(300px,.9fr); gap:18px; align-items:start; }
.rcb-dir, .rcb-shelf, .rcb-set { position:sticky; top:12px; max-height:calc(100vh - 30px); overflow:auto; background:var(--card); border:1px solid var(--rule); border-radius:4px; }
.rcb-dir { padding:12px; }
.rcb-q { width:100%; box-sizing:border-box; font-family:var(--text); font-size:14px; padding:8px 10px; border:1px solid var(--rule); border-radius:3px; background:#fffdf6; }
.rcb-all { display:flex; justify-content:space-between; width:100%; margin-top:8px; border:none; background:none; text-align:left; font-family:var(--text); font-size:14px; color:var(--ink); padding:6px 8px; border-radius:4px; cursor:pointer; }
.rcb-all span { color:var(--brass); font-size:11px; }
.rcb-all:hover { background:var(--paper-2); }
.rcb-all.sel, .rcb-tree .lt-row.sel { background:rgba(184,141,63,.2); }
.rcb-tree .lt-row.sel .lt-name { font-weight:600; color:var(--ink); }
.rcb-shelf { padding:4px 14px 14px; }
.rcb-shelf-h { position:sticky; top:0; z-index:2; background:var(--card); font-family:var(--display); font-size:21px; font-weight:600; padding:10px 0 8px; border-bottom:1px solid var(--rule); margin-bottom:8px; }
.rcb-shelf-h small { font-family:var(--text); font-size:12.5px; font-weight:400; color:var(--ink-faint); margin-left:6px; }
.rcb-deck { border:1px solid #e1d4b9; border-left:4px solid var(--cloth); border-radius:3px; background:#fffdf6; margin-bottom:8px; }
.rcb-deck-h { display:flex; align-items:center; gap:8px; padding:4px 8px 4px 0; }
.rcb-deck-t { flex:1; min-width:0; border:none; background:none; text-align:left; cursor:pointer; padding:8px 10px; color:var(--ink); display:flex; flex-direction:column; }
.rcb-deck-t span { font-family:var(--display); font-size:17.5px; font-weight:600; line-height:1.2; }
.rcb-deck-t small { font-size:12px; color:var(--ink-faint); }
.tg-btn.sm { padding:5px 10px; font-size:12.5px; white-space:nowrap; }
.rcb-deck-cards { border-top:1px dashed #e1d4b9; padding:4px 6px 6px; }
.rcb-card { display:grid; grid-template-columns:30px 1fr; align-items:start; gap:6px; padding:3px 2px; border-radius:3px; }
.rcb-card:hover { background:rgba(184,141,63,.07); }
.rcb-card.on .rcb-cue { color:var(--ink-soft); }
.rcb-plus { width:26px; height:26px; margin-top:3px; border-radius:50%; border:1.5px solid var(--brass); background:#fffdf6; color:#7d5f1e; font-size:16px; line-height:1; cursor:pointer; transition:transform .15s, background .15s; }
.rcb-plus:hover { transform:scale(1.12); background:#f6e7c2; }
.rcb-card.on .rcb-plus { background:var(--brass); color:#fff; border-color:var(--brass); font-size:13px; }
.rcb-cue { border:none; background:none; text-align:left; cursor:pointer; font-family:var(--text); font-size:14.5px; line-height:1.4; color:var(--ink); padding:5px 4px; }
.rcb-cue small { display:block; font-size:11.5px; color:var(--ink-faint); }
.rcb-peek { grid-column:2; padding:2px 6px 8px; font-size:14px; }
.rcb-set { padding:0; border-color:#cdbd9c; background:#fbf7ee; box-shadow:0 16px 34px -26px rgba(60,40,20,.6); }
.rcb-set-in { display:flex; flex-direction:column; }
.rcb-set-top { padding:14px 16px 12px; border-bottom:2px solid var(--ink-red); background:#fffdf6; }
.rcb-set-top .rc-aname { margin:4px 0 10px; width:100%; box-sizing:border-box; font-size:21px !important; }
.rcb-list { list-style:none; margin:0; padding:8px 10px; display:flex; flex-direction:column; gap:5px; }
.rcb-item { display:grid; grid-template-columns:12px 24px 1fr auto; gap:6px; align-items:center; background:#fffdf6; border:1px solid #e1d4b9; border-left:4px solid var(--cloth); border-radius:3px; padding:6px 6px 6px 6px; cursor:grab; transition:box-shadow .15s, transform .15s; }
.rcb-item:hover { box-shadow:0 4px 12px -8px rgba(60,40,20,.5); }
.rcb-item.dragging { opacity:.45; }
.rcb-item.over-top { box-shadow:0 -3px 0 0 var(--brass); }
.rcb-item.over-bot { box-shadow:0 3px 0 0 var(--brass); }
.rcb-item.fresh { animation:rcbIn .5s cubic-bezier(.2,.8,.2,1); }
.rcb-item.past { opacity:.55; border-style:dashed; }
@keyframes rcbIn { 0% { transform:translateX(-18px) scale(.97); opacity:0; background:#f6e7c2; } 60% { background:#f6e7c2; } 100% { transform:none; opacity:1; } }
.rcb-grip { width:8px; height:16px; background-image:radial-gradient(circle, #b5a483 1.2px, transparent 1.5px); background-size:4px 4px; }
.rcb-n { font-family:var(--display); font-size:16px; color:var(--ink-faint); text-align:right; font-variant-numeric:tabular-nums; }
.rcb-t { font-size:14px; line-height:1.35; min-width:0; }
.rcb-t small { display:block; font-size:11.5px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rcb-acts { display:flex; gap:2px; opacity:.55; transition:opacity .15s; }
.rcb-item:hover .rcb-acts, .rcb-item:focus-within .rcb-acts { opacity:1; }
.rcb-acts button { width:26px; height:26px; border:none; background:none; border-radius:3px; cursor:pointer; color:var(--ink-soft); font-size:14px; }
.rcb-acts button:hover:not(:disabled) { background:var(--paper-2); color:var(--ink); }
.rcb-acts button:disabled { opacity:.3; cursor:default; }
.rcb-acts .x:hover { color:var(--miss) !important; }
.rcb-empty { padding:26px 18px; text-align:center; color:var(--ink-soft); font-size:14px; }
.rcb-empty-card { width:150px; height:92px; margin:0 auto 12px; border:1.5px dashed #c9b893; border-radius:4px; display:grid; place-items:center; font-family:var(--display); font-size:18px; color:var(--ink-faint); transform:rotate(-2deg); }
.rcb-foot { position:sticky; bottom:0; background:#fbf7ee; border-top:1px solid var(--rule); padding:12px 16px 14px; }
.rcb-tally { font-size:13.5px; color:var(--ink-soft); margin-bottom:8px; }
.rcb-tally b { font-family:var(--display); font-size:24px; color:var(--ink); margin-right:3px; }
.rcb-foot-tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rcb-foot .rc-err { margin:0 0 8px; }
@media (max-width: 1250px) {
  .rcb-grid { grid-template-columns:minmax(0,1fr) minmax(290px,.9fr); }
  .rcb-dir { grid-column:1; position:static; max-height:300px; }
  .rcb-shelf { grid-column:1; position:static; max-height:none; }
  .rcb-set { grid-column:2; grid-row:1 / span 2; }
}
@media (max-width: 760px) {
  .rcb-claude { grid-template-columns:1fr; }
  .rcb-claude-b { justify-content:flex-start; }
  .rcb-grid { grid-template-columns:1fr; }
  .rcb-set { grid-column:1; grid-row:auto; order:-1; position:static; max-height:none; }
  .rcb-dir { max-height:260px; }
  .rcb-acts { opacity:1; }
  .rc-missnote-tools .rc-note { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  .rcb-item.fresh, .rc-missnote { animation:none; }
}

.rc-grid + .rc-set-tools { margin-top:20px; }

/* ════ Formulas ════ */
.rc-tex .katex { font-size:1.08em; }
.rc-tex.blk { display:block; overflow-x:auto; overflow-y:hidden; padding:4px 0; }
.rc-ans li.blk { list-style:none; }
.rc-ans li.blk::before { display:none; }
.rc-cue .rc-tex .katex { font-size:1em; }
.rc-tex-raw { font-family:ui-monospace,Menlo,monospace; font-size:.9em; background:rgba(184,141,63,.12); padding:0 4px; border-radius:2px; }
.rc-warn { margin:10px 0; padding:10px 14px; background:#fbf1d9; border:1px solid #e2c98a; border-left:4px solid var(--brass); border-radius:3px; font-size:14px; color:var(--ink); }

/* ════ Reminders ════ */
.rc-remind { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft); margin:10px 0; cursor:pointer; }
.rc-remind.sm { font-size:12.5px; margin:10px 0 0; justify-content:flex-end; }
.rc-remind input { accent-color:var(--brass); width:16px; height:16px; }

/* ════ Resume banner ════ */
.rc-resume { display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:linear-gradient(180deg,#3d281d,#2b1b13); color:#efe3c8; border-radius:6px; padding:16px 20px; margin:0 0 22px; box-shadow:0 14px 30px -22px rgba(30,15,5,.8); animation:rcSlip .35s cubic-bezier(.2,.8,.2,1); }
.rc-resume-l { flex:1; min-width:220px; }
.rc-resume-k { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#d9b768; }
.rc-resume-t { font-family:var(--display); font-size:24px; font-weight:600; color:#f6e7c2; line-height:1.2; margin:2px 0 4px; }
.rc-resume-m { font-size:13.5px; color:#d8cbb0; }
.rc-resume-bar { height:5px; background:rgba(255,255,255,.12); border-radius:3px; margin-top:10px; overflow:hidden; max-width:420px; }
.rc-resume-bar i { display:block; height:100%; background:#d9b768; border-radius:3px; }
.rc-resume-r { display:flex; align-items:center; gap:14px; }
.rc-resume .rc-start { background:#f3e3bb; color:#2b1b13; }
.rc-resume .lib-link { color:#e9d6a8; }

/* ════ Session: menu, return, edit ════ */
.rc-s-menu { position:relative; margin-left:10px; }
.rc-s-dots { width:34px; height:34px; border-radius:50%; border:1px solid var(--rule); background:var(--card); font-size:18px; line-height:1; color:var(--ink-soft); cursor:pointer; }
.rc-s-dots:hover, .rc-s-dots[aria-expanded="true"] { background:var(--paper-2); color:var(--ink); }
.rc-s-pop { position:absolute; right:0; top:40px; z-index:20; display:flex; flex-direction:column; min-width:170px; background:#fffdf6; border:1px solid var(--rule); border-radius:4px; box-shadow:0 14px 30px -14px rgba(40,25,10,.45); padding:4px; animation:rcSlip .18s ease-out; }
.rc-s-pop button { border:none; background:none; text-align:left; padding:9px 12px; font-family:var(--text); font-size:14px; color:var(--ink); border-radius:3px; cursor:pointer; }
.rc-s-pop button:hover { background:var(--paper-2); }
.rc-s-pop button.danger { color:var(--miss); }
.rc-g.ret { background:#f6efe1; border-color:#c9b893; color:#6b4a2b; border-style:dashed; }
.rc-g.ret:hover { background:#efe3c8; }
.rc-capped { position:absolute; top:12px; right:14px; font-family:var(--text); font-size:11px; letter-spacing:.06em; color:#8a6512; background:#fbf1d9; border:1px solid #e2c98a; border-radius:2px; padding:2px 8px; }
.rc-front { position:relative; }
.rc-sedit { background:#fffdf6; border:1px solid var(--rule); border-radius:6px; padding:18px 20px; box-shadow:0 14px 30px -24px rgba(60,40,20,.5); }
.rc-sedit textarea { width:100%; box-sizing:border-box; font-family:var(--text); font-size:15.5px; line-height:1.5; padding:9px 11px; border:1px solid var(--rule); border-radius:3px; background:#fffdf6; margin-bottom:10px; resize:vertical; }

/* ════ Calendar ════ */
.rc-cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:6px; margin:8px 0 22px; }
.rc-cal-w { font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); text-align:center; padding:2px 0 4px; }
.rc-cal-d { position:relative; min-height:86px; display:flex; flex-direction:column; align-items:flex-start; gap:5px; padding:8px 9px; text-align:left; border:1px solid #e1d4b9; border-radius:4px; background:#fffdf6; cursor:pointer; font-family:var(--text); color:var(--ink); transition:transform .15s, box-shadow .15s, border-color .15s; }
.rc-cal-d:hover:not(.out) { transform:translateY(-2px); box-shadow:0 8px 16px -12px rgba(60,40,20,.5); }
.rc-cal-d.out { background:transparent; border-color:transparent; cursor:default; opacity:.35; }
.rc-cal-d.l1 { background:#fbf6ea; } .rc-cal-d.l2 { background:#f8eed8; } .rc-cal-d.l3 { background:#f4e3c0; } .rc-cal-d.l4 { background:#efd7a6; }
.rc-cal-d.today { border:2px solid var(--ink-red); }
.rc-cal-d.sel { outline:2px solid var(--brass); outline-offset:2px; }
.rc-cal-n { font-family:var(--display); font-size:18px; font-weight:600; line-height:1; }
.rc-cal-n small { font-family:var(--text); font-size:10.5px; font-weight:400; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-red); }
.rc-cal-dots { display:flex; gap:3px; align-items:center; }
.rc-cal-dots i { width:8px; height:8px; border-radius:50%; background:var(--cloth); box-shadow:0 0 0 1px rgba(255,255,255,.7); }
.rc-cal-dots b { font-size:10px; color:var(--ink-soft); }
.rc-cal-c { font-size:11.5px; color:var(--ink-soft); margin-top:auto; }
.rc-cal-over { position:absolute; top:7px; right:7px; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--miss); border-radius:2px; padding:1px 5px; }
.rc-cal-pane { background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:16px 20px 20px; animation:rcSlip .25s ease-out; }
.rc-cal-pane-h { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
.rc-cal-title { font-family:var(--display); font-size:28px; font-weight:600; margin:0; line-height:1.1; }
.rc-start small { opacity:.7; font-size:.8em; margin-left:6px; }

/* Tagging */
.tg-ptree { max-height:340px; overflow:auto; margin-top:6px; border-top:1px solid var(--rule); padding-top:6px; }
.tg-applyall { background:var(--ink) !important; color:#f6efe1 !important; border-color:var(--ink) !important; }
.tg-nomatch { color:#a5342b; }
@media (max-width: 760px) {
  .rc-cal { gap:3px; }
  .rc-cal-d { min-height:58px; padding:5px; gap:3px; }
  .rc-cal-n { font-size:14px; }
  .rc-cal-c { font-size:9.5px; }
  .rc-cal-dots i { width:6px; height:6px; }
  .rc-cal-over { display:none; }
  .rc-resume-r { width:100%; }
}
.rc-grades .rc-g.ret { grid-column:1 / -1; justify-self:center; min-height:0; padding:7px 22px; font-size:15px; }
.rc-grades .rc-g.ret span { font-size:15px; }
</style>
</head>

<script>
'use strict';

/* ── Constants ── */
const AR_DB          = '34887b1fd3af80e38845f69f23f784df';
const IP_DB_DEFAULT  = '34787b1fd3af800383d8c63ecdbbfd21';
const STRINGS_DB     = '35187b1fd3af80e885d2d747998ee41c';
const STAGES         = ['🌱 New','📅 Stage 1','📅 Stage 2','📅 Stage 3','📅 Stage 4','📅 Stage 5','🏆 Mastered'];

// Interval (in days) for the Next Review date after each grade. Indexed by the
// NEW stage (the one we're about to write). The Solid column is the "you just
// cleared this stage, here's the gap to the next test" interval. The Partial
// and Blank columns are uniformly "next day" — they're checkpoint signals that
// you need a quick re-test, not a re-test much later.
//
// New is a special seed stage. Solid always advances it out (so the Solid
// column here isn't used); Partial keeps the card at New and schedules
// tomorrow; Blank floors to Stage 1 (also tomorrow). The 'solid: null' here
// is a safety net only — in practice nextReviewDate is called with the new
// stage (post-promotion), not New, after a Solid grade.
const STAGE_INTERVALS = {
  '🌱 New':       { solid: null, partial: 1,   blank: 1   },
  '📅 Stage 1':   { solid: 1,    partial: 1,   blank: 1   },
  '📅 Stage 2':   { solid: 3,    partial: 1,   blank: 1   },
  '📅 Stage 3':   { solid: 7,    partial: 1,   blank: 1   },
  '📅 Stage 4':   { solid: 21,   partial: 1,   blank: 1   },
  '📅 Stage 5':   { solid: 60,   partial: 1,   blank: 1   },
  '🏆 Mastered':  { solid: null, partial: null, blank: null } // no Next Review
};

// Migration map: legacy stage names → current canonical names. Used when an
// existing card's stage is read from Notion and we need to compute next-stage
// against the new STAGES array. The card's Stage property gets rewritten to
// the new name as soon as it's graded.
const LEGACY_STAGE_MAP = {
  '📅 Day 1':  '📅 Stage 1',
  '📅 Day 3':  '📅 Stage 2',
  '📅 Day 7':  '📅 Stage 3',
  '📅 Day 21': '📅 Stage 4',
  '📅 Day 60': '📅 Stage 5'
};

// Normalize a stage value read from Notion: if it's a legacy name, map it to
// the canonical equivalent. Unknown names fall through unchanged.
function normalizeStage(stage){
  return LEGACY_STAGE_MAP[stage] || stage;
}

// Relation properties available as deck pivots on the review dashboard.
// `prop` is the AR DB property name (must match exactly, including emoji and trailing space).
// `label` is the user-facing button text.
// `icon` is the emoji rendered on the dashboard button.
const DECK_RELATIONS = [
  {prop:'String Name',          label:'Strings',            icon:'🔗'},
  {prop:'🖋️ Life Bank ',         label:'Life Bank',          icon:'🖋️'},
  {prop:'📕 Content Vault',      label:'Content Vault',      icon:'📕'},
  {prop:'🎥 Media Vault',        label:'Media Vault',        icon:'🎥'},
  {prop:'🌐 Knowledge Bank',     label:'Knowledge Bank',     icon:'🌐'},
  {prop:'🍏 Personal Education', label:'Personal Education', icon:'🍏'},
  {prop:'Projects',              label:'Projects',           icon:'📁'},
  {prop:'Objectives',            label:'Objectives',         icon:'🎯'},
  {prop:'🏢 Companies',          label:'Companies',          icon:'🏢'},
  {prop:'🛤️ Idea Streams',       label:'Idea Streams',       icon:'🛤️'},
  {prop:'The Network',           label:'The Network',        icon:'👥'}
];

/* ════════════════════════════════════════════════════════════════════════
 *  THREADS SYSTEM
 *  Threads & fragments live in the SAME Info Processing database as recall
 *  chunks. A fragment is one IP row; a thread is emergent (≥2 fragments
 *  connected via Connected Fragments). There is no thread container page.
 *
 *  A "Thread Queue" page (Type = Thread Queue) holds an entire thread's notes
 *  in Option-C pipe format, one fragment per block:
 *     <ID> | <idea text → Name> | Builds On: C1 | Connected to: C2,RC1 | Source: <DB> — <instance> | Relation: <DB> — <instance>
 *  The ID prefix (C/RC/RCQ/OL) determines Type and is the wiring handle for
 *  the self-relations; it is ephemeral and never written to Notion.
 * ════════════════════════════════════════════════════════════════════════ */

// Local fragment-ID prefix → Type select value. Order matters: check longer
// prefixes (RCQ, RC) before shorter (C) so "RCQ1" isn't read as a Core Idea.
const TYPE_PREFIXES = [
  {prefix:'RCQ', type:'Referential CQ'},
  {prefix:'RC',  type:'Referential C'},
  {prefix:'OL',  type:'Open Loop'},
  {prefix:'C',   type:'Core Idea'},
  {prefix:'P',   type:'Pattern'},
  {prefix:'S',   type:'Story'}
];
const FRAGMENT_TYPES = ['Core Idea','Pattern','Story','Referential C','Referential CQ','Open Loop'];
/* Types that carry a thread's main line (spine) rather than hanging off it. */
function isSpineType(t){ return t==='Core Idea' || t==='Pattern' || t==='Story'; }

function typeFromLocalId(localId){
  const up = (localId||'').trim().toUpperCase();
  for(const {prefix,type} of TYPE_PREFIXES){
    if(up.startsWith(prefix)) return type;
  }
  return 'Core Idea';
}
function typeCssClass(type){
  return type==='Core Idea' ? 'type-core'
       : type==='Pattern' ? 'type-pattern'
       : type==='Story' ? 'type-story'
       : type==='Referential C' ? 'type-rc'
       : type==='Referential CQ' ? 'type-rcq'
       : 'type-ol';
}

// Primary Source select value → { relProp: exact IP relation property name,
// dsId: target data source ID (for matching inherited relations by target),
// dbId: target DATABASE ID (what /databases/{id}/query actually needs — this
// differs from dsId for most capture DBs, so querying with dsId 404s) }.
// Names/IDs verbatim from live schemas. NOTE the trailing space in "🖋️ Life Bank ".
const PRIMARY_SOURCE_MAP = {
  'Life Bank':          {relProp:'🖋️ Life Bank ',       dsId:'8015c4ba-a9b3-4886-bbba-84dafaa73252', dbId:'1dd541258c574b55b21fd0d8b81391ce'},
  'Content Vault':      {relProp:'📕 Content Vault',      dsId:'3d8b799e-32bf-4fdb-88b3-f1568ed43420', dbId:'f0b5313cde5b4f26929fdaf853648754'},
  'Media Vault':        {relProp:'🎥 Media Vault',        dsId:'1eadd1fb-196c-4d44-b2d8-2e776705030c', dbId:'af148965bb3c41519a3cb6508c770c33'},
  'Personal Education': {relProp:'🍏 Personal Education',  dsId:'9588cf27-48b0-4218-b007-54056cbc7ddc', dbId:'472856662ac34a5ebec1851d6b4267bb'},
  'Idea Streams':       {relProp:'🛤️ Idea Streams',       dsId:'29887b1f-d3af-80d5-a8da-000bba705525', dbId:'29887b1fd3af805681dfe18f1c0e0589'},
  'The Network':        {relProp:'The Network',           dsId:'22887b1f-d3af-80d5-992f-000b34367d49', dbId:'22887b1fd3af80b6adf4dd0be0983d24'},
  'Events in Time':     {relProp:'Events in Time',        dsId:'2c187b1f-d3af-80b5-8a33-000b67d85dbe', dbId:'2c187b1fd3af805ea938f1d115dbd8f6'},
  'Companies':          {relProp:'🏢 Companies',          dsId:'25f87b1f-d3af-8096-80d3-000be5a97fe7', dbId:'25f87b1fd3af809abcd4f78b9c2736e4'},
  'Knowledge Bank':     {relProp:'🌐 Knowledge Bank',     dsId:'2c287b1f-d3af-8039-9625-000bbd2d7a54', dbId:'2c287b1fd3af80a9b13bc2ed2e0fc5a3'}
};
// Accept loose aliases users/Claude might type for the Source DB name.
const SOURCE_ALIASES = {
  'content vault':'Content Vault', 'content':'Content Vault', 'book':'Content Vault', 'books':'Content Vault',
  'media vault':'Media Vault', 'media':'Media Vault',
  'life bank':'Life Bank', 'personal education':'Personal Education', 'education':'Personal Education',
  'idea streams':'Idea Streams', 'ideas':'Idea Streams',
  'the network':'The Network', 'network':'The Network', 'people':'The Network',
  'events in time':'Events in Time', 'events':'Events in Time',
  'companies':'Companies', 'company':'Companies',
  'knowledge bank':'Knowledge Bank', 'knowledge':'Knowledge Bank', 'topics':'Knowledge Bank'
};
function canonicalSourceName(raw){
  const t = (raw||'').trim();
  if(PRIMARY_SOURCE_MAP[t]) return t;
  const a = SOURCE_ALIASES[t.toLowerCase()];
  return a || t;
}

const THREAD_QUEUE_TYPE = 'Thread Queue';
const ARCHIVED_TYPE = 'Archived';
const LAYOUT_TYPE = 'Layout';
const CROSS_THREAD_PROP = 'Cross Thread';
const IMAGE_PROPS = ['Image','Images'];   // Files & media property on IP — any fragment can carry photos/screenshots.   // self-relation on IP: links a fragment to fragments in OTHER threads without merging the threads (ignored by the component builder).       // single IP row (Type = Layout) whose body holds the cross-device layout blob (thread order, positions, chain orders, pins). The Visualizer skips it as a fragment.   // processed Thread Queue pages are retyped to this (soft-archive) instead of being trashed; the Visualizer skips them.

// Goals System databases — relation property name on Info Processing + target
// data source ID, verbatim from the live IP schema. These are the relations a
// Core Idea inherits from its source, and that propagate across connections.
const GOALS_DBS = {
  'Visions':               {relProp:'📽️ Visions',          dsId:'2da87b1f-d3af-801f-9739-000bc1a936e4', dbId:'2da87b1fd3af80ce8560ef1db940128d'},
  'Goals':                 {relProp:'⛰️ Goals',             dsId:'2da87b1f-d3af-8038-b37a-000b6a1df5d6', dbId:'2da87b1fd3af808d8041dd475d3e5fbe'},
  'Objectives':            {relProp:'Objectives',           dsId:'e081302f-f4d9-471b-a2d9-bcb69201171a', dbId:'80c38a257a054cbda761f36ebc1bab85'},
  'Projects':              {relProp:'Projects',             dsId:'545daad2-46f6-4cf0-80d3-dda07dc87019', dbId:'9081e8054b38473d99e59d831cb230ef'},
  'Habits':                {relProp:'Habits (Unified)',     dsId:'2b687b1f-d3af-800d-964d-000bdbe51ff2', dbId:'2b687b1fd3af8088b6ddc163e142450e'},
  'High Leverage Systems': {relProp:'High Leverage Systems',dsId:'2c287b1f-d3af-801b-be5a-000b261e69ee', dbId:'2c287b1fd3af80b59673ef91ad2de404'}
};

// Unified registry of every database a relation can point at, for the in-editor
// search picker. Each entry: {name, kind, relProp, dsId}. `kind` drives the
// colored tag and the goals-inheritance rule.
const REL_DB_REGISTRY = (function(){
  const out = [];
  for(const [name, m] of Object.entries(PRIMARY_SOURCE_MAP)){
    out.push({name, kind:'capture', relProp:m.relProp, dsId:m.dsId, dbId:m.dbId});
  }
  for(const [name, m] of Object.entries(GOALS_DBS)){
    out.push({name, kind:'goals', relProp:m.relProp, dsId:m.dsId, dbId:m.dbId});
  }
  return out;
})();
function relDbByName(name){ return REL_DB_REGISTRY.find(d=>d.name===name); }
function relDbByProp(prop){ return REL_DB_REGISTRY.find(d=>d.relProp===prop); }
function relDbByDsId(dsId){ const f=fmtId(dsId); return REL_DB_REGISTRY.find(d=>fmtId(d.dsId)===f); }

/* ── State ── */
let currentTab = 'recall';
let creds = {proxyUrl:'', notionToken:'', ipDbId:'', notionVersion:'2022-06-28', aiUrl:'', aiKey:'', aiModel:''};
let diagSt = null; // null | 'running' | [{label,status,detail}]

// Create-tab state
let cs = {
  queueSt:        null,
  queueMsg:       '',
  queue:          [],
  queueIdx:       -1,
  page:           null,
  fetchSt:        null,
  fetchMsg:       '',
  // strings: [{name: 'String Name', cards: [{name,question,hints[],scope,stringNumber?}, ...]}, ...]
  // Each toggle on the IP page becomes one string. Cards inside a string are
  // separated by --- divider blocks. A page with no toggles gets a single
  // unnamed string with one blank card so the UI still renders an editor.
  strings:        [],
  parsedFromPage: false,
  pushSt:         null,
  pushMsg:        '',
  created:        [],
  inspectSt:      null,   // null | 'loading' | [{type,text,children:[{type,text}]}]
  relPick:        null,   // null | {si, ci, cat, db, q, results, searchSt, msg, scope:'card'|'all', busy} — the open "add relation" picker on a card
  relTitlesSt:    null,   // null | 'loading' | 'ok' — resolving titles for the source page's relations
};
// Registry relations (capture / goals / Knowledge Bank) of the source page,
// keyed by relation property name → [pageId,…]. Seeds every card's `rels`.
function _createPageRels(){
  const out={}; const rels=(cs.page&&cs.page.relations)||{};
  for(const d of REL_DB_REGISTRY){ const arr=rels[d.relProp]; if(arr&&arr.length) out[d.relProp]=arr.map(r=>r.id); }
  return out;
}
function _cloneRels(r){ const o={}; for(const k of Object.keys(r||{})) o[k]=(r[k]||[]).slice(); return o; }
function _newCard(){ return {name:'',question:'',hints:[''],scope:'', rels:_cloneRels(_createPageRels())}; }
async function _createResolveRelTitles(){
  const ids=[]; Object.values(_createPageRels()).forEach(a=>a.forEach(x=>ids.push(x)));
  cs.relTitlesSt='loading';
  await mapPool(ids, async x=>{ try{ await fetchPageTitle(x); }catch(e){} }, 6);
  cs.relTitlesSt='ok'; render();
}

// Review-tab state
let rs = {
  phase:         'idle',         // idle | picker | date | loading | preview | editString | loaded | stringReview | error
  // Active deck spec — what loadDeck() will fetch:
  //   {type:'due'}                                            → all due-today cards
  //   {type:'relation', relProp, relPageId, relPageTitle}     → cards linked to a specific page
  //   {type:'time',     dateFrom, dateTo}                     → cards by Created time range
  deckSpec:      null,
  // Picker sub-state (active when phase==='picker')
  pickerProp:    '',             // AR property name being picked from (e.g. "Projects")
  pickerLabel:   '',             // human label for that property
  pickerSt:      null,           // null | 'loading' | 'ok' | 'error'
  pickerOptions: [],             // [{id,title,count}, ...]
  pickerSearch:  '',
  pickerErr:     '',
  // Date-range sub-state (active when phase==='date')
  dateFrom:      '',
  dateTo:        '',
  // Preview sub-state (active when phase==='preview')
  // Each item is either {type:'string', stringId, stringTitle, cards:[...]}
  // or {type:'solo', card}. User can reorder (whole strings move together)
  // and remove items before starting the review.
  previewItems:  [],
  dragIdx:       -1,             // index of the row currently being dragged, or -1
  moveIdx:       -1,             // index of the row selected for tap-to-move, or -1
  // Edit-string sub-state (active when phase==='editString')
  // Lets user edit existing string members and add new ones, with full
  // relation inheritance from existing members.
  // Shape:
  //   {
  //     stringPreviewIdx,    // index in previewItems of the string being edited
  //     stringId, stringTitle,
  //     existingCards: [{id, name, question, scope, hints[], stringNumber,
  //                      // dirty flags computed at save time vs. originals:
  //                      origName, origQuestion, origScope, origHints,
  //                      questionBlockId, scopeBlockId, hintsToggleId}],
  //     newCards:    [{name, question, scope, hints[], insertAt}],
  //     donorRelations: {propName:[{id}]} | null,  // inherited at open-time
  //     loadSt: 'loading'|'ok'|'error', loadErr: '',
  //     saveSt: null|'saving'|'ok'|'error', saveErr: '',
  //     saveResults: [{label, ok, err?}]
  //   }
  editString:    null,
  // String-buffer (active during phase==='loaded' for string cards)
  // Buffers per-card grades within the current string. While these grades are
  // recorded for display on the string-review screen, they do NOT write to
  // Notion individually — only the string-level grade does. Solo cards bypass
  // the buffer entirely and write through immediately.
  // Shape: {stringId, items: [{cardIdx, score}], openScopes: Set<cardIdx>}
  stringBuffer:  null,
  // Inline edit state for the question or scope of the active card.
  // Null when no edit is in progress. Shape:
  //   {field:'question'|'scope', cardIdx, blockId, value, saveSt, saveErr}
  // saveSt: null | 'loading' | 'error'
  editing:       null,
  // Active session (phase==='loaded' or 'stringReview')
  cards:         [],
  idx:           0,
  revealed:      false,
  showHints:     false,
  saveSt:        null,
  saveErr:       '',
  results:       [],
  done:          false,
  errMsg:        '',
  // Go-back support: `frontier` is the index of the first card not yet graded
  // (the normal playing position); `graded` remembers each card's grade and
  // `stringScores` each committed string's grade so a revisited card can be
  // re-graded and written back consistently.
  frontier:      null,
  graded:        {},
  stringScores:  {}
};
function _rvFrontier(){ return (rs.frontier==null) ? rs.idx : rs.frontier; }
function _rvViewingDone(){ return rs.idx < _rvFrontier(); }

// Upcoming-tab state — the projected review calendar
let us = {
  phase:       'idle',         // idle | loading | loaded | error
  range:       '30d',          // '30d' | '90d' | 'all' — how far ahead to project
  monthOffset: 0,              // 0 = current month, -1/+1 = neighbors
  selectedDay: null,           // ISO date string currently expanded below grid, or null
  entries:     [],             // [{date, cardId, cardName, stringId, stringName, fromStage, toStage, url, stringNumber}]
  errMsg:      ''
};

// Thread-Queue tab state — parse Thread Queue pages into fragments, review,
// then two-pass create into Info Processing.
let ts = {
  queueSt:   null,    // null | 'loading' | 'ok' | 'error'
  queueMsg:  '',
  queue:     [],      // [{id, title, url, method, primarySource, done}]
  queueIdx:  -1,
  // Loaded thread (current queue page parsed)
  loadSt:    null,    // null | 'loading' | 'ok' | 'error'
  loadMsg:   '',
  pageId:    null,
  threadName:'',
  method:    'Upfront',          // 'Upfront' | 'Retroactive' (page-level, editable)
  // fragments: parsed + editable. Each:
  //   {localId, type, title, buildsOn:[localId], connected:[localId],
  //    source:{db, instance, relProp, dsId, status, matchId, matchTitle, options:[], picking:bool} | null,
  //    relation: {…same shape…} | null,   // OL's own primary-source relation
  //    excluded:bool}
  fragments: [],
  kbTopics:  [],      // suggested Knowledge Bank topics (editable)
  kbNewTopic:'',      // input buffer for adding a topic
  kbApplySt: null,    // null | 'loading' | 'done' | 'error'
  kbApplyMsg:'',
  kbTargetMode:'all', // 'all' | 'selected' — which fragments KB topics apply to
  kbTargets: null,    // Set of selected fragment indices when mode==='selected'
  kbSel:     null,    // Set of selected topic strings to apply (null = all selected)
  bulk:      null,    // bulk relation-assignment widget state (lazily created)
  threadNames: {},    // editor-only: stable-component-key → custom thread name (typed before create; written onto the anchor fragment at creation). Default (empty) = anchor title.
  showPreview: false, // map-preview toggle in the editor (local topology preview)
  parseWarnings: [],
  // Source-page relation cache for inheritance preview: dsId+instanceId → {relations}

/* ── Helpers ── */
const today    = () => new Date().toISOString().split('T')[0];
const addDaysToDate = (isoDate, n) => {
  const d = new Date(isoDate+'T12:00:00');  // noon to dodge DST edge cases
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
};
const addDays  = n => { const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString().split('T')[0]; };
const esc      = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fmtId(id){
  id = (id||'').replace(/-/g,'');
  if(id.length !== 32) return id;
  return id.replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/,'$1-$2-$3-$4-$5');
}
function getIpDb(){ return creds.ipDbId || IP_DB_DEFAULT; }

function nextStage(cur, score){
  // Normalize legacy stage names from older cards so the index lookup works.
  const norm = normalizeStage(cur);
  const i = STAGES.indexOf(norm);
  if(i<0) return STAGES[1];                                        // unknown stage → fall through to Stage 1
  if(score==='🟢 Solid')  return STAGES[Math.min(i+1, STAGES.length-1)];
  if(score==='🟡 Partial') return norm;                            // stay put (but rewrite legacy name)
  return STAGES[Math.max(i-1,1)];                                  // 🔴 Blank: drop one, floored at Stage 1
}

// Compute the next-review date based on the NEW stage AND the grade given.
// Solid uses the stage's full interval; Partial and Blank always go to tomorrow
// so you get a quick re-test without losing your stage. The Solid interval for
// Stage 1 is 1 day too — a Solid on a brand new card surfaces it again tomorrow.
function nextReviewDate(newStage, score){
  if(newStage === '🏆 Mastered') return null;
  const row = STAGE_INTERVALS[newStage];
  if(!row) return null;
  const days = score === '🟢 Solid'  ? row.solid
             : score === '🟡 Partial' ? row.partial
             :                          row.blank;
  if(days == null) return null;
  return addDays(days);
}

/* ── Recently-used filters cache (persisted) ──
 * Every filter combination that actually narrows the Visualizer (facet value,
 * search text, open/resolved, vetted) is remembered so it can be re-applied
 * with one pick from the "Recent filters" dropdown in the toolbar. Keyed by a
 * canonical string of the filter fields; newest first; capped. */
const RECENT_FILTERS_KEY = 'rs_viz_recent_filters';
const RECENT_FILTERS_MAX = 10;
const RECENT_FILTER_FIELDS = ['fOpen','fVetted','fFacet','fValue','fValues','fSourceDb','fGoalLevel','fGoalItemId','fGoalItemLabel','fGoalMode','fSearch'];
let _recentFilterTimer = null;
function loadRecentFilters(){ try{ vs.recentFilters = JSON.parse(localStorage.getItem(RECENT_FILTERS_KEY)||'[]') || []; }catch(e){ vs.recentFilters=[]; } }
function saveRecentFilters(){ try{ localStorage.setItem(RECENT_FILTERS_KEY, JSON.stringify(vs.recentFilters||[])); }catch(e){} }
function _filterSnap(){
  const snap={}; RECENT_FILTER_FIELDS.forEach(k=>{ snap[k]=Array.isArray(vs[k])? vs[k].slice() : (vs[k]==null?'':vs[k]); });
  snap.fSearch=(snap.fSearch||'').trim();
  return snap;
}
function _filterKey(snap){
  const f = {...snap}; f.fValues=(f.fValues||[]).slice().sort();
  if(f.fFacet!=='goal'){ f.fGoalLevel=''; f.fGoalItemId=''; f.fGoalItemLabel=''; f.fGoalMode='any'; }
  if(f.fFacet!=='source'){ f.fSourceDb=''; }
  if(f.fFacet!=='kb'){ f.fValues=[]; }
  if(f.fFacet!=='source'){ f.fValue=''; }
  return JSON.stringify(RECENT_FILTER_FIELDS.map(k=>f[k]));
}
function _filterLabel(snap){
  const parts=[];
  if(snap.fFacet==='goal' && snap.fGoalItemLabel) parts.push((snap.fGoalLevel? snap.fGoalLevel+': ':'')+snap.fGoalItemLabel+(snap.fGoalMode==='down'?' ↓':''));
  else if(snap.fFacet==='goal' && snap.fGoalLevel) parts.push('Goals: '+snap.fGoalLevel);
  if(snap.fFacet==='kb' && (snap.fValues||[]).length) parts.push('KB: '+snap.fValues.join(', '));
  if(snap.fFacet==='source' && snap.fSourceDb) parts.push(snap.fSourceDb+(snap.fValue? ' — '+snap.fValue:''));
  if(snap.fSearch) parts.push('"'+snap.fSearch+'"');
  if(snap.fOpen!=='open') parts.push(snap.fOpen==='all'?'All':'Resolved');
  if(snap.fVetted!=='all') parts.push(snap.fVetted==='vetted'?'Vetted':'Unvetted');
  return parts.join(' · ').slice(0,120);
}
// Called from renderVisualize whenever a narrowing filter is active. Debounced
// so a search string is recorded once it settles rather than per keystroke.
function vizNoteRecentFilter(){
  clearTimeout(_recentFilterTimer);
  _recentFilterTimer = setTimeout(()=>{
    const snap=_filterSnap();
    const narrowing = vizFacetArmed() || (snap.fSearch.length>=2) || snap.fOpen!=='open' || snap.fVetted!=='all';
    if(!narrowing) return;
    if(snap.fFacet==='source' && !snap.fSourceDb) return;      // half-configured facet
    const key=_filterKey(snap), label=_filterLabel(snap);
    if(!label) return;
    vs.recentFilters=(vs.recentFilters||[]).filter(r=>r.key!==key);
    vs.recentFilters.unshift({key, label, ts:Date.now(), snap});
    vs.recentFilters=vs.recentFilters.slice(0, RECENT_FILTERS_MAX);
    saveRecentFilters();
    const sel=document.getElementById('viz-recent-filters'); if(sel) sel.innerHTML=_recentFiltersOptions();   // refresh in place, no full re-render
  }, 1200);
}
function _recentFiltersOptions(){
  const rf=vs.recentFilters||[];
  return `<option value="">↺ Recent filters${rf.length?' ('+rf.length+')':''}</option>`+rf.map(r=>`<option value="${esc(r.key)}">${esc(r.label)}</option>`).join('')+(rf.length?`<option value="__clear">— clear recent filters —</option>`:'');
}
async function vizApplyRecentFilter(key){
  if(!key) return;
  if(key==='__clear'){ vs.recentFilters=[]; saveRecentFilters(); render(); return; }
  const r=(vs.recentFilters||[]).find(x=>x.key===key); if(!r) return;

}
