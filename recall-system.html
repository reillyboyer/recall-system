/* ── HTTP layer ── */
function base(){ if(!creds.proxyUrl) throw new Error('Proxy URL not set — open Settings.'); return creds.proxyUrl.replace(/\/+$/,'')+'/v1'; }

async function nReq(method, path, body){
  const url = base()+path;
  const opts = {method, headers:{
    'Authorization': 'Bearer '+creds.notionToken,
    'Notion-Version': creds.notionVersion || '2022-06-28'
  }};
  if(body){ opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  try{
    const r = await fetch(url, opts);
    const text = await r.text();
    let parsed = null; try{ parsed=JSON.parse(text); }catch(e){}
    return {ok:r.ok, status:r.status, text, parsed, url, networkError:false};
  }catch(e){
    return {ok:false, status:0, text:'', parsed:null, url, networkError:true, errName:e.name, errMsg:e.message};
  }
}
async function nGet(path){
  const r = await nReq('GET',path);
  if(!r.ok) throw new Error(r.networkError ? `NETWORK ${r.errName}: ${r.errMsg}` : `Notion ${r.status}: ${r.text.slice(0,400)}`);
  return r.parsed;
}
async function nPost(path,body){
  const r = await nReq('POST',path,body);
  if(!r.ok) throw new Error(r.networkError ? `NETWORK ${r.errName}: ${r.errMsg}` : `Notion ${r.status}: ${r.text.slice(0,400)}`);
  return r.parsed;
}
async function nPatch(path,body){
  const r = await nReq('PATCH',path,body);
  if(!r.ok) throw new Error(r.networkError ? `NETWORK ${r.errName}: ${r.errMsg}` : `Notion ${r.status}: ${r.text.slice(0,400)}`);
  return r.parsed;
}
// Multipart POST (Notion "Send a file upload"). No Content-Type header — the
// browser sets multipart/form-data with the boundary. The proxy must forward
// the body untouched for this to work.
async function nUpload(path, formData){
  const r = await fetch(base()+path, {method:'POST', headers:{'Authorization':'Bearer '+creds.notionToken,'Notion-Version':creds.notionVersion||'2022-06-28'}, body:formData});
  const text = await r.text(); let parsed=null; try{ parsed=JSON.parse(text); }catch(e){}
  if(!r.ok) throw new Error(`Notion ${r.status}: ${text.slice(0,400)}`);
  return parsed;
}
async function nDelete(path){
  const r = await nReq('DELETE',path);
  if(!r.ok) throw new Error(r.networkError ? `NETWORK ${r.errName}: ${r.errMsg}` : `Notion ${r.status}: ${r.text.slice(0,400)}`);
  return r.parsed;
}

/* Archive a Notion page (recoverable from trash for 30 days). */
async function nArchivePage(pageId){
  return await nPatch('/pages/'+fmtId(pageId), {archived: true});
}

/* ── Concurrency helper ── */
/**
 * Run `fn` over `items` with bounded concurrency. Returns an array of results
 * in input order. Errors per-item are caught and stored as the result, so the
 * whole batch never fails — caller is responsible for inspecting results.
 *
 * Why bounded concurrency: Notion's rate limit is ~3 req/s averaged. A handful
 * of in-flight requests is fine; firing 50 parallel `Promise.all` calls would
 * trip throttling and cause retries, which is worse than waiting our turn.
 */
async function mapPool(items, fn, concurrency = 5){
  const results = new Array(items.length);
  let nextIdx = 0;
  async function worker(){
    while(true){
      const myIdx = nextIdx++;
      if(myIdx >= items.length) return;
      try{
        results[myIdx] = await fn(items[myIdx], myIdx);
      }catch(e){
        results[myIdx] = {__err: e};
      }
    }
  }
  const workers = [];
  const n = Math.max(1, Math.min(concurrency, items.length));
  for(let i=0; i<n; i++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

/* ── In-memory page-title cache ──
 * Page titles for relation pages (Strings, Projects, IP pages, etc.) rarely
 * change during a session. Caching by page ID lets repeated deck loads,
 * picker opens, and resume validation reuse titles instead of re-fetching.
 * The cache lives in module scope, so a tab reload starts fresh — that's
 * the right tradeoff: stale-title risk is bounded by how long you keep the
 * tab open, and a reload is the obvious manual refresh action.
 */
const titleCache = new Map();   // pageId -> title (string)

async function fetchPageTitle(pageId){
  const id = fmtId(pageId);
  if(titleCache.has(id)) return titleCache.get(id);
  try{
    const pg    = await nGet('/pages/'+id);
    const title = extractTitle(pg.properties) || '(Untitled)';
    titleCache.set(id, title);
    return title;
  }catch(e){
    return '(Unknown)';
  }
}

/* ── Notion helpers ── */
function extractTitle(properties){
  if(!properties) return '';
  const tp = properties.Name || properties.name || properties.title || properties.Title;
  if(tp && tp.title) return (tp.title||[]).map(t=>t.plain_text).join('');
  // fallback: find any title-type property
  for(const p of Object.values(properties)){
    if(p.type==='title') return (p.title||[]).map(t=>t.plain_text).join('');
  }
  return '';
}

/* ── Fetch IP page (properties + all relation data) ──
 * Uses the inline relation array from GET /pages/{id} as the primary source.
 * Notion returns up to 25 related-page IDs inline, which covers virtually all
 * IP pages. Only when an inline array is truncated (has_more=true) do we fall
 * back to the property-item endpoint to fetch the full paginated list.
 *
 * Why this matters: the property-item endpoint requires URL-encoding the
 * property ID, and for properties with non-ASCII names (emoji-prefixed ones
 * in this workspace) the encoding can intermittently break. Previously, any
 * such failure was silently swallowed and the relation just disappeared from
 * the inheritance set. Now we use inline data we already have, fall back to
 * inline on error, and surface failures in relDebug.
 */
async function fetchPage(pageId){
  const fid = fmtId(pageId);
  const pr  = await nGet('/pages/'+fid);
  const title = extractTitle(pr.properties);

  // Collect ALL property names and types for the debug panel
  const allProps = {};
  for(const [key,prop] of Object.entries(pr.properties||{})){
    allProps[key] = prop.type;
  }

  const relations = {};  // {propName: [{id},...]}  — non-empty only, used for inheritance
  const relDebug  = {};  // all relation props, for the debug panel

  const relProps = Object.entries(pr.properties||{}).filter(([,p])=>p.type==='relation');

  for(const [key, prop] of relProps){
    // Step 1: read the inline relation array — Notion returns up to 25 here
    const inline = Array.isArray(prop.relation) ? prop.relation : [];
    let ids = inline.map(r => ({id: r.id})).filter(r => r.id);
    const truncated = !!prop.has_more;
    let fetchError = null;

    // Step 2: only paginate via the property endpoint if inline was truncated
    if(truncated){
      const propId = prop.id;
      const fullIds = [];
      try{
        let cursor = null;
        let hasMore = false;
        do {
          const qs  = cursor
            ? `?page_size=100&start_cursor=${encodeURIComponent(cursor)}`
            : '?page_size=100';
          const res = await nGet(
            `/pages/${fid}/properties/${encodeURIComponent(propId)}${qs}`
          );
          if(res.object === 'list'){
            for(const item of (res.results||[])){
              if(item.type === 'relation' && item.relation?.id){
                fullIds.push({id: item.relation.id});
              }
            }
            hasMore = res.has_more || false;
            cursor  = res.next_cursor || null;
          } else if(res.type === 'relation' && res.relation?.id){
            fullIds.push({id: res.relation.id});
            break;
          } else {
            break;
          }
        } while(hasMore && cursor);
        // Pagination succeeded — use the full list
        ids = fullIds;
      }catch(e){
        // Pagination failed — keep the inline data we already had so we don't
        // silently lose relations. Surface the error in the debug panel.
        fetchError = e.message;
        // (ids already holds the inline array from above)
      }
    }

    relDebug[key] = {ids, count: ids.length, truncated, err: fetchError};
    if(ids.length > 0) relations[key] = ids;
  }

  return {pageId, title, url: pr.url, relations, relDebug, allProps};
}

/* ── Parse string toggles from IP page blocks ──
 * New format:
 *   ▶ [string name]                  (toggle block — its label is the string name)
 *      ### Name                      (heading_3 section labels)
 *      [name content]                (paragraph/list block — section content)
 *      ### Question
 *      [question content]
 *      ### Scope Documentation
 *      [scope content]
 *      ### Hints
 *      [hint lines, one block each]
 *      ---                           (divider — separates cards within the string)
 *      ### Name
 *      [next card content...]
 *
 * Returns: [{name:'string label', cards:[{name,question,hints,scope,stringNumber}]}, ...]
 *
 * Toggles with no parseable cards are skipped. If no toggles are found at all,
 * returns an empty array — the caller handles that fallback.
 */
async function parseStringsFromBlocks(pageId){
  const strings = [];
  try{
    const blocksRes = await nGet('/blocks/'+fmtId(pageId)+'/children?page_size=100');
    const blocks = blocksRes.results || [];

    for(const block of blocks){
      if(block.type !== 'toggle') continue;
      const stringName = ((block.toggle?.rich_text)||[]).map(t=>t.plain_text).join('').trim();
      if(!stringName) continue;

      // Fetch children of this string toggle
      let children = [];
      try{
        const childRes = await nGet('/blocks/'+block.id+'/children?page_size=100');
        children = childRes.results || [];
      }catch(e){ continue; }

      // Split children into card-groups at each divider block.
      // The first group starts at the toggle's first child; each subsequent
      // divider closes the current group and opens a new one.
      const groups = [[]];
      for(const child of children){
        if(child.type === 'divider'){
          groups.push([]);
        } else {
          groups[groups.length-1].push(child);
        }
      }

      const cards = [];
      groups.forEach((group, idx) => {
        const card = parseCardFromBlocks(group);
        // Skip empty groups (e.g., trailing divider, or content-free section)
        if(!card.name && !card.question && !card.scope && card.hints.length === 0) return;
        if(card.hints.length === 0) card.hints = [''];
        // stringNumber = position within the string (1-indexed) by default;
        // overridden if the user wrote a custom name in the Name section.
        card.stringNumber = idx + 1;
        cards.push(card);
      });

      if(cards.length > 0){
        strings.push({name: stringName, cards});
      }
    }
  }catch(e){
    console.warn('parseStringsFromBlocks failed:', e.message);
  }
  return strings;
}

/* Parse a single card from a flat list of blocks (one card-group inside a toggle).
 * Walks the blocks in order, switching sections at each heading_3, accumulating
 * content from paragraph/list blocks into the current section. */
function parseCardFromBlocks(group){
  const card = {name:'', question:'', hints:[], scope:''};
  let section = null;
  for(const child of group){
    const ct   = child.type;
    const rtxt = ((child[ct]?.rich_text)||[]).map(t=>t.plain_text).join('').trim();

    if(ct === 'heading_3'){
      section = rtxt.toLowerCase();
      continue;
    }
    if(!section || !rtxt) continue;

    if(/^name$/.test(section)){
      card.name = card.name ? card.name+'\n'+rtxt : rtxt;
    } else if(/^question$/.test(section)){
      card.question = card.question ? card.question+'\n'+rtxt : rtxt;
    } else if(/^hint/.test(section)){
      card.hints.push(rtxt);
    } else if(/^scope/.test(section)){
      card.scope = card.scope ? card.scope+'\n'+rtxt : rtxt;
    }
  }
  return card;
}

/* ── Block inspector — shows the raw 2-level block tree for debugging ── */
async function doInspectBlocks(){
  if(!cs.page) return;
  cs.inspectSt = 'loading'; render();
  try{
    const res = await nGet('/blocks/'+fmtId(cs.page.pageId)+'/children?page_size=100');
    const blocks = res.results || [];
    const tree = [];

    for(const b of blocks){
      const bt   = b.type;
      // Extract rich_text from whatever type key holds it
      const data = b[bt] || {};
      const rt   = data.rich_text || data.title || [];
      const text = rt.map(t=>t.plain_text).join('') || '';
      const isToggleable = data.is_toggleable || false;

      const node = {
        type: bt,
        text,
        isToggleable,
        hasChildren: b.has_children,
        id: b.id,
        children: []
      };

      // Fetch one level of children for any block that has them
      if(b.has_children){
        try{
          const cr = await nGet('/blocks/'+b.id+'/children?page_size=50');
          node.children = (cr.results||[]).map(c=>{
            const cd   = c[c.type] || {};
            const crt  = cd.rich_text || cd.title || [];
            return {
              type: c.type,
              text: crt.map(t=>t.plain_text).join('') || '',
              isToggleable: cd.is_toggleable || false,
              hasChildren: c.has_children,
              id: c.id
            };
          });
        }catch(e){
          node.children = [{type:'ERROR', text:e.message}];
        }
      }
      tree.push(node);
    }
    cs.inspectSt = tree;
  }catch(e){
    cs.inspectSt = [{type:'ERROR', text:e.message}];
  }
  render();
}
async function doLoadQueue(){
  cs = {...cs,
    queueSt:'loading', queueMsg:'', queue:[], queueIdx:-1,
    page:null, fetchSt:null, fetchMsg:'', strings:[], pushSt:null, created:[]
  };
  render();
  try{
    const rawId = getIpDb();
    const dbId  = fmtId(rawId);

    // Step 1: Verify the database is reachable with a GET (no filter, no body)
    const dbCheck = await nReq('GET', '/databases/'+dbId);
    if(!dbCheck.ok){
      // Maybe it's a page ID not a database ID
      const pageCheck = await nReq('GET', '/pages/'+dbId);
      if(pageCheck.ok){
        throw new Error(
          `The ID ${dbId} resolves to a PAGE in Notion, not a database. `+
          `You need the ID of the Info Processing DATABASE itself. `+
          `Open Info Processing in Notion, click ••• → Open as full page, and copy the URL. `+
          `Then paste it in Settings → Info Processing Database ID.`
        );
      }
      const raw = dbCheck.parsed || {};
      const code = raw.code || '';
      if(code === 'object_not_found'){
        throw new Error(`Database ${dbId} not found. The ID may be wrong — run Diagnostics in Settings to search for accessible databases.`);
      }
      if(dbCheck.status === 401 || code === 'unauthorized'){
        throw new Error(`Unauthorized. Check your Notion token in Settings.`);
      }
      throw new Error(`Cannot access database: ${dbCheck.status} ${code || dbCheck.text.slice(0,200)}`);
    }

    // Step 2: Database is accessible — try query with Status filter
    let data;
    let filterErr = null;

    // Try Notion native Status type
    try{
      data = await nPost('/databases/'+dbId+'/query',{
        filter: {property:'Status', status:{equals:'Card Gen Ready'}},
        sorts:  [{timestamp:'created_time', direction:'ascending'}],
        page_size: 50
      });
    }catch(e1){
      filterErr = e1.message;
      // Try legacy Select type
      try{
        data = await nPost('/databases/'+dbId+'/query',{
          filter: {property:'Status', select:{equals:'Card Gen Ready'}},
          sorts:  [{timestamp:'created_time', direction:'ascending'}],
          page_size: 50
        });
        filterErr = null;
      }catch(e2){
        // Both filter types failed — try with NO filter to confirm basic query works
        try{
          const raw = await nPost('/databases/'+dbId+'/query',{page_size:1});
          // Query works but filters fail — property name must be different
          const dbMeta = dbCheck.parsed;
          const propNames = Object.keys(dbMeta?.properties||{}).join(', ');
          throw new Error(
            `Database is accessible, but the "Status" filter failed. `+
            `Available properties: ${propNames||'(none found)'}. `+
            `Check that your Info Processing database has a property named exactly "Status".`
          );
        }catch(e3){
          if(/Status/.test(e3.message)) throw e3;
          throw new Error(`Database query failed: ${e2.message}`);
        }
      }
    }

    const queue = (data.results||[]).map(p=>({
      id:    p.id,
      title: extractTitle(p.properties) || p.id,
      url:   p.url,
      done:  false
    }));
    cs.queue = queue;
    cs.queueSt = 'ok';
    if(queue.length > 0) await doLoadQueuePage(0);
  }catch(e){
    cs.queueSt = 'error';
    const usedId = fmtId(getIpDb());
    cs.queueMsg = `${e.message||'Failed'} (DB: ${usedId})`;
  }
  render();
}

async function doLoadQueuePage(idx){
  if(idx < 0 || idx >= cs.queue.length) return;
  cs.queueIdx      = idx;
  cs.page          = null;
  cs.fetchSt       = 'loading';
  cs.fetchMsg      = '';
  cs.strings       = [];
  cs.parsedFromPage= false;
  cs.pushSt        = null;
  cs.created       = [];
  cs.inspectSt     = null;
  render();
  try{
    const item = cs.queue[idx];
    // Fetch page properties and string toggles in parallel
    const [page, parsedStrings] = await Promise.all([
      fetchPage(item.id),
      parseStringsFromBlocks(item.id)
    ]);
    cs.page = page;
    if(parsedStrings.length > 0){
      cs.strings        = parsedStrings;
      cs.parsedFromPage = true;
    } else {
      // No string toggles found — start with one unnamed string with one blank card
      cs.strings = [{name:'', cards:[{name:'', question:'', hints:[''], scope:''}]}];
    }
    // Every card starts with the source page's capture / goals / KB relations;
    // they can then be adjusted per card before creation.
    const seed=_createPageRels();
    cs.strings.forEach(st=>st.cards.forEach(c=>{ c.rels=_cloneRels(seed); }));
    cs.relPick=null;
    cs.fetchSt = 'ok';
    _createResolveRelTitles();   // async; re-renders when titles arrive
  }catch(e){
    cs.fetchSt  = 'error';
    cs.fetchMsg = e.message || 'Failed to load page';
  }
  render();
}

/* ── Card creation ── */
function buildBodyBlocks(card){
  return [
    {object:'block',type:'heading_3',heading_3:{rich_text:[{type:'text',text:{content:'Question'}}]}},
    {object:'block',type:'numbered_list_item',numbered_list_item:{rich_text:[{type:'text',text:{content:card.question||''}}]}},
    {object:'block',type:'toggle',toggle:{rich_text:[{type:'text',text:{content:'💡 Hints'}}],children:(card.hints||[]).filter(Boolean).map(h=>({object:'block',type:'bulleted_list_item',bulleted_list_item:{rich_text:[{type:'text',text:{content:h}}]}}))}},
    {object:'block',type:'heading_3',heading_3:{rich_text:[{type:'text',text:{content:'Current Answer'}}]}},
    {object:'block',type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:''}}]}},
    {object:'block',type:'heading_3',heading_3:{rich_text:[{type:'text',text:{content:'Recall Documentation'}}]}},
    {object:'block',type:'toggle',toggle:{rich_text:[{type:'text',text:{content:'📋 Session Log'}}],children:[{object:'block',type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:'Log each review: [YYYY-MM-DD · score] notes.'}}]}}]}},
    {object:'block',type:'divider',divider:{}},
    {object:'block',type:'heading_3',heading_3:{rich_text:[{type:'text',text:{content:'Scope Documentation'}}]}},
    {object:'block',type:'paragraph',paragraph:{rich_text:[{type:'text',text:{content:card.scope||''}}]}}
  ];
}

async function createCard(card, ipPageId, ipRelations){
  // Core properties — safe to set on creation
  const coreProps = {
    'Name':         {title:[{type:'text',text:{content:card.name}}]},
    'Stage':        {select:{name:STAGES[0]}},
    'Next Review':  {date:{start:today()}},
    'Review Count': {number:0}
  };
  if(typeof card.stringNumber === 'number' && !isNaN(card.stringNumber)){
    coreProps['String Number'] = {number: card.stringNumber};
  }
  if(ipPageId) coreProps['Info Processing'] = {relation:[{id:fmtId(ipPageId)}]};

  // Build the full props payload including inherited relations
  const fullProps = {...coreProps};
  const relsToInherit = [];  // [{key, relArray}]
  if(ipRelations){
    for(const [key, relArray] of Object.entries(ipRelations)){
      // Skip the relation pointing back to the IP page itself (already set)
      if(key === 'Info Processing') continue;
      // Skip the back-relation from IP to AR (would point at sibling AR cards)
      if(key === 'Active Recall')   continue;
      if(!relArray || relArray.length === 0) continue;
      const relValue = {relation: relArray.map(r => ({id: r.id}))};
      fullProps[key] = relValue;
      relsToInherit.push({key, relArray});
    }
  }

  const children = buildBodyBlocks(card);

  // Try to create the page with all properties (including inherited relations)
  // in a single call. This is faster and atomic — if it succeeds, all relations
  // are set; if it fails, we fall back to per-property patching to identify
  // which relation is the problem.
  try{
    const page = await nPost('/pages',{
      parent:     {database_id: fmtId(AR_DB)},
      properties: fullProps,
      children
    });
    const relResults = relsToInherit.map(r => ({
      key: r.key, ok: true, count: r.relArray.length
    }));
    return {page, relResults};
  }catch(bulkErr){
    // Bulk create failed — likely one of the inherited relation property names
    // doesn't exist on the AR DB or the data is malformed. Create the page
    // with just core props, then patch each relation individually so we can
    // surface which one(s) actually fail.
    const page = await nPost('/pages',{
      parent:     {database_id: fmtId(AR_DB)},
      properties: coreProps,
      children
    });

    const relResults = [];
    for(const {key, relArray} of relsToInherit){
      try{
        await nPatch('/pages/'+fmtId(page.id), {properties:{
          [key]: {relation: relArray.map(r=>({id: r.id}))}
        }});
        relResults.push({key, ok:true, count: relArray.length});
      }catch(e){
        relResults.push({key, ok:false, err: e.message, count: relArray.length});
      }
    }
    return {page, relResults};
  }
}

async function doPush(){
  // Need at least one ready card across all strings
  const readyTotal = cs.strings.reduce((n, st) => n + st.cards.filter(c=>c.name.trim()).length, 0);
  if(!readyTotal) return;
  cs.pushSt='loading'; cs.pushMsg=''; cs.created=[]; render();

  const ipPageId    = cs.page?.pageId;
  const ipRelations = cs.page?.relations || {};
  const results     = [];

  // Process each string toggle sequentially. Each string gets its own
  // Strings DB page; its AR cards are linked to that page via "String Name".
  for(let si = 0; si < cs.strings.length; si++){
    const stringObj = cs.strings[si];
    const stringName = (stringObj.name || '').trim();
    const stringCards = stringObj.cards.filter(c => c.name.trim());
    if(stringCards.length === 0) continue;

    // Section header in the results list (only when there's >1 string or a name)
    if(cs.strings.length > 1 || stringName){
      results.push({
        name: `━━ String ${si+1}${stringName?': "'+stringName+'"':''} ━━`,
        url: null, ok: true, isHeader: true
      });
    }

    const createdIdsForString = [];

    // Create AR cards for this string
    for(const card of stringCards){
      try{
        // Per-card relations: the page's non-registry relations are inherited
        // as before; capture / goals / KB come from the card's own (editable) set.
        const cardRels = {...ipRelations};
        for(const d of REL_DB_REGISTRY){ delete cardRels[d.relProp]; }
        for(const [prop, ids] of Object.entries(card.rels||{})){ if(ids && ids.length) cardRels[prop]=ids.map(id=>({id})); }
        const {page, relResults} = await createCard(card, ipPageId, cardRels);
        const relOk   = relResults.filter(r=>r.ok);
        const relFail = relResults.filter(r=>!r.ok);
        const relNote = relResults.length
          ? (relFail.length
              ? `Relations: ${relOk.length} ok, ${relFail.length} failed — `+relFail.map(r=>`"${r.key}": ${r.err}`).join(' | ')
              : `Relations: ${relOk.map(r=>r.key).join(', ')||'none inherited'}`)
          : 'No relations to inherit';
        results.push({name:card.name, url:page.url, id:page.id, ok:true, relNote});
        createdIdsForString.push(page.id);
      }catch(e){
        results.push({name:card.name, url:null, id:null, ok:false, err:e.message});
      }
    }

    // Create Strings DB page and link cards (only if we have a name + at least 1 card)
    if(stringName && createdIdsForString.length >= 1){
      try{
        const strPage = await nPost('/pages',{
          parent: {database_id: fmtId(STRINGS_DB)},
          properties: {
            'Name': {title:[{type:'text',text:{content:stringName}}]}
          }
        });
        const strPageId = strPage.id;

        const linkErrors = [];
        for(const arId of createdIdsForString){
          try{
            await nPatch('/pages/'+fmtId(arId), {properties:{
              'String Name': {relation:[{id: strPageId}]}
            }});
          }catch(e){
            linkErrors.push(`Card ${fmtId(arId)}: ${e.message}`);
          }
        }
        if(linkErrors.length){
          results.push({
            name: `⚠ String "${stringName}" created but ${linkErrors.length} card link(s) failed`,
            url: strPage.url, ok: false,
            err: linkErrors.join(' | ')
          });
        } else {
          results.push({
            name: `🔗 String "${stringName}" → ${createdIdsForString.length} cards linked`,
            url: strPage.url, ok: true
          });
        }
      }catch(e){
        results.push({
          name: `⚠ String "${stringName}" — creation failed`,
          url: null, ok: false, err: e.message
        });
      }
    } else if(!stringName && createdIdsForString.length >= 1){
      // Cards were created but not linked because no string name was provided
      results.push({
        name: `ℹ ${createdIdsForString.length} card(s) created without a string link (toggle had no label)`,
        url: null, ok: true
      });
    }
  }

  // Update IP page status → Recall Tokenized
  if(ipPageId){
    try{
      await nPatch('/pages/'+fmtId(ipPageId),{properties:{'Status':{status:{name:'Recall Tokenized'}}}});
    }catch(e){
      try{ await nPatch('/pages/'+fmtId(ipPageId),{properties:{'Status':{select:{name:'Recall Tokenized'}}}}); }catch(e2){}
    }
  }

  const ok   = results.filter(r=>r.ok && !r.isHeader).length;
  const fail = results.filter(r=>!r.ok).length;
  const stringCount = cs.strings.filter(s => s.cards.some(c => c.name.trim())).length;
  cs.created = results;
  cs.pushSt  = fail===0 ? 'ok' : 'error';
  cs.pushMsg = fail===0
    ? `${ok} item${ok!==1?'s':''} created across ${stringCount} string${stringCount!==1?'s':''}.`
    : `${ok} created, ${fail} failed.`;

  // Mark queue item done and auto-advance
  if(cs.queueIdx >= 0 && cs.queueIdx < cs.queue.length && fail===0){
    cs.queue[cs.queueIdx].done = true;
    const nextIdx = cs.queueIdx + 1;
    if(nextIdx < cs.queue.length){
      setTimeout(async () => {
        cs.pushSt = null; cs.created = [];
        await doLoadQueuePage(nextIdx);
      }, 1400);
    }
  }
  render();
}

/* ── Review: load card content ── */
async function readCardContent(pageId){
  // questionBlockId / scopeBlockId are returned alongside the text values so
  // the review screen can patch a specific block when the user edits the field
  // inline. They will be null for older tab-format cards (whose content lives
  // inside nested tab structures); editing is disabled in that case.
  let question='', hints=[], scope='';
  let questionBlockId = null, scopeBlockId = null;
  try{
    const blocksRes = await nGet('/blocks/'+pageId+'/children?page_size=100');
    const blocks = blocksRes.results || [];

    // Track whether we just saw the Scope Documentation heading so the next
    // paragraph block gets recognized as the scope content.
    let nextBlockIsScope = false;

    for(let i=0; i<blocks.length; i++){
      const b  = blocks[i];
      const bt = b.type;
      const btxt = ((b[bt]?.rich_text)||[]).map(x=>x.plain_text).join('');

      // Body block reading (fallback / non-template cards)
      if(bt==='numbered_list_item' && btxt && !question){
        question = btxt;
        questionBlockId = b.id;
      }
      if(bt==='toggle' && /hint/i.test(btxt)){
        try{
          const ch = await nGet('/blocks/'+b.id+'/children?page_size=20');
          hints = (ch.results||[]).map(c=>((c[c.type]?.rich_text)||[]).map(x=>x.plain_text).join('')).filter(Boolean);
        }catch(e){}
      }
      if(bt==='heading_3' && /scope/i.test(btxt)){
        nextBlockIsScope = true;
        continue;
      }
      if(nextBlockIsScope){
        // The first block after the Scope Documentation heading carries the scope text
        if(bt === 'paragraph' || bt === 'numbered_list_item' || bt === 'bulleted_list_item'){
          scope = btxt;
          scopeBlockId = b.id;
          nextBlockIsScope = false;
        } else {
          // If the next block isn't a textual block, abandon the lookup
          nextBlockIsScope = false;
        }
      }

      // Tab block reading (template-based cards). Tabs do NOT yield block IDs
      // for inline editing — the block structure is too variable to safely
      // patch without a richer schema discovery pass.
      if(bt==='tabs'){
        try{
          const tabsRes = await nGet('/blocks/'+b.id+'/children?page_size=20');
          for(const tab of (tabsRes.results||[])){
            const tabData  = tab.tab || tab[tab.type] || {};
            const tabTitle = (tabData.rich_text||tabData.title||[]).map(t=>t.plain_text).join('').toLowerCase();
            const tcRes    = await nGet('/blocks/'+tab.id+'/children?page_size=50');
            const tcBlocks = tcRes.results || [];

            for(let j=0; j<tcBlocks.length; j++){
              const tc   = tcBlocks[j];
              const tct  = tc.type;
              const tctxt= ((tc[tct]?.rich_text)||[]).map(x=>x.plain_text).join('');

              if(/question/i.test(tabTitle) && tct==='numbered_list_item' && tctxt) question = tctxt;
              if(/hint/i.test(tabTitle) && tct==='bulleted_list_item' && tctxt) hints.push(tctxt);
              if(/scope/i.test(tabTitle) && tct==='paragraph' && tctxt) scope += (scope?'\n':'')+tctxt;

              // Toggle hints within question tab
              if(/question/i.test(tabTitle) && tct==='toggle' && /hint/i.test(tctxt)){
                try{
                  const hch = await nGet('/blocks/'+tc.id+'/children?page_size=20');
                  hints = (hch.results||[]).map(c=>((c[c.type]?.rich_text)||[]).map(x=>x.plain_text).join('')).filter(Boolean);
                }catch(e){}
              }
            }
          }
        }catch(e){}
      }
    }
  }catch(e){}
  return {question, hints, scope, questionBlockId, scopeBlockId};
}

/* ── Build the Notion filter for a deck spec. ── */
function buildDeckFilter(spec){
  if(!spec || spec.type === 'due'){
    return {and:[
      {property:'Next Review', date:{on_or_before:today()}},
      {property:'Stage',       select:{does_not_equal:'🏆 Mastered'}}
    ]};
  }
  if(spec.type === 'relation'){
    return {and:[
      {property: spec.relProp, relation:{contains: fmtId(spec.relPageId)}},
      {property: 'Stage',      select:{does_not_equal:'🏆 Mastered'}}
    ]};
  }
  if(spec.type === 'time'){
    const dateFilter = {};
    if(spec.dateFrom) dateFilter.on_or_after  = spec.dateFrom;
    if(spec.dateTo)   dateFilter.on_or_before = spec.dateTo;
    return {and:[
      {property:'Created time', created_time: dateFilter},
      {property:'Stage',        select:{does_not_equal:'🏆 Mastered'}}
    ]};
  }
  return buildDeckFilter({type:'due'});
}

/* ── Query AR with pagination support. Returns the union of all result pages. ── */
async function queryAllAR(filter, sorts){
  const all = [];
  let cursor = null;
  do {
    const body = {filter, sorts: sorts || [{property:'Stage', direction:'ascending'}], page_size: 100};
    if(cursor) body.start_cursor = cursor;
    const data = await nPost('/databases/'+fmtId(AR_DB)+'/query', body);
    for(const p of (data.results||[])) all.push(p);
    cursor = data.has_more ? data.next_cursor : null;
  } while(cursor);
  return all;
}

/* ── Load a deck by spec. ──
 * spec:
 *   {type:'due'}                                          → due-today only
 *   {type:'relation', relProp, relPageId, relPageTitle}   → cards linked to that page
 *   {type:'time', dateFrom, dateTo}                       → cards by Created time range
 * For relation and time decks, the deck is expanded so that any card belonging
 * to a String pulls in the rest of that String's cards too — so the user reviews
 * complete strings, not fragments.
 */
async function loadDeck(spec){
  const isDue = !spec || spec.type === 'due';
  spec = spec || {type:'due'};

  // Step 1: primary query (the cards directly matched by the deck spec)
  const primary = await queryAllAR(buildDeckFilter(spec));

  // Step 2: whole-string expansion (skip for due — that filter already defines what's in)
  const pagesById = new Map();
  for(const p of primary) pagesById.set(p.id, p);

  if(!isDue){
    const stringIds = new Set();
    for(const p of primary){
      const rels = p.properties?.['String Name']?.relation || [];
      for(const r of rels) if(r.id) stringIds.add(r.id);
    }
    for(const sid of stringIds){
      const sibFilter = {and:[
        {property:'String Name', relation:{contains: fmtId(sid)}},
        {property:'Stage',       select:{does_not_equal:'🏆 Mastered'}}
      ]};
      try{
        const siblings = await queryAllAR(sibFilter);
        for(const sp of siblings) if(!pagesById.has(sp.id)) pagesById.set(sp.id, sp);
      }catch(e){
        console.warn('String expansion failed for', sid, e.message);
      }
    }
  }

  const allPages = Array.from(pagesById.values());

  // First pass: collect cards and unique string + IP page IDs
  const rawCards = [];
  const stringIdSet = new Set();
  const ipIdSet     = new Set();

  for(const p of allPages){
    const name  = extractTitle(p.properties) || p.id;
    const rawStage = p.properties?.Stage?.select?.name;
    const stage = normalizeStage(rawStage || STAGES[0]);
    const count = p.properties?.['Review Count']?.number || 0;
    // Last grade given to this card. Null if it's never been reviewed.
    const lastScore = p.properties?.['Recall Score']?.select?.name || null;

    const stringRels = p.properties?.['String Name']?.relation || [];
    const stringId   = stringRels.length > 0 ? stringRels[0].id : null;
    if(stringId) stringIdSet.add(stringId);

    const ipRels = p.properties?.['Info Processing']?.relation || [];
    const ipId   = ipRels.length > 0 ? ipRels[0].id : null;
    if(ipId) ipIdSet.add(ipId);

    rawCards.push({
      id: p.id, name, stage, count, url: p.url,
      stringId,
      stringNumber: p.properties?.['String Number']?.number ?? null,
      ipId,
      lastScore,
      question:'', hints:[], scope:''
    });
  }

  // Pass 2: fetch string + IP page titles in parallel (cached by ID)
  // Both batches are independent, so launch them together.
  const stringIds = [...stringIdSet];
  const ipIds     = [...ipIdSet];

  const [stringTitleArr, ipTitleArr] = await Promise.all([
    mapPool(stringIds, fetchPageTitle, 5),
    mapPool(ipIds,     fetchPageTitle, 5)
  ]);

  const stringTitles = {};
  stringIds.forEach((sid, i) => { stringTitles[sid] = stringTitleArr[i] || '(Untitled String)'; });
  const ipTitles = {};
  ipIds.forEach((ipid, i) => { ipTitles[ipid] = ipTitleArr[i] || '(Untitled IP page)'; });

  // Pass 3: read each card's block content in parallel.
  // Concurrency 4 because readCardContent may chain a sub-fetch for hints,
  // which doubles the in-flight count for cards with hints.
  const contentArr = await mapPool(rawCards, c => readCardContent(c.id), 4);

  const cards = [];
  rawCards.forEach((card, i) => {
    const content = contentArr[i] && !contentArr[i].__err ? contentArr[i] : {question:'',hints:[],scope:'',questionBlockId:null,scopeBlockId:null};
    if(content.question) card.question = content.question;
    if(content.hints.length) card.hints = content.hints;
    if(content.scope) card.scope = content.scope;
    card.questionBlockId = content.questionBlockId || null;
    card.scopeBlockId    = content.scopeBlockId    || null;

    if(card.ipId)     card.ipPageTitle = ipTitles[card.ipId] || '';
    if(card.stringId) card.stringTitle = stringTitles[card.stringId] || '';

    cards.push(card);
  });

  // Sort: same as before — string cards grouped by String Number, then solo cards by stage
  cards.sort((a,b) => {
    const aStr = a.stringId || '';
    const bStr = b.stringId || '';
    if(aStr && aStr === bStr){
      const an = a.stringNumber ?? 9999;
      const bn = b.stringNumber ?? 9999;
      return an - bn;
    }
    if(aStr && bStr) return aStr.localeCompare(bStr);
    if(aStr) return -1;
    if(bStr) return 1;
    return STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage);
  });

  // Compute stringPos / stringTotal from final sorted order
  const sortedGroups = {};
  cards.forEach((c,i) => {
    if(c.stringId){
      if(!sortedGroups[c.stringId]) sortedGroups[c.stringId] = [];
      sortedGroups[c.stringId].push(i);
    }
  });
  cards.forEach((c,i) => {
    if(c.stringId){
      const grp     = sortedGroups[c.stringId];
      c.stringPos   = grp.indexOf(i) + 1;
      c.stringTotal = grp.length;
    }
  });

  return cards;
}

/* ── Build picker options for a relation property. ──
 * Walks every AR card, collects unique IDs from the given relation property,
 * fetches each page's title, and counts how many cards reference each one.
 * Returns: [{id, title, count}, ...] sorted by count desc, then title asc.
 */
async function loadPickerOptions(relProp){
  // Pull all AR cards that have at least one entry in this relation property.
  const filter = {property: relProp, relation:{is_not_empty: true}};
  const pages = await queryAllAR(filter);

  // Count occurrences of each related page ID
  const counts = new Map();   // id -> count
  for(const p of pages){
    const rels = p.properties?.[relProp]?.relation || [];
    for(const r of rels){
      if(!r.id) continue;
      counts.set(r.id, (counts.get(r.id) || 0) + 1);
    }
  }

  // Resolve titles in parallel (cached by ID — if the user opens multiple
  // pickers, repeat IDs across them are free)
  const ids = [...counts.keys()];
  const titles = await mapPool(ids, fetchPageTitle, 5);
  const options = ids.map((id, i) => ({id, title: titles[i] || '(Untitled)', count: counts.get(id)}));

  options.sort((a,b) => b.count - a.count || a.title.localeCompare(b.title));
  return options;
}

/* ── Upcoming review projection ──────────────────────────────────────────
 * Walk forward from each non-Mastered card's current state, simulating a
 * Solid grade at every step, until we hit Mastered or exceed the range cap.
 * Each step yields a projected review entry tagged with the from→to stage
 * transition, so the calendar can show "Stage 2 → Stage 3 review" etc.
 *
 * Date arithmetic uses the existing STAGE_INTERVALS table so projections
 * always match what the real grader produces. The seed date for each card
 * is its current Next Review, falling back to today() if null.
 *
 * Range caps: '30d' / '90d' / 'all'. 'all' walks to Mastered.
 */
function projectUpcomingReviews(pages, stringTitles, rangeKey){
  const cap = rangeKey === '30d' ? 30
           : rangeKey === '90d' ? 90
           : null;                              // 'all'
  const capDate = cap == null ? null : addDays(cap);
  const todayIso = today();

  const entries = [];

  for(const p of pages){
    const cardId    = p.id;
    const cardName  = extractTitle(p.properties) || cardId;
    const rawStage  = p.properties?.Stage?.select?.name;
    let   stage     = normalizeStage(rawStage || STAGES[0]);
    if(stage === '🏆 Mastered') continue;

    const rawNextReview = p.properties?.['Next Review']?.date?.start || todayIso;
    // Clamp overdue cards to today — if the card was due yesterday, you'll
    // review it today (or later), so today is the realistic projection start.
    const nextReview = rawNextReview < todayIso ? todayIso : rawNextReview;
    const url        = p.url;
    const stringRels = p.properties?.['String Name']?.relation || [];
    const stringId   = stringRels.length > 0 ? stringRels[0].id : null;
    const stringName = stringId ? (stringTitles[stringId] || '(Untitled String)') : null;
    const stringNumber = p.properties?.['String Number']?.number ?? null;

    // Walk forward.
    //   curDate is the date when the user would *next* see this card.
    //   On that date, they grade Solid, which lands them in newStage and
    //   pushes the next review out by STAGE_INTERVALS[newStage].solid days.
    let curDate  = nextReview;
    let curStage = stage;
    let safety   = 20;  // hard cap on iterations per card — every path
                        // reaches Mastered in ≤6 hops, so 20 is plenty even
                        // with weird data.
    while(safety-- > 0){
      // The card is due on curDate. Project the Solid grade that happens then.
      const newStage = nextStage(curStage, '🟢 Solid');
      entries.push({
        date:         curDate,
        cardId,       cardName,
        stringId,     stringName,
        stringNumber,
        fromStage:    curStage,
        toStage:      newStage,
        url
      });

      if(newStage === '🏆 Mastered') break;

      // Where would the *next* review of this card land, after the Solid we
      // just projected? Use the new stage's Solid interval.
      const row  = STAGE_INTERVALS[newStage];
      const days = row && row.solid;
      if(days == null) break;  // shouldn't happen for non-Mastered new stages

      const nextDate = addDaysToDate(curDate, days);
      if(capDate && nextDate > capDate) break;

      curDate  = nextDate;
      curStage = newStage;
    }
  }

  return entries;
}

async function loadUpcoming(){
  us.phase = 'loading'; us.errMsg = ''; us.entries = [];
  render();
  try{
    // One AR query — non-Mastered cards. We only need a few properties so
    // there's no per-card content refetch.
    const filter = {property:'Stage', select:{does_not_equal:'🏆 Mastered'}};
    const pages  = await queryAllAR(filter);

    // Collect unique string IDs across all cards, fetch their titles in
    // parallel (with cache hits if the user has already loaded a deck this
    // session).
    const stringIdSet = new Set();
    for(const p of pages){
      const rels = p.properties?.['String Name']?.relation || [];
      if(rels.length > 0 && rels[0].id) stringIdSet.add(rels[0].id);
    }
    const sids = [...stringIdSet];
    const titleArr = await mapPool(sids, fetchPageTitle, 5);
    const stringTitles = {};
    sids.forEach((sid, i) => { stringTitles[sid] = titleArr[i] || '(Untitled String)'; });

    const entries = projectUpcomingReviews(pages, stringTitles, us.range);
    us.entries = entries;
    us.phase   = 'loaded';
  }catch(e){
    us.phase  = 'error';
    us.errMsg = e.message || 'Failed to load upcoming reviews';
  }
  render();
}

function rvSetUpcomingRange(range){
  us.range = range;
  us.selectedDay = null;
  loadUpcoming();
}
function rvUpcomingPrevMonth(){ us.monthOffset--; us.selectedDay = null; render(); }
function rvUpcomingNextMonth(){ us.monthOffset++; us.selectedDay = null; render(); }
function rvUpcomingToday(){     us.monthOffset = 0; us.selectedDay = today(); render(); }
function rvUpcomingSelectDay(iso){

  render();
}

/* Update a card after a grade.
 *   pageId, score: the canonical grade that drives Stage, Next Review,
 *     Last Reviewed, Review Count.
 *   stage, count: pre-review stage and count (so progression is computed
 *     against the right baseline, especially important for string reviews
 *     where per-card grades don't persist their stage changes).
 *   recallScoreOverride: optional. When set, this value (not `score`) is
 *     written to the Recall Score property. Used by string-level grading
 *     so the canonical record of how I felt about each card survives, even
 *     as the string-level grade drives every card's trajectory.
 */
async function updateCard(pageId, score, stage, count, recallScoreOverride){
  // Normalize incoming stage in case the card was created under the legacy
  // naming. nextStage normalizes internally, but the migration-on-grade
  // rewrite at the patch step needs the new name explicitly.
  const ns  = nextStage(stage, score);
  const nr  = nextReviewDate(ns, score);
  const pid = fmtId(pageId);

  // Build properties — only include fields we're confident about
  const props = {
    'Stage':        {select:{name:ns}},
    'Last Reviewed':{date:{start:today()}},
    'Review Count': {number:(count||0)+1},
  };
  // Next Review: set or clear
  props['Next Review'] = nr ? {date:{start:nr}} : {date:null};
  // Recall Score: write the override if given, otherwise the canonical score.
  // Either way, only write if it's a known option.
  const recallToWrite = recallScoreOverride || score;
  if(['🔴 Blank','🟡 Partial','🟢 Solid'].includes(recallToWrite)){
    props['Recall Score'] = {select:{name:recallToWrite}};
  }

  // Attempt full patch — if it fails, retry without optional fields
  try{
    await nPatch('/pages/'+pid, {properties:props});
  }catch(e1){
    // Retry with only the core fields in case an optional property doesn't exist
    const coreProps = {
      'Stage':        props['Stage'],
      'Last Reviewed':props['Last Reviewed'],
      'Review Count': props['Review Count'],
      'Next Review':  props['Next Review'],
    };
    try{
      await nPatch('/pages/'+pid, {properties:coreProps});
    }catch(e2){
      throw new Error(`Property patch failed: ${e2.message}`);
    }
  }
}

  }catch(err){

    mainHtml = `<div class="block"><div class="pill pill-err" style="display:block;margin-bottom:8px">Something went wrong rendering this view.</div>

  // Preserve the page scroll position across re-renders WITHIN the same tab.
  // Replacing #main.innerHTML (and growing textareas / focusing inputs) would

  const sameTab = (_lastRenderedTab === currentTab);

  if(['inbox','tagging','export','recall','recalladd','recallbuild','recallcal'].includes(currentTab)){ const a = document.activeElement; if(a && a.id && /^(ib|tg|ex|rc)-/.test(a.id)) _ibFocus = {id:a.id, s:a.selectionStart, e:a.selectionEnd}; }
  const _mainEl = document.getElementById('main');
  _mainEl.classList.toggle('main-wide', currentTab==='inbox');
  const _libLook = ['library','topics','tagging','export','recall','recalladd','recallbuild','recallcal'].includes(currentTab);
  const _keep = [...document.querySelectorAll('[data-keep]')].map(el=>[el.getAttribute('data-keep'), el.scrollTop]);
  _mainEl.classList.toggle('main-lib', _libLook);
  document.body.classList.toggle('on-lib', _libLook); document.documentElement.classList.toggle('on-lib', _libLook);

  _keep.forEach(([k,top])=>{ const el = document.querySelector('[data-keep="'+k+'"]'); if(el) el.scrollTop = top; });
  if(sameTab){
    // restore after layout (textarea auto-grow already ran)
    window.scrollTo(0, savedScroll);
  } else {
    // new tab → start at the top
    window.scrollTo(0, 0);
  }
  _lastRenderedTab = currentTab;
}

        <div style="font-size:11px;font-weight:600;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Block tree (2 levels deep) · ${s.inspectSt.length} top-level blocks</div>
        ${s.inspectSt.map(n => renderNode(n,0) + n.children.map(c=>renderNode(c,1)).join('')).join('')}
      </div>`;
    }

    // Source page's capture / goals / KB relations — the defaults every card starts with.
    const pageRels=_createPageRels();
    const pageChips=_relChipsHtml(pageRels, null);
    const relPanel = `<div style="margin-top:10px">
      <div class="fe-label">Relations on this page <span style="font-weight:400;color:var(--dim)">— seeded onto every card below</span></div>
      ${cs.relTitlesSt==='loading' && pageChips ? `<div class="rel-search-hint"><span class="spin"></span> loading titles…</div>` : ''}
      ${pageChips || `<div style="font-size:12px;color:var(--dim)">No capture, goals, or Knowledge Bank relations on this page.</div>`}
    </div>`;

    h += `<div class="block">
      <div class="blabel">Source page</div>
      <div class="page-info">
        <div class="page-title">${esc(s.page.title)}</div>
      </div>
      ${relPanel}
      <div style="display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap">
        <a href="${esc(s.page.url||'')}" target="_blank" style="font-size:12px;color:var(--info);text-decoration:none">Open in Notion ↗</a>
        <button class="btn btn-sm" onclick="doInspectBlocks()" ${s.inspectSt==='loading'?'disabled':''} style="font-size:11px;padding:4px 10px">
          ${s.inspectSt==='loading' ? '<span class="spin"></span>' : '🔍 Inspect Blocks'}
        </button>
        ${Array.isArray(s.inspectSt) ? `<button class="btn btn-sm" onclick="cs.inspectSt=null;render()" style="font-size:11px;padding:4px 10px">Hide</button>` : ''}
      </div>
      ${inspHtml}
    </div>`;
  }

  /* ── String + card editor ── */
  if(s.fetchSt==='ok' && s.page){
    const totalCards = s.strings.reduce((n,st) => n + st.cards.length, 0);
    const readyTotal = s.strings.reduce((n,st) => n + st.cards.filter(c=>c.name.trim()).length, 0);
    const stringCount = s.strings.length;

    h += `<div class="block">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="blabel" style="margin-bottom:0">Strings (${stringCount}) · ${readyTotal}/${totalCards} cards ready</div>
        ${s.parsedFromPage
          ? `<span class="pill pill-ok" style="font-size:11px">✓ Auto-populated from page</span>`
          : `<span style="font-size:11px;color:var(--dim)">No string toggles found in page</span>`}
      </div>`;

    // Identify which strings will be missing names (warn the user)
    const unnamed = s.strings
      .map((st, i) => ({i, st}))
      .filter(o => o.st.cards.some(c => c.name.trim()) && !o.st.name.trim());

    s.strings.forEach((st, si) => {
      const isMultiCard = st.cards.length >= 2;
      const stringReady = st.cards.filter(c=>c.name.trim()).length;
      h += `<div style="margin-top:18px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--bg)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700;color:var(--info);background:#eff6ff;padding:3px 10px;border-radius:12px">String ${si+1}</span>
          <input type="text" class="s-name" data-si="${si}" value="${esc(st.name)}" placeholder="String name (e.g. Test 1 — Strings)" style="flex:1;font-size:14px;font-weight:600">
          <span style="font-size:11px;color:var(--dim);white-space:nowrap">${stringReady}/${st.cards.length} cards</span>
          <button class="btn btn-sm btn-red" onclick="removeString(${si})" title="Remove this string">×</button>
        </div>`;

      st.cards.forEach((c, ci) => {
        const cardNum = ci + 1;
        h += `<div class="card-ed" style="margin-top:10px">
          <div class="card-num" style="display:flex;align-items:center;justify-content:space-between">
            <span>Card ${cardNum}${isMultiCard ? ` <span style="font-size:10px;opacity:.6">/ ${st.cards.length}</span>` : ''}</span>
            ${isMultiCard ? `<span style="font-size:11px;font-weight:600;color:var(--info);background:#eff6ff;padding:2px 8px;border-radius:10px">${cardNum}/${st.cards.length}</span>` : ''}
          </div>
          <label class="flabel">Name</label>
          <input type="text" class="c-name" data-si="${si}" data-i="${ci}" value="${esc(c.name)}" placeholder="Short concept label (3–7 words)…">
          <label class="flabel">Question</label>
          <textarea class="c-q" data-si="${si}" data-i="${ci}" rows="2" placeholder="Open-ended synthesis question…">${esc(c.question)}</textarea>
          <label class="flabel">Hints</label>
          ${(c.hints||[]).map((hh,j)=>`
            <div class="hint-row">
              <input type="text" class="c-hint" data-si="${si}" data-i="${ci}" data-j="${j}" value="${esc(hh)}" placeholder="Hint ${j+1}…">
              <button class="hint-del" onclick="removeHint(${si},${ci},${j})">×</button>
            </div>`).join('')}
          <button class="btn btn-dashed" onclick="addHint(${si},${ci})">+ Add hint</button>
          <label class="flabel">Scope Documentation</label>
          <textarea class="c-scope" data-si="${si}" data-i="${ci}" rows="5" placeholder="Definitive 2–4 paragraph reference account…">${esc(c.scope)}</textarea>
          <label class="flabel">Relations <span style="font-weight:400;color:var(--dim)">· capture · goals · Knowledge Bank</span></label>
          ${_relChipsHtml(c.rels||{}, {si,ci}) || `<div style="font-size:12px;color:var(--dim)">No relations on this card.</div>`}
          ${(cs.relPick && cs.relPick.si===si && cs.relPick.ci===ci) ? renderCreateRelPicker() : `<button class="btn btn-dashed" style="margin-top:6px" onclick="createRelPickOpen(${si},${ci})">+ Add relation</button>`}
          <div class="card-actions"><button class="btn btn-sm btn-red" onclick="removeCard(${si},${ci})">Remove card</button></div>
        </div>`;
      });

      h += `<button class="btn btn-dashed" style="padding:10px;margin-top:10px;width:100%" onclick="addCard(${si})">+ Add blank card to this string</button>
      </div>`;
    });

    h += `<button class="btn btn-dashed" style="padding:10px;margin-top:14px;width:100%" onclick="addString()">+ Add blank string</button>
    </div>`;

    /* ── Create button ── */
    h += `<div class="block">
      <div class="blabel">Create</div>
      ${unnamed.length ? `<div style="font-size:12px;color:var(--warning);margin-bottom:10px">⚠ ${unnamed.length} string${unnamed.length!==1?'s':''} ${unnamed.length===1?'has':'have'} cards but no name — those cards will be created in Active Recall but not linked in the Strings DB.</div>` : ''}
      <button class="btn btn-primary btn-full" onclick="doPush()" ${s.pushSt==='loading'||!readyTotal?'disabled':''}>
        ${s.pushSt==='loading'
          ? '<span class="spin"></span> Creating in Notion…'
          : `Create ${readyTotal} card${readyTotal!==1?'s':''} across ${stringCount} string${stringCount!==1?'s':''}`}
      </button>
      ${s.pushSt==='ok'    ? `<div style="margin-top:8px"><span class="pill pill-ok">${esc(s.pushMsg)}</span></div>` : ''}
      ${s.pushSt==='error' ? `<div style="margin-top:8px"><span class="pill pill-err">${esc(s.pushMsg)}</span></div>` : ''}
      ${s.created.length ? `<div class="created-list">${s.created.map(c=>{
        if(c.isHeader){
          return `<div style="margin-top:10px;padding:6px 0;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">${esc(c.name)}</div>`;
        }
        return `<div class="created-item" style="flex-direction:column;align-items:flex-start;gap:4px">
          <div style="display:flex;align-items:center;gap:10px;width:100%">
            <span>${c.ok?'✓':'✗'}</span>
            <span class="name">${esc(c.name)}</span>
            ${c.url?`<a href="${esc(c.url)}" target="_blank" style="margin-left:auto">Open ↗</a>`:''}
          </div>
          ${c.relNote?`<div style="font-size:11px;color:${c.relNote.includes('failed')?'var(--danger)':'var(--muted)'};padding-left:20px">${esc(c.relNote)}</div>`:''}
          ${c.err?`<div style="font-size:11px;color:var(--danger);padding-left:20px">${esc(c.err)}</div>`:''}
        </div>`;
      }).join('')}</div>` : ''}
    </div>`;
  }

  return h;
}

// ── Create tab: per-card relation pills + add-relation picker ──
// Mirrors the Visualizer's pills editor, but edits an in-memory `rels` map on
// the card; nothing is written to Notion until the cards are created.
function _relChipsHtml(rels, at){
  const cats=[
    {label:'Capture system', test:d=>d.kind==='capture' && d.name!=='Knowledge Bank'},
    {label:'Goals system',   test:d=>d.kind==='goals'},
    {label:'Knowledge Bank', test:d=>d.name==='Knowledge Bank'}
  ];
  let blocks='';
  for(const c of cats){
    const chips=[];
    for(const d of REL_DB_REGISTRY.filter(c.test)){
      for(const id of (rels[d.relProp]||[])){
        const t=titleCache.get(fmtId(id))||'…';
        chips.push(`<span class="pill-chip"><span class="pill-chip-db">${esc(d.name)}</span><span>${esc(t)}</span>${at?`<button class="fe-x" data-p="${esc(d.relProp)}" onclick="createRelRemove(${at.si},${at.ci},this.getAttribute('data-p'),'${id}')" title="remove from this card">✕</button>`:''}</span>`);
      }
    }
    if(chips.length) blocks+=`<div class="fe-label" style="margin-top:6px">${c.label}</div><div class="pill-group">${chips.join('')}</div>`;
  }
  return blocks;
}
function createRelPickOpen(si,ci){
  cs.relPick={si,ci,cat:'kb',db:'Knowledge Bank',q:'',results:null,searchSt:null,msg:'',scope:'card',busy:false};
  createRelRunSearch(''); render();
}
function createRelPickClose(){ cs.relPick=null; _tqFocusKey=null; render(); }
function createRelSetCat(key){ const c=_pillsCat(key); const p=cs.relPick; if(!c||!p) return; p.cat=key; p.db=c.dbs[0]; p.results=null; p.searchSt=null; createRelRunSearch(p.q||''); render(); }
function createRelSetDb(name){ const p=cs.relPick; if(!p) return; p.db=name; p.results=null; p.searchSt=null; createRelRunSearch(p.q||''); render(); }
function createRelSetScope(v){ const p=cs.relPick; if(!p) return; p.scope=v; render(); }
let _createRelTimer=null;
function createRelInput(v){ const p=cs.relPick; if(!p) return; p.q=v; _tqFocusKey='create-rel-q'; clearTimeout(_createRelTimer); _createRelTimer=setTimeout(()=>createRelRunSearch(v),220); }
async function createRelRunSearch(v){
  const p=cs.relPick; if(!p) return; const reg=relDbByName(p.db);
  if(!reg){ p.results=[]; p.searchSt='error'; p.msg='Unknown database'; render(); return; }
  p.searchSt='loading'; render();
  try{
    const pages=await tqGetDbPages(reg.dbId);
    const q=(v||'').trim().toLowerCase();
    const res = !q ? pages.slice(0,25) : pages.filter(pg=>pg.title.toLowerCase().includes(q)).sort((a,b)=>a.title.length-b.title.length).slice(0,25);
    if(cs.relPick===p){ p.results=res; p.searchSt='ok'; }
  }catch(e){ if(cs.relPick===p){ p.results=[]; p.searchSt='error'; p.msg=e.message; } }
  render();
}
function createRelAdd(instId, title){
  const p=cs.relPick; if(!p) return; const reg=relDbByName(p.db); if(!reg) return;
  if(title) titleCache.set(fmtId(instId), title);
  const targets = p.scope==='all' ? cs.strings.flatMap(st=>st.cards) : [cs.strings[p.si].cards[p.ci]];
  let added=0;
  for(const c of targets){
    c.rels=c.rels||{}; const cur=c.rels[reg.relProp]||[];
    if(cur.some(x=>fmtId(x)===fmtId(instId))) continue;
    c.rels[reg.relProp]=[...cur, instId]; added++;
  }
  p.msg = added ? `Added “${title}” to ${p.scope==='all'?added+' card'+(added!==1?'s':''):'this card'}.` : 'Already on the card.';
  p.searchSt='ok';
  render();
}
function createRelRemove(si,ci,relProp,id){
  const c=cs.strings[si]&&cs.strings[si].cards[ci]; if(!c||!c.rels) return;
  c.rels[relProp]=(c.rels[relProp]||[]).filter(x=>fmtId(x)!==fmtId(id));
  render();
}
function renderCreateRelPicker(){
  const p=cs.relPick; if(!p) return '';
  const cat=_pillsCat(p.cat);
  const catOpts=_PILLS_CATS.map(c=>`<option value="${c.key}" ${c.key===p.cat?'selected':''}>${esc(c.label)}</option>`).join('');
  const dbSel = (p.cat==='kb') ? '' : `<select class="rel-db-sel" onchange="createRelSetDb(this.value)">${(cat?cat.dbs:[]).map(d=>`<option value="${esc(d)}" ${d===p.db?'selected':''}>${esc(d)}</option>`).join('')}</select>`;
  let results='';
  if(p.searchSt==='loading') results=`<div class="rel-search-hint"><span class="spin"></span> searching…</div>`;
  else if(p.searchSt==='error') results=`<div class="rel-search-hint" style="color:var(--danger)">${esc(p.msg||'search failed')}</div>`;
  else if(p.results){
    results = p.results.length
      ? `<div class="rel-results">`+p.results.map(o=>`<button class="rel-result" onclick="createRelAdd('${o.id}', this.getAttribute('data-t'))" data-t="${esc(o.title)}">+ ${esc(o.title)}</button>`).join('')+`</div>`
      : `<div class="rel-search-hint">No matches in ${esc(p.db)}.</div>`;
  }
  const total=cs.strings.reduce((n,st)=>n+st.cards.length,0);
  return `<div class="frag-editor pills-editor" style="margin-top:8px">
    <div style="display:flex;align-items:center;gap:6px">
      <div class="fe-label" style="margin:0">🔖 Add a relation</div>
      <button class="fe-undo" style="margin-left:auto" onclick="createRelPickClose()">✕ Close</button>
    </div>
    <div class="rel-search-bar" style="margin-top:6px">
      <select class="rel-db-sel" onchange="createRelSetCat(this.value)">${catOpts}</select>
      ${dbSel}
      ${total>1?`<select class="rel-db-sel" onchange="createRelSetScope(this.value)" title="Add to this card only, or to every card on this page"><option value="card" ${p.scope==='card'?'selected':''}>This card</option><option value="all" ${p.scope==='all'?'selected':''}>All ${total} cards</option></select>`:''}
    </div>
    <div class="rel-search-bar" style="margin-top:0">
      <input class="rel-search-input" id="create-rel-q" placeholder="Search ${esc(p.db)}…" value="${esc(p.q||'')}" oninput="createRelInput(this.value)" autocomplete="off">
    </div>
    ${results}
    ${p.msg && p.searchSt!=='error' ? `<div class="fe-msg ok" style="margin-top:6px">${esc(p.msg)}</div>`:''}
  </div>`;
}

function bindEditors(){
  document.querySelectorAll('.s-name').forEach(el=>{
    el.oninput=()=>{ cs.strings[+el.dataset.si].name=el.value; };
  });
  document.querySelectorAll('.c-name').forEach(el=>{
    el.oninput=()=>{ cs.strings[+el.dataset.si].cards[+el.dataset.i].name=el.value; };
  });
  document.querySelectorAll('.c-q').forEach(el=>{
    el.oninput=()=>{ cs.strings[+el.dataset.si].cards[+el.dataset.i].question=el.value; };
  });
  document.querySelectorAll('.c-hint').forEach(el=>{
    el.oninput=()=>{ cs.strings[+el.dataset.si].cards[+el.dataset.i].hints[+el.dataset.j]=el.value; };
  });
  document.querySelectorAll('.c-scope').forEach(el=>{
    el.oninput=()=>{ cs.strings[+el.dataset.si].cards[+el.dataset.i].scope=el.value; };
  });
}
function addString(){ cs.strings.push({name:'',cards:[_newCard()]}); render(); }
function removeString(si){ cs.strings.splice(si,1); if(cs.strings.length===0) cs.strings=[{name:'',cards:[_newCard()]}]; cs.relPick=null; render(); }
function addCard(si){ cs.strings[si].cards.push(_newCard()); render(); }
function removeCard(si,ci){ cs.strings[si].cards.splice(ci,1); if(cs.strings[si].cards.length===0) cs.strings[si].cards=[_newCard()]; cs.relPick=null; render(); }
function addHint(si,ci){ cs.strings[si].cards[ci].hints.push(''); render(); }
function removeHint(si,ci,j){ cs.strings[si].cards[ci].hints.splice(j,1); render(); }

/* ── Review tab ── */
function renderReview(){
  const g = gate(); if(g) return g;
  const s = rs;

  if(s.phase==='idle'){
    // Escape a JS-string value safely for use inside an HTML attribute.
    // JSON.stringify handles JS-level quoting (backslashes, control chars, etc.);
    // we then replace HTML-significant chars so the attribute parses cleanly.
    const attrJs = v => JSON.stringify(String(v))
      .replace(/&/g,'&amp;').replace(/"/g,'&quot;')
      .replace(/</g,'&lt;').replace(/>/g,'&gt;');

    // Resume banner — shown above the dashboard if a paused session exists
    const saved = sessionStore.load();
    let banner = '';
    if(saved && saved.cards && saved.cards.length){
      const total    = saved.cards.length;
      const graded   = saved.idx || 0;
      const remaining = total - graded;
      const age      = fmtAge(saved.savedAt);
      banner = `
      <div class="resume-banner">
        <div class="resume-banner-row">
          <div class="resume-banner-icon">📌</div>
          <div class="resume-banner-text">
            <div class="resume-banner-title">Resume your saved session</div>

        </div>

          <button class="btn btn-primary" onclick="rvResumeSavedSession(false)">Continue saved</button>

          <button class="btn-link-danger" onclick="rvDiscardSavedSession()">Discard</button>

      </div>`;
    }

    return `
    <div style="padding:8px 0">
      ${banner}
      <div style="text-align:center;margin-bottom:24px">
        <div style="font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em">Build a deck</div>

  if(s.phase==='picker'){
