     closes it). Covers both normal map view and full-screen map view. */
  .viz-reader, .viz-reader.reader-over-full {
    position:fixed; inset:0; width:auto; height:100vh; max-height:none;
    z-index:1100; border:none; border-left:none; border-top:none;
    border-radius:0; box-shadow:none;
  }
  .mm-wrap.mm-full.with-reader-over { right:0; }   /* map stays full behind the overlay */

  /* Bigger tap targets */
  .mm-ctrl-btn { width:42px; height:42px; font-size:18px; }
  .reader-x { font-size:26px; padding:4px 12px; }
  .fe-edit-btn { font-size:12px; padding:6px 12px; }
  .sel-check { width:22px; height:22px; font-size:13px; }
  .tangent-chip { font-size:12.5px; padding:7px 12px; }
  .tangent-chip .caret { font-size:11px; }
  .fe-btn { padding:10px 14px; font-size:13px; }
  .reader-x { min-width:40px; }

  /* Editor + bars: wrap and fill the narrow width */
  .reader-controls { flex-wrap:wrap; row-gap:6px; }
  .fe-sel { flex:1 1 140px; padding:8px; font-size:13px; }
  .fe-in { min-width:120px; padding:9px; }
  .fe-actions { flex-wrap:wrap; }
  .sel-bar { flex-wrap:wrap; row-gap:8px; }
  .sel-bar > span:last-child { width:100%; }      /* push Save/Done actions to their own row */
  .frag-editor { padding:12px 10px; }
  .spine-item { padding:15px 16px; }
  .tangent-inline { margin-left:8px; }

  /* The mouse-centric hint isn't useful on touch */
  .mm-hint { display:none; }
}

/* ── Two-column fragment layout (Core left, related RC/RCQ/OL right) ── */
.frag-rows { display:flex; flex-direction:column; gap:14px; margin-bottom:10px; }
.frag-row { display:flex; gap:14px; align-items:flex-start; }
.frag-row > .frag-col-core { flex:1 1 0; min-width:0; }
.frag-row > .frag-col-related { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:10px; }
.frag-col-related:empty { display:none; }
.frag-row.no-core > .frag-col-core { display:none; }
.frag-row.no-core > .frag-col-related { flex-basis:100%; }
.related-rail-label { font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--dim); margin-bottom:-2px; }
/* In a row, cards sit flush (the column gap handles spacing) */
.frag-row .frag-card { margin-bottom:0; }
@media (max-width: 720px){
  .frag-row { flex-direction:column; gap:10px; }
  .frag-row > .frag-col-core, .frag-row > .frag-col-related { flex-basis:auto; width:100%; }
  .frag-col-related { padding-left:14px; border-left:2px solid var(--border); }
}
.thread-summary { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px; }
.thread-summary b { color:var(--text); }
.frag-toggle-ex { font-size:11px; color:var(--muted); cursor:pointer; background:none; border:none; text-decoration:underline; }

/* ── Thread topology summary, grouping, connection editing, preview map ── */
.tq-topo-line { font-size:13px; color:var(--text); margin-bottom:10px; }
.tq-thread-chips { display:flex; flex-wrap:wrap; gap:6px; }
.tq-tchip { display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:3px 9px; border-radius:7px; background:var(--card); border:1px solid var(--border2); color:var(--text); max-width:300px; }
.tq-tchip b { color:var(--info); }
.tq-tchip-n { font-size:10px; font-weight:700; background:var(--border,#e2e8f0); color:var(--muted); border-radius:10px; padding:0 6px; }

.tq-thread-group { border:1px solid var(--border2); border-radius:12px; padding:12px 12px 4px; margin-bottom:14px; background:var(--bg); }
.tq-thread-hd { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; padding-bottom:8px; border-bottom:1px dashed var(--border2); }
.tq-thread-tag { font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#fff; background:var(--info); padding:2px 8px; border-radius:6px; }
.tq-thread-name { font-size:13.5px; font-weight:600; color:var(--text); flex:1; min-width:0; overflow-wrap:anywhere; }

  background:transparent; border:1px solid transparent; border-radius:6px; padding:3px 7px; font-family:inherit;
  transition:border-color .12s, background .12s; }

.tq-thread-meta { font-size:11px; color:var(--muted); white-space:nowrap; }

.tq-anchor-pick select { font-size:11px; padding:2px 6px; border:1px solid var(--border2); border-radius:6px; background:var(--surface); color:var(--text); font-family:inherit; cursor:pointer; max-width:200px; }
.tq-thread-group .frag-card { background:var(--surface); }

.frag-conns { margin-top:9px; }
.frag-refined { font-size:11px; color:var(--muted); margin-top:6px; }
.refined-chip { display:inline-block; font-size:10.5px; font-weight:600; color:var(--info); background:rgba(37,99,235,0.07); border:1px solid var(--border2); border-radius:6px; padding:1px 6px; margin-right:2px; }
.conn-x { background:none; border:none; cursor:pointer; font-size:10px; padding:0 0 0 3px; opacity:0.55; color:inherit; }
.conn-x:hover { opacity:1; }
.conn-add { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.conn-add-sel { font-size:11px; padding:3px 7px; border:1px dashed var(--border2); border-radius:6px; background:var(--surface); color:var(--info); font-family:inherit; cursor:pointer; max-width:180px; }

.frag-del-btn { background:none; border:none; cursor:pointer; font-size:12px; padding:2px 4px; opacity:0.4; }
.frag-del-btn:hover { opacity:1; }

.tq-add-frag-wrap { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tq-add-frag-lbl { font-size:12px; color:var(--muted); font-weight:600; }
.tq-add-frag { font-size:12px; padding:6px 12px; border:1px dashed var(--border2); border-radius:8px; background:var(--surface); color:var(--info); cursor:pointer; font-family:inherit; font-weight:600; }
.tq-add-frag:hover { border-color:var(--info); background:rgba(37,99,235,0.05); }

.tqp-wrap { margin-top:12px; display:flex; flex-direction:column; gap:12px; }
.tqp-thread { border:1px solid var(--border2); border-radius:10px; padding:10px 12px; background:var(--surface); }
.tqp-hd { font-size:12px; color:var(--muted); margin-bottom:9px; }
.tqp-hd b { color:var(--text); }
.tqp-flow { display:flex; flex-direction:column; align-items:flex-start; gap:14px; overflow-x:auto; padding-bottom:6px; }
.tqp-col { display:flex; flex-direction:column; gap:6px; min-width:150px; max-width:210px; flex:0 0 auto; }
.tqp-arrow { align-self:flex-start; margin-top:14px; color:var(--dim); font-size:16px; flex:0 0 auto; }
.tqp-node { display:flex; align-items:flex-start; gap:6px; font-size:11.5px; line-height:1.35; padding:7px 9px; border:1px solid var(--border2); border-left:4px solid var(--dim); border-radius:7px; background:var(--card); }
.tqp-node-sm { font-size:11px; padding:5px 8px; background:var(--surface); }
.tqp-badge { font-size:9px; font-weight:700; color:#fff; padding:1px 5px; border-radius:4px; flex:0 0 auto; margin-top:1px; }
.tqp-txt { overflow-wrap:anywhere; }
.tqp-tans { display:flex; flex-direction:column; gap:5px; padding-left:12px; border-left:2px dashed var(--border2); margin-left:6px; }
.tqp-orphans { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--border2); }
.tqp-orph-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); font-weight:700; }

/* Nested tree preview (children branch to the right, tangents below) */
.tqp-tnode { display:flex; align-items:center; gap:4px; }
.tqp-tself { display:flex; flex-direction:column; gap:5px; flex:0 0 auto; min-width:150px; max-width:215px; }
.tqp-isroot .tqp-node { border-color:var(--accent,#2563eb); box-shadow:0 0 0 2px rgba(37,99,235,0.16); }
.tqp-anchor-lbl { font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent,#2563eb); }
.tqp-tkids { display:flex; flex-direction:column; gap:8px; }
.tqp-tkid { display:flex; align-items:center; gap:4px; }
.tqp-edge { color:var(--dim); font-size:15px; flex:0 0 auto; }
.tqp-secondary { display:flex; flex-direction:column; gap:5px; margin-left:8px; padding:8px 0 0 10px; border-left:2px dashed var(--border2); }
.tqp-sec-lbl { font-size:10px; font-weight:700; color:#3730a3; }

/* Reorder buttons in the fragment card head */
.frag-move { background:none; border:1px solid var(--border2); border-radius:5px; cursor:pointer; font-size:11px; line-height:1; padding:3px 6px; color:var(--muted); }
.frag-move:hover { border-color:var(--info); color:var(--info); }
.frag-move:disabled { opacity:0.3; cursor:default; }

/* ── Relation rows (Primary Source / Capture / Goals) ── */
.rel-row { display:flex; align-items:center; gap:8px; margin-top:8px; padding:8px 10px; border-radius:8px; background:var(--card); flex-wrap:wrap; }
.rel-kind { font-size:10px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:2px 7px; border-radius:5px; flex-shrink:0; }
.rel-kind-primary { background:#fde68a; color:#92400e; }
.rel-kind-capture { background:#bfdbfe; color:#1e40af; }
.rel-kind-goals   { background:#ddd6fe; color:#5b21b6; }
.rel-text { font-size:13px; color:var(--text); flex:1; min-width:140px; line-height:1.4; }
.rel-text .rel-db { font-weight:600; }
.rel-stat { font-size:12px; font-weight:600; white-space:nowrap; }
.rel-stat-found { color:#166534; }
.rel-stat-missing { color:#991b1b; }
.rel-stat-checking { color:#6b7280; }
.rel-pencil { background:none; border:none; cursor:pointer; font-size:14px; padding:2px 4px; border-radius:5px; flex-shrink:0; opacity:0.7; }
.rel-pencil:hover { opacity:1; background:var(--surface); }
.rel-del { background:none; border:none; cursor:pointer; font-size:13px; color:var(--danger); padding:2px 4px; opacity:0.6; flex-shrink:0; }
.rel-del:hover { opacity:1; }

/* ── Inline search picker ── */
.rel-search { margin-top:6px; margin-bottom:2px; border:1px solid var(--border2); border-radius:8px; padding:9px; background:var(--surface); }
.rel-search-bar { display:flex; gap:6px; align-items:center; margin-bottom:7px; flex-wrap:wrap; }
.rel-db-sel { font-size:12px; padding:6px 8px; border:1px solid var(--border2); border-radius:7px; background:var(--surface); color:var(--text); font-family:inherit; }
.rel-search-input { flex:1; min-width:140px; font-size:13px; padding:7px 10px; border:1px solid var(--border2); border-radius:7px; }
.rel-results { display:flex; flex-direction:column; gap:3px; max-height:230px; overflow-y:auto; }
.rel-result { display:block; width:100%; text-align:left; font-size:13px; padding:7px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); cursor:pointer; }
.rel-result:hover { border-color:var(--info); background:var(--surface); }
.rel-search-hint { font-size:11px; color:var(--muted); padding:4px 2px; }

/* ── Add-relation toggle ── */
.add-rel-wrap { margin-top:8px; }
.add-rel-btn { font-size:12px; color:var(--info); background:none; border:1px dashed var(--border2); border-radius:7px; padding:6px 12px; cursor:pointer; width:100%; }
.add-rel-btn:hover { border-color:var(--info); background:rgba(37,99,235,0.04); }

/* ── Inherited goals chip ── */
.inherit-chip { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 9px; border-radius:6px; background:#f5f3ff; color:#6d28d9; border:1px dashed #c4b5fd; }

/* Auto-grown fragment text: no fixed rows, expands to content via JS */
.frag-title-input { width:100%; font-size:14px; line-height:1.55; padding:10px 12px; border:1px solid var(--border2); border-radius:8px; overflow:hidden; resize:vertical; }


/* ════ Processing Inbox ════ */
.main.main-wide { max-width: 920px; }
.ib-lanes { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.ib-count { display:inline-block; min-width:18px; margin-left:4px; font-size:11px; opacity:.75; }
.ib-notice { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12.5px; color:#1e40af; background:#eff6ff; border:1px solid #bfdbfe; border-radius:9px; padding:9px 12px; margin-bottom:12px; }
.ib-empty { font-size:13.5px; color:var(--muted); line-height:1.65; }
.ib-empty b { color:var(--text); }
.ib-muted { font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px; }
.ib-hint { font-size:12.5px; color:var(--muted); line-height:1.55; margin:2px 0 8px; }
.ib-q { display:block; font-size:14px; font-weight:600; color:var(--text); margin-bottom:4px; }
.ib-sub { font-size:11.5px; font-weight:600; color:var(--dim); margin:10px 0 6px; }
.ib-grow { flex:1; }
.ib-row-end { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
.ib-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.ib-x { border:none; background:none; color:var(--dim); cursor:pointer; font-size:14px; line-height:1; padding:0 2px; font-family:inherit; }
.ib-x:hover { color:var(--danger); }
.ib-mini { border:1px solid var(--border2); background:var(--surface); color:var(--muted); border-radius:6px; font-size:12px; padding:1px 7px; cursor:pointer; font-family:inherit; }
.ib-mini:hover { color:var(--info); border-color:var(--info); }
.ib-linkbtn { border:none; background:none; color:var(--info); cursor:pointer; font-size:12px; font-family:inherit; padding:0; }
.ib-linkbtn:hover { text-decoration:underline; }
textarea.ib-auto { resize:none; overflow:hidden; line-height:1.5; }
.main-wide :focus-visible { outline:2px solid #93c5fd; outline-offset:2px; }

/* item lists */
.ib-list { display:flex; flex-direction:column; gap:6px; }
.ib-lanehead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.ib-item { display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer; font-family:inherit; color:var(--text); transition:border-color .12s; }
.ib-item:hover { border-color:var(--border2); background:#fcfcfb; }
.ib-item-main { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }

.ib-item-rels { display:flex; flex-wrap:wrap; gap:4px; }
.ib-item-side { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0; }
.ib-item-st { font-size:11.5px; color:var(--dim); }
.ib-item-draft { color:var(--info); font-weight:600; }

/* relation chips */
.ib-relrow { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.ib-rel { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:2px 8px; border-radius:6px; background:var(--card); border:1px solid var(--border); color:var(--text); max-width:320px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ib-rel-goals { background:#f5f3ff; border-color:#ddd6fe; color:#5b21b6; }
.ib-rel-kb { background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
.ib-addrel { font-size:11.5px; padding:2px 9px; border-radius:6px; border:1px dashed var(--border2); background:transparent; color:var(--info); cursor:pointer; font-family:inherit; }
.ib-picker { margin-top:10px; border:1px solid var(--border2); border-radius:9px; padding:10px; background:var(--card); }
.ib-picker-row { display:flex; gap:8px; margin-bottom:8px; }
.ib-picker-row input { flex:1; }

/* workspace header + stepper */
.ib-head { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
.ib-back { border:none; background:none; color:var(--muted); font-size:13px; cursor:pointer; font-family:inherit; padding:4px 0; }
.ib-back:hover { color:var(--text); }
.ib-notion { font-size:12px; color:var(--info); text-decoration:none; }
.ib-notion:hover { text-decoration:underline; }
.ib-title { font-size:20px; font-weight:600; letter-spacing:-.3px; line-height:1.3; margin-bottom:14px; }
.ib-steps { display:flex; gap:0; margin-bottom:14px; border:1px solid var(--border2); border-radius:10px; overflow:hidden; background:var(--surface); }
.ib-step { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:9px 6px; border:none; border-right:1px solid var(--border); background:transparent; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; }
.ib-step:last-child { border-right:none; }
.ib-step:disabled { opacity:.4; cursor:not-allowed; }
.ib-step-n { width:19px; height:19px; border-radius:50%; border:1.5px solid currentColor; display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; }
.ib-step.past { color:var(--text); }
.ib-step.past .ib-step-n { background:var(--text); color:#fff; border-color:var(--text); }
.ib-step.on { background:var(--text); color:#fff; }
.ib-step.on .ib-step-n { border-color:#fff; }
@media (max-width:560px){ .ib-step { font-size:0; gap:0; } .ib-step-n { font-size:10.5px; } .ib-step.on { font-size:12px; gap:6px; } }

/* reading surface — the one quiet, bookish place in the app */
.ib-readblock { padding:28px 32px; }
.ib-read { font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; font-size:16.5px; line-height:1.72; color:#24221d; max-width:66ch; margin-top:14px; }
.ib-read p { margin:0 0 .8em; }
.ib-read .ib-h1 { font-size:21px; font-weight:600; margin:1.2em 0 .45em; line-height:1.3; }
.ib-read .ib-h2 { font-size:18px; font-weight:600; margin:1.1em 0 .4em; }
.ib-read .ib-h3 { font-size:16.5px; font-weight:700; margin:1em 0 .35em; }
.ib-read .ib-li { position:relative; padding-left:18px; margin:0 0 .35em; }
.ib-read .ib-li::before { content:''; position:absolute; left:4px; top:.72em; width:5px; height:5px; border-radius:50%; background:#a8a59e; }
.ib-read .ib-quote { border-left:3px solid var(--border2); padding:2px 0 2px 14px; color:#4a4740; margin:.6em 0; }
.ib-read .ib-code { font-family:'SF Mono','Fira Code',monospace; font-size:12.5px; background:var(--card); padding:10px 12px; border-radius:7px; white-space:pre-wrap; margin:.6em 0; }
.ib-read .ib-hr { border:none; border-top:1px solid var(--border); margin:1.2em 0; }
.ib-read .ib-fig { margin:.8em 0; }
.ib-read .ib-fig img { max-width:100%; border-radius:8px; border:1px solid var(--border); }
.ib-read figcaption { font-size:13px; color:var(--muted); margin-top:4px; }
@media (max-width:560px){ .ib-readblock { padding:18px 16px; } .ib-read { font-size:16px; } }

/* fragmenting */
.ib-aibox { margin-top:12px; padding:14px; border-radius:9px; background:var(--card); font-size:13px; }
.ib-aibox > div:first-child { display:flex; align-items:center; gap:8px; }
.ib-ai-last { margin-top:8px; font-family:'Iowan Old Style',Georgia,serif; color:var(--muted); font-size:14px; min-height:1.4em; }
.ib-staged { margin-top:12px; font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

/* shaping */
.ib-shapebar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
.ib-tally { display:flex; gap:10px; font-size:12px; font-weight:600; color:var(--text); }
.ib-tally span { display:inline-flex; align-items:center; gap:5px; }
.ib-tally i, .ib-sw { display:inline-block; width:8px; height:8px; border-radius:50%; }
.ib-sw { margin-right:2px; }
.ib-frag { position:relative; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--tc); border-radius:10px; padding:10px 12px 10px 12px; margin-bottom:8px; transition:border-color .12s, box-shadow .12s; }
.ib-frag.ib-drop { box-shadow:0 0 0 2px var(--info); border-color:var(--info); }
.ib-frag-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.ib-handle { cursor:grab; color:var(--dim); font-size:16px; line-height:1; padding:4px 4px; border-radius:5px; touch-action:none; user-select:none; }
.ib-handle:hover { color:var(--text); background:var(--card); }
body.ib-dragging, body.ib-dragging * { cursor:grabbing !important; user-select:none; }
.ib-num { font-size:11.5px; font-weight:700; color:var(--muted); min-width:22px; }
.ib-tool { font-size:11.5px; padding:2px 7px; border:1px solid transparent; background:none; color:var(--muted); border-radius:6px; cursor:pointer; font-family:inherit; }
.ib-tool:hover:not(:disabled) { border-color:var(--border2); color:var(--text); background:var(--surface); }
.ib-tool:disabled { opacity:.3; cursor:default; }
.ib-tool-del:hover:not(:disabled) { color:var(--danger); border-color:#fca5a5; }
.ib-frag-text { font-size:14px; min-height:40px; }
.ib-conns { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:7px; }
.ib-conns .conn-chip .ib-x { font-size:12px; color:inherit; opacity:.6; }
.ib-loose { font-size:11px; color:#b45309; }
.ib-addrow { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
.ib-ghost { position:fixed; z-index:3000; pointer-events:none; background:var(--text); color:#fff; font-size:12px; padding:6px 10px; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.25); max-width:280px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* connecting */
.ib-note { border:1px solid var(--border); border-radius:8px; padding:8px; margin-bottom:6px; background:var(--card); }
.ib-note-tools { display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap; }
.ib-note-tools .viz-sel { max-width:260px; font-size:11.5px; padding:4px 7px; }
.ib-walk { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.ib-dots { flex:1; display:flex; flex-wrap:wrap; gap:5px; justify-content:center; }
.ib-dot-btn { width:14px; height:14px; border-radius:50%; border:2px solid var(--tc); background:transparent; cursor:pointer; padding:0; }
.ib-dot-btn.has { background:var(--tc); }
.ib-dot-btn.on { box-shadow:0 0 0 3px rgba(26,25,22,.18); transform:scale(1.2); }
.ib-focus-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.ib-focus-text { font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; font-size:19px; line-height:1.55; color:#24221d; margin:10px 0 4px; max-width:62ch; }
.ib-cands { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px; }
@media (max-width:720px){ .ib-cands { grid-template-columns:1fr; } }
.ib-col { min-width:0; }
.ib-col-h { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; font-size:12.5px; font-weight:700; color:var(--text); }
.ib-col-h small { font-weight:400; color:var(--dim); font-size:11.5px; flex:1; }
.ib-far { border:1.5px dashed #c4b5fd; border-radius:11px; padding:10px; background:linear-gradient(180deg, rgba(139,92,246,.045), rgba(139,92,246,0)); }
.ib-far .ib-col-h span { color:#6d28d9; }
.ib-cand { border:1px solid var(--border); border-radius:9px; margin-bottom:6px; background:var(--surface); overflow:hidden; }
.ib-cand.open { border-color:var(--info); }
.ib-cand.linked { opacity:.55; }
.ib-cand-main { display:flex; gap:9px; width:100%; text-align:left; border:none; background:none; padding:9px 10px; cursor:pointer; font-family:inherit; color:var(--text); }
.ib-cand-main:hover:not(:disabled) { background:#fafaf8; }
.ib-cand-main:disabled { cursor:default; }
.ib-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.ib-cand-body { display:flex; flex-direction:column; gap:2px; min-width:0; }
.ib-cand-t { font-size:13px; line-height:1.4; }
.ib-cand-m { font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ib-cand-q { font-size:12.5px; color:#6d28d9; font-style:italic; line-height:1.45; margin-top:3px; }
.ib-compose { padding:10px; border-top:1px solid var(--border); background:#f8fafc; }
.ib-compose textarea { margin-top:8px; }
.ib-compose .ib-cand-q { margin:6px 0 0; }
.ib-ai { margin-top:8px; }
.ib-ai-h { font-size:11.5px; font-weight:700; color:#6d28d9; margin:4px 0 6px; display:flex; align-items:center; gap:6px; }
.ib-ai-btn { width:100%; border-style:dashed; color:#6d28d9; border-color:#c4b5fd; background:transparent; }
.ib-search { margin-top:12px; }
.ib-results { margin-top:8px; }
.ib-linked, .ib-own { margin-top:14px; }
.ib-own textarea { margin-top:4px; }
.ib-link-row { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); }
.ib-link-row:last-child { border-bottom:none; }
.ib-link-mode { font-size:10.5px; font-weight:700; color:var(--info); background:#eff6ff; border-radius:5px; padding:2px 6px; white-space:nowrap; margin-top:1px; }
.ib-link-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.ib-link-t { font-size:12.5px; color:var(--muted); }
.ib-link-why { font-size:13.5px; color:var(--text); }

/* commit */
.ib-summary { display:flex; flex-direction:column; gap:4px; margin:14px 0 6px; font-size:13.5px; }
.ib-summary .ib-muted { display:inline; margin-left:4px; }
.ib-warn { margin-top:10px; font-size:12.5px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:8px 11px; }
.ib-log { margin-top:10px; font-size:12px; color:var(--muted); max-height:180px; overflow:auto; }
.ib-log-err { color:var(--danger); }
.ib-done-t { font-size:17px; font-weight:600; margin-bottom:6px; }

/* stand-alone triage */
.ib-sa-idea { font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif; font-size:21px; line-height:1.5; color:#24221d; margin-bottom:12px; }
.ib-sa-body { margin-top:10px; font-size:13px; }
.ib-sa-body summary { cursor:pointer; color:var(--muted); font-size:12.5px; }
.ib-sa-body .ib-read { font-size:15px; }
.ib-pairsel { width:100%; margin-bottom:8px; }
.ib-astype { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; color:var(--muted); }
.ib-outcome { font-size:13px; color:var(--text); padding:10px 14px; border-radius:9px; background:var(--card); margin-bottom:10px; }
.ib-sa-actions { margin-top:0; }
@media (prefers-reduced-motion: reduce){ .ib-frag, .ib-dot-btn { transition:none; } .ib-dot-btn.on { transform:none; } }

/* ════ Library ════ */
.main.main-lib { max-width: 1320px; padding-top: 18px; }
body.on-lib, html.on-lib { background: #ece4d3; }
.lib {
  --paper:#f3ecdd; --paper-2:#e8dec9; --card:#fbf7ee; --rule:#d9ccb1;
  --ink:#2a221b; --ink-soft:#6a5c4d; --ink-faint:#9a8b78;
  --walnut:#3d281d; --walnut-2:#2b1b13; --oak:#a06f45; --brass:#b88d3f; --ribbon:#9b2a24;
  --display:'Cormorant Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --text:'Source Serif 4','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  display:grid; grid-template-columns: 264px minmax(0,1fr); gap:0;
  min-height: calc(100vh - 36px); border-radius:6px; overflow:hidden;
  background: linear-gradient(90deg, var(--walnut-2) 0 264px, var(--paper) 264px); color: var(--ink);
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 18px 40px -26px rgba(52,32,18,.55), 0 0 0 1px #d6c8ab;
}
.lib-wait { display:flex; align-items:center; justify-content:center; grid-template-columns:1fr; }
.lib-wait-in { font-family:var(--display); font-size:22px; font-style:italic; color:var(--ink-soft); display:flex; gap:12px; align-items:center; }
:where(.lib) button { font-family:inherit; }
.lib :focus-visible { outline:2px solid var(--brass); outline-offset:2px; }

/* the stacks: walnut panel */
.lib-stacks {
  position:sticky; top:0; align-self:start; height:calc(100vh - 36px); overflow:auto;
  padding:18px 10px 24px;
  color:#efe3c8;
  background:
    repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(88deg, rgba(0,0,0,.05) 0 1px, transparent 1px 13px),
    linear-gradient(180deg, var(--walnut), var(--walnut-2));
  box-shadow: inset -10px 0 18px -12px rgba(0,0,0,.6);
  scrollbar-width: thin; scrollbar-color: #6b4a35 transparent;
}
.lib-stacks-h { display:block; width:100%; text-align:left; background:none; border:none; color:#f7ecd2; font-family:var(--display); font-size:22px; font-weight:600; padding:4px 10px 12px; cursor:pointer; border-bottom:1px solid rgba(239,227,200,.14); margin-bottom:8px; }
.lib-stacks-h.sel { color:var(--brass); }
.lt-row { display:flex; align-items:center; gap:2px; padding-left:calc(var(--d) * 14px); border-radius:4px; position:relative; }
.lt-row:hover { background:rgba(239,227,200,.07); }
.lt-row.sel { background:rgba(184,141,63,.2); }
.lt-row.sel::before { content:''; position:absolute; left:0; top:4px; bottom:4px; width:3px; border-radius:2px; background:var(--brass); }
.lt-chev, .lt-chev-sp { width:22px; height:26px; flex:0 0 22px; }
.lt-chev { display:flex; align-items:center; justify-content:center; background:none; border:none; color:#c9b48d; cursor:pointer; border-radius:4px; }
.lt-chev svg { transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.lt-node.open > .lt-row .lt-chev svg { transform: rotate(90deg); }
.lt-name { flex:1; min-width:0; text-align:left; background:none; border:none; color:#efe3c8; font-family:var(--text); font-size:14px; padding:5px 4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lt-row.sel .lt-name { color:#fff7e3; font-weight:600; }
.lt-count { font-size:11px; color:var(--brass); padding:0 8px 0 4px; font-variant-numeric:tabular-nums; }
.lt-kids { display:grid; grid-template-rows:0fr; transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1); }
.lt-node.open > .lt-kids { grid-template-rows:1fr; }
.lt-kids-in { overflow:hidden; min-height:0; }
.lt-unfiled { display:flex; justify-content:space-between; width:100%; margin-top:14px; padding:8px 10px; background:none; border:1px dashed rgba(239,227,200,.25); border-radius:4px; color:#d9c9a6; font-family:var(--text); font-size:13.5px; font-style:italic; cursor:pointer; }
.lt-unfiled.sel { border-color:var(--brass); color:#fff7e3; }

/* the room */
.lib-room { min-width:0; padding:26px 40px 64px; }
.lib-stacks-toggle { display:none; }
.lib-crumb { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:12.5px; color:var(--ink-faint); margin-bottom:10px; view-transition-name: lib-crumb; }
.lib-crumb button { background:none; border:none; padding:0; color:var(--ink-soft); cursor:pointer; font-size:12.5px; }
.lib-crumb button:hover { color:var(--ink); text-decoration:underline; text-decoration-color:var(--brass); }
.lib-sep { width:4px; height:4px; background:var(--brass); transform:rotate(45deg); display:inline-block; opacity:.8; }
.lib-hub-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.lib-h1 { font-family:var(--display); font-size:48px; font-weight:600; line-height:1.02; letter-spacing:-.6px; margin:0; color:var(--ink); }
.lib-lede { font-family:var(--text); font-size:17px; line-height:1.6; color:var(--ink-soft); margin:10px 0 18px; max-width:62ch; }
.lib-tick { font-variant-numeric: tabular-nums; color:var(--ink); font-weight:600; }
.lib-link { background:none; border:none; padding:0; color:var(--ink); text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:3px; cursor:pointer; font-size:inherit; margin-left:6px; }
.lib-h2 { font-family:var(--display); font-style:italic; font-weight:500; font-size:30px; color:var(--ink); margin:38px 0 14px; display:flex; align-items:center; gap:16px; }
.lib-h2::after { content:''; flex:1; height:1px; background:linear-gradient(90deg, var(--rule), transparent); }
.lib-h3 { font-family:var(--display); font-size:21px; font-weight:600; margin:22px 0 4px; color:var(--ink-soft); }
.lib-note { font-family:var(--text); font-size:15px; color:var(--ink-soft); margin-top:22px; }
.lib-more { font-size:12px; color:var(--ink-faint); align-self:center; }
.lib-grow { flex:1; }
.lib-viewseg { display:inline-flex; background:var(--paper-2); border:1px solid var(--rule); border-radius:999px; padding:3px; }
.lib-viewseg button { border:none; background:none; padding:6px 14px; border-radius:999px; font-size:13px; color:var(--ink-soft); cursor:pointer; transition: background .2s, color .2s; }
.lib-viewseg button.on { background:var(--ink); color:var(--paper); }

/* subtopic distribution */
.lib-dist { display:flex; height:34px; border-radius:4px; overflow:hidden; gap:2px; margin:4px 0 6px; }
.lib-dist-seg { min-width:18px; border:none; cursor:pointer; padding:0 8px; display:flex; align-items:center; color:#fbf4e4; font-size:12px; font-family:var(--text);
  background: color-mix(in srgb, var(--wing) calc(100% - var(--k) * 11%), #c9b893); transition: filter .2s; transform-origin:left; }
.lib-dist-seg span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lib-dist-seg:hover { filter:brightness(1.15); }

/* shelves of books — the memorable thing */
.lib-shelf { margin:18px 0 26px; }
.lib-shelf-h { display:flex; align-items:baseline; gap:12px; margin-bottom:6px; }
.lib-shelf-name { background:none; border:none; padding:0; font-family:var(--display); font-size:23px; font-weight:600; color:var(--ink); cursor:pointer; text-align:left; }
.lib-shelf-name:not(.plain):hover { text-decoration:underline; text-decoration-color:var(--brass); text-underline-offset:4px; }
.lib-shelf-name.plain { cursor:default; }
.lib-shelf-n { font-size:12.5px; color:var(--ink-faint); }
.lib-shelf-row { display:flex; align-items:flex-end; gap:14px; overflow-x:auto; padding:16px 6px 0; scrollbar-width:thin; scrollbar-color:var(--oak) transparent; }
.lib-ledge { height:15px; margin-top:-1px; border-radius:2px;
  background: linear-gradient(180deg, #c48d5c 0, #a8744a 3px, #8a5a36 9px, #6f4529 15px);
  box-shadow: 0 10px 14px -8px rgba(60,35,18,.55), inset 0 1px 0 rgba(255,236,200,.35); }
.lib-book {
  position:relative; flex:0 0 146px; height:198px; border-radius:2px 5px 5px 2px; cursor:pointer;
  background:
    linear-gradient(90deg, rgba(0,0,0,.34) 0 8px, rgba(255,255,255,.1) 8px 10px, rgba(0,0,0,.06) 10px 12px, transparent 12px),
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px),
    var(--cloth);
  box-shadow: 0 1px 0 rgba(0,0,0,.2), 2px 3px 8px -3px rgba(40,22,10,.55);
  display:flex; flex-direction:column; padding:14px 10px 9px 18px; color:#f4e8cd;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;
}
.lib-book:hover, .lib-book:focus-visible { transform: translateY(-7px); box-shadow: 0 1px 0 rgba(0,0,0,.2), 4px 12px 18px -8px rgba(40,22,10,.6); }
.lib-label { background:#f5ecd6; border:1px solid #cfae6a; outline:1px solid rgba(207,174,106,.55); outline-offset:2px; padding:9px 9px; color:var(--ink); flex:1; min-height:0; overflow:hidden; border-radius:1px; }
.lib-book-t { font-family:var(--display); font-size:16.5px; font-weight:600; line-height:1.18; display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
.lib-book-foot { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:9px; font-size:11px; font-variant-numeric:tabular-nums; }
.lib-dots { display:flex; flex-wrap:wrap; gap:2.5px; max-width:96px; }
.ld { width:5px; height:5px; border-radius:50%; display:inline-block; }
.ld-type-core { background:#e9dcb8; }
.ld-type-rc   { background:#c9a7e0; }
.ld-type-rcq  { background:#9fbbe6; }
.ld-type-ol   { background:#e8c25a; }
.lib-book-date { position:absolute; left:18px; bottom:-20px; font-size:10.5px; color:var(--ink-faint); white-space:nowrap; opacity:0; transition:opacity .2s; }
.lib-book:hover .lib-book-date { opacity:1; }
.lib-ribbon { position:absolute; top:-3px; right:16px; width:13px; height:0; background:var(--ribbon); clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); transition: height .32s cubic-bezier(.2,.8,.2,1); box-shadow:0 2px 3px rgba(0,0,0,.3); }
.lib-book.pinned .lib-ribbon { height:42px; }
.lib-pin { position:absolute; top:6px; left:-1px; width:22px; height:24px; border:none; border-radius:0 4px 4px 0; background:rgba(20,10,5,.5); color:#f4e8cd; display:flex; align-items:center; justify-content:center; cursor:pointer; opacity:0; transition:opacity .2s; }
.lib-book:hover .lib-pin, .lib-pin:focus-visible, .lib-book.pinned .lib-pin { opacity:1; }
.lib-book.pinned .lib-pin { color:#f0c46a; }
.lib-endcap { flex:0 0 110px; height:198px; border:1.5px dashed #b9a582; border-radius:3px; background:rgba(255,255,255,.25); color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.lib-endcap span { font-family:var(--display); font-size:22px; font-weight:600; color:var(--ink); }
.lib-endcap small { font-size:11.5px; }
.lib-endcap:hover { background:rgba(255,255,255,.55); }

/* wings of the reading room */
.lib-wings { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:16px; margin:8px 0 10px; }
.lib-wing { position:relative; text-align:left; border:1px solid var(--rule); background:var(--card); border-radius:4px; padding:16px 16px 0; cursor:pointer; display:flex; flex-direction:column; gap:2px; overflow:hidden; transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s; }
.lib-wing:hover { transform:translateY(-3px); box-shadow:0 12px 22px -16px rgba(60,35,18,.6); }
.lib-wing-t { font-family:var(--display); font-size:25px; font-weight:600; color:var(--ink); line-height:1.1; }
.lib-wing-n { font-size:12.5px; color:var(--ink-faint); }
.lib-wing-spines { display:flex; align-items:flex-end; gap:2px; height:58px; margin-top:12px; padding:0 2px; border-bottom:7px solid #8a5a36; }
.lib-wing-spines i { flex:1; max-width:13px; height:var(--h); border-radius:1px 1px 0 0; background: color-mix(in srgb, var(--cloth) calc(100% - var(--s)), #e3d2ad); }

/* catalog (list) */
.lib-catalog { display:flex; flex-direction:column; gap:8px; }
.lib-card { display:flex; align-items:stretch; gap:14px; width:100%; text-align:left; border:1px solid var(--rule); background:var(--card); border-radius:3px; padding:0 14px 0 0; cursor:pointer; color:var(--ink); transition: transform .2s, box-shadow .2s; }
.lib-card:hover { transform:translateX(3px); box-shadow:0 6px 16px -12px rgba(60,35,18,.6); }
.lib-card-spine { width:7px; background:var(--cloth); border-radius:3px 0 0 3px; }
.lib-card.pinned .lib-card-spine { box-shadow: inset 0 -26px 0 var(--ribbon); }
.lib-card-body { flex:1; min-width:0; padding:12px 0; display:flex; flex-direction:column; gap:5px; }
.lib-card-t { font-family:var(--text); font-size:16.5px; line-height:1.4; border-bottom:1px solid #e6c9b8; padding-bottom:5px; }
.lib-card-m { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12px; color:var(--ink-faint); }
.lib-card-dots { display:flex; flex-wrap:wrap; gap:3px; align-content:center; max-width:90px; }
.lib-card-dots .ld-type-core { background:#7b6a52; }

/* what I don't know yet */
.lib-loops { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:12px; }
.lib-loop { position:relative; text-align:left; border:none; cursor:pointer; padding:14px 14px 12px; color:var(--ink); display:flex; flex-direction:column; gap:8px;
  background: repeating-linear-gradient(180deg, transparent 0 23px, rgba(110,140,170,.18) 23px 24px), #fdfaf1;
  box-shadow: 0 1px 0 #e2d6bd, 0 8px 14px -12px rgba(60,35,18,.6); border-radius:2px; transition: transform .2s; }
.lib-loop:hover { transform: rotate(-.6deg) translateY(-2px); }
.lib-loop-t { font-family:var(--text); font-size:15px; line-height:1.5; }
.lib-loop.is-q .lib-loop-t { font-style:italic; color:#4a4640; }
.lib-loop.is-ol::before { content:''; position:absolute; top:-6px; right:14px; width:18px; height:14px; background:#e8c25a; border-radius:2px 2px 0 0; box-shadow:0 -1px 0 rgba(0,0,0,.08); }
.lib-loop-m { font-size:11.5px; color:var(--ink-faint); }
.lib-empties { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
.lib-empties-h { font-family:var(--display); font-style:italic; font-size:18px; color:var(--ink-soft); margin-right:4px; }
.lib-empty { font-size:12.5px; color:var(--ink-soft); border:1px dashed #bfae8c; padding:4px 10px; border-radius:2px; text-decoration:none; background:rgba(255,255,255,.25); }
.lib-empty:hover { border-style:solid; color:var(--ink); }

/* where it reaches */
.lib-reach { display:flex; flex-direction:column; gap:10px; }
.lib-reach-row { display:grid; grid-template-columns: 190px 1fr; gap:14px; align-items:start; padding:10px 0 10px 14px; border-left:4px solid var(--cloth); }
.lib-reach-wing { background:none; border:none; padding:0; text-align:left; font-family:var(--display); font-size:21px; font-weight:600; color:var(--ink); cursor:pointer; }
.lib-reach-wing:hover { text-decoration:underline; text-decoration-color:var(--brass); }
.lib-reach-threads { display:flex; flex-wrap:wrap; gap:6px; }
.lib-reach-threads button { border:1px solid var(--rule); background:var(--card); border-radius:3px; padding:5px 10px; font-size:13px; color:var(--ink); cursor:pointer; text-align:left; font-family:var(--text); }
.lib-reach-threads button:hover { border-color:var(--oak); }

/* a thread taken off the shelf */
.lib-thread { background:var(--paper); }
.lib-thread-bar { display:flex; align-items:center; gap:12px; margin:4px 0 14px; flex-wrap:wrap; }
.lib-back { display:inline-flex; align-items:center; gap:7px; background:none; border:1px solid var(--rule); border-radius:999px; padding:6px 14px 6px 11px; font-size:13px; color:var(--ink-soft); cursor:pointer; }
.lib-back:hover { color:var(--ink); border-color:var(--oak); }
.lib-pin-lg { border:1px solid var(--rule); background:var(--card); border-radius:999px; padding:6px 14px; font-size:13px; color:var(--ink-soft); cursor:pointer; }
.lib-pin-lg.on { background:var(--ribbon); border-color:var(--ribbon); color:#fbeee0; }
.lib-thread-t { font-family:var(--display); font-size:clamp(28px, 2.6vw, 38px); font-weight:600; line-height:1.08; margin:0 0 10px; max-width:30ch; border-left:6px solid var(--cloth); padding-left:16px; }
.lib-thread-topics { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
.lib-topic { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--card); border-radius:999px; padding:4px 11px 4px 9px; font-size:12.5px; color:var(--ink); cursor:pointer; }
.lib-topic::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--cloth); }
.lib-reader.viz-reader { position:static; flex:none; width:auto; max-width:780px; max-height:none; height:auto; overflow:visible; background:var(--card); border:1px solid var(--rule); border-radius:3px; box-shadow:0 14px 30px -24px rgba(60,35,18,.7); }
.lib-reader .reader-x { display:none; }
.lib-reader .reader-head { border-bottom-color:var(--rule); }
.lib-reader .reader-title { visibility:hidden; }
.lib .viz-reader .spine-item { border-bottom-color:#ece1ca; padding:20px 26px; }
.lib .viz-reader .spine-item:hover { background:rgba(184,141,63,.06); }
.lib .viz-reader .spine-item.reading, .lib .viz-reader .spine-item.focused { background:rgba(184,141,63,.09); box-shadow: inset 3px 0 0 var(--brass); }
.lib .viz-reader .spine-text { font-family:var(--text); font-size:18px; line-height:1.7; color:var(--ink); }
.lib .viz-reader .spine-num { color:var(--ink-faint); }

/* map cards, rebound */
.lib .mm-wrap { border-color:var(--rule); border-radius:4px;
  background: radial-gradient(circle, rgba(120,95,60,.13) 1px, transparent 1.3px) 0 0/22px 22px, #f7f1e4; }
.lib .mm-edge { stroke:#bea57f; }
.lib .mm-node { background:var(--card) !important; border:1px solid #d4c4a4 !important; border-radius:3px; color:var(--ink); font-family:var(--text); font-weight:400; font-size:13.5px; line-height:1.45;
  box-shadow: 0 1px 0 #e5d9c0, 0 8px 16px -12px rgba(60,35,18,.55); }
.lib .mm-node:hover { box-shadow: 0 1px 0 #e5d9c0, 0 12px 20px -12px rgba(60,35,18,.6); }
.lib .mm-node[data-ftype="type-core"] { font-size:15px; font-weight:500; border-top:3px solid #2d4a3c !important; padding-top:10px; }
.lib .mm-node[data-ftype="type-rc"] { background:#f6efe1 !important; font-style:italic; font-size:13px; color:#4d4136; border-left:3px solid var(--brass) !important; }

.lib .mm-node[data-ftype="type-ol"]::after { content:''; position:absolute; top:-5px; right:12px; width:12px; height:22px; background:#e1b64c; clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%); }

/* full screen stops at the app sidebar (expanded or railed) instead of sliding under it */
@media (min-width: 721px) {

}

.lib .viz-reader .reader-head { border-bottom-color:var(--rule); }
.lib .viz-reader.lib-side .reader-title { font-family:var(--display); font-size:19px; font-weight:600; }
@keyframes libSlideIn { from { opacity:0; transform: translateX(16px); } }
.lib .mm-legend { font-family:var(--text); color:var(--ink-soft); gap:14px; }
.lib .mm-legend .lg .dot { width:18px !important; height:12px !important; border-radius:2px !important; background:var(--card) !important; border:1px solid #cdbb98; box-sizing:border-box; display:inline-block; margin-right:5px; vertical-align:-2px; }
.lib .mm-legend .lg[data-ftype="type-core"] .dot { border-top:3px solid #2d4a3c; }
.lib .mm-legend .lg[data-ftype="type-rc"] .dot { background:#f6efe1 !important; border-left:3px solid var(--brass); }
.lib .mm-legend .lg[data-ftype="type-rcq"] .dot { border:1px dashed #8f8a82; background:#fbfaf6 !important; }
.lib .mm-legend .lg[data-ftype="type-ol"] .dot { border-bottom:2px dashed #c9a24a; position:relative; }
.lib .mm-legend .lg[data-ftype="type-ol"] .dot::after { content:''; position:absolute; top:-3px; right:2px; width:5px; height:8px; background:#e1b64c; clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%); }
.lib .mm-legend .lg[data-ftype="type-rc"], .lib .mm-legend .lg[data-ftype="type-rcq"] { font-style:italic; }
@media (max-width: 860px){ .lib-split { flex-direction:column; } .lib .viz-reader.lib-side { position:static; width:100%; flex:none; max-height:none; } }

/* motion: one reveal on arrival, the rest answers your actions */
.lib-enter .lib-book { animation: libRise .55s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(min(var(--i), 10) * 35ms); }
.lib-enter .lib-dist-seg { animation: libGrow .6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes libRise { from { opacity:0; transform: translateY(18px); } }
@keyframes libGrow { from { transform: scaleX(0); } }
::view-transition-old(lib-hub) { animation: libOut .2s ease both; }
::view-transition-new(lib-hub) { animation: libIn .38s cubic-bezier(.2,.8,.2,1) both; }
::view-transition-group(lib-open) { animation-duration:.45s; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
::view-transition-group(lib-crumb) { animation-duration:.35s; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration:.18s; }
@keyframes libOut { to { opacity:0; transform: translateY(-6px); } }
@keyframes libIn { from { opacity:0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation:none !important; }
  .lib-enter .lib-book, .lib-enter .lib-dist-seg { animation:none; }
  .lib-book, .lib-wing, .lib-card, .lib-loop, .lt-kids, .lt-chev svg, .lib-ribbon { transition:none; }
}

  .lib-stacks { position:fixed; inset:0 auto 0 0; width:min(86vw, 320px); height:100vh; z-index:1200; transform:translateX(-104%); transition:transform .32s cubic-bezier(.2,.8,.2,1); }

  .lib-room { padding:18px 16px 50px; }
  .lib-h1 { font-size:36px; }
  .lib-thread-t { font-size:30px; }
  .lib-book { flex-basis:124px; height:172px; }
  .lib-endcap { height:172px; }
  .lib-reach-row { grid-template-columns:1fr; gap:6px; }
}
