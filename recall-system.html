  render();
}
function vizCloseReader(){ vs.reader=null; vs.edit=null; vs.sel=null; vs.rename=null; render(); }
function vizToggleTangent(ev, id){
  const R=vs.reader; if(!R) return;
  if(!R.expanded) R.expanded=new Set();
  if(R.expanded.has(id)) R.expanded.delete(id); else R.expanded.add(id);
  // True in-place toggle: re-render ONLY the spine-item that contains the
  // clicked chip and swap that one element. The expansion always appears below
  // the chip, and nothing above it (or in the rest of the reader) is rebuilt,
  // so the scroll position is left completely untouched — no readjustment.
  const item = ev && ev.target && ev.target.closest ? ev.target.closest('.spine-item') : null;
  if(item && item.id && item.id.indexOf('spine-')===0){
    const coreId = item.id.slice('spine-'.length);
    const sp = vizThreadSpine(R.compIdx);
    const tree = mmBuildTree(vs.comps[R.compIdx]);
    const pos = tree.displayOrder.indexOf(coreId);
    const tmp = document.createElement('div');
    tmp.innerHTML = renderSpineItem(R, coreId, pos>=0 ? pos+1 : null, sp.tangentsOf[coreId]||[]);
    const fresh = tmp.firstElementChild;
    if(fresh){ item.replaceWith(fresh); vizSyncMapHighlight(); return; }
  }
  // Fallback (shouldn't normally hit): reader-only re-render, scroll preserved.
  vizUpdateReader();
}
// Expand every tangent in the thread, or collapse all if any are open.
function vizToggleAllTangents(){
  const R=vs.reader; if(!R) return;
  const sp = vizThreadSpine(R.compIdx);
  if(R.expanded && R.expanded.size){ R.expanded=new Set(); vizUpdateReader(); return; }
  const all=new Set();
  // expand all directly-attached tangents (one level); deeper levels stay click-to-open
  for(const cid of sp.spine) (sp.tangentsOf[cid]||[]).forEach(t=>all.add(t));
  sp.orphans.forEach(t=>all.add(t));
  R.expanded=all; vizUpdateReader();
}
// Re-render ONLY the reader panel (not the heavy map DOM) and restore the
// reader's internal scroll so expanding a tangent opens in place — the reader
// no longer jumps to the top or loses your place in a long thread.
function vizUpdateReader(){
  const wrap = document.querySelector('.viz-reader');
  if(!wrap){ render(); return; }
  const oldBody = wrap.querySelector('.reader-body');
  const savedTop = oldBody ? oldBody.scrollTop : 0;
  wrap.innerHTML = renderReader();
  const newBody = wrap.querySelector('.reader-body');
  if(newBody) newBody.scrollTop = savedTop;
  if(_editFocusKey){
    const el = document.getElementById(_editFocusKey);
    if(el){ el.focus({preventScroll:true}); const v=el.value; if(v!=null){ el.value=''; el.value=v; } }
    _editFocusKey = null;   // one-shot
  }
  vizBindReaderScroll();
  vizSyncMapHighlight();
}
// Wire the reader to the map: scrolling updates the highlight to the fragment
// at the top of the viewport; clicking a fragment highlights that one. Throttled.
let _rdrScrollRAF = null;
function vizBindReaderScroll(){
  const body = document.querySelector('.viz-reader .reader-body');
  if(!body) return;
  body.onscroll = ()=>{
    if(_rdrScrollRAF) return;
    _rdrScrollRAF = requestAnimationFrame(()=>{ _rdrScrollRAF=null; vizSyncMapHighlight(); });
  };
  body.onclick = vizReaderClick;
}
// Apply the "current fragment" highlight to a specific id: a blue marker on the
// reader item and a blue ring on the matching map node (both cleared elsewhere).
// Click a connection in the editor to find that fragment on the map: pan to it
// and ring it (amber, distinct from the blue "currently editing" ring).
function vizLocateFragment(id){
  document.querySelectorAll('.mm-node.mm-located').forEach(el=>el.classList.remove('mm-located'));
  if(vs.view!=='map') return;
  const mn=document.querySelector(`.mm-node[data-node="${id}"]`);
  const canvas=document.getElementById('mm-canvas');
  if(!mn||!canvas) return;
  mn.classList.add('mm-located');
  // pan so the node sits in the middle of the visible map area
  const nx=mn.offsetLeft+mn.offsetWidth/2, ny=mn.offsetTop+mn.offsetHeight/2;
  const z=vs.mm.zoom||1;
  vs.mm.pan.x = canvas.clientWidth/2  - nx*z;
  vs.mm.pan.y = canvas.clientHeight/2 - ny*z;
  _mmApplyTransform();
}
function vizApplyHighlight(id){
  const R = vs.reader; if(R) R.cursorId = id;
  const body = document.querySelector('.viz-reader .reader-body');
  if(body){
    body.querySelectorAll('[data-frag].reading').forEach(el=>el.classList.remove('reading'));
    if(id){ const ri = body.querySelector(`[data-frag="${id}"]`); if(ri) ri.classList.add('reading'); }
  }
  document.querySelectorAll('.mm-node.mm-current').forEach(el=>el.classList.remove('mm-current'));
  if(vs.view==='map' && id){
    const mn = document.querySelector(`.mm-node[data-node="${id}"]`);
    if(mn) mn.classList.add('mm-current');
  }
}
// Determine the current reader fragment (topmost one inside the reader
// viewport) and highlight it. Drives the highlight as you scroll — UNLESS the
// editor is open (then it stays on the edited fragment) or a click just pinned
// one (then it holds through the programmatic scroll).
let _pinUntil = 0;
function vizSyncMapHighlight(){
  if(vs.sel && vs.sel.active){
    // Select mode: ring EVERY selected fragment on the map (blue), clearing the
    // single-cursor highlight. Reader items show their own selected styling.
    document.querySelectorAll('.mm-node.mm-current').forEach(el=>el.classList.remove('mm-current'));
    document.querySelectorAll('[data-frag].reading').forEach(el=>el.classList.remove('reading'));
    if(vs.view==='map'){
      vs.sel.ids.forEach(id=>{ const mn=document.querySelector(`.mm-node[data-node="${id}"]`); if(mn) mn.classList.add('mm-current'); });
    }
    return;
  }
  if(vs.edit){ vizApplyHighlight(vs.edit.id); return; }
  if(_pinUntil>Date.now() && vs.reader && vs.reader.cursorId){ vizApplyHighlight(vs.reader.cursorId); return; }
  const body = document.querySelector('.viz-reader .reader-body');
  if(!body) return;
  const items = body.querySelectorAll('[data-frag]');
  if(!items.length) return;
  const bodyTop = body.getBoundingClientRect().top;
  // Pick the item whose top is closest to (at or just past) the viewport top —
  // i.e. the one you're currently reading at the top of the panel.
  let curId=null, best=Infinity;
  items.forEach(el=>{
    const dt = el.getBoundingClientRect().top - bodyTop;
    // Prefer items at/above the fold; weight ones just below the top edge.
    const score = dt >= -12 ? dt : (1000 - dt);
    if(score < best){ best = score; curId = el.getAttribute('data-frag'); }
  });
  vizApplyHighlight(curId);
}
// Click a fragment in the reader. In select mode it toggles selection; otherwise
// it highlights the fragment (rings it on the map). Ignores chips/buttons/text-select.
function vizReaderClick(ev){
  if(ev.target.closest && ev.target.closest('.tangent-chip')) return;   // chips toggle expansion
  if(ev.target.closest && ev.target.closest('a,button')) return;        // controls do their own thing
  const sel = window.getSelection && window.getSelection();
  if(sel && !sel.isCollapsed) return;                                   // don't hijack a text selection
  const block = ev.target.closest && ev.target.closest('[data-frag]');
  if(!block) return;
  const id = block.getAttribute('data-frag');
  if(vs.sel && vs.sel.active){ vizSelToggle(id); return; }              // select mode → pick/unpick
  if(vs.edit) return;                                                   // editing → highlight stays on edited fragment
  vizApplyHighlight(id);
}

/* ════════════════════════════════════════════════════════════════════════
 * SAVE FRAGMENTS → INFO PROCESSING PAGE
 * "Select mode" lets you pick fragments from the open thread (or all of it) and
 * funnel them into a NEW Info Processing page: the fragment texts become the
 * page body (one paragraph each, in reading order) and the page is tagged
 * Status = "Saved" and Flags = "Remember & Implication: Pending" — ready to be
 * turned into flashcards by the separate card-gen process.
 * ════════════════════════════════════════════════════════════════════════ */
function vizSelStart(){
  if(!vs.reader) return;
  vs.edit=null; vs.pillsEdit=null;
  vs.sel={active:true, compIdx:vs.reader.compIdx, ids:new Set(), busy:false, msg:'', url:'', st:null};
  vizUpdateReader();
}
function vizSelCancel(){ vs.sel=null; if(vs.pillsEdit && vs.pillsEdit.bulk) vs.pillsEdit=null; vizUpdateReader(); }
function vizSelToggle(id){
  if(!vs.sel) return;
  if(vs.sel.ids.has(id)) vs.sel.ids.delete(id); else vs.sel.ids.add(id);
  vs.sel.st=null; vs.sel.msg='';
  vizUpdateReader();
}
function vizSelAll(){
  if(!vs.sel) return; const comp=vs.comps[vs.sel.compIdx]; if(!comp) return;
  vs.sel.ids=new Set(comp.nodeIds); vs.sel.st=null; vs.sel.msg=''; vizUpdateReader();
}
function vizSelClear(){ if(!vs.sel) return; vs.sel.ids=new Set(); vs.sel.st=null; vs.sel.msg=''; vizUpdateReader(); }

// All fragment ids of a thread in reading order: anchor-first spine (depth-first),
// each spine node's tangents after it, then orphans, then any stragglers.
function vizOrderedIds(compIdx){
  const comp=vs.comps[compIdx]; if(!comp) return [];
  const sp=vizThreadSpine(compIdx); const tree=mmBuildTree(comp);
  const out=[]; const seen=new Set();
  const push=id=>{ if(id!=null && !seen.has(id)){ seen.add(id); out.push(id); } };
  tree.displayOrder.forEach(id=>{ push(id); (sp.tangentsOf[id]||[]).forEach(push); });
  (sp.orphans||[]).forEach(push);
  comp.nodeIds.forEach(push);            // safety: sub-tangents / anything missed
  return out;
}

// Create the Info Processing page from the current selection.
async function vizSaveCreate(){
  const s=vs.sel; if(!s || !s.ids.size) return;
  const comp=vs.comps[s.compIdx];
  const frags = vizOrderedIds(s.compIdx).filter(id=>s.ids.has(id)).map(id=>vs.byId[id]).filter(Boolean);
  if(!frags.length) return;
  s.busy=true; s.st=null; s.msg=''; s.url=''; vizUpdateReader();
  const dbId=fmtId(getIpDb());
  const title = (comp ? vizThreadLabel(comp) : 'Saved fragments');
  const blocks = frags.map(f=>({ object:'block', type:'paragraph',
    paragraph:{ rich_text:[{type:'text', text:{content:(f.title||'').slice(0,1990)}}] } }));
  const warnings=[];
  try{
    // Page is created with its body up front (first 100 blocks); properties are
    // applied as best-effort patches so a schema mismatch can't lose the body.
    const page = await nPost('/pages', {
      parent:{database_id:dbId},
      properties:{ 'Name':{title:[{type:'text',text:{content:title}}]} },
      children: blocks.slice(0,100)
    });
    const pid = fmtId(page.id);
    // remaining body blocks in batches of 100
    for(let i=100;i<blocks.length;i+=100){
      try{ await nPatch('/blocks/'+pid+'/children', {children: blocks.slice(i,i+100)}); }
      catch(e){ warnings.push('some blocks not added'); break; }
    }
    // Status = "Saved" (status type, fallback to select)
    try{ await nPatch('/pages/'+pid, {properties:{'Status':{status:{name:'Saved'}}}}); }
    catch(e){ try{ await nPatch('/pages/'+pid, {properties:{'Status':{select:{name:'Saved'}}}}); }
      catch(e2){ warnings.push('Status not set'); } }
    // Flags = the existing "Remember & Implication: Pending" option (multi-select)
    try{ await nPatch('/pages/'+pid, {properties:{'Flags':{multi_select:[{name:'Remember & Implication: Pending'}]}}}); }
    catch(e){ warnings.push('Flags not set'); }

    s.busy=false; s.st='ok'; s.url=page.url||'';
    s.msg = `Saved ${frags.length} fragment${frags.length!==1?'s':''} to a new IP page` + (warnings.length?` · ⚠ ${warnings.join('; ')}`:'');
    vizUpdateReader();
  }catch(err){
    s.busy=false; s.st='error'; s.msg = (err && err.message) || 'Save failed'; vizUpdateReader();
  }
}

 * READER FRAGMENT EDITING — live edits to existing Info Processing rows.

 * the text/type, add or remove Builds On / Connected Fragments links, and
 * create a new connected fragment. Writes go straight to Notion; the in-memory
 * node set is then mutated and the thread graph rebuilt (no full refetch) so
 * the reader and map update immediately.

function _pillsState(ids, bulk){ return {ids, bulk:!!bulk, loading:!bulk, cat:'kb', db:'Knowledge Bank', q:'', results:null, searchSt:null, msg:'', busy:false, applyMsg:''}; }

function vizPillsInput(v){ const p=vs.pillsEdit; if(!p) return; p.q=v; _editFocusKey='viz-pills-q'; clearTimeout(_pillsTimer); _pillsTimer=setTimeout(()=>vizPillsRunSearch(v),220); }
async function vizPillsRunSearch(v){

// Reflect an add/remove in the node's read-only display arrays so the map's
// inline pills update without a reload.
function _pillsUpdateDisplay(n, reg, title, add){
  if(reg.name==='Knowledge Bank'){
    n.kb = n.kb||[];
    n.kb = add ? (n.kb.includes(title)?n.kb:[...n.kb,title]) : n.kb.filter(t=>t!==title);
  } else if(reg.kind==='goals'){
    n.goals = n.goals||[];
    n.goals = add ? (n.goals.some(g=>g.system===reg.name&&g.title===title)?n.goals:[...n.goals,{system:reg.name,title}])
                  : n.goals.filter(g=>!(g.system===reg.name&&g.title===title));
  } else {
    n.captureInstances = n.captureInstances||[];
    n.captureInstances = add ? (n.captureInstances.some(c=>c.system===reg.name&&c.title===title)?n.captureInstances:[...n.captureInstances,{system:reg.name,title}])
                             : n.captureInstances.filter(c=>!(c.system===reg.name&&c.title===title));
  }
}
async function vizPillsAdd(instId, title){
  const p=vs.pillsEdit; if(!p||p.busy) return; const reg=relDbByName(p.db); if(!reg) return;
  p.busy=true; p.applyMsg=''; vizUpdateReader();
  let added=0, dup=0, failed=0;
  for(const fid of p.ids){
    const n=vs.byId[fid]; if(!n) continue;
    n.rels = n.rels||{};
    const cur = n.rels[reg.relProp]||[];
    if(cur.some(x=>fmtId(x)===fmtId(instId))){ dup++; continue; }
    const next=[...cur, instId];
    try{ await vizPatchRel(fid, reg.relProp, next); n.rels[reg.relProp]=next; _pillsUpdateDisplay(n, reg, title, true); added++; }
    catch(e){ failed++; }
  }
  if(title && !titleCache.has(fmtId(instId))) titleCache.set(fmtId(instId), title);
  p.busy=false;
  p.applyMsg = p.bulk
    ? `Added “${title}” to ${added} fragment${added!==1?'s':''}${dup?` · ${dup} already had it`:''}${failed?` · ${failed} failed`:''}.`
    : (failed?`Couldn't add “${title}”.`:(dup?'Already on this fragment.':''));
  vizUpdateReader();   // keep reader scroll; map inline pills refresh on its next render
}
async function vizPillsRemove(dbName, id, title){

}

// PATCH a page's relation property to an explicit id array.
async function vizPatchRel(pageId, relProp, ids){
  await nPatch('/pages/'+fmtId(pageId), {properties:{[relProp]:{relation: ids.map(x=>({id:fmtId(x)}))}}});
}
// Maintain the local inverse (refinedBy) so map direction stays right without a
// refetch. addEdge=true adds (child builds on parent), false removes.
function _localBuildEdge(childId, parentId, add){
  const child=vs.byId[childId], parent=vs.byId[parentId];
  if(child){ const s=new Set(child.buildsOn||[]); if(add) s.add(parentId); else s.delete(parentId); child.buildsOn=[...s]; }
  if(parent){ const s=new Set(parent.refinedBy||[]); if(add) s.add(childId); else s.delete(childId); parent.refinedBy=[...s]; }
}
function _localConnEdge(aId, bId, add){
  const a=vs.byId[aId], b=vs.byId[bId];
  if(a){ const s=new Set(a.connected||[]); if(add) s.add(bId); else s.delete(bId); a.connected=[...s]; }
  if(b){ const s=new Set(b.connected||[]); if(add) s.add(aId); else s.delete(aId); b.connected=[...s]; }
}
// Canonical edge spec for a connection action, so an add/remove can be inverted.
function _connSpecFor(kind, eid, tid){
  if(kind==='builds')     return {type:'builds', childId:eid, parentId:tid};
  if(kind==='builds-rev') return {type:'builds', childId:tid, parentId:eid};
  if(kind==='cross')      return {type:'cross', aId:eid, bId:tid};
  return {type:'connected', aId:eid, bId:tid};
}
function _localCrossEdge(aId, bId, add){
  const a=vs.byId[aId], b=vs.byId[bId];
  if(a){ const s=new Set(a.cross||[]); if(add) s.add(bId); else s.delete(bId); a.cross=[...s]; }
  if(b){ const s=new Set(b.cross||[]); if(add) s.add(aId); else s.delete(aId); b.cross=[...s]; }
}
// ── Connection history (multi-level undo/redo) + draft-mode plumbing ────────
let _undo = [];   // applied connection ops, newest last: {spec, added}
let _redo = [];   // ops that were undone, available to redo
function _draftOn(){ return !!(vs.draft && vs.draft.active); }
function _applyConnLocal(spec, on){
  if(spec.type==='builds')     _localBuildEdge(spec.childId, spec.parentId, on);
  else if(spec.type==='cross') _localCrossEdge(spec.aId, spec.bId, on);
  else                         _localConnEdge(spec.aId, spec.bId, on);
}
async function _persistConn(spec){           // write the current net state of the owning side
  if(spec.type==='builds'){ const pid=spec.childId; await vizPatchRel(pid,'Builds On', (vs.byId[pid]&&vs.byId[pid].buildsOn)||[]); }
  else if(spec.type==='cross'){
    // Write BOTH ends so it holds whether the property was created as a one- or two-property self-relation.
    const {aId,bId}=spec;
    await vizPatchRel(aId, CROSS_THREAD_PROP, (vs.byId[aId]&&vs.byId[aId].cross)||[]);
    try{ await vizPatchRel(bId, CROSS_THREAD_PROP, (vs.byId[bId]&&vs.byId[bId].cross)||[]); }catch(e){ /* mirror side is best-effort */ }
  }
  else { const aid=spec.aId; await vizPatchRel(aid,'Connected Fragments', (vs.byId[aid]&&vs.byId[aid].connected)||[]); }
}
// In draft mode, remember each fragment's relations the first time it's touched
// so Discard can restore them and Commit can write only what actually changed.
function _draftTouch(spec){
  if(!_draftOn()) return;
  const ids = spec.type==='builds' ? [spec.childId, spec.parentId] : [spec.aId, spec.bId];
  ids.forEach(id=>{ if(vs.draft.base[id]===undefined){ const n=vs.byId[id]; vs.draft.base[id]= n ? {buildsOn:[...(n.buildsOn||[])], connected:[...(n.connected||[])], cross:[...(n.cross||[])], refinedBy:[...(n.refinedBy||[])]} : null; } });
}
// Multi-level undo / redo. Undo inverts the most recent op; redo re-applies it.
async function vizUndo(){ await _stepHistory(_undo, _redo, true); }
async function vizRedo(){ await _stepHistory(_redo, _undo, false); }

// ── Draft mode ──────────────────────────────────────────────────────────────
// Opt-in mode: connection edits apply instantly in memory but are NOT written to
// Notion until you Commit (or thrown away on Discard). Live writes are the
// default; this is for experimenting with structure safely.
function _draftCount(){ return vs.draft ? Object.keys(vs.draft.base).length : 0; }
function vizDraftToggle(){
  if(_draftOn()){
    if(_draftCount()){ vs.draft.msg='Commit or discard your changes first.'; vizUpdateReader(); return; }
    vs.draft=null;                          // nothing pending → just exit
  } else {
    vs.draft={active:true, base:{}, busy:false, msg:''};
    _undo=[]; _redo=[];                     // fresh history for the session
  }
  render();
}
function vizDraftDiscard(){
  if(!vs.draft) return;
  const b=vs.draft.base;
  Object.keys(b).forEach(id=>{ const n=vs.byId[id], s=b[id]; if(n&&s){ n.buildsOn=[...s.buildsOn]; n.connected=[...s.connected]; n.cross=[...(s.cross||[])]; n.refinedBy=[...s.refinedBy]; } });
  vs.draft=null; _undo=[]; _redo=[];
  const focal = vs.reader && vs.reader.cursorId;
  vizBuildComponents();
  vs._dirIndexBuilt=false; vs._parentsIndex={}; vs._childrenIndex={};
  render();
}
async function vizDraftCommit(){
  if(!_draftOn()) return; const d=vs.draft;
  d.busy=true; d.msg=''; vizUpdateReader();
  const ids=Object.keys(d.base);
  const sortJoin=a=>[...(a||[])].map(fmtId).sort().join(',');
  try{
    for(const id of ids){
      const n=vs.byId[id], s=d.base[id]; if(!n||!s) continue;
      if(sortJoin(n.buildsOn)!==sortJoin(s.buildsOn))   await vizPatchRel(id,'Builds On', n.buildsOn||[]);
      if(sortJoin(n.connected)!==sortJoin(s.connected)) await vizPatchRel(id,'Connected Fragments', n.connected||[]);
      if(sortJoin(n.cross)!==sortJoin(s.cross||[]))     await vizPatchRel(id, CROSS_THREAD_PROP, n.cross||[]);
    }
    vs.draft=null; _undo=[]; _redo=[];
    render();
  }catch(err){ d.busy=false; d.msg='Commit failed: '+(err&&err.message||'')+' — your changes are still staged.'; vizUpdateReader(); }
}
async function _stepHistory(from, to, isUndo){
  if(!from.length) return;
  // Non-connection ops (bulk position reset) — restore/clear the position map.
  if(from[from.length-1].kind === 'posReset'){
    const op = from.pop(); to.push(op);
    if(isUndo){ vs.nodePos = JSON.parse(JSON.stringify(op.prev||{})); }   // undo → bring positions back
    else      { vs.nodePos = {}; }                                        // redo → clear again
    saveNodePos();
    render();
    _syncMapPosNotion(op.persistedIds||[], isUndo ? op.prev : null);      // keep Notion in sync (best-effort)
    return;
  }
  const op = from.pop();
  const on = isUndo ? !op.added : op.added;
  _draftTouch(op.spec);
  _applyConnLocal(op.spec, on);
  to.push(op);
  if(vs.edit){ vs.edit.connSt=null; vs.edit.connMsg=''; }
  const focal = vs.edit ? vs.edit.id : (op.spec.type==='builds'?op.spec.childId:op.spec.aId);
  if(_draftOn()){ vizAfterEdit(focal); return; }
  vizUpdateReader();
  try{ await _persistConn(op.spec); vizAfterEdit(focal); }
  catch(err){
    _applyConnLocal(op.spec, !on);   // revert
    to.pop(); from.push(op);         // restore stacks
    if(vs.edit){ vs.edit.connSt='error'; vs.edit.connMsg=(err&&err.message)||'Failed'; }
    vizUpdateReader();
  }
}
// Rebuild threads after a live edit, keep the reader on the edited fragment,
// re-render, and scroll it back into view.
// Toggle whether the focal fragment is its thread's pinned anchor (top).
function vizEditToggleAnchor(){
  const e=vs.edit; if(!e) return;
  if(vs.pinAnchor[e.id]) delete vs.pinAnchor[e.id]; else vs.pinAnchor[e.id]=true;
  savePinAnchors();
  vizAfterEdit(e.id);
}

// ── Animated re-layout (FLIP) ──────────────────────────────────────────────
// Capture every map node's current position BEFORE a re-render, then glide each
// node from its old spot to its new one AFTER the (canonical) render. Edges are
// hidden during the glide and faded back in once nodes settle, so they never
// look detached. render() stays the source of truth — this is purely visual.
function _mmCapturePositions(){
  const m={};
  document.querySelectorAll('.mm-scene .mm-node[data-node]').forEach(el=>{
    m[el.getAttribute('data-node')] = { l: el.offsetLeft, t: el.offsetTop };
  });
  return m;
}
function _mmFlip(oldPos){
  if(!oldPos) return;
  const scene=document.getElementById('mm-scene'); if(!scene) return;
  const edges=scene.querySelector('svg.mm-edges');
  let any=false;
  scene.querySelectorAll('.mm-node[data-node]').forEach(el=>{
    const o=oldPos[el.getAttribute('data-node')]; if(!o) return;     // new node: leave as-is
    const dl=o.l-el.offsetLeft, dt=o.t-el.offsetTop;
    if(Math.abs(dl)<1 && Math.abs(dt)<1) return;
    any=true;
    el.style.transition='none';
    el.style.transform=`translate(${dl}px,${dt}px)`;
  });
  if(!any) return;                                  // nothing moved → no animation
  if(edges) edges.style.opacity='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    scene.querySelectorAll('.mm-node[data-node]').forEach(el=>{
      el.style.transition='transform .36s cubic-bezier(.22,.61,.36,1)';
      el.style.transform='';
    });
  }));
  setTimeout(()=>{
    if(edges) edges.style.opacity='';
    scene.querySelectorAll('.mm-node[data-node]').forEach(el=>{ el.style.transition=''; });
  }, 400);
}

function vizAfterEdit(focalId){
  const exp = (vs.reader && vs.reader.expanded) ? vs.reader.expanded : new Set();
  const oldPos = (vs.view==='map') ? _mmCapturePositions() : null;   // for the glide
  vizBuildComponents();

  const n = vs.byId[focalId];
  if(n && n.comp>=0) vs.reader = {compIdx:n.comp, expanded:exp, cursorId:focalId};

async function vizEditSave(){

// Candidate target fragments for a new connection (search by title). Searches
// ALL fragments; only excludes self and ones already linked in the chosen
// relation. Titles that start with the query rank first so a searched fragment
// always surfaces.
function vizConnCandidates(){
  const e=vs.edit; if(!e) return []; const n=vs.byId[e.id]; if(!n) return [];
  const q=(e.connQuery||'').trim().toLowerCase();
  const childIds=new Set(vs.nodes.filter(o=>(o.buildsOn||[]).includes(e.id)).map(o=>o.id));
  const have = e.connKind==='builds' ? new Set([...(n.buildsOn||[]), e.id])
            : e.connKind==='connected' ? new Set([...(n.connected||[]), e.id])
            : e.connKind==='cross' ? new Set([...(n.cross||[]), ...(vs.comps[n.comp]? vs.comps[n.comp].nodeIds : [e.id])])   // cross-thread: only fragments in OTHER threads
            : new Set([e.id, ...childIds]);   // builds-rev: exclude existing children
  const pool = vs.nodes.filter(o=> !have.has(o.id) && (!q || (o.title||'').toLowerCase().includes(q)));
  if(q) pool.sort((a,b)=>{
    const sa=(a.title||'').toLowerCase().startsWith(q)?0:1, sb=(b.title||'').toLowerCase().startsWith(q)?0:1;
    return sa-sb || (a.title||'').localeCompare(b.title||'');
  });
  return pool.slice(0, 12);
}
async function vizEditAddConn(tid){
  const e=vs.edit; if(!e||!tid) return; const n=vs.byId[e.id], t=vs.byId[tid]; if(!n||!t) return;
  const spec=_connSpecFor(e.connKind, e.id, tid);
  e.adding=tid; e.connSt=null; e.connMsg=''; vizUpdateReader();   // instant green check
  _draftTouch(spec);
  _applyConnLocal(spec, true);                                    // optimistic
  _undo.push({spec, added:true}); _redo=[];
  if(_draftOn()){ e.adding=null; e.connQuery=''; vizAfterEdit(e.id); return; }
  try{
    await _persistConn(spec);
    e.adding=null; e.connQuery='';
    vizAfterEdit(e.id);
  }catch(err){
    _applyConnLocal(spec, false); _undo.pop();                    // revert + un-record
    e.adding=null; e.connSt='error'; e.connMsg=err.message||'Failed'; vizUpdateReader();
  }
}
async function vizEditRemoveConn(kind, tid){
  const e=vs.edit; if(!e) return;
  const spec=_connSpecFor(kind, e.id, tid);
  e.connSt=null; e.connMsg='';
  _draftTouch(spec);
  _applyConnLocal(spec, false);                                   // optimistic: pill vanishes
  _undo.push({spec, added:false}); _redo=[];
  vizUpdateReader();
  if(_draftOn()){ vizAfterEdit(e.id); return; }
  try{
    await _persistConn(spec);
    vizAfterEdit(e.id);
  }catch(err){
    _applyConnLocal(spec, true); _undo.pop();                     // revert + un-record
    e.connSt='error'; e.connMsg=err.message||'Failed'; vizUpdateReader();
  }
}
// Delete (archive) the fragment. Two-step: first click arms, second confirms.
async function vizEditDelete(){
  const e=vs.edit; if(!e) return; const id=e.id; const n=vs.byId[id]; if(!n) return;
  if(_draftOn()){ e.delSt='error'; e.delMsg='Deleting is paused in Draft mode — commit or discard first.'; e.confirmDel=false; vizUpdateReader(); return; }
  if(!e.confirmDel){ e.confirmDel=true; vizUpdateReader(); return; }
  e.delSt='saving'; vizUpdateReader();
  // Remember a neighbor to refocus the reader on after deletion.
  const neighbor = (n.buildsOn||[])[0] || (n.connected||[])[0]
    || (vs.nodes.find(o=>(o.buildsOn||[]).includes(id))||{}).id || null;
  try{
    await nArchivePage(id);
    // strip the node and every reference to it
    delete vs.byId[id];
    vs.nodes = vs.nodes.filter(x=>x.id!==id);
    vs.nodes.forEach(o=>{
      o.buildsOn  = (o.buildsOn||[]).filter(x=>x!==id);
      o.connected = (o.connected||[]).filter(x=>x!==id);
      o.refinedBy = (o.refinedBy||[]).filter(x=>x!==id);
    });
    vs.edit=null;
    vizBuildComponents();
    vs._dirIndexBuilt=false; vs._parentsIndex={}; vs._childrenIndex={};
    const nb = neighbor && vs.byId[neighbor];
    if(nb && nb.comp>=0){ vs.reader={compIdx:nb.comp, expanded:new Set(), cursorId:neighbor}; }
    else { vs.reader=null; }
    render();
    if(nb){ setTimeout(()=>{
      const body=document.querySelector('.viz-reader .reader-body');
      const el=document.getElementById('spine-'+neighbor);
      if(body&&el){ const er=el.getBoundingClientRect(), br=body.getBoundingClientRect(); body.scrollTop+=(er.top-br.top)-10; }
      vizApplyHighlight(neighbor);
    },60); }
  }catch(err){ e.delSt='error'; e.delMsg=err.message||'Delete failed'; e.confirmDel=false; vizUpdateReader(); }
}

async function vizEditCreate(){
  const e=vs.edit; if(!e) return; const n=vs.byId[e.id]; if(!n) return;
  if(_draftOn()){ e.addSt='error'; e.addMsg='Adding fragments is paused in Draft mode — commit or discard first.'; vizUpdateReader(); return; }
  const title=(e.addText||'').trim();
  if(!title){ e.addSt='error'; e.addMsg='Enter the new fragment text.'; vizUpdateReader(); return; }
  e.addSt='saving'; e.addMsg=''; vizUpdateReader();
  try{
    const dbId=fmtId(getIpDb());
    const props={ 'Name':{title:[{type:'text',text:{content:title}}]}, 'Type':{select:{name:e.addType}} };
    if(n.method) props['Method']={select:{name:n.method}};
    const page=await nPost('/pages',{parent:{database_id:dbId}, properties:props});
    const newId=page.id;
    const newNode={ id:newId, title, type:e.addType, resolved:false, method:n.method||null,
      primarySource:null, captureInstances:[], identifier:null, primarySourceId:null, threadStatus:null,
      buildsOn:[], refinedBy:[], connected:[], createdAt:Date.now(), goals:[], kb:[], comp:-1 };
    vs.nodes.push(newNode); vs.byId[newId]=newNode;
    if(e.addRel==='this-builds-on'){          // this fragment builds on the NEW (new is more foundational)
      await vizPatchRel(e.id,'Builds On', [...new Set([...(n.buildsOn||[]), newId])]);
      _localBuildEdge(e.id, newId, true);
    } else if(e.addRel==='builds-on-this'){    // NEW builds on this fragment
      await vizPatchRel(newId,'Builds On', [e.id]);
      _localBuildEdge(newId, e.id, true);
    } else {                                   // connected (lateral)
      await vizPatchRel(newId,'Connected Fragments', [e.id]);
      _localConnEdge(newId, e.id, true);
    }
    e.addText=''; e.addSt=null;
    vizAfterEdit(e.id);
  }catch(err){ e.addSt='error'; e.addMsg=err.message||'Create failed'; vizUpdateReader(); }
}

/* ── Interactive mindmap handlers ── */
function vizMmToggleSpine(id){ vs.mm.collapsedSpine[id]=!vs.mm.collapsedSpine[id]; render(); }
function vizMmTogglePills(id){ vs.mm.openPills[id]=!vs.mm.openPills[id]; if(vs.mm.measuredH) delete vs.mm.measuredH[id]; render(); }

// After the map paints, measure each card's REAL height and, if it differs from
// what the layout assumed, cache it and re-lay-out once. This makes node spacing
// exact for any content (open pills, long titles) without guessing — the layout
// converges in one extra pass and then stays stable.
function vizMmSyncHeights(){
  const mm = vs.mm;
  if(!mm.measuredH) mm.measuredH = {};
  requestAnimationFrame(()=>{
    const scene = document.getElementById('mm-scene');
    if(!scene) return;
    let changed = false;
    scene.querySelectorAll('.mm-node[data-mmid]').forEach(el=>{
      const id = el.getAttribute('data-mmid');
      const h = el.offsetHeight;                       // unscaled layout height (scene units)
      if(h && Math.abs((mm.measuredH[id]||0) - h) > 1){ mm.measuredH[id] = h; changed = true; }
    });
    if(changed) render();
  });
}
function vizMmToggleTangents(id){ const open = vs.mm.openTangents[id] !== false; vs.mm.openTangents[id] = !open; render(); }
function vizMmToggleThread(compIdx){ vs.mm.collapsedThreads[compIdx]=!vs.mm.collapsedThreads[compIdx]; render(); }
// Collapse every thread on the map into its toggle (or expand them all back).
// Operates on the threads currently shown, so a filtered view only affects
// its own threads. Also resets the pan so the collapsed stack is in view.
function vizMmCollapseAll(collapse){
  const shown = vizFilteredComps();
  vs.mm.collapsedThreads = vs.mm.collapsedThreads || {};
  shown.forEach(c=>{ if(collapse) vs.mm.collapsedThreads[c.idx]=true; else delete vs.mm.collapsedThreads[c.idx]; });
  vs.layout=null; render();
}
function vizMmAllCollapsed(){
  const shown = vizFilteredComps();
  return shown.length>0 && shown.every(c=>vs.mm.collapsedThreads && vs.mm.collapsedThreads[c.idx]);
}
// Move a whole thread up/down in the map/list sequence (the order threads are
// populated). Captures the current displayed order, swaps with the neighbour,
// and persists it. No tree rebuild needed — only the inter-thread order changes.
function vizMoveThread(ev, compIdx, dir){
  if(ev) ev.stopPropagation();
  const list = vizFilteredComps();
  const i = list.findIndex(c=>c.idx===compIdx);
  if(i<0) return;
  const j = dir<0 ? i-1 : i+1;
  if(j<0 || j>=list.length) return;
  const keys = list.map(vizCompKey);
  [keys[i], keys[j]] = [keys[j], keys[i]];
  vs.threadOrder = keys;
  saveThreadOrder();
  render();
}
// Mark / unmark a thread as Vetted (foundational organizing done). Writes the
// Vetted checkbox on the thread's metadata fragment (its name carrier / anchor);
// unmarking clears it from every member so the flag is unambiguous.
async function vizToggleVetted(compIdx){
  const comp = vs.comps[compIdx]; if(!comp) return;
  if(vs.reader) vs.reader.vetBusy = true; render();
  const wasVetted = vizThreadVetted(comp);
  try{
    if(!wasVetted){
      const target = vizThreadNameTarget(comp);
      if(target){ await nPatch('/pages/'+fmtId(target.id), {properties:{'Vetted':{checkbox:true}}}); target.vetted = true; }
    } else {
      for(const id of comp.nodeIds){ if(vs.byId[id] && vs.byId[id].vetted){
        await nPatch('/pages/'+fmtId(id), {properties:{'Vetted':{checkbox:false}}}); vs.byId[id].vetted = false;
      } }
    }
  }catch(e){ if(vs.reader) vs.reader.vetBusy=false; render(); alert("Couldn't update Vetted: "+(e.message||e)); return; }
  if(vs.reader) vs.reader.vetBusy = false;
  render();
}
// Delete (archive in Notion) every fragment in a thread. Two-step confirm.
function vizDeleteThreadArm(){ if(vs.reader){ vs.reader.delArm=true; render(); } }
function vizDeleteThreadCancel(){ if(vs.reader){ vs.reader.delArm=false; vs.reader.delBusy=false; render(); } }
async function vizDeleteThread(compIdx){
  const comp = vs.comps[compIdx]; if(!comp) return;
  if(_draftOn()){ alert('Deleting is paused in Draft mode — commit or discard first.'); return; }
  if(vs.reader){ vs.reader.delBusy=true; render(); }
  const ids = comp.nodeIds.slice();
  const failed = [];
  await mapPool(ids, async id=>{ try{ await nArchivePage(id); }catch(e){ failed.push({id, e:e.message||String(e)}); } }, 5);
  const gone = new Set(ids.filter(id=>!failed.some(f=>f.id===id)));
  vs.nodes = vs.nodes.filter(x=>!gone.has(x.id));
  gone.forEach(id=>{ delete vs.byId[id]; });
  vs.nodes.forEach(o=>{
    o.buildsOn  = (o.buildsOn||[]).filter(x=>!gone.has(x));
    o.connected = (o.connected||[]).filter(x=>!gone.has(x));
    o.cross     = (o.cross||[]).filter(x=>!gone.has(x));
    o.refinedBy = (o.refinedBy||[]).filter(x=>!gone.has(x));
  });
  vizBuildComponents();   // also drops _spineCache + _treeCache
  vs._dirIndexBuilt=false; vs._parentsIndex={}; vs._childrenIndex={};
  vs.reader=null; vs.rename=null; vs.edit=null; vs.sel=null;
  render();
  if(failed.length) setTimeout(()=>alert(`Couldn't delete ${failed.length} of ${ids.length} fragment(s). First error: ${failed[0].e}`), 50);
}
// Move a sibling chain up/down within its group (children of a common parent, or
// the thread's secondary roots). Stores the full new sibling order as a manual
// override (persisted) and drops the tree cache so the map + reader reorder.
function vizMoveChain(ev, nodeId, dir){
  if(ev) ev.stopPropagation();
  const n = vs.byId[nodeId]; if(!n) return;
  const comp = vs.comps[n.comp]; if(!comp) return;
  const tree = mmBuildTree(comp);
  const parent = tree.parentOf[nodeId];
  let group, key;
  if(parent!=null){ group=(tree.childrenOf[parent]||[]).slice(); key=parent; }
  else { group=(tree.secondaryRoots||[]).slice(); key=vizRootsKey(comp); }
  const i = group.indexOf(nodeId); if(i<0) return;
  const j = dir<0 ? i-1 : i+1;
  if(j<0 || j>=group.length) return;
  [group[i], group[j]] = [group[j], group[i]];
  vs.childOrder = vs.childOrder || {};
  vs.childOrder[key] = group;
  saveChildOrder();
  _syncChainOrderNotion(key, group);   // durable: store on the parent fragment (root-group order stays local)

// ── Fragment images ──────────────────────────────────────────────────────────
// Any fragment can carry photos/screenshots via the "Image" Files & media

// so: (1) a URL known to be expired is refreshed BEFORE it renders (one GET of
// the page), and (2) an <img> that still fails triggers the same refresh once
// and repoints every rendered copy in place. External URLs skip all of this.
const _imgRefreshing = {};   // fragId → Promise (dedupe concurrent refreshes)
function vizImgSrc(n, i){
  const im=(n.images||[])[i]; if(!im) return '';

async function vizImgRefresh(fragId){
  if(_imgRefreshing[fragId]) return _imgRefreshing[fragId];

    try{
      const page = await nGet('/pages/'+fmtId(fragId));
      const n = vs.byId[fragId]; if(!n) return;
      n.images = filesProp(page.properties||{}); n.imagesRaw = filesRaw(page.properties||{});
      document.querySelectorAll(`img[data-img-frag="${fragId}"]`).forEach(el=>{
        const i=+el.getAttribute('data-img-i'); const im=n.images[i];

          el.src=im.url;
        }
      });

function vizImgErr(el){

// Upload flow (Notion File Upload API, ≤20 MB per file):
//   POST /file_uploads {filename, content_type} → {id}
//   POST /file_uploads/{id}/send  multipart "file"
//   PATCH /pages/{frag}  Image: [...existing raw files, {type:'file_upload', file_upload:{id}}]
// Formats every browser can render. Anything else (HEIC/HEIF from an iPhone,
// TIFF, BMP) uploads fine to Notion but shows as a broken image later, so it is
// converted to JPEG before upload. Oversized or huge-dimension images are
// re-encoded too, which keeps uploads under Notion's 20 MB single-part limit.
const WEB_IMAGE_TYPES = ['image/png','image/jpeg','image/gif','image/webp'];
const IMG_MAX_DIM = 2400;          // longest edge after downscaling
const IMG_REENCODE_OVER = 4*1024*1024;
function _isImageFile(f){
  if(/^image\//.test(f.type||'')) return true;
  return /\.(heic|heif|png|jpe?g|gif|webp|bmp|tiff?)$/i.test(f.name||'');   // iOS often reports an empty type for HEIC
}
async function _decodeImage(file){
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file); }catch(e){}
  }
  return await new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url); res(im); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode failed')); };
    im.src=url;
  });
}
// Returns {blob, name, type, note} ready to upload, or throws with guidance.
async function _prepImage(file){
  const webOk = WEB_IMAGE_TYPES.includes((file.type||'').toLowerCase());
  const heic  = /heic|heif/i.test(file.type||'') || /\.(heic|heif)$/i.test(file.name||'');
  if(webOk && file.size<=IMG_REENCODE_OVER) return {blob:file, name:file.name||'image.png', type:file.type, note:''};
  let src;
  try{ src = await _decodeImage(file); }
  catch(err){
    if(heic) throw new Error(`${file.name||'That photo'} is HEIC, which this browser can't read or display. On iPhone: Settings → Camera → Formats → Most Compatible (saves new photos as JPEG), or open the photo in Photos and share it as a JPEG. Converting on an iPhone (Safari) also works — HEIC decodes natively there.`);
    throw new Error(`Couldn't read ${file.name||'that image'} — try a PNG or JPEG.`);
  }
  const w0=src.width||src.naturalWidth, h0=src.height||src.naturalHeight;
  const scale = Math.min(1, IMG_MAX_DIM/Math.max(w0,h0));
  const w=Math.max(1,Math.round(w0*scale)), h=Math.max(1,Math.round(h0*scale));
  const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(src,0,0,w,h);
  if(src.close) src.close();
  // Step quality down until it fits comfortably inside Notion's single-part limit.
  let blob=null;
  for(const q of [0.9,0.8,0.7,0.6,0.5]){
    blob = await new Promise(r=>canvas.toBlob(r,'image/jpeg',q));
    if(blob && blob.size < 18*1024*1024) break;
  }
  if(!blob) throw new Error('Could not convert that image in this browser.');
  const base=(file.name||'image').replace(/\.[^.]+$/,'');
  const note = heic ? 'converted from HEIC' : (scale<1 ? `resized to ${w}×${h}` : 'recompressed');
  return {blob, name:base+'.jpg', type:'image/jpeg', note};
}
async function vizImgFiles(files, fragId){
  const e=vs.edit; const n=vs.byId[fragId]; if(!n||!files||!files.length) return;
  const list=[...files].filter(_isImageFile);
  if(!list.length){ if(e){ e.imgSt='error'; e.imgMsg='Only image files are supported.'; vizUpdateReader(); } return; }
  if(e){ e.imgSt='busy'; e.imgMsg=`Preparing ${list.length} image${list.length>1?'s':''}…`; e.imgDrag=false; vizUpdateReader(); }
  try{
    const uploads=[]; const notes=[];
    for(const f of list){
      const prepped = await _prepImage(f);
      if(prepped.blob.size>20*1024*1024) throw new Error(`${f.name} is still over 20 MB after conversion.`);
      if(prepped.note) notes.push(`${prepped.name} ${prepped.note}`);
      if(e){ e.imgMsg=`Uploading ${prepped.name}…`; vizUpdateReader(); }
      const fu = await nPost('/file_uploads', {filename:prepped.name, content_type:prepped.type});
      const fd = new FormData(); fd.append('file', prepped.blob, prepped.name);
      await nUpload('/file_uploads/'+fu.id+'/send', fd);
      uploads.push({type:'file_upload', file_upload:{id:fu.id}, name:prepped.name.slice(0,100)});
    }
    vs._imgNotes = notes;
    const prop = vizImageProp();
    const page = await nPatch('/pages/'+fmtId(fragId), {properties:{[prop]:{files:[...(n.imagesRaw||[]).map(_rawFileForWrite), ...uploads]}}});
    n.images = filesProp(page.properties||{}); n.imagesRaw = filesRaw(page.properties||{});
    // A just-attached upload can come back as a file_upload entry with no URL
    // yet; one re-read turns it into a hosted file with a signed URL.
    if(n.images.length < (n.imagesRaw||[]).length){
      try{
        const fresh = await nGet('/pages/'+fmtId(fragId));
        n.images = filesProp(fresh.properties||{}); n.imagesRaw = filesRaw(fresh.properties||{});
      }catch(e){}
    }
    if(e){ e.imgSt='ok'; e.imgMsg=`Added ${uploads.length} image${uploads.length>1?'s':''}.`+((vs._imgNotes||[]).length?` (${vs._imgNotes.join('; ')})`:''); }
    if(vs.mm && vs.mm.measuredH) delete vs.mm.measuredH[fragId];
    render();
  }catch(err){
    const msg=(err&&err.message)||'Upload failed';
    if(e){ e.imgSt='error'; e.imgMsg = /validation_error.*Image|property.*does not exist|Image is not a property/i.test(msg) ? `Add a "Image" Files & media property to Info Processing first. (${msg.slice(0,120)})` : msg; }
    vizUpdateReader();
  }
}
// Re-sendable form of an existing file object (Notion accepts its own hosted
// files back verbatim; external files as-is). Strips read-only fields.
function _rawFileForWrite(f){
  if(f.type==='file') return {type:'file', name:f.name||'', file:{url:f.file.url, expiry_time:f.file.expiry_time}};
  if(f.type==='external') return {type:'external', name:f.name||'', external:{url:f.external.url}};
  return f;
}
async function vizImgRemove(fragId, i){

// Touch: single-finger pan, two-finger pinch-zoom. Mirrors the mouse pan and the

let _mmTouch=null;
function vizMmTouchStart(ev){

  } else if(ev.touches.length>=2){

function _mmTouchMove(ev){

  if(_mmTouch.mode==='pan' && ev.touches.length>=1){
    const t=ev.touches[0];
    const dx=t.clientX-_mmTouch.sx, dy=t.clientY-_mmTouch.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) _mmDragged=true;
    vs.mm.pan.x=_mmTouch.px+dx; vs.mm.pan.y=_mmTouch.py+dy;
    _mmApplyTransform();
  } else if(_mmTouch.mode==='pinch' && ev.touches.length>=2){
    const a=ev.touches[0], b=ev.touches[1];
    const dist=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);

    const sx=(_mmTouch.mx-_mmTouch.px)/_mmTouch.z, sy=(_mmTouch.my-_mmTouch.py)/_mmTouch.z;

function _mmTouchEnd(ev){
  if(ev.touches && ev.touches.length>0) return;   // fingers still down
