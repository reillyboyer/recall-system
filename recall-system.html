  window.removeEventListener('touchmove', _mmTouchMove);
  window.removeEventListener('touchend', _mmTouchEnd);
}

/* ════════════════════════════════════════════════════════════════════════
 * DRAG-AND-DROP RESTRUCTURING
 * Press a node and drag it onto another to re-wire the structure. A movement
 * threshold separates a drag from a click (which still opens the reader) and
 * from a background pan. On drop, a small menu offers the relationship to make.
 * Uses the same foundation as the editor: optimistic local edit + undo stack +
 * draft-or-live persistence + animated re-layout. Pointer events → mouse+touch.
 * ════════════════════════════════════════════════════════════════════════ */
// Pick facing-side anchor points between two node rects (for re-routing an edge
// after a node has been manually moved).
function _edgeAnchors(a, b){
  const acx=a.x+a.w/2, acy=a.y+a.h/2, bcx=b.x+b.w/2, bcy=b.y+b.h/2;
  if(Math.abs(bcx-acx) >= Math.abs(bcy-acy)){
    return bcx>=acx ? {x1:a.x+a.w,y1:acy,x2:b.x,y2:bcy} : {x1:a.x,y1:acy,x2:b.x+b.w,y2:bcy};
  }
  return bcy>=acy ? {x1:acx,y1:a.y+a.h,x2:bcx,y2:b.y} : {x1:acx,y1:a.y,x2:bcx,y2:b.y+b.h};
}
// Manual node positions (display preference, persisted locally). fragId → {dx,dy}
// offset from the computed layout position.
function loadNodePos(){ try{ vs.nodePos = JSON.parse(localStorage.getItem('rs_node_pos')||'{}') || {}; }catch{ vs.nodePos={}; } }
function saveNodePos(){ try{ localStorage.setItem('rs_node_pos', JSON.stringify(vs.nodePos||{})); }catch{} _layoutTouch(); }
// ── Durable persistence (Notion) ────────────────────────────────────────────
// localStorage is per-origin and lost whenever the app is served from a new
// URL/version (e.g. a fresh gist revision). To survive that, accepted map
// positions and chain orders are also written to the fragments themselves:
//   • Map Pos   (rich_text)  — "dx,dy" on the moved fragment (its locked offset)
//   • Chain Order (rich_text) — comma-joined child page-ids on the PARENT
// Writes are best-effort: if the property doesn't exist yet they no-op, so
// nothing breaks before you add it. Reads happen in vizLoad.
async function _syncMapPosNotion(ids, state){
  for(const id of (ids||[])){
    const v = state && state[id];
    try{ await nPatch('/pages/'+fmtId(id), {properties:{'Map Pos':{rich_text: v ? [{type:'text',text:{content: Math.round(v.dx)+','+Math.round(v.dy)}}] : []}}}); }
    catch(e){ /* property missing or transient — ignore */ }
  }
}
async function _syncChainOrderNotion(parentKey, order){
  if(!parentKey || parentKey.indexOf('roots:')===0) return;   // root-group order has no parent page → local-only
  try{ await nPatch('/pages/'+fmtId(parentKey), {properties:{'Chain Order':{rich_text: (order&&order.length)? [{type:'text',text:{content: order.join(',')}}] : []}}}); }
  catch(e){ /* property missing or transient — ignore */ }
}
// Return every moved fragment to its auto-layout position. Undoable: pushes a
// posReset op so the map's undo button steps back to the prior positions.
function vizResetAllPositions(){
  const cur = vs.nodePos || {};
  const ids = Object.keys(cur);
  if(!ids.length) return;
  const old = _mmCapturePositions();
  const prev = JSON.parse(JSON.stringify(cur));               // snapshot for undo
  const persistedIds = ids.filter(id=>cur[id] && cur[id].ok); // those with a durable Map Pos
  vs.nodePos = {};
  saveNodePos();
  _undo.push({kind:'posReset', prev, persistedIds, added:true});
  _redo = [];
  render(); requestAnimationFrame(()=>_mmFlip(old));
  _syncMapPosNotion(persistedIds, null);                       // clear durable positions (best-effort)
}
function loadChildOrder(){ try{ vs.childOrder = JSON.parse(localStorage.getItem('rs_child_order')||'{}') || {}; }catch{ vs.childOrder={}; } }
function saveChildOrder(){ try{ localStorage.setItem('rs_child_order', JSON.stringify(vs.childOrder||{})); }catch{} _layoutTouch(); }
function loadThreadOrder(){ try{ vs.threadOrder = JSON.parse(localStorage.getItem('rs_thread_order')||'[]') || []; }catch{ vs.threadOrder=[]; } }
function saveThreadOrder(){ try{ localStorage.setItem('rs_thread_order', JSON.stringify(vs.threadOrder||[])); }catch{} _layoutTouch(); }

/* ── Cross-device layout sync (Notion "Layout" row) ─────────────────────────
 * localStorage is per-browser, so thread order, root-group order, node
 * positions, chain orders and pinned anchors used to differ between devices.
 * The whole layout is now also mirrored as ONE JSON blob in the body of a
 * single Info Processing row with Type = Layout (created on first save; the
 * Visualizer never treats it as a fragment). Last write wins by timestamp:
 *   • load  → if the remote blob is newer than this browser's copy, adopt it;
 *             if this browser's copy is newer (edited offline), push it.
 *   • save  → every local save bumps rs_layout_ts and schedules a debounced
 *             push of the full blob (one PATCH per burst of edits).
 * The blob lives in a code block (not a property) so no schema change is
 * required. 2000-char rich-text pieces × up to 100 per block ≈ 200 KB. */
const LAYOUT_PAGE_TITLE = 'Recall Layout';
const LAYOUT_TS_KEY = 'rs_layout_ts';
const LAYOUT_ID_KEY = 'rs_layout_page_id';
let _layoutPageId = null;   // discovered in vizLoad (or created on first push)
let _layoutBlockId = null;  // the code block holding the blob
// Visible sync state — surfaced in the Visualize status line so a failure is
// never silent (the first version only console.warn'd, which hid real errors).
let _layoutSt = { state:'idle', msg:'', lastPush:0, lastPull:0, err:'' };
function _layoutSetSt(state, msg, err){
  _layoutSt.state=state; _layoutSt.msg=msg||''; if(err!==undefined) _layoutSt.err=err||'';
  const el=document.getElementById('layout-sync-stat'); if(el) el.innerHTML=_layoutStatHtml();
}
function _layoutStatHtml(){
  const s=_layoutSt;
  const ago=t=>{ if(!t) return ''; const d=Date.now()-t; return d<60000?'just now':d<3600000?Math.floor(d/60000)+'m ago':Math.floor(d/3600000)+'h ago'; };
  if(s.state==='error') return `<span style="color:var(--danger);cursor:pointer" onclick="alert('Layout sync error:\\n\\n'+_layoutSt.err)" title="${esc(s.err)}">⚠ layout sync failed — tap for details</span> · <a style="cursor:pointer;color:var(--accent,#2563eb)" onclick="layoutSyncNow()">retry</a>`;
  if(s.state==='pushing') return `<span style="color:var(--muted)"><span class="spin"></span> saving layout…</span>`;
  if(s.state==='ok')      return `<span style="color:var(--muted)">layout synced ${ago(s.lastPush||s.lastPull)}</span>`;
  return `<a style="cursor:pointer;color:var(--accent,#2563eb)" onclick="layoutSyncNow()" title="Publish this device's arrangement to Notion now">sync layout</a>`;
}
function layoutSyncNow(){ _layoutTouchNow(); }
function _layoutTouchNow(){ try{ localStorage.setItem(LAYOUT_TS_KEY, String(Date.now())); }catch{} _layoutDirty=true; clearTimeout(_layoutTimer); _layoutPush(); }
async function layoutPullNow(){
  _layoutSetSt('pushing','pulling');
  const r = await _layoutReconcile(true);
  if(r==='adopted'){ vizBuildComponents(); render(); }
  else if(r!=='error') _layoutSetSt('ok','');
}
let _layoutTimer = null, _layoutBusy = false, _layoutDirty = false, _layoutApplying = false;
function _layoutBlob(){
  return { v:1, ts:Date.now(),
    threadOrder: vs.threadOrder||[], childOrder: vs.childOrder||{},
    nodePos: vs.nodePos||{}, pinAnchor: vs.pinAnchor||{} };
}
function _layoutLocalTs(){ return +(localStorage.getItem(LAYOUT_TS_KEY)||0); }
function _layoutTouch(){
  if(_layoutApplying) return;                       // adopting the remote blob must not echo it back
  try{ localStorage.setItem(LAYOUT_TS_KEY, String(Date.now())); }catch{}
  _layoutDirty = true;
  clearTimeout(_layoutTimer);
  _layoutTimer = setTimeout(_layoutPush, 1500);
}
function _layoutChunks(str){
  const out=[]; for(let i=0;i<str.length;i+=2000) out.push({type:'text', text:{content:str.slice(i,i+2000)}});
  return out.slice(0,100);
}
async function _layoutEnsurePage(){
  if(_layoutPageId && _layoutBlockId) return true;
  if(!creds.proxyUrl || !creds.notionToken) return false;
  if(!_layoutPageId){ try{ _layoutPageId = localStorage.getItem(LAYOUT_ID_KEY)||null; }catch{} }
  if(!_layoutPageId){
    try{
      const data = await nPost('/databases/'+fmtId(getIpDb())+'/query', {filter:{property:'Type', select:{equals:LAYOUT_TYPE}}, page_size:1});
      const p = (data.results||[])[0];
      if(p) _layoutPageId = p.id;
    }catch(e){ /* the Type option may not exist yet — fall through to create */ }
  }
  if(!_layoutPageId){
    // The IP database's title property isn't necessarily called "Name"; use the
    // one the schema actually reports, or page creation fails with a validation
    // error (which is exactly what silently broke sync before).
    const titleProp = vs.ipTitleProp || (await _layoutDiscoverTitleProp()) || 'Name';
    const props = { [titleProp]:{title:[{type:'text',text:{content:LAYOUT_PAGE_TITLE}}]}, 'Type':{select:{name:LAYOUT_TYPE}} };
    let created;
    try{
      created = await nPost('/pages', {parent:{database_id:fmtId(getIpDb())}, properties:props,
        children:[{object:'block', type:'code', code:{language:'json', rich_text:[{type:'text',text:{content:'{}'}}]}}]});
    }catch(e){
      // Retry without Type in case the select rejects a new option; the page id
      // is cached locally either way, so it stays findable.
      delete props['Type'];
      created = await nPost('/pages', {parent:{database_id:fmtId(getIpDb())}, properties:props,
        children:[{object:'block', type:'code', code:{language:'json', rich_text:[{type:'text',text:{content:'{}'}}]}}]});
    }
    _layoutPageId = created.id;
  }
  try{ localStorage.setItem(LAYOUT_ID_KEY, _layoutPageId); }catch{}
  if(!_layoutBlockId){
    const kids = await nGet('/blocks/'+fmtId(_layoutPageId)+'/children?page_size=20');
    const code = (kids.results||[]).find(b=>b.type==='code');
    if(code) _layoutBlockId = code.id;
    else {
      const app = await nPatch('/blocks/'+fmtId(_layoutPageId)+'/children', {children:[{object:'block', type:'code', code:{language:'json', rich_text:[{type:'text',text:{content:'{}'}}]}}]});
      const b = (app.results||[])[0]; if(b) _layoutBlockId = b.id;
    }
  }
  return !!(_layoutPageId && _layoutBlockId);
}
async function _layoutPush(){
  if(_layoutBusy){ _layoutDirty=true; return; }
  _layoutBusy = true; _layoutDirty = false;
  _layoutSetSt('pushing','');
  try{
    if(await _layoutEnsurePage()){
      const blob = _layoutBlob(); blob.ts = _layoutLocalTs() || blob.ts;
      await nPatch('/blocks/'+fmtId(_layoutBlockId), {code:{language:'json', rich_text:_layoutChunks(JSON.stringify(blob))}});
      _layoutSt.lastPush = Date.now(); _layoutSetSt('ok','', '');
    } else { _layoutSetSt('idle',''); }
  }catch(e){
    _layoutDirty = true;
    _layoutSetSt('error','', (e&&e.message)||String(e));
    console.warn('Layout sync failed', e);
  }
  _layoutBusy = false;
  if(_layoutDirty){ clearTimeout(_layoutTimer); _layoutTimer=setTimeout(_layoutPush, 4000); }
}
// Leaving the page mid-debounce would drop the pending push — flush it with a
// keepalive request (survives tab close / app switch on mobile).
function _layoutFlushOnHide(){
  if(!_layoutDirty || !_layoutPageId || !_layoutBlockId || !creds.proxyUrl) return;
  clearTimeout(_layoutTimer); _layoutDirty=false;
  const blob=_layoutBlob(); blob.ts=_layoutLocalTs()||blob.ts;
  try{ fetch(base()+'/blocks/'+fmtId(_layoutBlockId), {method:'PATCH', keepalive:true,
    headers:{'Authorization':'Bearer '+creds.notionToken,'Notion-Version':creds.notionVersion||'2022-06-28','Content-Type':'application/json'},
    body: JSON.stringify({code:{language:'json', rich_text:_layoutChunks(JSON.stringify(blob))}})}); }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') _layoutFlushOnHide(); });
window.addEventListener('pagehide', _layoutFlushOnHide);
async function _layoutDiscoverTitleProp(){
  try{
    const schema = await nGet('/databases/'+fmtId(getIpDb()));
    for(const [k,p] of Object.entries(schema.properties||{})) if(p.type==='title'){ vs.ipTitleProp=k; return k; }
  }catch(e){}
  return null;
}
// Read the remote blob; returns the parsed object or null.
async function _layoutFetch(){
  try{
    if(!(await _layoutEnsurePage())) return null;
    const b = await nGet('/blocks/'+fmtId(_layoutBlockId));
    const txt = ((b.code&&b.code.rich_text)||[]).map(t=>t.plain_text).join('');
    const obj = JSON.parse(txt||'{}');
    _layoutSt.lastPull = Date.now();
    return (obj && typeof obj==='object' && obj.v) ? obj : null;
  }catch(e){ _layoutSetSt('error','', (e&&e.message)||String(e)); console.warn('Layout fetch failed', e); return null; }
}
// Called from vizLoad after the per-fragment (Map Pos / Chain Order) seeding.
async function _layoutReconcile(force){
  const remote = await _layoutFetch();
  if(_layoutSt.state==='error' && !force) return 'error';
  const localTs = _layoutLocalTs();
  // Pre-existing local arrangement from before layout sync shipped: it has no
  // timestamp, so publish it rather than letting it sit local-only forever.
  const hasLocal = Object.keys(vs.nodePos||{}).length || (vs.threadOrder||[]).length || Object.keys(vs.childOrder||{}).length;
  if(!remote && !localTs && hasLocal){ _layoutTouchNow(); return 'pushed'; }
  if(remote && (remote.ts||0) >= localTs){
    _layoutApplying = true;
    try{
      vs.threadOrder = Array.isArray(remote.threadOrder) ? remote.threadOrder : [];
      vs.childOrder  = remote.childOrder && typeof remote.childOrder==='object' ? remote.childOrder : {};
      vs.nodePos     = remote.nodePos && typeof remote.nodePos==='object' ? remote.nodePos : {};
      vs.pinAnchor   = remote.pinAnchor && typeof remote.pinAnchor==='object' ? remote.pinAnchor : {};
      saveThreadOrder(); saveChildOrder(); saveNodePos(); savePinAnchors();
      try{ localStorage.setItem(LAYOUT_TS_KEY, String(remote.ts||0)); }catch{}
    } finally { _layoutApplying = false; }
    _treeCache = {};
    return 'adopted';
  }
  if(localTs && (!remote || (remote.ts||0) < localTs)){ _layoutTouchNow(); return 'pushed'; }   // this browser is ahead → publish
  if(!_layoutSt.lastPush) _layoutSetSt('idle','');
  return 'none';
}
function vizResetNodePos(ev, id){
  if(ev){ ev.stopPropagation(); }
  if(!(vs.nodePos && vs.nodePos[id])) return;
  const old=_mmCapturePositions();
  const cur=vs.nodePos[id];
  if(cur.prev){
    // step back to the one previous position (stays editable so a second ⤺ → propagation)
    vs.nodePos[id]={dx:cur.prev.dx, dy:cur.prev.dy, ok:false, prev:null};
  } else {
    delete vs.nodePos[id];                       // back to the propagation-rule position
  }
  saveNodePos(); _syncMapPosNotion([id], null);  // no longer an accepted position → clear durable copy
  render(); requestAnimationFrame(()=>_mmFlip(old));
}
// ✓ — accept the dragged spot as this node's position (clears the "moved" badges
// and dashed outline; the node stays where you put it). Drag it again to re-edit.
function vizAcceptNodePos(ev, id){
  if(ev){ ev.stopPropagation(); }
  if(vs.nodePos && vs.nodePos[id]){ vs.nodePos[id].ok=true; saveNodePos(); _syncMapPosNotion([id], vs.nodePos); render(); }
}

let _nodeDrag=null;
function vizNodeDragStart(ev, id){
  if(vs.linkPick) return;                                  // pick mode → tap to pick, no drag
  if(ev.button!==undefined && ev.button!==0) return;       // primary button only
  ev.stopPropagation();
  _nodeDrag={ id, el:ev.currentTarget, sx:ev.clientX, sy:ev.clientY, moved:false, target:null };
  window.addEventListener('pointermove', _nodeDragMove);
  window.addEventListener('pointerup', _nodeDragEnd);
}
function _nodeDragMove(ev){
  const d=_nodeDrag; if(!d) return;
  const dx=ev.clientX-d.sx, dy=ev.clientY-d.sy;
  if(!d.moved){ if(Math.abs(dx)<6 && Math.abs(dy)<6) return; d.moved=true; _mmDragged=true; d.el.classList.add('mm-dragging'); }
  const z=vs.mm.zoom||1;
  d.el.style.transform=`translate(${dx/z}px,${dy/z}px)`;    // follow the pointer (scene is scaled by z)
  const under=document.elementFromPoint(ev.clientX, ev.clientY);   // dragged node has pointer-events:none
  const tgt=under && under.closest && under.closest('.mm-node[data-node]');
  const tid=tgt && tgt.getAttribute('data-node');
  const next=(tid && tid!==d.id) ? tid : null;
  if(next!==d.target){
    const prev=d.target && document.querySelector(`.mm-node[data-node="${d.target}"]`);
    if(prev) prev.classList.remove('mm-drop-target');
    d.target=next;
    if(next && tgt) tgt.classList.add('mm-drop-target');
  }
}
function _nodeDragEnd(ev){
  const d=_nodeDrag; _nodeDrag=null;
  window.removeEventListener('pointermove', _nodeDragMove);
  window.removeEventListener('pointerup', _nodeDragEnd);
  if(!d) return;
  if(d.target){ const t=document.querySelector(`.mm-node[data-node="${d.target}"]`); if(t) t.classList.remove('mm-drop-target'); }
  if(d.moved && d.target && d.target!==d.id){
    // dropped onto another node → offer a connection
    d.el.classList.remove('mm-dragging'); d.el.style.transform='';
    _showDropMenu(ev.clientX, ev.clientY, d.id, d.target);
  } else if(d.moved){
    // dropped on empty space → store a manual position (offset from computed spot).
    // Remember the position we moved FROM as a single "previous" checkpoint, so
    // ⤺ steps back to it once, then a second ⤺ goes to the propagation default.
    const z=vs.mm.zoom||1;
    const dx=(ev.clientX-d.sx)/z, dy=(ev.clientY-d.sy)/z;
    if(!vs.nodePos) vs.nodePos={};
    const cur=vs.nodePos[d.id];
    const base=cur || {dx:0,dy:0};
    const prev = cur ? {dx:cur.dx, dy:cur.dy} : null;   // where it sat before this drag (null = propagation)
    vs.nodePos[d.id]={dx:base.dx+dx, dy:base.dy+dy, ok:false, prev};
    saveNodePos();
    render();   // re-render places the card at its new offset (the drag transform left it there, so no jump)
  } else {
    d.el.classList.remove('mm-dragging'); d.el.style.transform='';   // no real move → treated as a click
  }
  setTimeout(()=>{ _mmDragged=false; }, 60);
}

// Does `start` reach `goal` by following Builds-On? (used to block cycles)
function _reaches(start, goal){
  const seen=new Set(); const stack=[start];
  while(stack.length){ const id=stack.pop(); if(id===goal) return true; if(seen.has(id)) continue; seen.add(id);
    for(const p of ((vs.byId[id]&&vs.byId[id].buildsOn)||[])) stack.push(p); }
  return false;
}
function _connExists(spec){
  if(spec.type==='builds'){ const c=vs.byId[spec.childId]; return !!(c && (c.buildsOn||[]).includes(spec.parentId)); }
  if(spec.type==='cross'){ const a=vs.byId[spec.aId]; return !!(a && (a.cross||[]).includes(spec.bId)); }
  const a=vs.byId[spec.aId]; return !!(a && (a.connected||[]).includes(spec.bId));
}
// Apply a connection action from a drag-drop (no editor open). Same path as the
// editor: optimistic + undo + draft/live persist + animated re-layout.
async function vizDoConn(spec, focalId){
  if(spec.type==='builds'){
    if(spec.childId===spec.parentId) return;
    if(_reaches(spec.parentId, spec.childId)){ _mmToast('Can’t — that would create a Builds-On loop.'); return; }
  }
  if(_connExists(spec)){ _mmToast('That connection already exists.'); return; }
  _draftTouch(spec); _applyConnLocal(spec, true); _undo.push({spec, added:true}); _redo=[];
  if(_draftOn()){ vizAfterEdit(focalId); return; }
  try{ await _persistConn(spec); vizAfterEdit(focalId); }
  catch(err){ _applyConnLocal(spec, false); _undo.pop(); _mmToast('Save failed: '+(err&&err.message||'')); vizAfterEdit(focalId); }
}
// ── Pick-on-map link target ─────────────────────────────────────────────────
// From the editor, choose to find the link target on the map instead of typing.
// The reader hides (handy on mobile, where it's full-screen), the map shows, and
// the next node you tap becomes the connection (using the editor's chosen kind).
function vizLinkPickStart(){
  const e=vs.edit; if(!e) return;
  vs.linkPick={fromId:e.id, connKind:e.connKind||'builds', prevFull:!!(vs.mm&&vs.mm.full)};
  vs.view='map';                                  // ensure the map is the visible surface
  if(vs.mm) vs.mm.full=true;                       // take over the viewport so the filter bar/empty editor gap don't show
  render();
}
function vizLinkPickCancel(){ const lp=vs.linkPick; vs.linkPick=null; if(vs.mm) vs.mm.full = lp ? !!lp.prevFull : false; render(); }
async function vizLinkPickChoose(targetId){
  const lp=vs.linkPick; if(!lp) return;
  vs.linkPick=null;
  if(vs.mm) vs.mm.full = !!lp.prevFull;            // restore the prior full-screen state
  const {fromId, connKind}=lp;
  if(!targetId || targetId===fromId){ render(); _mmToast('Pick a different fragment.'); return; }
  const spec=_connSpecFor(connKind, fromId, targetId);
  if(spec.type==='builds' && _reaches(spec.parentId, spec.childId)){ render(); _mmToast('Can’t — that would create a Builds-On loop.'); return; }
  if(spec.type==='cross' && vs.byId[fromId] && vs.byId[targetId] && vs.byId[fromId].comp===vs.byId[targetId].comp){ render(); _mmToast('Cross-thread links go to a fragment in a different thread — use Connected within a thread.'); return; }
  if(_connExists(spec)){ render(); _mmToast('That connection already exists.'); return; }
  await vizDoConn(spec, fromId);                   // applies + re-renders (reader/editor reappear on the source)
}

// Floating menu shown at the drop point: choose the relationship to create.
function _showDropMenu(x, y, dId, tId){
  _closeDropMenu();
  const D=vs.byId[dId], T=vs.byId[tId]; if(!D||!T) return;
  const dn=esc(tqShort(D.title,30)), tn=esc(tqShort(T.title,30));
  const m=document.createElement('div'); m.className='drag-menu'; m.id='drag-menu';
  const item=(label, disabled)=>`<button class="dm-item" ${disabled?'disabled':''}>${label}</button>`;
  const cycleD = _reaches(tId, dId);   // D builds on T would loop
  const cycleT = _reaches(dId, tId);   // T builds on D would loop
  m.innerHTML =
    `<div class="dm-head">Connect</div>`+
    item(`“${dn}” <b>builds on</b> “${tn}”`, cycleD || _connExists({type:'builds',childId:dId,parentId:tId}))+
    item(`“${tn}” <b>builds on</b> “${dn}”`, cycleT || _connExists({type:'builds',childId:tId,parentId:dId}))+
    item(`<b>Connect</b> “${dn}” ↔ “${tn}”`, _connExists({type:'connected',aId:dId,bId:tId}))+
    (D.comp!==T.comp ? item(`<b>⇄ Cross-thread link</b> “${dn}” ↔ “${tn}” <span style="color:var(--dim)">(threads stay separate)</span>`, _connExists({type:'cross',aId:dId,bId:tId})) : '')+
    `<button class="dm-item dm-cancel">Cancel</button>`;
  document.body.appendChild(m);
  // position, keeping it on-screen
  const r=m.getBoundingClientRect();
  m.style.left=Math.min(x, window.innerWidth - r.width - 8)+'px';
  m.style.top =Math.min(y, window.innerHeight - r.height - 8)+'px';
  const btns=m.querySelectorAll('.dm-item');
  btns[0].addEventListener('click', ()=>{ _closeDropMenu(); vizDoConn({type:'builds', childId:dId, parentId:tId}, dId); });
  btns[1].addEventListener('click', ()=>{ _closeDropMenu(); vizDoConn({type:'builds', childId:tId, parentId:dId}, dId); });
  btns[2].addEventListener('click', ()=>{ _closeDropMenu(); vizDoConn({type:'connected', aId:dId, bId:tId}, dId); });
  if(D.comp!==T.comp){
    btns[3].addEventListener('click', ()=>{ _closeDropMenu(); vizDoConn({type:'cross', aId:dId, bId:tId}, dId); });
    btns[4].addEventListener('click', _closeDropMenu);
  } else btns[3].addEventListener('click', _closeDropMenu);
  setTimeout(()=>document.addEventListener('pointerdown', _dropMenuOutside, true), 0);
}
function _dropMenuOutside(ev){ if(!ev.target.closest('.drag-menu')) _closeDropMenu(); }
function _closeDropMenu(){ const m=document.getElementById('drag-menu'); if(m) m.remove(); document.removeEventListener('pointerdown', _dropMenuOutside, true); }
// Brief transient message for drag feedback.
let _toastT=null;
function _mmToast(msg){
  let t=document.getElementById('mm-toast');
  if(!t){ t=document.createElement('div'); t.id='mm-toast'; t.className='mm-toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_toastT); _toastT=setTimeout(()=>{ t.classList.remove('show'); }, 2600);
}
function vizMmWheel(ev){
  ev.preventDefault();
  const canvas=document.getElementById('mm-canvas');
  const rect=canvas?canvas.getBoundingClientRect():{left:0,top:0};
  const mx=ev.clientX-rect.left, my=ev.clientY-rect.top;     // pointer in canvas space
  const oldZ=vs.mm.zoom;
  const factor = ev.deltaY<0 ? 1.1 : 0.9;
  const newZ=Math.max(0.25, Math.min(2.5, oldZ*factor));
  // zoom toward the pointer: keep the scene point under the cursor fixed
  const sx=(mx-vs.mm.pan.x)/oldZ, sy=(my-vs.mm.pan.y)/oldZ;
  vs.mm.pan.x = mx - sx*newZ;
  vs.mm.pan.y = my - sy*newZ;
  vs.mm.zoom = newZ;
  _mmApplyTransform();
}





/* ════════════════════════════════════════════════════════════════════════
 * VISUALIZE TAB — data layer
 * ════════════════════════════════════════════════════════════════════════ */

// Map of IP "Has X" rollup property → facet label, for cheap classifier titles.
const VIZ_GOALS_ROLLUPS = {
  'Has Vision':'Visions', 'Has Goal':'Goals', 'Has Objective':'Objectives',
  'Has Project':'Projects', 'Has Habit':'Habits', 'Has HLS':'High Leverage Systems'
};
const VIZ_KB_ROLLUP = 'Has Knowledge Bank';
// Capture-system "Has X" rollups → their Primary Source select value, so we can
// show the INSTANCE titles (not the DB name) on capture/source pills.
const VIZ_CAPTURE_ROLLUPS = {
  'Has Life Bank':'Life Bank', 'Has Content Vault':'Content Vault',
  'Has Media Vault':'Media Vault', 'Has Personal Education':'Personal Education',
  'Has Idea Streams':'Idea Streams', 'Has The Network':'The Network',
  'Has Companies':'Companies'
  // (Events in Time has no rollup defined in the IP schema; Knowledge Bank handled separately)
};
// Identifying emojis for each relational system: capture systems + Knowledge
// Bank, and the Goals levels. These match the live Thread Identifier / Primary
// Source Identifier formulas (Projects 🌿, Habits 🗼) so a goal/source shown in
// the section-1 identifier pill uses the same emoji as its section-2 pill.
const REL_EMOJI = {
  // capture systems (by Primary Source value)
  'Life Bank':'🖋️', 'Content Vault':'📕', 'Media Vault':'🎥',
  'Personal Education':'🍏', 'Idea Streams':'🛤️', 'The Network':'📖',
  'Events in Time':'📸', 'Companies':'🏢', 'Knowledge Bank':'🌐',
  // goals levels (by VIZ_GOALS_ROLLUPS label)
  'Visions':'📽️', 'Goals':'⛰️', 'Objectives':'🎯',
  'Projects':'🌿', 'Habits':'🗼', 'High Leverage Systems':'⚙️'
};

function rollupTitles(prop){
  // A rollup of related-page titles comes back as {type:'rollup', rollup:{array:[{type:'title',title:[...]}, ...]}}
  if(!prop || prop.type!=='rollup' || !prop.rollup) return [];
  const arr = prop.rollup.array || [];
  const out = [];
  for(const item of arr){
    if(item.type==='title') out.push((item.title||[]).map(t=>t.plain_text).join(''));
    else if(item.type==='rich_text') out.push((item.rich_text||[]).map(t=>t.plain_text).join(''));
    else if(typeof item.name==='string') out.push(item.name);
  }
  return out.filter(Boolean);
}
function relIds(prop){
  if(!prop || prop.type!=='relation') return [];
  return (prop.relation||[]).map(r=>r.id);
}
function formulaString(prop){
  if(!prop || prop.type!=='formula' || !prop.formula) return '';
  const f = prop.formula;
  return (f.string ?? (f.number!=null?String(f.number):'') ?? '') || '';
}
function selectName(prop){
  if(!prop) return '';
  if(prop.type==='select') return prop.select ? prop.select.name : '';
  return '';
}
function checkboxVal(prop){ return !!(prop && prop.type==='checkbox' && prop.checkbox); }
// ── Image (Files & media) property ──
function _imageProp(props){ for(const k of IMAGE_PROPS){ const p=props&&props[k]; if(p && p.type==='files') return p; } return null; }
function filesRaw(props){ const p=_imageProp(props); return p ? (p.files||[]).slice() : []; }
function filesProp(props){
  const p=_imageProp(props); if(!p) return [];
  return (p.files||[]).map(f=>{
    if(f.type==='file' && f.file) return {url:f.file.url, expiry: f.file.expiry_time ? Date.parse(f.file.expiry_time) : null, name:f.name||'', external:false};
    if(f.type==='external' && f.external) return {url:f.external.url, expiry:null, name:f.name||'', external:true};
    return null;
  }).filter(Boolean);
}
function vizImageProp(){ return vs.imagePropName || IMAGE_PROPS[0]; }
function richText(prop){
  if(!prop || prop.type!=='rich_text') return '';
  return (prop.rich_text||[]).map(t=>t.type==='equation' && t.equation ? '$'+t.equation.expression+'$' : t.plain_text).join('');
}

/* ════════════════════════════════════════════════════════════════════════
 * GOALS-SYSTEM ALIGNMENT ENGINE
 * ────────────────────────────────────────────────────────────────────────
 * The six goals databases form a fully-connected mesh: every level can relate
 * directly to every other. We load them once and build TWO adjacencies per item:
 *   • adjAny  — undirected: every cross-level relation, both directions. Closure
 *     reaches anything linked to X up, down, or sideways across the web.
 *   • adjDown — downward-only: edges from a higher level to a strictly lower one
 *     (Visions→Goals→Objectives→Projects→Habits/HLS), plus the Habits↔HLS leaf
 *     lateral. Closure reaches only items BELOW X in the hierarchy.
 * The active mode is vs.fGoalMode ('any' | 'down'); both are precomputed so the
 * toggle is instant. Each relation is added both ways for adjAny so reachability
 * is robust even if only one side of a Notion relation is populated.
 * ════════════════════════════════════════════════════════════════════════ */
const GOAL_LEVELS = ['Visions','Goals','Objectives','Projects','Habits','High Leverage Systems'];
const GOAL_RANK = {'Visions':0,'Goals':1,'Objectives':2,'Projects':3,'Habits':4,'High Leverage Systems':4};
// Relation property name (in any goals DB) → the level it points at.
const GOAL_REL_TO_LEVEL = {
  '📽️ Visions':'Visions',
  '⛰️ Goals':'Goals',
  '🎯 Objectives':'Objectives',
  '🌿 Projects':'Projects',
  '🗼 Habits (Unified)':'Habits',
  '⚙️ High Leverage Systems':'High Leverage Systems'
};
function goalRelArrayIds(prop){
  if(!prop || prop.type!=='relation') return [];
  return (prop.relation||[]).map(r=>fmtId(r.id));
}

// gs holds the loaded goals graph. Loaded lazily the first time "By Goal" is used.
let gs = {
  loaded:false, loading:false, err:'',
  byId:{},               // goalId → {id, title, level, adjAny:[goalId], adjDown:[goalId]}
  byLevel:{}             // level → [{id,title}]   (for the level-then-search picker)
};

async function vizLoadGoals(){
  if(gs.loaded || gs.loading) return;
  gs.loading=true; gs.err=''; render();
  const byId={}, byLevel={};
  GOAL_LEVELS.forEach(l=>byLevel[l]=[]);
  // Fetch one goals DB fully (paginating its own cursor) and return its rows.
  const loadOneLevel = async (level)=>{
    const reg = GOALS_DBS[level];
    const dbId = fmtId(reg.dbId);
    const rows = [];
    let cursor=null, pages=0;
    do{
      const body={page_size:100};
      if(cursor) body.start_cursor=cursor;
      const data = await nPost('/databases/'+dbId+'/query', body);
      for(const p of (data.results||[])){
        const id = fmtId(p.id);
        const props = p.properties||{};
        const title = extractTitle(props) || '';
        // collect this item's relations to OTHER goals levels
        const rels = [];  // [{id, level}]
        for(const [propName, lvl] of Object.entries(GOAL_REL_TO_LEVEL)){
          if(lvl===level) continue;            // self-level relation = sibling links; skip
          goalRelArrayIds(props[propName]).forEach(rid=>rels.push({id:rid, level:lvl}));
        }
        rows.push({id, title, level, rels});
      }
      cursor = data.has_more ? data.next_cursor : null;
      pages++;
    } while(cursor && pages<30);
    return rows;
  };
  try{
    // Query all six goals databases concurrently instead of one after another.
    // Network round-trips dominate this load; running the six in parallel cuts
    // wall-clock time from the SUM of all six down to roughly the slowest one.
    // mapPool preserves index order and captures a throw as {__err}, so we
    // surface the first failure to keep the original error handling.
    const perLevel = await mapPool(GOAL_LEVELS, loadOneLevel, 6);
    const failed = perLevel.find(r => r && r.__err);
    if(failed) throw failed.__err;
    GOAL_LEVELS.forEach((level, i)=>{
      for(const row of (perLevel[i]||[])){
        byId[row.id] = row;
        byLevel[level].push({id:row.id, title:row.title});
      }
    });
  }catch(e){
    gs.loading=false; gs.err = /object_not_found|Could not find|404/i.test(e.message)
      ? 'A goals database is not shared with the Recall integration.' : (e.message||'Failed to load goals');
    render(); return;
  }
  // Build adjacencies. adjAny: undirected (both directions). adjDown: downward
  // only (edge to a strictly-lower rank), plus the Habits↔HLS leaf lateral.
  for(const g of Object.values(byId)){ g._any=new Set(); g._down=new Set(); }
  for(const g of Object.values(byId)){
    const myRank = GOAL_RANK[g.level];
    for(const r of g.rels){
      const t = byId[r.id];
      if(!t) continue;                          // edge to an item we didn't load
      // undirected: both ways
      g._any.add(r.id); t._any.add(g.id);
      // downward: from this item to a strictly-lower-ranked neighbor; plus the
      // Habits↔HLS leaf lateral (both rank 4, different level).
      const theirRank = GOAL_RANK[r.level];
      const isDown = theirRank > myRank;
      const isLeafLateral = (myRank===4 && theirRank===4 && g.level!==r.level);
      if(isDown || isLeafLateral) g._down.add(r.id);
    }
  }
  for(const g of Object.values(byId)){ g.adjAny=Array.from(g._any); g.adjDown=Array.from(g._down); delete g._any; delete g._down; }
  GOAL_LEVELS.forEach(l=>byLevel[l].sort((a,b)=>a.title.localeCompare(b.title)));
  gs.byId=byId; gs.byLevel=byLevel; gs.loaded=true; gs.loading=false;
  render();
}

// Alignment closure from a goals item, following the active mode's adjacency.
// mode: 'any' (undirected reachability) | 'down' (downward only). Returns Set of IDs.
function vizGoalClosure(startId, mode){
  const out=new Set();
  if(!gs.byId[startId]) return out;
  const useDown = mode==='down';
  const stack=[startId];
  while(stack.length){
    const id=stack.pop();
    if(out.has(id)) continue;
    out.add(id);
    const g=gs.byId[id];
    if(g){ const nbrs = useDown ? g.adjDown : g.adjAny; for(const d of nbrs){ if(!out.has(d)) stack.push(d); } }
  }
  return out;
}

// Given the currently-selected goal item + mode, compute the set of aligned
// TITLES (the closure's titles), which is what fragment.goals carries.
function vizComputeGoalClosureTitles(){
  vs._goalClosureTitles = null;
  if(vs.fFacet!=='goal' || !vs.fGoalItemId) return;
  const ids = vizGoalClosure(vs.fGoalItemId, vs.fGoalMode||'any');
  const titles = new Set();
  ids.forEach(id=>{ const g=gs.byId[id]; if(g && g.title) titles.add(g.title); });
  vs._goalClosureTitles = titles;
}

// For a goals search suggestion, the parent-level context to show as metadata:
//   Goals → its Visions,  Objectives → its Goals,  Projects → its Objectives,
//   Habits → its Visions,  High Leverage Systems → its Visions.
// (Visions are top-level and show no parent.) Returns a short " · "-joined
// string of parent titles, or '' when there's nothing useful to show.
const GOAL_PARENT_LEVEL = {
  'Goals':'Visions',
  'Objectives':'Goals',
  'Projects':'Objectives',
  'Habits':'Visions',
  'High Leverage Systems':'Visions'
};
function vizGoalItemMeta(itemId){
  const g = gs.byId[itemId];
  if(!g) return '';
  const parentLevel = GOAL_PARENT_LEVEL[g.level];
  if(!parentLevel) return '';
  const seen = new Set();
  const titles = [];
  for(const r of (g.rels||[])){
    if(r.level!==parentLevel) continue;
    const t = gs.byId[r.id];
    if(t && t.title && !seen.has(t.title)){ seen.add(t.title); titles.push(t.title); }
  }
  return titles.join(' · ');
}

// Read every capture/goals/Knowledge-Bank relation property's page IDs off an IP
// row, keyed by relation-property name. The editable counterpart to the read-only
// rollups (captureInstances/goals/kb) — used by the pills editor to add/remove.
function _readNodeRels(props){
  const out = {};
  for(const d of REL_DB_REGISTRY){
    const ids = relIds(props[d.relProp]);
    if(ids && ids.length) out[d.relProp] = ids;
  }
  return out;
}
async function vizLoad(){
  if(!creds.proxyUrl || !creds.notionToken){ vs.loadSt='error'; vs.loadMsg='Set proxy URL and Notion token in Settings first.'; render(); return; }
  vs.loadSt='loading'; vs.loadMsg=''; render();
  const dbId = fmtId(getIpDb());

  // ── Schema detection ─────────────────────────────────────────────────────
  // Notion self-relations come in two flavors:
  //   (1) one-property self-relation — SYMMETRIC. Writing A.BuildsOn=[B] mirrors
  //       to B.BuildsOn=[A]; direction is unrecoverable from the data.
  //   (2) two-property self-relation — DIRECTIONAL. "Builds On" is paired with
  //       a separate inverse property (e.g. "Refined By"); Notion auto-populates
  //       the inverse. Direction is preserved natively.
  // We detect which configuration is in use by reading the database schema and
  // store the inverse property name (if any) for the rest of the load to use.
  vs.ipSchema = { buildsOnSymmetric: false, buildsOnInverse: null, schemaError: null };
  try{
    const schema = await nReq('GET', '/databases/'+dbId);
    const props = schema.parsed && schema.parsed.properties;
    if(props){
      for(const k of IMAGE_PROPS){ if(props[k] && props[k].type==='files'){ vs.imagePropName=k; break; } }
      for(const [k,p] of Object.entries(props)){ if(p.type==='title'){ vs.ipTitleProp=k; break; } }
    }
    if(props && props['Builds On'] && props['Builds On'].type === 'relation'){
      const rel = props['Builds On'].relation || {};
      // Notion API: dual_property → has a separate inverse; single_property → symmetric.
      if(rel.type === 'dual_property' && rel.dual_property && rel.dual_property.synced_property_name){
        vs.ipSchema.buildsOnInverse = rel.dual_property.synced_property_name;
      } else if(rel.type === 'single_property'){
        vs.ipSchema.buildsOnSymmetric = true;
      }
    }
  }catch(e){
    vs.ipSchema.schemaError = e.message || String(e);
    // continue — we'll fall back to raw buildsOn if schema fetch failed
  }
  const inverseProp = vs.ipSchema.buildsOnInverse;
  const nodes = [];
  try{
    let cursor=null, pages=0;
    do{
      const body={page_size:100};
      if(cursor) body.start_cursor=cursor;
      const data = await nPost('/databases/'+dbId+'/query', body);
      for(const p of (data.results||[])){
        const props = p.properties||{};
        const type = selectName(props.Type);
        if(type===LAYOUT_TYPE){ _layoutPageId = p.id; continue; }       // cross-device layout blob row — not a fragment
        if(type===THREAD_QUEUE_TYPE || type===ARCHIVED_TYPE) continue;   // queue scratch pages (and retired ones) aren't fragments
        if(isSaInboxType(type)) continue;                                // stand-alone ideas still waiting in the Inbox
        if(!isLatticeType(type)) continue;                               // Thread Pending, Revisit, Look Into…, untyped: not part of the latticework
        const goals = [];
        for(const [rk, sys] of Object.entries(VIZ_GOALS_ROLLUPS))
          rollupTitles(props[rk]).forEach(t=>goals.push({system:sys, title:t}));
        const kb = rollupTitles(props[VIZ_KB_ROLLUP]);
        const captureInstances = [];
        for(const [rk, sys] of Object.entries(VIZ_CAPTURE_ROLLUPS))
          rollupTitles(props[rk]).forEach(t=>captureInstances.push({system:sys, title:t}));
        nodes.push({
          id: p.id,
          title: extractTitle(props),
          type: type || '(untyped)',
          resolved: checkboxVal(props.Resolved),
          method: selectName(props.Method),
          primarySource: selectName(props['Primary Source']),
          threadName: richText(props['Thread Name']),   // custom thread label (component-level; stored on the anchor). '' → fall back to anchor title.
          vetted: checkboxVal(props['Vetted']),          // thread-level "foundational work done" flag (stored on the anchor; read component-wide).
          rels: _readNodeRels(props),                     // {relProp:[pageId,…]} for every capture/goals/KB relation — the editable source of truth for the pills editor.
          _mapPos: (function(){ const s=richText(props['Map Pos']); const m=s&&s.split(','); return (m&&m.length===2&&!isNaN(+m[0])&&!isNaN(+m[1]))?{dx:+m[0],dy:+m[1]}:null; })(),
          _chainOrder: (function(){ const s=richText(props['Chain Order']); return s? s.split(',').map(x=>x.trim()).filter(Boolean):null; })(),
          captureInstances: captureInstances,
          identifier: formulaString(props['Thread Identifier']),
          primarySourceId: formulaString(props['Primary Source Identifier']),
          threadStatus: formulaString(props['Thread Status']),
          buildsOn: relIds(props['Builds On']),
          // refinedBy = inverse of Builds On. When the IP DB has a paired
          // inverse property configured, this list is the DIRECTIONAL set of
          // nodes that build on THIS node — i.e., this node's children in the
          // spine tree. Empty when schema is symmetric (no inverse property).
          refinedBy: inverseProp ? relIds(props[inverseProp]) : [],
          connected: relIds(props['Connected Fragments']),
          cross: relIds(props[CROSS_THREAD_PROP]),          // cross-thread links (never merge threads)
          images: filesProp(props),                          // [{url, expiry, name, external}] from the Image files property
          imagesRaw: filesRaw(props),                        // the raw Notion file objects (re-sent verbatim when editing the property)
          // created_time fallback for legacy data where the inverse property
          // isn't configured. Used only when refinedBy is empty AND schema is
          // detected symmetric — see buildsOnDir() for the resolution order.
          createdAt: p.created_time ? Date.parse(p.created_time) : 0,
          goals: goals,
          kb: Array.from(new Set(kb)),
          comp: -1
        });
      }
      cursor = data.has_more ? data.next_cursor : null;
      pages++;
    } while(cursor && pages<40);
  }catch(e){
    vs.loadSt='error';
    vs.loadMsg = /object_not_found|Could not find database|404/i.test(e.message)
      ? 'Info Processing database not found / not shared with the Recall integration.'
      : (e.message||'Load failed');
    render(); return;
  }
  vs.nodes = nodes;
  vs.byId = {}; nodes.forEach(n=>vs.byId[n.id]=n);
  // Cross-thread links are shown from both ends regardless of which side was
  // written (a one-property self-relation mirrors automatically; a two-property
  // one or a hand-edited page might not).
  nodes.forEach(n=>{ (n.cross||[]).forEach(t=>{ const o=vs.byId[t]; if(o){ o.cross=o.cross||[]; if(!o.cross.includes(n.id)) o.cross.push(n.id); } }); });
  nodes.forEach(n=>{ n.cross=(n.cross||[]).filter(t=>!!vs.byId[t]); });
  // Seed view-state overrides from Notion (durable across app updates / origins).
  // Notion is authoritative for ACCEPTED positions and chain orders; localStorage
  // retains transient state (pending unaccepted drags, root-group order).
  nodes.forEach(n=>{
    if(n._mapPos){ vs.nodePos[n.id] = {dx:n._mapPos.dx, dy:n._mapPos.dy, ok:true, prev:null}; }
    if(n._chainOrder && n._chainOrder.length){ vs.childOrder[n.id] = n._chainOrder.slice(); }
    delete n._mapPos; delete n._chainOrder;
  });
  // Cross-device layout: the Notion Layout blob (if newer than this browser's
  // copy) overrides everything above — thread order, root-group order, positions.
  await _layoutReconcile();
  vizBuildComponents();
  _treeCache={};
  // Reverse-index of "Builds On" must be rebuilt against the new node set.
  vs._dirIndexBuilt = false; vs._parentsIndex = {}; vs._childrenIndex = {};
  vs.loadSt='ok';
  render();
}

// Union-find over Builds On + Connected Fragments (undirected) → components.
// Edges to fragments outside the fetched set (shouldn't happen, but safe) are ignored.
function vizBuildComponents(){
  // Per-thread collapse state is keyed by comp index, but indices are reassigned
  // on every rebuild. Capture which threads were collapsed by a STABLE key (their
  // lowest-id member) so we can re-apply it to the new indices and not blow away
  // the user's collapsed/expanded layout on every edit.
  const _collapsedKeys = new Set();
  if(vs.mm && vs.mm.collapsedThreads && Array.isArray(vs.comps)){
    vs.comps.forEach((c,i)=>{ if(vs.mm.collapsedThreads[i] && c.nodeIds && c.nodeIds.length){ _collapsedKeys.add(c.nodeIds.reduce((a,b)=>a<b?a:b)); } });
  }
  const idIndex = {}; vs.nodes.forEach((n,i)=>idIndex[n.id]=i);
  const parent = vs.nodes.map((_,i)=>i);
  const find = a => { while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; };
  const union = (a,b)=>{ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; };
  vs.nodes.forEach((n,i)=>{
    for(const ref of [...n.buildsOn, ...n.connected]){
      const j = idIndex[ref];
      if(j!=null) union(i,j);
    }
  });
  const groups = {};
  vs.nodes.forEach((n,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(n.id); });
  const comps = [];
  let idx=0;
  for(const root of Object.keys(groups)){
    const nodeIds = groups[root];
    const goals=new Set(), kb=new Set(), sources=new Set(), idents=new Set();
    const captureMap=new Map();   // "system|title" → {system, title}
    const goalsMap=new Map();     // "system|title" → {system, title}
    let resolvedCount=0;
    for(const id of nodeIds){
      const n = vs.byId[id];
      n.comp = idx;
      (n.goals||[]).forEach(g=>{ goals.add(g.title); goalsMap.set(g.system+'|'+g.title, g); });
      n.kb.forEach(k=>kb.add(k));
      (n.captureInstances||[]).forEach(c=>captureMap.set(c.system+'|'+c.title, c));
      if(n.primarySource) sources.add(n.primarySource);
      if(n.identifier) idents.add(n.identifier);
      if(n.resolved) resolvedCount++;
    }
    const captureInstances = Array.from(captureMap.values());
    const goalsObjs = Array.from(goalsMap.values());
    comps.push({
      idx, nodeIds,
      total: nodeIds.length,
      resolvedCount,
      open: resolvedCount < nodeIds.length,   // open if ANY fragment unresolved
      goals, goalsObjs, kb, sources, idents, captureInstances
    });
    idx++;
  }
  // Sort: largest threads first (most developed), singletons last.
  comps.sort((a,b)=> b.total - a.total);
  comps.forEach((c,i)=>{ c.idx=i; c.nodeIds.forEach(id=>{ vs.byId[id].comp=i; }); });
  vs.comps = comps;
  // Re-apply collapse state to the new indices via the stable per-thread keys.
  if(vs.mm){ const m={}; comps.forEach((c,i)=>{ if(c.nodeIds.length && _collapsedKeys.has(c.nodeIds.reduce((a,b)=>a<b?a:b))) m[i]=true; }); vs.mm.collapsedThreads=m; }
  _spineCache = {};   // component indices changed — drop memoized spines
  _treeCache = {};
}

/* Build the ordered reading spine for a component: Core Ideas in Builds On
 * order (topological by dependency), each with its attached RC/RCQ/OL tangents.
 * Mirrors the editor's grouping but over live node ids. */
let _spineCache = {};
function vizThreadSpine(compIdx){
  if(_spineCache[compIdx]) return _spineCache[compIdx];
  const r = _computeThreadSpine(compIdx);
  _spineCache[compIdx] = r;
  return r;
}
function _computeThreadSpine(compIdx){
  const comp = vs.comps[compIdx];
  if(!comp) return {spine:[], tangentsOf:{}, orphans:[]};
  const ids = comp.nodeIds;
  const inComp = new Set(ids);
  const isCore = id => vs.byId[id] && isSpineType(vs.byId[id].type);

  // SPINE MEMBERSHIP: a node is a structural (spine) node if it's a Core Idea OR
  // it participates in any Builds On edge inside the component — it builds on
  // something here, or something here builds on it. This lets a Core Idea that
  // builds on an RC/RCQ/OL (and that RC) both join the tree so the branch
  // continues off it, instead of the Core dangling as a stranded root. For
  // ordinary threads (Cores build on Cores; RC/RCQ/OL only Connected) the spine
  // set is exactly the Cores, so existing behavior is unchanged.
  const buildsWithin = id => buildsOnDir(vs.byId[id]).some(t=>inComp.has(t));
  const isBuiltOn    = id => ids.some(o=> buildsOnDir(vs.byId[o]).includes(id));
  const isSpine = id => isCore(id) || buildsWithin(id) || isBuiltOn(id);
  const spineNodes = ids.filter(isSpine);

  // Topological order of spine nodes by Builds On (roots first). buildsOnDir
  // ignores symmetric-relation back-edges where possible.
  const spineSet = new Set(spineNodes);
  const indeg = {}; spineNodes.forEach(c=>indeg[c]=0);
  spineNodes.forEach(c=>{
    buildsOnDir(vs.byId[c]).forEach(t=>{ if(spineSet.has(t)) indeg[c]++; });
  });
  // Kahn's algorithm; ties broken by original node order (stable).
  const order = [];
  let frontier = spineNodes.filter(c=>indeg[c]===0);
  const seen = new Set();
  while(frontier.length){
    frontier.sort((a,b)=> ids.indexOf(a)-ids.indexOf(b));
    const next=[];
    for(const c of frontier){
      if(seen.has(c)) continue;
      seen.add(c); order.push(c);
      spineNodes.forEach(o=>{
        if(!seen.has(o) && buildsOnDir(vs.byId[o]).includes(c)){
          indeg[o]--; if(indeg[o]<=0) next.push(o);
        }
      });
    }
    frontier = next;
  }
  spineNodes.forEach(c=>{ if(!seen.has(c)) order.push(c); });   // cycles → node order

  // Attach each non-spine node to the first spine node it reaches via buildsOn/connected.
  const spineFor = (startId)=>{
    const visited=new Set(); const stack=[startId];
    while(stack.length){
      const id=stack.shift();
      if(id==null||visited.has(id)) continue;
      visited.add(id);
      const n=vs.byId[id]; if(!n) continue;
      if(isSpine(id) && id!==startId) return id;
      for(const ref of [...buildsOnDir(n), ...n.connected]){
        if(inComp.has(ref) && !visited.has(ref)){
          if(isSpine(ref)) return ref;
          stack.push(ref);
        }
      }
    }
    return null;
  };
  const tangentsOf = {}; order.forEach(c=>tangentsOf[c]=[]);
  const orphans = [];
  for(const id of ids){
    if(spineSet.has(id)) continue;
    const c = spineFor(id);
    if(c!=null && tangentsOf[c]) tangentsOf[c].push(id);
    else orphans.push(id);
  }
  return {spine:order, tangentsOf, orphans};
}

async function runDiag(){
  if(!creds.proxyUrl || !creds.notionToken){ alert('Set Proxy URL and Notion Token first.'); return; }
  diagSt = 'running'; render();
  const results = [];

  const check = async (label, fn) => {
    try{
      const detail = await fn();
      results.push({label, status:'ok', detail: detail||'OK'});
    }catch(e){
      results.push({label, status:'err', detail: e.message||String(e)});
    }
    diagSt = results; render();
  };

  // 1. Token check
  await check('Token: GET /users/me', async ()=>{
    const r = await nReq('GET','/users/me');
    if(!r.ok) throw new Error(`${r.status}: ${r.text.slice(0,300)}`);
    const u = r.parsed;
    return `Authenticated as: ${u?.name||u?.id||'unknown'} (${u?.type||'?'})`;
  });

  // 2. Active Recall DB
  await check(`AR Database GET (${fmtId(AR_DB)})`, async ()=>{
    const r = await nReq('GET','/databases/'+fmtId(AR_DB));
    if(!r.ok) throw new Error(`${r.status}: ${r.text.slice(0,300)}`);
    const title = (r.parsed?.title||[]).map(t=>t.plain_text).join('') || '(no title)';
    const props = Object.keys(r.parsed?.properties||{}).join(', ');
    return `Title: "${title}"\nProperties: ${props}`;
  });

  // 3. IP DB — try as database
  const ipId = fmtId(getIpDb());
  await check(`IP Database GET (${ipId})`, async ()=>{
    const r = await nReq('GET','/databases/'+ipId);
    if(!r.ok){
      const code = r.parsed?.code||'';
      throw new Error(`${r.status} ${code}: ${r.text.slice(0,300)}`);
    }
    const title = (r.parsed?.title||[]).map(t=>t.plain_text).join('') || '(no title)';
    const props = Object.keys(r.parsed?.properties||{}).join(', ');
    return `✓ Is a database. Title: "${title}"\nProperties: ${props}`;
  });

  // 4. IP ID — try as page (helps if it's actually a page)
  await check(`IP ID as PAGE GET (${ipId})`, async ()=>{
    const r = await nReq('GET','/pages/'+ipId);
    if(!r.ok){
      const code = r.parsed?.code||'';
      throw new Error(`${r.status} ${code} — expected if this ID is a database, not a page`);
    }
    return `⚠ This ID resolves as a PAGE, not a database. You need to find the actual database ID inside this page.`;
  });

  // 5. AR DB query (no filter)
  await check('AR Database query (no filter, 1 result)', async ()=>{
    const r = await nReq('POST','/databases/'+fmtId(AR_DB)+'/query', {page_size:1});
    if(!r.ok) throw new Error(`${r.status}: ${r.text.slice(0,300)}`);
    const count = r.parsed?.results?.length||0;
    return `Query OK, got ${count} result(s). Total: ${r.parsed?.total_count||'?'}`;
  });

  // 6. IP DB query (no filter)
  await check(`IP Database query (no filter, 1 result)`, async ()=>{
    const r = await nReq('POST','/databases/'+ipId+'/query',{page_size:1});
    if(!r.ok) throw new Error(`${r.status}: ${r.text.slice(0,300)}`);
    const count = r.parsed?.results?.length||0;
    return `Query OK, got ${count} result(s)`;
  });

  // 7. Search for all accessible databases
  await check('Search: all accessible databases', async ()=>{
    // Try without filter first (works on all API versions)
    const r = await nReq('POST','/search',{
      filter:{property:'object', value:'database'},
      page_size:20
    });
    if(!r.ok){
      // Newer API uses data_source
      const r2 = await nReq('POST','/search',{
        filter:{property:'object', value:'data_source'},
        page_size:20
      });
      if(!r2.ok) throw new Error(`${r2.status}: ${r2.text.slice(0,300)}`);
      const dbs = (r2.parsed?.results||[]).map(d=>{
        const title = (d.title||[]).map(t=>t.plain_text).join('')||(d.name||'(untitled)');
        return `"${title}" → ${d.id||''}`;
      });
      return `(via data_source filter)\n`+(dbs.length?dbs.join('\n'):'(none accessible)');
    }
    const dbs = (r.parsed?.results||[]).map(d=>{
      const title = (d.title||[]).map(t=>t.plain_text).join('')||'(untitled)';
      return `"${title}" → ${d.id||''}`;
    });
    return dbs.length ? dbs.join('\n') : '(no databases accessible — check integration connections)';
  });

  // 8. Cross-device layout row — can the app read and write the layout blob?
  await check('Layout sync (cross-device arrangement)', async ()=>{
    const ok = await _layoutEnsurePage();
    if(!ok) throw new Error('Could not find or create the Layout row.');
    const b = await nGet('/blocks/'+fmtId(_layoutBlockId));
    const txt = ((b.code&&b.code.rich_text)||[]).map(t=>t.plain_text).join('');
    let parsed=null; try{ parsed=JSON.parse(txt||'{}'); }catch(e){}
    const when = parsed&&parsed.ts ? new Date(parsed.ts).toLocaleString() : 'never written';
    const counts = parsed ? `${Object.keys(parsed.nodePos||{}).length} positions · ${(parsed.threadOrder||[]).length} thread order · ${Object.keys(parsed.childOrder||{}).length} chain orders` : 'empty';
    await nPatch('/blocks/'+fmtId(_layoutBlockId), {code:{language:'json', rich_text:_layoutChunks(txt||'{}')}});   // write test (no data change)
    return `Row: ${_layoutPageId}\nLast written: ${when}\nContents: ${counts}\nRead + write both OK.`;
  });

  // 9. Image pipeline — proves whether uploads survive the proxy intact.
  // Generates a tiny PNG, runs the real three-step upload, then loads the
  // returned URL in an <img>. A decode failure means the bytes were corrupted
  // in transit (almost always a proxy that reads the body as text).
  await check('Image upload + display round-trip', async ()=>{
    const ok = await _layoutEnsurePage();
    if(!ok) throw new Error('Needs the Layout row (see the previous check).');
    const prop = vizImageProp();
    const canvas = document.createElement('canvas'); canvas.width=8; canvas.height=8;
    const ctx = canvas.getContext('2d'); ctx.fillStyle='#2563eb'; ctx.fillRect(0,0,8,8);
    const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob) throw new Error('Could not generate a test image in this browser.');
    const sentBytes = blob.size;
    const fu = await nPost('/file_uploads', {filename:'recall-selftest.png', content_type:'image/png'});
    if(!fu || !fu.id) throw new Error('Step 1 (create file upload) returned no id.');
    const fd = new FormData(); fd.append('file', blob, 'recall-selftest.png');
    await nUpload('/file_uploads/'+fu.id+'/send', fd);
    const page = await nPatch('/pages/'+fmtId(_layoutPageId), {properties:{[prop]:{files:[{type:'file_upload', file_upload:{id:fu.id}, name:'recall-selftest.png'}]}}});
    let files = filesProp(page.properties||{});
    if(!files.length){
      const fresh = await nGet('/pages/'+fmtId(_layoutPageId));
      files = filesProp(fresh.properties||{});
    }
    if(!files.length) throw new Error(`Uploaded, but the "${prop}" property came back with no viewable file. Check that "${prop}" is a Files & media property on Info Processing.`);
    const url = files[0].url;
    const decoded = await new Promise(res=>{
      const im = new Image();
      im.onload = ()=>res({ok:true, w:im.naturalWidth, h:im.naturalHeight});
      im.onerror = ()=>res({ok:false});
      im.src = url;
      setTimeout(()=>res({ok:false, timeout:true}), 12000);
    });
    try{ await nPatch('/pages/'+fmtId(_layoutPageId), {properties:{[prop]:{files:[]}}}); }catch(e){}   // clean up
    if(!decoded.ok){
      throw new Error(
        `Upload succeeded but the image will not display.\n`+
        `Sent ${sentBytes} bytes; Notion returned a URL but the browser could not decode it.\n`+
        `This is what a proxy that reads the request body as text does to binary uploads.\n`+
        `Fix: in the Val Town proxy use  const body = await req.arrayBuffer();  instead of  await req.text();\n`+
        `URL tested: ${url}`);
    }
    return `Sent ${sentBytes} bytes → uploaded → displayed at ${decoded.w}×${decoded.h}. Pipeline is healthy.`;
  });

  diagSt = results; render();
}

/* ════════════════════════════════════════════════════════════════════════
 *  PROCESSING INBOX
 *  Replaces the paste-and-fix Thread Queue flow with a staged workspace.
 *  Two lanes pulled straight from Info Processing:
 *    • Thread Queue pages (Type = Thread Queue): Read → Fragment (Claude) →
 *      Shape (staging, nothing written yet) → Connect (your connective pass
 *      against the latticework) → Commit (one two-pass write).
 *    • Stand-alone ideas (Type = "Stand Alone Ideas (Processed)"): quick
 *      triage — keep in the collection (optionally cross-linked), dock into a
 *      thread, pair with another stand-alone, or archive.
 *  Claude does the mechanical work (splitting into one-idea fragments, and
 *  proposing distant fragments to consider); every cross-lattice connection
 *  and its "why" is written by you.
 * ════════════════════════════════════════════════════════════════════════ */
const SA_COLLECTION_TYPE = 'Stand Alone Idea';   // stand-alones kept as their own collection (a lattice citizen, not a thread)
let SA_INBOX_TYPE = null;                        // exact Type option name, discovered from the IP schema
function _saInboxLike(s){ return /stand\s*-?\s*alone/i.test(s||'') && /process/i.test(s||''); }
function isSaInboxType(t){ return !!t && (t===SA_INBOX_TYPE || _saInboxLike(t)); }

const IB_DRAFTS_KEY = 'rs_inbox_drafts_v1';
let ib = {
  loadSt: null, loadMsg: '', lane: 'tq',
  items: [],          // [{id,title,url,kind:'tq'|'sa',type,method,primarySource,rels:{relProp:[ids]},created,done}]
  openId: null,
  drafts: {},         // Thread Queue pageId → draft (persisted to localStorage, minus transient parts)
  sa: {},             // stand-alone pageId → triage state (transient)
  cand: {},           // candidate-panel cache per context key
  compose: null,      // {key, targetId, mode, why}
  commit: null,       // {st:'busy'|'ok'|'error', msg, log:[]}
  pick: null,         // purpose/topic picker {kind, db, q, results, st}
  titleProp: 'Name'
};
function ibLoadDrafts(){ try{ ib.drafts = JSON.parse(localStorage.getItem(IB_DRAFTS_KEY)||'{}') || {}; }catch(e){ ib.drafts = {}; } }
let _ibSaveT = null;
function ibSaveDrafts(){
  clearTimeout(_ibSaveT);
  _ibSaveT = setTimeout(()=>{
    try{
      const slim = {};
      for(const [k,d] of Object.entries(ib.drafts)){ const c = {...d}; delete c.body; delete c.ai; slim[k] = c; }
      localStorage.setItem(IB_DRAFTS_KEY, JSON.stringify(slim));
    }catch(e){}
  }, 350);
}
function ibItem(id){ return ib.items.find(x=>x.id===id); }
function ibOpenItem(){ return ib.openId ? ibItem(ib.openId) : null; }
function ibPending(kind){ return ib.items.filter(x=>x.kind===kind && !x.done); }
function ibRelTitle(id){ return titleCache.get(fmtId(id)) || '…'; }
function ibUid(d, prefix){ d.seq = (d.seq||0) + 1; return (prefix||'f') + d.seq; }

/* ── Load both lanes ── */
async function ibLoad(){
  if(!creds.proxyUrl || !creds.notionToken){ ib.loadSt='error'; ib.loadMsg='Set your proxy URL and Notion token in Settings first.'; render(); return; }
  ib.loadSt = 'loading'; ib.loadMsg = ''; render();
  try{
    const dbId = fmtId(getIpDb());
    const schema = await nGet('/databases/'+dbId);
    const props = schema.properties || {};
    for(const [k,p] of Object.entries(props)){ if(p.type==='title'){ ib.titleProp = k; break; } }
    const opts = (props.Type && props.Type.select && props.Type.select.options) || [];
    const sa = opts.find(o=>_saInboxLike(o.name));
    SA_INBOX_TYPE = sa ? sa.name : null;
    ib.hasCross = !!(props[CROSS_THREAD_PROP] && props[CROSS_THREAD_PROP].type==='relation');
    ib.hasThreadName = !!(props['Thread Name'] && props['Thread Name'].type==='rich_text');

    const ors = [{property:'Type', select:{equals:THREAD_QUEUE_TYPE}}];
    if(SA_INBOX_TYPE) ors.push({property:'Type', select:{equals:SA_INBOX_TYPE}});
    const items = [];
    let cursor = null, n = 0;
    do{
      const body = {filter: ors.length>1 ? {or:ors} : ors[0], sorts:[{timestamp:'created_time', direction:'ascending'}], page_size:100};
      if(cursor) body.start_cursor = cursor;
      const data = await nPost('/databases/'+dbId+'/query', body);
      for(const p of (data.results||[])){
        const pr = p.properties || {};
        const type = selectName(pr.Type);
        items.push({
          id: p.id, url: p.url,
          title: extractTitle(pr) || '(untitled)',
          kind: type===THREAD_QUEUE_TYPE ? 'tq' : 'sa',
          type,
          method: selectName(pr.Method) || '',
          primarySource: selectName(pr['Primary Source']) || '',
          rels: _readNodeRels(pr),
          created: p.created_time || '',
          done: false
        });
      }
      cursor = data.has_more ? data.next_cursor : null; n++;
    } while(cursor && n < 20);
    ib.items = items;
    // Drop drafts whose Thread Queue page no longer exists (processed elsewhere).
    const live = new Set(items.map(x=>x.id));
    for(const k of Object.keys(ib.drafts)) if(!live.has(k)) delete ib.drafts[k];
    ibSaveDrafts();
    ib.loadSt = 'ok';
    if(!ibPending('tq').length && ibPending('sa').length) ib.lane = 'sa';
  }catch(e){
    ib.loadSt = 'error';
    ib.loadMsg = /object_not_found|404/i.test(e.message) ? 'Info Processing database not found or not shared with the integration.' : (e.message||'Load failed');
  }
  render();
  if(ib.loadSt==='ok'){
    if(vs.loadSt==='idle') vizLoad();          // the latticework powers connection suggestions
    ibResolveRelTitles();
  }
}
async function ibResolveRelTitles(){
  const ids = new Set();
  ib.items.forEach(it=>Object.values(it.rels||{}).forEach(a=>a.forEach(x=>ids.add(fmtId(x)))));
  const need = [...ids].filter(id=>!titleCache.has(id));
  if(!need.length) return;
  await mapPool(need, id=>fetchPageTitle(id), 4);
  if(currentTab==='inbox') render();
}

  return out;
}
