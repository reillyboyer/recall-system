  const splitIds = v => v.split(/[,;]/).map(s=>s.trim()).filter(Boolean);

  for(let i=2;i<parts.length;i++){
    const seg = parts[i];
    const ci = seg.indexOf(':');
    if(ci < 0) continue;
    const key = seg.slice(0,ci).trim().toLowerCase();
    const val = seg.slice(ci+1).trim();
    if(!val) continue;
    if(key === 'builds on' || key === 'buildson')      frag.buildsOn = splitIds(val);
    else if(key === 'connected to' || key === 'connected') frag.connected = splitIds(val);
    else if(key === 'source'){
      const {db, instance} = splitRelValue(val);
      frag.rels.push(makeRel('primary', db, instance));
    }
    else if(key === 'relation'){
      const {db, instance} = splitRelValue(val);
      const reg = relDbByName(db);
      const kind = reg ? reg.kind : 'capture';
      frag.rels.push(makeRel(kind, db, instance));
    }
    else if(key === 'goals' || key === 'goal'){
      const {db, instance} = splitRelValue(val);
      // If no DB prefix given, assume the "Goals" database itself
      frag.rels.push(makeRel('goals', db || 'Goals', instance || val));
    }
    else if(key === 'type'){
      const t = FRAGMENT_TYPES.find(ft => ft.toLowerCase() === val.toLowerCase());
      if(t) frag.type = t;
    }
  }
  return frag;
}

/* Extract plain-text lines from a Thread Queue page's blocks. We read the
 * common text-bearing block types (paragraph, list items, headings, toggles,
 * code, quote) and flatten each to one logical line. Code blocks are split on
 * newlines so a pasted multi-line code block still yields one fragment/line. */
function blockToLines(block){
  const t = block.type;
  const data = block[t] || {};
  const rt = data.rich_text || data.title || [];
  const text = rt.map(x=>x.plain_text).join('');
  if(t === 'code') return text.split('\n');
  return [text];
}

/* Split a (possibly newline-collapsed) line back into individual fragment
 * strings. When the copy button strips newlines, an entire thread arrives as
 * one blob. Every fragment starts with a local ID at a field boundary, so we
 * insert a split point immediately before any "<ID> |" that appears after a
 * pipe — i.e. wherever one fragment's last field abuts the next fragment's ID.
 * A normal (already-newline-separated) line passes through untouched. */
function splitCollapsedFragments(line){
  // Boundary: a pipe, optional space, then a fragment ID, then a pipe.
  // We mark the boundary right before the ID so each chunk begins "ID | …".
  const marked = line.replace(
    /\|\s*([A-Za-z]{1,3}\d+[a-z]?)\s*\|/g,
    '\u0001$1 |'
  );
  if(marked.indexOf('\u0001') < 0) return [line];
  return marked.split('\u0001').map(s=>s.trim()).filter(Boolean);
}

async function parseThreadFromPage(pageId){
  const fragments = [];
  const warnings = [];
  let kbTopics = [];
  let threadSource = null;   // {db, instance} parsed from a standalone Source: line
  const rawLines = [];

  const res = await nGet('/blocks/'+fmtId(pageId)+'/children?page_size=100');
  const blocks = res.results || [];
  for(const b of blocks){
    for(const ln of blockToLines(b)) rawLines.push(ln);
    // toggles may hold lines as children too
    if(b.type === 'toggle' && b.has_children){
      try{
        const cr = await nGet('/blocks/'+b.id+'/children?page_size=100');
        for(const c of (cr.results||[])) for(const ln of blockToLines(c)) rawLines.push(ln);
      }catch(e){}
    }
  }

  // Expand any newline-collapsed blobs into individual fragment lines.
  const lines = [];
  for(const rl of rawLines){
    for(const piece of splitCollapsedFragments(rl)) lines.push(piece);
  }

  for(const rawLn of lines){
    const ln = (rawLn||'').trim();
    if(!ln) continue;
    // KB topics footer
    const kbm = ln.match(/^suggested\s+knowledge\s+bank\s+topics?\s*:\s*(.+)$/i);
    if(kbm){
      kbTopics = kbm[1].split(/[,;]/).map(s=>s.trim()).filter(Boolean);
      continue;
    }
    // Standalone thread-level Source line (no pipe, no fragment ID): capture it
    // as the thread's primary source so every anchor fragment inherits it even
    // if the page's Primary Source property was never set.
    const srcm = ln.match(/^(?:primary\s+)?source\s*:\s*(.+)$/i);
    if(srcm && ln.indexOf('|') < 0){
      const parsed = parseThreadSourceValue(srcm[1]);
      if(parsed) threadSource = parsed;
      continue;
    }
    // Skip the THREAD NOTES header / Method header lines
    if(/^thread\s+notes/i.test(ln)) continue;
    if(/^method\s*:/i.test(ln) && ln.indexOf('|') < 0) continue;

    const frag = parseThreadLine(ln);
    if(frag){ fragments.push(frag); }
    else { warnings.push(ln.length > 80 ? ln.slice(0,80)+'…' : ln); }
  }
  return {fragments, warnings, kbTopics, threadSource};
}

/* Parse a "<DB> — <instance>" value (optionally trailing "(Primary)") into a
 * {db, instance, relProp, dsId} object, or null if the DB doesn't resolve. */
function parseThreadSourceValue(val){
  const {db, instance} = splitRelValue(val);
  const reg = relDbByName(db);
  if(!reg) return null;
  return {db, instance, relProp: reg.relProp, dsId: reg.dsId};
}

/* ── Queue loader: IP rows where Type = Thread Queue ── */
async function tqLoadQueue(){
  ts = {...ts, queueSt:'loading', queueMsg:'', queue:[], queueIdx:-1,
        loadSt:null, pageId:null, fragments:[], kbTopics:[], parseWarnings:[],
        pushSt:null, results:[]};
  render();
  try{
    const dbId = fmtId(getIpDb());
    const dbCheck = await nReq('GET','/databases/'+dbId);
    if(!dbCheck.ok) throw new Error(`Cannot access Info Processing database (${dbCheck.status}). Check Settings → DB ID and token.`);

    const data = await nPost('/databases/'+dbId+'/query',{
      filter: {property:'Type', select:{equals: THREAD_QUEUE_TYPE}},
      sorts:  [{timestamp:'created_time', direction:'ascending'}],
      page_size: 50
    });

    const queue = (data.results||[]).map(p=>{
      const props = p.properties||{};
      const psName = props['Primary Source']?.select?.name || '';
      // Capture an already-set primary-source RELATION on the queue page, if any.
      // (Step 1 of source resolution: the Thread Queue row often already carries
      // the relation, which is the most reliable source — no title lookup needed.)
      let existingSrc = null;
      if(psName){
        const reg = relDbByName(psName);
        if(reg){
          const relArr = props[reg.relProp]?.relation || [];
          if(relArr.length){
            existingSrc = {db:psName, relProp:reg.relProp, dsId:reg.dsId, matchId: relArr[0].id};
          }
        }
      }
      return {
        id: p.id,
        title: extractTitle(props) || p.id,
        url: p.url,
        method: props.Method?.select?.name || 'Upfront',
        primarySource: psName,
        existingSrc,
        done: false
      };
    });
    ts.queue = queue;
    ts.queueSt = 'ok';
    if(queue.length > 0) await tqLoadPage(0);
  }catch(e){
    ts.queueSt = 'error';
    ts.queueMsg = e.message || 'Failed to load Thread Queue';
  }
  render();
}

async function tqLoadPage(idx){
  if(idx < 0 || idx >= ts.queue.length) return;
  ts.queueIdx = idx;
  ts.loadSt = 'loading'; ts.loadMsg='';
  ts.pageId = null; ts.fragments=[]; ts.kbTopics=[]; ts.parseWarnings=[];
  ts.threadNames = {};
  ts.pushSt = null; ts.results=[];
  ts.kbNewTopic=''; ts.kbApplySt=null; ts.kbApplyMsg=''; ts.bulk=null;
  ts.kbTargetMode='all'; ts.kbTargets=null; ts.kbSel=null;
  render();
  try{
    const item = ts.queue[idx];
    ts.pageId = item.id;
    ts.threadName = item.title;
    ts.method = item.method || 'Upfront';
    const {fragments, warnings, kbTopics, threadSource} = await parseThreadFromPage(item.id);

    // Thread's default primary source, in priority order:
    //   1. An existing Primary Source RELATION already set on the queue page
    //      (most reliable — a real page id, no title lookup needed).
    //   2. A "Source: <DB> — <instance>" line in the notes (carries the instance).
    //   3. The page's Primary Source select property (DB only, no instance).
    if(item.existingSrc){
      ts._pageSource = {db:item.existingSrc.db, instance:'', relProp:item.existingSrc.relProp,
                        dsId:item.existingSrc.dsId, matchId:item.existingSrc.matchId, preResolved:true};
    } else if(threadSource){
      ts._pageSource = {db:threadSource.db, instance:threadSource.instance,
                        relProp:threadSource.relProp, dsId:threadSource.dsId, preResolved:false};
    } else if(item.primarySource){
      const reg = relDbByName(item.primarySource);
      ts._pageSource = {db:item.primarySource, instance:'',
                        relProp:reg?reg.relProp:null, dsId:reg?reg.dsId:null, preResolved:false};
    } else {
      ts._pageSource = null;
    }

    ts.fragments = fragments;
    ts.kbTopics = kbTopics;
    ts.parseWarnings = warnings;
    ts.loadSt = 'ok';
    render();
    // Kick off async validation of all source/relation instances
    tqValidateAll();
  }catch(e){
    ts.loadSt = 'error';
    ts.loadMsg = e.message || 'Failed to parse thread page';
    render();
  }
}

/* ── Relation validation & search ──
 * Every relation (primary source, capture, goals) is an entry in a fragment's
 * `rels` array. Validation searches the target data source for a title match;
 * the same search powers the in-editor pencil/search picker.
 */
async function tqQueryDbPages(dbId){
  // Fetch all pages of a target database (paginated), returning [{id,title}].
  // dbId must be the DATABASE id (not the data-source id) or Notion 404s.
  const id = fmtId(dbId);
  const out = [];
  let cursor = null, pages = 0;
  do {
    const body = {page_size: 100};
    if(cursor) body.start_cursor = cursor;
    const data = await nPost('/databases/'+id+'/query', body);
    for(const p of (data.results||[])) out.push({id:p.id, title: extractTitle(p.properties)||''});
    cursor = data.has_more ? data.next_cursor : null;
    pages++;
  } while(cursor && pages < 12);
  return out;
}

// Per-database page cache so repeated searches/validations don't re-fetch.
const dsPageCache = new Map();   // dbId → [{id,title}]

// Discover a database's title-property NAME (needed to create pages in it).
const _dbTitlePropCache = new Map();
async function tqDbTitleProp(dbId){
  const key = fmtId(dbId);
  if(_dbTitlePropCache.has(key)) return _dbTitlePropCache.get(key);
  const db = await nReq('GET', '/databases/'+key);
  let name = 'Name';
  const props = (db && db.properties) || {};
  for(const k of Object.keys(props)){ if(props[k] && props[k].type==='title'){ name = k; break; } }
  _dbTitlePropCache.set(key, name);
  return name;
}
// Create a new page (instance) in a database with just its title, returning
// {id,title}. Used to materialize a suggested relation that doesn't exist yet.
async function tqCreateInstance(dbId, title){
  const titleProp = await tqDbTitleProp(dbId);
  const page = await nPost('/pages', {
    parent: {database_id: fmtId(dbId)},
    properties: { [titleProp]: { title: [{ text: { content: title } }] } }
  });
  dsPageCache.delete(fmtId(dbId));   // bust cache so later resolves see the new page
  return { id: page.id, title };
}

async function tqGetDbPages(dbId){
  if(!dbId) throw new Error('No database id for this relation.');
  const key = fmtId(dbId);
  if(dsPageCache.has(key)) return dsPageCache.get(key);
  try{
    const pages = await tqQueryDbPages(dbId);
    dsPageCache.set(key, pages);
    return pages;
  }catch(e){
    if(/object_not_found|Could not find database|404/i.test(e.message)){
      throw new Error('Database not shared with the Recall integration. In Notion: open the database → ••• → Connections → add "Recall".');
    }
    throw e;
  }
}

async function tqSearchInstance(dbId, instance){
  let pages;
  try{ pages = await tqGetDbPages(dbId); }
  catch(e){ return {error: e.message, options: []}; }
  const needle = (instance||'').trim().toLowerCase();
  if(!needle) return {options: []};
  const exact = pages.filter(r => r.title.trim().toLowerCase() === needle);
  if(exact.length === 1) return {exactId: exact[0].id, exactTitle: exact[0].title, options: []};
  const fuzzy = pages.filter(r => {
    const t = r.title.trim().toLowerCase();
    return t.includes(needle) || needle.includes(t);
  });
  if(exact.length > 1) return {options: exact};
  return {options: fuzzy.slice(0, 10)};
}

async function tqValidateOne(rel){
  if(!rel || !rel.dbId || !rel.instance) return;
  rel.status = 'checking'; render();
  const r = await tqSearchInstance(rel.dbId, rel.instance);
  if(r.error){ rel.status='missing'; rel.err=r.error; }
  else if(r.exactId){ rel.status='ok'; rel.matchId=r.exactId; rel.matchTitle=r.exactTitle; }
  else { rel.status='missing'; }   // no auto-pick: show Not Found, user uses pencil
  render();
}

async function tqValidateAll(){
  const ps = ts._pageSource;
  // Apply the thread-level primary source as a default to anchor Core Ideas
  // that lack their own primary-source relation.
  if(ps && ps.dsId){
    for(const f of ts.fragments){
      const hasPrimary = f.rels.some(r=>r.kind==='primary');
      if(!hasPrimary && f.type==='Core Idea'){
        const rel = makeRel('primary', ps.db, ps.instance||'');
        if(ps.preResolved && ps.matchId){
          rel.matchId = ps.matchId; rel.status='ok';
          // resolve its display title from the DB cache lazily
        }
        f.rels.unshift(rel);
      }
    }
    // If the source pre-resolved by relation id, fetch its title once for display.
    if(ps.preResolved && ps.matchId && !ps._title){
      try{ ps._title = await fetchPageTitle(ps.matchId); }catch(e){ ps._title=''; }
      for(const f of ts.fragments){
        for(const r of f.rels){
          if(r.kind==='primary' && r.matchId===ps.matchId && !r.matchTitle){
            r.matchTitle = ps._title; r.instance = ps._title || r.instance;
          }
        }
      }
      render();
    }
  }
  // Validate every rel that has an instance but isn't already resolved.
  const toCheck = [];
  for(const f of ts.fragments){
    for(const r of f.rels){
      if(r.status!=='ok' && r.dsId && r.instance) toCheck.push(r);
    }
  }
  await mapPool(toCheck, tqValidateOne, 3);
  tqPropagateGoals();
  render();
}

/* ── Goals inheritance across connections ──
 * If any fragment carries a goals-system relation, every fragment connected to
 * it (via Builds On or Connected Fragments, in either direction) inherits that
 * goals relation — transitively across the whole connected component — even if
 * the notes didn't state it. Inherited rels are tagged fromInherit=true so they
 * render distinctly and aren't double-added.
 */
function tqPropagateGoals(){
  // Build an undirected adjacency over local IDs from buildsOn + connected.
  const byId = {};
  ts.fragments.forEach(f => { byId[f.localId.toUpperCase()] = f; });
  const adj = {};
  const addEdge = (a,b)=>{
    const A=a.toUpperCase(), B=b.toUpperCase();
    (adj[A]=adj[A]||new Set()).add(B);
    (adj[B]=adj[B]||new Set()).add(A);
  };
  ts.fragments.forEach(f=>{
    (f.buildsOn||[]).forEach(t=>{ if(byId[t.toUpperCase()]) addEdge(f.localId, t); });
    (f.connected||[]).forEach(t=>{ if(byId[t.toUpperCase()]) addEdge(f.localId, t); });
  });
  // Find connected components.
  const seen = new Set();
  const components = [];
  for(const f of ts.fragments){
    const start = f.localId.toUpperCase();
    if(seen.has(start)) continue;
    const comp = []; const stack=[start];
    while(stack.length){
      const n = stack.pop();
      if(seen.has(n)) continue;
      seen.add(n); comp.push(n);
      for(const m of (adj[n]||[])) if(!seen.has(m)) stack.push(m);
    }
    components.push(comp);
  }
  // For each component, gather the union of goals relations, then ensure every
  // member carries each one (by matchId when resolved, else by db+instance).
  for(const comp of components){
    const goalsRels = [];
    for(const id of comp){
      const f = byId[id]; if(!f) continue;
      for(const r of f.rels){
        if(r.kind!=='goals') continue;
        const key = r.matchId ? 'id:'+r.matchId : 'ti:'+r.db+'|'+(r.instance||'').toLowerCase();
        if(!goalsRels.some(g=>g.key===key)) goalsRels.push({key, rel:r});
      }
    }
    if(!goalsRels.length) continue;
    for(const id of comp){
      const f = byId[id]; if(!f) continue;
      for(const {key, rel} of goalsRels){
        const already = f.rels.some(r=>{
          if(r.kind!=='goals') return false;
          const k = r.matchId ? 'id:'+r.matchId : 'ti:'+r.db+'|'+(r.instance||'').toLowerCase();
          return k===key;
        });
        if(already) continue;
        const clone = makeRel('goals', rel.db, rel.instance);
        clone.matchId = rel.matchId; clone.matchTitle = rel.matchTitle;
        clone.status = rel.status==='ok' ? 'ok' : rel.status;
        clone.fromInherit = true;
        f.rels.push(clone);
      }
    }
  }
}

/* ── Editor relation actions ── */
function tqRelOpenPicker(fi, ri){
  const rel = ts.fragments[fi].rels[ri];
  rel.picking = !rel.picking;
  if(rel.picking){
    rel.query = rel.instance || '';
    rel.results = null; rel.searchSt = null;
    _tqFocusKey = `relsearch-${fi}-${ri}`;
    if(rel.query) tqRelRunSearch(fi, ri, rel.query);
  } else {
    _tqFocusKey = null;
  }
  render();
}
function tqRelSetDb(fi, ri, dbName){
  const rel = ts.fragments[fi].rels[ri];
  const reg = relDbByName(dbName);
  if(reg){ rel.db = reg.name; rel.dsId = reg.dsId; rel.dbId = reg.dbId; rel.relProp = reg.relProp; rel.kind = (rel.kind==='primary'?'primary':reg.kind); }
  rel.results = null; rel.searchSt=null;
  tqRelRunSearch(fi, ri, rel.query||'');
  render();
}
let _relSearchTimer = null;
function tqRelOnInput(fi, ri, val){
  const rel = ts.fragments[fi].rels[ri];
  rel.query = val;
  _tqFocusKey = `relsearch-${fi}-${ri}`;
  clearTimeout(_relSearchTimer);
  _relSearchTimer = setTimeout(()=>tqRelRunSearch(fi, ri, val), 220);
}
async function tqRelRunSearch(fi, ri, val){
  const rel = ts.fragments[fi].rels[ri];
  if(!rel.dbId){ rel.results=[]; rel.searchSt='error'; rel.err='No database id'; render(); return; }
  rel.searchSt = 'loading'; render();
  try{
    const pages = await tqGetDbPages(rel.dbId);
    const q = (val||'').trim().toLowerCase();
    let res;
    if(!q){ res = pages.slice(0, 25); }
    else {
      res = pages.filter(p=>p.title.toLowerCase().includes(q))
                 .sort((a,b)=>{
                   const ae=a.title.toLowerCase()===q?0:1, be=b.title.toLowerCase()===q?0:1;
                   if(ae!==be) return ae-be;
                   return a.title.length-b.title.length;
                 }).slice(0, 25);
    }
    rel.results = res; rel.searchSt='ok';
  }catch(e){ rel.results=[]; rel.searchSt='error'; rel.err=e.message; }
  render();
}
function tqRelPick(fi, ri, id, title){
  const rel = ts.fragments[fi].rels[ri];
  rel.matchId = id; rel.matchTitle = title; rel.instance = title;
  rel.status = 'ok'; rel.picking = false; rel.results=null;
  _tqFocusKey = null;
  // If this is a goals relation, re-propagate so connected fragments inherit it.
  if(rel.kind==='goals') tqPropagateGoals();
  render();
}
function tqRelRemove(fi, ri){
  const rel = ts.fragments[fi].rels[ri];
  ts.fragments[fi].rels.splice(ri, 1);
  _tqFocusKey = null;
  if(rel.kind==='goals') tqPropagateGoals();
  render();
}
function tqAddRelation(fi, kind){
  // Add a blank relation row of the given kind, defaulting to a sensible DB,
  // and open its picker immediately.
  const defaultDb = kind==='goals' ? 'Goals' : 'Content Vault';
  const rel = makeRel(kind==='goals'?'goals':'capture', defaultDb, '');
  rel.picking = true; rel.query=''; rel.results=null;
  ts.fragments[fi].rels.push(rel);
  const ri = ts.fragments[fi].rels.length - 1;
  _tqFocusKey = `relsearch-${fi}-${ri}`;
  render();
  tqRelRunSearch(fi, ri, '');
}

function tqSetMethod(m){ ts.method = m; render(); }
function tqSetFragType(i, t){ ts.fragments[i].type = t; render(); }
function tqToggleExclude(i){ ts.fragments[i].excluded = !ts.fragments[i].excluded; render(); }
function tqEditTitle(i, v){ ts.fragments[i].title = v; }

/* ── Two-pass creation into Info Processing ──
 * Pass 1: create every (non-excluded) fragment as an IP row with Name, Type,
 *   Method, Primary Source select + the matched source relation, the OL's own
 *   Relation, and (for Core Ideas) inherited relations from the source page.
 *   Capture localId → new Notion page id.
 * Pass 2: patch Builds On / Connected Fragments using the localId→id map.
 * Finally retype the Thread Queue page to "Archived" (kept in Notion, skipped by
 * the Visualizer) rather than trashing it.
 */
/* Create an IP page resiliently: try with all props (incl. inherited relations)
 * in one call; if Notion rejects the bulk payload (usually a single bad
 * relation value), retry with the safe core props, then patch the remaining
 * properties one at a time so a single bad relation can't sink the whole row.
 * Mirrors the recall createCard fallback strategy. */
async function tqCreatePageResilient(dbId, props){
  const SAFE = new Set(['Name','Type','Method','Primary Source']);
  try{
    return await nPost('/pages',{ parent:{database_id: dbId}, properties: props });
  }catch(bulkErr){
    const coreProps = {};
    const restProps = {};
    for(const [k,v] of Object.entries(props)){
      if(SAFE.has(k)) coreProps[k] = v; else restProps[k] = v;
    }
    const page = await nPost('/pages',{ parent:{database_id: dbId}, properties: coreProps });
    for(const [k,v] of Object.entries(restProps)){
      try{ await nPatch('/pages/'+fmtId(page.id), {properties:{[k]:v}}); }
      catch(e){ /* skip the offending relation; row still created */ }
    }
    return page;
  }
}

async function tqCreate(){
  const live = ts.fragments.filter(f => !f.excluded && f.title.trim());
  if(!live.length) return;
  ts.pushSt = 'loading'; ts.pushMsg=''; ts.results=[]; render();

  const dbId = fmtId(getIpDb());
  const idMap = {};      // localId → new page id
  const results = [];

  // Map each named thread's name onto the local-id of the fragment that will
  // carry it — the thread's anchor, or the first live fragment if the anchor
  // was excluded. Written as the Thread Name property in pass 1.
  const nameByLocal = {};
  try{
    const {comps:lcomps} = tqLocalComponents();
    const isLive = i => ts.fragments[i] && !ts.fragments[i].excluded && ts.fragments[i].title.trim();
    for(const c of lcomps){
      const nm = ts.threadNames && (ts.threadNames[tqCompKey(c)]||'').trim();
      if(!nm) continue;
      let ti = isLive(c.anchorIdx) ? c.anchorIdx : (c.idxs||[]).find(isLive);
      const a = (ti!=null) ? ts.fragments[ti] : null;
      if(a && a.localId) nameByLocal[a.localId.toUpperCase()] = nm;
    }
  }catch(e){ /* topology failed — proceed without names */ }

  // ---- Pass 1: create rows ----
  for(const f of live){
    try{
      const props = {
        'Name':   {title:[{type:'text',text:{content:f.title.trim()}}]},
        'Type':   {select:{name: f.type}},
        'Method': {select:{name: ts.method}}
      };
      // If this fragment is the carrier of a named thread, stamp the name on it.
      const tname = nameByLocal[(f.localId||'').toUpperCase()];
      if(tname) props['Thread Name'] = {rich_text:[{type:'text',text:{content:tname}}]};
      let inheritNote = '';
      let primaryRel = null;

      // Apply every resolved relation (primary / capture / goals).
      // Merge multiple relations that target the same IP property.
      const addRelProp = (relProp, id) => {
        if(props[relProp] && props[relProp].relation){
          if(!props[relProp].relation.some(x=>x.id===fmtId(id)))
            props[relProp].relation.push({id: fmtId(id)});
        } else {
          props[relProp] = {relation:[{id: fmtId(id)}]};
        }
      };
      for(const r of f.rels){
        if(r.kind==='primary'){
          primaryRel = r;
          if(r.db && relDbByName(r.db)) props['Primary Source'] = {select:{name: r.db}};
        }
        if(r.status==='ok' && r.matchId && r.relProp){
          addRelProp(r.relProp, r.matchId);
        }
      }
      // If no explicit primary but a capture relation exists, set the Primary
      // Source select from the first capture relation's DB.
      if(!props['Primary Source']){
        const cap = f.rels.find(r=>r.kind==='capture' && r.db && relDbByName(r.db));
        if(cap) props['Primary Source'] = {select:{name: cap.db}};
      }

      // Inheritance for Core Ideas: pull the resolved primary source page's
      // goals/knowledge-bank classifiers onto this fragment.
      if(f.type==='Core Idea' && primaryRel && primaryRel.status==='ok' && primaryRel.matchId){
        try{
          const srcPage = await fetchPage(primaryRel.matchId);
          const srcRels = srcPage.relations || {};
          const inherited = [];
          for(const [k, arr] of Object.entries(srcRels)){
            if(!arr || !arr.length) continue;
            if(k==='Info Processing' || k==='Active Recall' || k==='Builds On' || k==='Connected Fragments') continue;
            if(!Object.prototype.hasOwnProperty.call(srcPageRelWhitelist(), k)) continue;
            for(const rel of arr) addRelProp(k, rel.id);
            inherited.push(k);
          }
          if(inherited.length) inheritNote = 'Inherited: '+inherited.join(', ');
        }catch(e){ inheritNote = 'Inherit skipped: '+e.message; }
      }

      const page = await tqCreatePageResilient(dbId, props);
      idMap[f.localId] = page.id;
      results.push({localId:f.localId, name:f.title.trim(), ok:true, url:page.url, note:inheritNote});
    }catch(e){
      results.push({localId:f.localId, name:f.title.trim(), ok:false, err:e.message});
    }
  }

  // ---- Pass 2: wire self-relations ----
  // Normalize the localId→pageId map so references like "c1"/"C1" resolve.
  const normMap = {};
  for(const [lid,pid] of Object.entries(idMap)) normMap[lid.toUpperCase()] = pid;
  const resolve = lid => normMap[(lid||'').toUpperCase()];
  for(const f of live){
    const myId = idMap[f.localId];
    if(!myId) continue;
    const patch = {};
    const builds = (f.buildsOn||[]).map(resolve).filter(Boolean);
    const conn   = (f.connected||[]).map(resolve).filter(Boolean);
    if(builds.length) patch['Builds On'] = {relation: builds.map(id=>({id:fmtId(id)}))};
    if(conn.length)   patch['Connected Fragments'] = {relation: conn.map(id=>({id:fmtId(id)}))};
    if(Object.keys(patch).length){
      try{ await nPatch('/pages/'+fmtId(myId), {properties:patch}); }
      catch(e){
        const r = results.find(x=>x.localId===f.localId);
        if(r){ r.note = (r.note?r.note+' · ':'')+'⚠ wiring failed: '+e.message; }
      }
    }
  }

  // ---- Retire the Thread Queue scratch page ----
  // Don't trash it — just retype it to "Archived" so the page persists in Notion
  // but the Visualizer skips it (and it no longer shows as a pending queue page).
  let archiveNote = '';
  if(ts.pageId){
    try{ await nPatch('/pages/'+fmtId(ts.pageId), {properties:{'Type':{select:{name: ARCHIVED_TYPE}}}}); archiveNote='Queue page archived.'; }
    catch(e){ archiveNote='Queue page NOT archived: '+e.message; }
  }

  const ok = results.filter(r=>r.ok).length;
  const fail = results.filter(r=>!r.ok).length;
  ts.results = results;
  ts.pushSt = fail===0 ? 'ok' : 'error';
  ts.pushMsg = (fail===0
    ? `${ok} fragment${ok!==1?'s':''} created and wired.`
    : `${ok} created, ${fail} failed.`) + (archiveNote?' '+archiveNote:'');

  if(ts.queueIdx>=0 && fail===0){
    ts.queue[ts.queueIdx].done = true;
    const next = ts.queueIdx+1;
    if(next < ts.queue.length){
      setTimeout(async ()=>{ ts.pushSt=null; ts.results=[]; await tqLoadPage(next); }, 1500);
    }
  }
  render();
}

// Which source-page relation properties are eligible to be INHERITED onto a
// Core Idea fragment. We inherit the classifiers — Goals System (all 7 levels)
// and Knowledge Bank — not the source's own capture-system anchors. The
// property names below are shared across the capture databases and Info
// Processing (verified against live schemas), so name-matching is reliable for
// these specific classifiers; they also map onto identically-named IP props.
function srcPageRelWhitelist(){
  // Relations a Core Idea inherits from its resolved primary-source page.
  // NOTE: Knowledge Bank is intentionally NOT here. KB topics are assigned only
  // via the explicit "Knowledge Bank topics" tool (selected topics → selected
  // fragments); inheriting the source page's existing KB topics was adding
  // unrequested topics to fragments that weren't targeted. Goals classifiers are
  // still inherited so a fragment lands situated in your goals.
  return {
    '⛰️ Goals':1, '📽️ Visions':1, 'Objectives':1, 'Projects':1,
    'Habits (Unified)':1, 'High Leverage Systems':1
  };
}

/* ════════════════════════════════════════════════════════════════════════
 *  THREAD QUEUE — rendering
 * ════════════════════════════════════════════════════════════════════════ */
function renderThreadQueue(){
  const g = gate();
  if(g) return `<div class="block"><div class="blabel">Thread Queue</div></div>`+g;

  let html = `<div class="block">
    <div class="blabel">🧵 Thread Queue</div>
    <div class="helptext">Loads Info Processing pages with <b>Type = Thread Queue</b>, parses their fragment notes, and lets you review every fragment, connection, and source relation before creating them as real fragments — with inheritance and two-pass wiring.</div>
    <button class="btn btn-primary" onclick="tqLoadQueue()" ${ts.queueSt==='loading'?'disabled':''}>
      ${ts.queueSt==='loading'?'<span class="spin"></span> Loading…':'↻ Load Thread Queue'}
    </button>`;

  if(ts.queueSt==='error'){
    html += `<div class="pill pill-err" style="margin-top:12px;display:block">${esc(ts.queueMsg)}</div>`;
  }
  if(ts.queueSt==='ok'){
    if(!ts.queue.length){
      html += `<div class="helptext" style="margin-top:12px">No Thread Queue pages found. Create an Info Processing page, set its Type to "Thread Queue", set Method + Primary Source, and paste your pipe-formatted fragment lines into the body.</div>`;
    } else {
      html += `<div class="queue-list">` + ts.queue.map((q,i)=>`
        <div class="queue-item ${i===ts.queueIdx?'active':''} ${q.done?'done':''}" onclick="${q.done?'':'tqLoadPage('+i+')'}">
          <span class="queue-num">${i+1}</span>
          <span class="queue-title">${esc(q.title)}</span>
          <span class="method-badge ${q.method==='Retroactive'?'method-retro':'method-upfront'}">${q.method==='Retroactive'?'⟲ Retro':'✎ Upfront'}</span>
        </div>`).join('') + `</div>`;
    }
  }
  html += `</div>`;

  // Loaded thread editor
  if(ts.loadSt==='loading'){
    html += `<div class="block"><span class="spin"></span> Parsing thread page…</div>`;
  } else if(ts.loadSt==='error'){
    html += `<div class="block"><div class="pill pill-err" style="display:block">${esc(ts.loadMsg)}</div></div>`;
  } else if(ts.loadSt==='ok'){
    html += renderThreadEditor();
  }
  return html;
}

function renderThreadEditor(){
  const live = ts.fragments.filter(f=>!f.excluded && f.title.trim());
  const counts = {C:0,RC:0,RCQ:0,OL:0};
  ts.fragments.forEach(f=>{
    if(f.type==='Core Idea') counts.C++;
    else if(f.type==='Referential C') counts.RC++;
    else if(f.type==='Referential CQ') counts.RCQ++;
    else counts.OL++;
  });

  let html = `<div class="block">
    <div class="blabel">Thread — ${esc(ts.threadName)}</div>
    <div class="frag-head" style="margin-bottom:4px">
      <span style="font-size:12px;color:var(--muted)">Method:</span>
      <button class="method-badge ${ts.method==='Upfront'?'method-upfront':''}" style="${ts.method==='Upfront'?'':'opacity:.45'}" onclick="tqSetMethod('Upfront')">✎ Upfront</button>
      <button class="method-badge ${ts.method==='Retroactive'?'method-retro':''}" style="${ts.method==='Retroactive'?'':'opacity:.45'}" onclick="tqSetMethod('Retroactive')">⟲ Retroactive</button>
    </div>
    <div class="thread-summary">
      <span><b>${ts.fragments.length}</b> fragments</span>
      <span>Core <b>${counts.C}</b></span><span>RC <b>${counts.RC}</b></span>
      <span>RCQ <b>${counts.RCQ}</b></span><span>OL <b>${counts.OL}</b></span>
    </div>`;
  if(ts.method==='Retroactive'){
    html += `<div class="helptext" style="margin-top:8px;color:#5b21b6">⟲ Retroactive thread — after creation, revisit in the webapp to add clarifying questions, open loops, goals relations, and knowledge-bank topics. Connections beyond what's stated are your work.</div>`;
  }
  html += `</div>`;

  // ── Topology: how many threads these notes will create ──
  const {comps} = tqLocalComponents();
  const tWord = comps.length===1 ? 'thread' : 'threads';
  html += `<div class="block">
    <div class="blabel">🧵 Topology — ${comps.length} ${tWord}</div>
    <div class="tq-topo-line">These notes will create <b>${comps.length}</b> ${tWord} from <b>${ts.fragments.length}</b> fragment${ts.fragments.length!==1?'s':''}. Each thread is a connected cluster; its anchor is the most foundational fragment (largest Builds On subtree), and fragments are laid out depth-first from there.</div>
    <div class="tq-thread-chips">${comps.map(c=>{
      const a = ts.fragments[c.anchorIdx];
      return `<span class="tq-tchip" title="${esc(a?a.title:'')}"><b>T${c.pos+1}</b> ${esc(tqShort(tqThreadDisplayName(c),46))} <span class="tq-tchip-n">${c.idxs.length}</span></span>`;
    }).join('')}</div>
    <button class="btn btn-sm" style="margin-top:11px" onclick="tqTogglePreview()">${ts.showPreview?'▾ Hide map preview':'🗺️ Preview map'}</button>
    ${ts.showPreview ? renderThreadPreviewMap(comps) : ''}
  </div>`;

  // ── Fragments, grouped by thread, laid out in DFS pre-order: the anchor's
  // whole Builds-On subtree first, then the next-largest root, etc. Each spine
  // fragment's RC/RCQ/OL tangents sit in its right column. ──
  for(const c of comps){
    const tree = tqLocalTree(c.idxs);
    const a  = ts.fragments[c.anchorIdx];
    // Anchor picker — only when the thread has more than one possible root (an
    // actual choice). "Auto" clears the override and uses the largest-subtree rule.
    const allRoots = [tree.root, ...tree.secondaryRoots].filter(r=>r!=null);
    let anchorPick = '';
    if(allRoots.length > 1){
      const hasPin = c.idxs.some(i=>ts.fragments[i] && ts.fragments[i].anchor);
      anchorPick = `<label class="tq-anchor-pick" title="Choose this thread's anchor (entry point)">⚓
        <select onchange="tqSetAnchor(${c.idxs[0]}, this.value)">
          <option value="" ${!hasPin?'selected':''}>Auto</option>
          ${allRoots.map(r=>`<option value="${r}" ${ts.fragments[r]&&ts.fragments[r].anchor?'selected':''}>${esc(ts.fragments[r].localId)} — ${esc(tqShort(ts.fragments[r].title,30)||'(untitled)')}</option>`).join('')}
        </select></label>`;
    }
    html += `<div class="tq-thread-group">
      <div class="tq-thread-hd">
        <span class="tq-thread-tag">Thread ${c.pos+1}</span>
        <input class="tq-thread-name-input" id="tq-tname-${esc(tqCompKey(c))}"
          value="${esc((ts.threadNames && ts.threadNames[tqCompKey(c)])||'')}"
          placeholder="${esc(tqShort(a&&a.title?a.title:'(untitled)',60))}"
          title="Name this thread (blank = use the anchor fragment's title)"
          oninput="tqSetThreadName('${esc(tqCompKey(c))}', this.value)">
        <span class="tq-thread-meta">${c.idxs.length} frag · C${c.counts.C} · RC${c.counts.RC} · RCQ${c.counts.RCQ} · OL${c.counts.OL}</span>
        ${anchorPick}
      </div>
      <div class="frag-rows">`;
    for(const coreIdx of tree.displayOrder){
      html += `<div class="frag-row">`;
      html += `<div class="frag-col-core">`+renderFragmentCard(ts.fragments[coreIdx], coreIdx)+`</div>`;
      html += `<div class="frag-col-related">`;
      for(const ri of (tree.tangentsOf[coreIdx]||[])) html += renderFragmentCard(ts.fragments[ri], ri);
      html += `</div>`;
      html += `</div>`;
    }
    if(tree.orphans.length || !tree.displayOrder.length){
      html += `<div class="frag-row no-core"><div class="frag-col-core"></div><div class="frag-col-related">`;
      html += `<div class="related-rail-label">${tree.displayOrder.length?'Unattached in this thread':'Fragments (no Core Idea yet)'}</div>`;
      const loose = tree.displayOrder.length ? tree.orphans : c.idxs;
      for(const ri of loose) html += renderFragmentCard(ts.fragments[ri], ri);
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }

  // ── Add a fragment (becomes its own thread until you wire it) ──
  html += `<div class="block"><div class="tq-add-frag-wrap">
    <span class="tq-add-frag-lbl">Add fragment:</span>
    <button class="tq-add-frag" onclick="tqAddFragment('Core Idea')">+ Core Idea</button>
    <button class="tq-add-frag" onclick="tqAddFragment('Referential C')">+ RC</button>
    <button class="tq-add-frag" onclick="tqAddFragment('Referential CQ')">+ RCQ</button>
    <button class="tq-add-frag" onclick="tqAddFragment('Open Loop')">+ OL</button>
  </div></div>`;

  // Parse warnings
  if(ts.parseWarnings.length){
    html += `<div class="block"><div class="blabel" style="color:#854d0e">⚠ Unparsed lines (${ts.parseWarnings.length})</div>
      <div class="helptext">These page lines didn't match the fragment format and were skipped. Fix them on the page if they should be fragments:</div>
      ${ts.parseWarnings.map(w=>`<div class="pill pill-warn" style="display:block;margin-top:4px">${esc(w)}</div>`).join('')}</div>`;
  }

  // KB suggestions — editable pills + apply to all/selected fragments
  const kbTgtCount = tqResolveTargets('kb').length;
  const kbSelCount = tqKbSelectedTopics().length;
  html += `<div class="block"><div class="blabel">Knowledge Bank topics</div>
    <div class="helptext">Suggestions parsed from the notes. Tick the topics you want, choose which fragments, then apply. Topics that don't exist yet are created in the Knowledge Bank automatically. ${ts.kbApplySt==='done'?'<span class="rel-stat-found">✅ applied</span>':''}</div>
    ${ts.kbTopics.length?`<div class="kb-seltools"><button onclick="tqKbSelectAllTopics(true)">Select all</button><button onclick="tqKbSelectAllTopics(false)">None</button><span class="tgt-count">${kbSelCount} of ${ts.kbTopics.length} selected</span></div>`:''}
    <div class="kb-suggest" id="kb-pills">
      ${ts.kbTopics.length ? ts.kbTopics.map((t,ti)=>{
        const on = !ts.kbSel || ts.kbSel.has(t);
        return `<span class="kb-tag${on?'':' kb-tag-off'}"><label class="kb-tag-lbl"><input type="checkbox" ${on?'checked':''} onchange="tqKbToggleSel(${ti})">${esc(t)}</label><button class="kb-del" onclick="tqKbRemove(${ti})" title="remove">✕</button></span>`;
      }).join('') : '<i style="color:var(--dim)">none</i>'}
    </div>
    <div class="rel-search-bar" style="margin-top:10px">
      <input class="rel-search-input" placeholder="Add a topic…" value="${esc(ts.kbNewTopic||'')}" oninput="tqKbInput(this.value)" id="kb-new-input"
        onkeydown="if(event.key==='Enter'){tqKbAdd();}">
      <button class="btn btn-sm" onclick="tqKbAdd()">+ Add</button>
    </div>
    ${renderFragmentTargetPicker('kb')}
    <button class="btn btn-sm btn-full" style="margin-top:8px" onclick="tqKbApplyAll()" ${ts.kbApplySt==='loading'||!kbSelCount||!kbTgtCount?'disabled':''}>
      ${ts.kbApplySt==='loading'?'<span class="spin"></span> Resolving, creating & adding…':`⤵ Add ${kbSelCount} topic${kbSelCount!==1?'s':''} to ${ts.kbTargetMode==='selected'?`${kbTgtCount} selected`:`all ${kbTgtCount}`} fragment${kbTgtCount!==1?'s':''}`}
    </button>
    ${ts.kbApplyMsg?`<div class="helptext" style="margin-top:6px">${esc(ts.kbApplyMsg)}</div>`:''}
  </div>`;

  // Bulk relation assignment — Primary Source / Capture / Goals → all fragments
  html += renderBulkAssign(live.length);

  // Create button + results
  html += `<div class="block">`;
  if(ts.pushSt==='ok' || ts.pushSt==='error'){
    html += `<div class="pill ${ts.pushSt==='ok'?'pill-ok':'pill-err'}" style="display:block;margin-bottom:10px">${esc(ts.pushMsg)}</div>`;
    html += ts.results.map(r=>`
      <div class="src-row" style="background:${r.ok?'#f0fdf4':'#fef2f2'}">
        <span class="frag-id">${esc(r.localId)}</span>
        <span class="src-val">${r.url?`<a href="${r.url}" target="_blank">${esc(r.name)}</a>`:esc(r.name)}</span>
        ${r.ok?`<span class="val-badge val-ok">✓ created</span>`:`<span class="val-badge val-missing">✗ ${esc(r.err||'failed')}</span>`}
        ${r.note?`<div style="flex-basis:100%;font-size:11px;color:var(--muted)">${esc(r.note)}</div>`:''}
      </div>`).join('');
  }
  const validIssues = ts.fragments.filter(f=>!f.excluded && f.title.trim() &&
    f.rels.some(r=>r.dsId && r.instance && r.status!=='ok' && r.status!=='needsinstance')
  ).length;
  if(validIssues && ts.pushSt!=='ok'){
    html += `<div class="pill pill-warn" style="display:block;margin-bottom:10px">⚠ ${validIssues} fragment(s) have unresolved source/relation matches. You can still create — unresolved relations will be skipped (set Primary Source only), and you can wire them in Notion later.</div>`;
  }
  html += `<button class="btn btn-primary btn-full" onclick="tqCreate()" ${ts.pushSt==='loading'||!live.length?'disabled':''}>
    ${ts.pushSt==='loading'?'<span class="spin"></span> Creating fragments…':`Create ${live.length} fragment${live.length!==1?'s':''} into Info Processing →`}
  </button>`;
  html += `</div>`;
  return html;
}

/* ── Local topology (pre-creation) ──
 * The same connected-component / spine logic the Visualize tab runs over live
 * Notion nodes, but applied to the LOCAL parsed fragments so the editor can
 * show how many threads will be created and preview their shape before push.
 */
function tqShort(t, n){ t=(t||'').trim(); n=n||60; return t.length>n ? t.slice(0,n-1)+'…' : t; }
// Stable key for a local (pre-create) thread component: the lexicographically
// smallest local-id among its fragments. Stable as long as the cluster's member
// set is unchanged, so a typed name survives re-renders and anchor changes.
function tqCompKey(c){
  const ids = (c.idxs||[]).map(i=>ts.fragments[i] && ts.fragments[i].localId).filter(Boolean).sort();
  return ids[0] || ('comp'+(c.pos!=null?c.pos:0));
}
// What a thread is called in the editor: the typed custom name, else the anchor title.
function tqThreadDisplayName(c){
  const nm = ts.threadNames && (ts.threadNames[tqCompKey(c)]||'').trim();
  if(nm) return nm;
  const a = ts.fragments[c.anchorIdx];
  return (a && a.title) ? a.title : '(untitled)';
}
// Capture a typed name. No re-render (the input keeps its own value, like
// tqEditTitle) so typing stays smooth; the value is read at create time.
function tqSetThreadName(key, v){ (ts.threadNames = ts.threadNames || {})[key] = v; }
function tqFragByLocal(){
  const m={}; ts.fragments.forEach((f,i)=>{ m[(f.localId||'').toUpperCase()]=i; }); return m;
}
function tqPrefixForType(type){
  return type==='Core Idea'?'C':type==='Referential C'?'RC':type==='Referential CQ'?'RCQ':'OL';
}
function tqNextLocalId(prefix){
  let max=0;
  ts.fragments.forEach(f=>{
    const m=(f.localId||'').toUpperCase().match(/^([A-Z]{1,3})(\d+)/);
    if(m && m[1]===prefix){ const n=parseInt(m[2],10); if(n>max) max=n; }
  });
  return prefix+(max+1);
}

// Connected components over buildsOn + connected (undirected), like
// vizBuildComponents but on ts.fragments. Returns {comps, compOf}.
//   comps: [{idxs:[fragIdx], counts:{C,RC,RCQ,OL}, anchorIdx, minIdx, pos}]
//   compOf: fragIdx → comp pos
function tqLocalComponents(){
  const byL = tqFragByLocal();
  const parent = ts.fragments.map((_,i)=>i);
  const find=a=>{ while(parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; };
  const union=(a,b)=>{ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; };
  ts.fragments.forEach((f,i)=>{
    [...(f.buildsOn||[]), ...(f.connected||[])].forEach(lid=>{
      const j = byL[(lid||'').toUpperCase()];
      if(j!=null) union(i,j);
    });
  });
  const groups={};
  ts.fragments.forEach((f,i)=>{ const r=find(i); (groups[r]=groups[r]||[]).push(i); });
  const comps=[];
  for(const root of Object.keys(groups)){
    const idxs=groups[root];
    const counts={C:0,RC:0,RCQ:0,OL:0};
    idxs.forEach(i=>{
      const t=ts.fragments[i].type;
      if(t==='Core Idea')counts.C++; else if(t==='Referential C')counts.RC++;
      else if(t==='Referential CQ')counts.RCQ++; else counts.OL++;
    });
    comps.push({idxs, counts, anchorIdx: tqLocalAnchorIdx(idxs), minIdx: Math.min(...idxs)});
  }
  comps.sort((a,b)=>a.minIdx-b.minIdx);   // stable: order by first appearance in the notes
  const compOf={};
  comps.forEach((c,ci)=>{ c.pos=ci; c.idxs.forEach(i=>compOf[i]=ci); });
  return {comps, compOf};
}

// Reading spine for a local component: Core Ideas in Builds On order, each with
// its attached RC/RCQ/OL tangents. Mirrors _computeThreadSpine over fragment idxs.
function tqLocalSpine(idxs){
  const byL = tqFragByLocal();
  const inComp = new Set(idxs);
  const isCore = i => ts.fragments[i] && ts.fragments[i].type==='Core Idea';
  const boIdx  = i => (ts.fragments[i].buildsOn||[]).map(l=>byL[(l||'').toUpperCase()]).filter(j=>j!=null && inComp.has(j));
  const refIdx = i => [...(ts.fragments[i].buildsOn||[]), ...(ts.fragments[i].connected||[])].map(l=>byL[(l||'').toUpperCase()]).filter(j=>j!=null && inComp.has(j));
  // Spine = Builds On participants of ANY type (mirrors _computeThreadSpine), so
  // a Core that builds on an RC, and that RC, both join the tree.
  const hasParent={}, hasChild={};
  for(const i of idxs){ const ps=boIdx(i); if(ps.length) hasParent[i]=1; for(const p of ps) hasChild[p]=1; }
  const onSpine = i => isCore(i) || hasParent[i] || hasChild[i];
  const spineIdx = idxs.filter(onSpine);
  const spineSet = new Set(spineIdx);
  const indeg={}; spineIdx.forEach(c=>indeg[c]=0);
  spineIdx.forEach(c=>{ boIdx(c).forEach(t=>{ if(spineSet.has(t)) indeg[c]++; }); });
  const order=[]; const seen=new Set();
  let frontier=spineIdx.filter(c=>indeg[c]===0);
  while(frontier.length){
    frontier.sort((a,b)=>idxs.indexOf(a)-idxs.indexOf(b));   // stable tiebreak = listed order
    const next=[];
    for(const c of frontier){
      if(seen.has(c)) continue;
      seen.add(c); order.push(c);
      spineIdx.forEach(o=>{ if(!seen.has(o) && boIdx(o).includes(c)){ indeg[o]--; if(indeg[o]<=0) next.push(o); } });
    }
    frontier=next;
  }
  spineIdx.forEach(c=>{ if(!seen.has(c)) order.push(c); });   // cycles → listed order
  const spineFor = (start)=>{
    const vis=new Set(); const stack=[start];
    while(stack.length){
      const i=stack.shift();
      if(i==null||vis.has(i)) continue; vis.add(i);
      if(spineSet.has(i) && i!==start) return i;
      for(const r of refIdx(i)){ if(!vis.has(r)){ if(spineSet.has(r)) return r; stack.push(r); } }
    }
    return null;
  };
  const tangentsOf={}; order.forEach(c=>tangentsOf[c]=[]);
  const orphans=[];
  for(const i of idxs){
    if(spineSet.has(i)) continue;
    const c=spineFor(i);
    if(c!=null && tangentsOf[c]) tangentsOf[c].push(i); else orphans.push(i);
  }
  return {spine:order, tangentsOf, orphans};
}

// Build the rooted tree for a local component (mirrors the Visualize mmBuildTree):
// parent = the Builds-On target earlier in spine order; root = the spine node with
// the largest Builds-On subtree (the most foundational fragment).
function tqLocalTree(idxs){
  const sp = tqLocalSpine(idxs);
  const byL = tqFragByLocal();
  const spineSet = new Set(sp.spine);
  const oi={}; sp.spine.forEach((id,i)=>oi[id]=i);
  const boIdx = i => (ts.fragments[i].buildsOn||[]).map(l=>byL[(l||'').toUpperCase()]).filter(j=>j!=null);
  const childrenOf={}; sp.spine.forEach(i=>childrenOf[i]=[]);
  const parentOf={};
  for(const i of sp.spine){
    const p = boIdx(i).find(t=>spineSet.has(t) && oi[t] < oi[i]);
    if(p!=null){ parentOf[i]=p; childrenOf[p].push(i); }
  }
  const roots = sp.spine.filter(i=>parentOf[i]==null);
  // Builds-On subtree size for every spine node (memoized).
  const subtreeSize=(i,s=new Set())=>{ if(s.has(i)) return 0; s.add(i); let t=1; for(const c of childrenOf[i]) t+=subtreeSize(c,s); return t; };
  const sizeOf={}; sp.spine.forEach(i=>{ sizeOf[i]=subtreeSize(i); });
  // Ordering rule for siblings AND roots: larger Builds-On subtree first; ties
  // broken by listed order (lower fragment index = earlier in the notes, which
  // defaults to ascending id and is what the ↑/↓ buttons nudge).
  const bySize = (a,b)=> (sizeOf[b]-sizeOf[a]) || (a-b);
  sp.spine.forEach(i=>{ childrenOf[i].sort(bySize); });
  roots.sort(bySize);
  // Manual anchor override: if a fragment in this thread is pinned (f.anchor) and
  // is a valid root (builds on nothing in-thread), it becomes the anchor and is
  // walked first. Otherwise the auto rule (largest Builds-On subtree) applies.
  const pinned = idxs.find(i => ts.fragments[i] && ts.fragments[i].anchor && roots.includes(i));
  let root;
  if(pinned!=null){
    root = pinned;
    roots.splice(roots.indexOf(pinned),1); roots.unshift(pinned);
  } else {
    root = roots.length ? roots[0] : (sp.spine.length ? sp.spine[0] : (idxs.length ? idxs[0] : null));
  }
  const secondaryRoots = roots.slice(1);
  // displayOrder = DFS PRE-ORDER across roots in size order: walk the anchor's
  // entire Builds-On subtree (parent, then each child's whole subtree) before
  // moving to the next-largest root. This is the linear order the editor lays
  // fragments out in; each spine node's RC/RCQ/OL tangents render in its right
  // column at its row.
  const displayOrder=[]; const placed=new Set();
  const dfs = node => { if(node==null||placed.has(node)) return; placed.add(node); displayOrder.push(node); for(const c of (childrenOf[node]||[])) dfs(c); };
  for(const r of roots) dfs(r);
  sp.spine.forEach(i=>{ if(!placed.has(i)){ placed.add(i); displayOrder.push(i); } });   // safety net
  // Lateral anchor of each secondary root: first node in the canonical subtree it's Connected to.
  const canon=new Set(); (function walk(i){ if(i==null||canon.has(i)) return; canon.add(i); for(const c of childrenOf[i]) walk(c); })(root);
  const lateralAnchorOf={};
  for(const sr of secondaryRoots){
    const seen=new Set(); const stack=[sr]; let anchor=null;
    while(stack.length && !anchor){
      const i=stack.pop(); if(seen.has(i)) continue; seen.add(i);
      const conn=(ts.fragments[i].connected||[]).map(l=>byL[(l||'').toUpperCase()]).filter(j=>j!=null);
      for(const t of conn){ if(canon.has(t)){ anchor=t; break; } }
      if(!anchor) for(const c of (childrenOf[i]||[])) stack.push(c);
    }
    if(anchor!=null) lateralAnchorOf[sr]=anchor;
  }
  return {root, childrenOf, parentOf, tangentsOf:sp.tangentsOf, spine:sp.spine, displayOrder, orphans:sp.orphans, secondaryRoots, lateralAnchorOf};
}
function tqLocalAnchorIdx(idxs){
  const t = tqLocalTree(idxs);
  if(t.root!=null) return t.root;
  const core = idxs.find(i=>ts.fragments[i].type==='Core Idea');
  return core!=null ? core : (idxs.length ? Math.min(...idxs) : null);
}

/* ── Fragment + connection editing ── */
function tqAddFragment(type){
  type = type || 'Core Idea';
  const localId = tqNextLocalId(tqPrefixForType(type));
  ts.fragments.push({localId, type, title:'', buildsOn:[], connected:[], rels:[], excluded:false});
  _tqFocusKey = `frag-title-${ts.fragments.length-1}`;
  render();
}
function tqRemoveFragment(fi){
  const f = ts.fragments[fi]; if(!f) return;
  const lid = (f.localId||'').toUpperCase();
  ts.fragments.splice(fi,1);
  // strip references to the removed fragment from everyone else
  ts.fragments.forEach(o=>{
    o.buildsOn  = (o.buildsOn||[]).filter(l=>(l||'').toUpperCase()!==lid);
    o.connected = (o.connected||[]).filter(l=>(l||'').toUpperCase()!==lid);
  });
  _tqFocusKey=null;
  tqPropagateGoals();
  render();
}
function tqAddConnection(fi, kind, lid){
  if(!lid) return;
  const f = ts.fragments[fi]; if(!f) return;
  const arr = kind==='builds' ? (f.buildsOn=f.buildsOn||[]) : (f.connected=f.connected||[]);
  if(!arr.some(x=>(x||'').toUpperCase()===lid.toUpperCase())) arr.push(lid);
  tqPropagateGoals();   // a new edge can change the connected component's goals inheritance
  render();
}
function tqRemoveConnection(fi, kind, lid){
  const f = ts.fragments[fi]; if(!f) return;
  if(kind==='builds') f.buildsOn  = (f.buildsOn||[]).filter(x=>(x||'').toUpperCase()!==lid.toUpperCase());
  else                f.connected = (f.connected||[]).filter(x=>(x||'').toUpperCase()!==lid.toUpperCase());
  tqPropagateGoals();
  render();
}
// Candidate fragments to add as a builds-on / connected link from fragment fi.
function tqConnCandidates(fi, kind){
  const f = ts.fragments[fi]; if(!f) return [];
  const have = new Set(((kind==='builds'?f.buildsOn:f.connected)||[]).map(x=>(x||'').toUpperCase()));
  const selfL = (f.localId||'').toUpperCase();
  return ts.fragments
    .filter(o=> (o.localId||'').toUpperCase()!==selfL && !have.has((o.localId||'').toUpperCase()))
    .map(o=>({lid:o.localId, title:o.title}));
}
function tqTogglePreview(){ ts.showPreview = !ts.showPreview; render(); }

// Manually set (or clear → "Auto") the anchor of the thread containing locatorIdx.
// Stored as f.anchor on the chosen fragment; only one per thread. tqLocalTree
// honors it when the choice is a valid root. Editor-only: the Visualize map still
// derives its anchor from Builds On structure after creation.
function tqSetAnchor(locatorIdx, chosenStr){
  const {comps} = tqLocalComponents();
  const comp = comps.find(c => c.idxs.includes(locatorIdx));
  if(!comp) return;
  comp.idxs.forEach(i => { if(ts.fragments[i]) delete ts.fragments[i].anchor; });
  if(chosenStr!==''){ const fi = parseInt(chosenStr,10); if(ts.fragments[fi]) ts.fragments[fi].anchor = true; }
  _tqFocusKey = null;
  render();
}

// Reorder a fragment in the list. Sibling order in a thread tree (and the
// tiebreak for which root anchors a thread) follows listed order, so moving a
// fragment up/down rearranges siblings and can flip the anchor among equal-size
// roots. It also sets the order rows are created in. localId references are by
// name, so swapping array positions never breaks connections.
function tqMoveFragment(fi, dir){
  const j = fi + dir;
  if(j < 0 || j >= ts.fragments.length) return;
  const t = ts.fragments[fi]; ts.fragments[fi] = ts.fragments[j]; ts.fragments[j] = t;
  _tqFocusKey = null;
  render();
}

/* ── Read-only preview map of the local topology (pre-creation) ── */
function tqpNode(f, small){
  const col = typeColor(f.type);
  const sh  = TYPE_SHORT[f.type] || '?';
  const txt = f.title && f.title.trim() ? esc(tqShort(f.title, small?44:60)) : '<i style="color:var(--dim)">(untitled)</i>';
  return `<div class="tqp-node${small?' tqp-node-sm':''}" style="border-left-color:${col}">
    <span class="tqp-badge" style="background:${col}" title="${esc(f.type)}">${esc(f.localId||sh)}</span><span class="tqp-txt">${txt}</span></div>`;
}
// Recursive nested-tree node: a fragment, its tangents below, and its Builds-On
// children branching to the right (so a Core that builds on an RC sits to the
// right of that RC). Mirrors the NotebookLM-style layout.
function tqpTree(idx, tree, visited){
  visited = visited || new Set();
  if(idx==null || visited.has(idx)) return '';
  visited.add(idx);
  const f = ts.fragments[idx];
  const kids = (tree.childrenOf[idx]||[]);
  const tans = (tree.tangentsOf[idx]||[]);
  const isRoot = idx===tree.root;
  let h = `<div class="tqp-tnode">`;
  h += `<div class="tqp-tself${isRoot?' tqp-isroot':''}">`;
  if(isRoot) h += `<div class="tqp-anchor-lbl">⚓ anchor</div>`;
  h += tqpNode(f);
  if(tans.length) h += `<div class="tqp-tans">`+tans.map(ti=>tqpNode(ts.fragments[ti],true)).join('')+`</div>`;
  h += `</div>`;
  if(kids.length){
    h += `<div class="tqp-tkids">`;
    for(const k of kids) h += `<div class="tqp-tkid"><span class="tqp-edge">→</span>`+tqpTree(k, tree, visited)+`</div>`;
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}
function renderThreadPreviewMap(comps){
  comps = comps || tqLocalComponents().comps;
  if(!comps.length) return '<div class="helptext" style="margin-top:10px">No fragments to preview.</div>';
  let h = `<div class="tqp-wrap">`;
  for(const c of comps){
    const tree = tqLocalTree(c.idxs);
    const a = ts.fragments[tree.root!=null ? tree.root : c.idxs[0]];
    h += `<div class="tqp-thread">
      <div class="tqp-hd"><b>Thread ${c.pos+1}</b> — ${esc(tqShort(a && a.title ? a.title : '(untitled)', 70))}</div>
      <div class="tqp-flow">`;
    if(tree.root!=null) h += tqpTree(tree.root, tree, new Set());
    // Secondary roots: their own Builds-On subtrees, joined to the main tree only
    // by a Connected edge (shown via the lateral-anchor note).
    for(const sr of tree.secondaryRoots){
      const anchorIdx = tree.lateralAnchorOf[sr];
      const anchorF = anchorIdx!=null ? ts.fragments[anchorIdx] : null;
      h += `<div class="tqp-secondary"><div class="tqp-sec-lbl">↔ Connected${anchorF?` to ${esc(anchorF.localId)}`:''}</div>`
        + tqpTree(sr, tree, new Set()) + `</div>`;
    }
    h += `</div>`;
    if(tree.orphans.length){
      h += `<div class="tqp-orphans"><span class="tqp-orph-lbl">${tree.spine.length?'unattached':'fragments'}</span>`
        + tree.orphans.map(oi=>tqpNode(ts.fragments[oi],true)).join('') + `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  return h;
}

/* Group fragments into rows for the two-column layout. Each Core Idea anchors a
 * row (left column). Every non-Core fragment (RC/RCQ/OL) attaches to the right
 * column of the FIRST Core Idea it can reach by following its buildsOn/connected
 * references transitively (so an OL → RCQ → C3 lands beside C3). Non-Core
 * fragments that reach no Core Idea collect in a trailing "unattached" row.
 * Returns [{coreIdx|null, relatedIdx:[...]}], preserving parse order throughout. */
function tqGroupFragments(){
  const frby = {};                          // localId(UC) → index
  ts.fragments.forEach((f,i)=>{ frby[f.localId.toUpperCase()] = i; });
  const isCore = f => f.type === 'Core Idea';

  // For a non-core fragment, find the index of the Core Idea it attaches to.
  const coreFor = (startIdx) => {
    const seen = new Set();
    const stack = [startIdx];
    while(stack.length){
      const idx = stack.shift();
      if(idx == null || seen.has(idx)) continue;
      seen.add(idx);
      const f = ts.fragments[idx];
      if(!f) continue;
      if(isCore(f) && idx !== startIdx) return idx;   // reached a Core Idea
      // follow this fragment's references (buildsOn first, then connected),
      // in listed order, so the "first reachable" core is deterministic
      const refs = [...(f.buildsOn||[]), ...(f.connected||[])];
      for(const r of refs){
        const ti = frby[(r||'').toUpperCase()];
        if(ti != null && !seen.has(ti)){
          const tf = ts.fragments[ti];
          if(tf && isCore(tf)) return ti;             // direct core hit wins
          stack.push(ti);
        }
      }
    }
    return null;
  };

  const rows = [];
  const rowByCore = {};                       // coreIdx → row object
  ts.fragments.forEach((f,i)=>{
    if(isCore(f)){
      const row = {coreIdx:i, relatedIdx:[]};
      rowByCore[i] = row; rows.push(row);
    }
  });

  const unattached = {coreIdx:null, relatedIdx:[]};
  ts.fragments.forEach((f,i)=>{
    if(isCore(f)) return;
    const ci = coreFor(i);
    if(ci != null && rowByCore[ci]) rowByCore[ci].relatedIdx.push(i);
    else unattached.relatedIdx.push(i);
  });
  if(unattached.relatedIdx.length) rows.push(unattached);
  return rows;
}

function renderFragmentCard(f, i){
  const tc = typeCssClass(f.type);
  const typeOpts = FRAGMENT_TYPES.map(t=>`<option value="${t}" ${t===f.type?'selected':''}>${t}</option>`).join('');
  let html = `<div class="frag-card ${f.excluded?'excluded':''}">
    <div class="frag-head">
      <span class="frag-id">${esc(f.localId)}</span>
      <select class="frag-type-sel ${tc}" onchange="tqSetFragType(${i}, this.value)">${typeOpts}</select>
      <div style="flex:1"></div>
      <button class="frag-move" title="Move earlier (reorders siblings)" onclick="tqMoveFragment(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="frag-move" title="Move later (reorders siblings)" onclick="tqMoveFragment(${i},1)" ${i===ts.fragments.length-1?'disabled':''}>↓</button>
      <button class="frag-toggle-ex" onclick="tqToggleExclude(${i})">${f.excluded?'include':'exclude'}</button>
      <button class="frag-del-btn" title="Delete fragment" onclick="tqRemoveFragment(${i})">🗑</button>
    </div>
    <textarea class="frag-title-input tq-autogrow" id="frag-title-${i}" oninput="tqEditTitle(${i}, this.value); tqAutoGrow(this)">${esc(f.title)}</textarea>`;

  // Connections (editable: remove existing, add new via the pickers below)
  const connChips = [];
  (f.buildsOn||[]).forEach(lid=>{
    const exists = ts.fragments.some(x=>x.localId.toUpperCase()===lid.toUpperCase());
    connChips.push(`<span class="conn-chip ${exists?'conn-builds':'conn-broken'}">↑ builds on ${esc(lid)}<button class="conn-x" title="remove" onclick="tqRemoveConnection(${i},'builds','${esc(lid)}')">✕</button></span>`);
  });
  (f.connected||[]).forEach(lid=>{
    const exists = ts.fragments.some(x=>x.localId.toUpperCase()===lid.toUpperCase());
    connChips.push(`<span class="conn-chip ${exists?'conn-connected':'conn-broken'}">↔ ${esc(lid)}<button class="conn-x" title="remove" onclick="tqRemoveConnection(${i},'conn','${esc(lid)}')">✕</button></span>`);
  });
  const boCand = tqConnCandidates(i,'builds');
  const coCand = tqConnCandidates(i,'conn');
  // Refined By = the inverse of Builds On: fragments that build on THIS one.
  // Read-only (derived from their Builds On), shown so the chain reads both ways.
  const refinedBy = ts.fragments
    .filter(x => (x.buildsOn||[]).some(l => (l||'').toUpperCase() === (f.localId||'').toUpperCase()))
    .map(x => x.localId);
  html += `<div class="frag-conns">`;
  if(connChips.length) html += `<div class="frag-meta">${connChips.join('')}</div>`;
  if(refinedBy.length) html += `<div class="frag-refined">↳ refined by ${refinedBy.map(l=>`<span class="refined-chip">${esc(l)}</span>`).join(' ')}</div>`;
  if(boCand.length || coCand.length){
    html += `<div class="conn-add">`;
    if(boCand.length) html += `<select class="conn-add-sel" onchange="tqAddConnection(${i},'builds',this.value)"><option value="">+ builds on…</option>${boCand.map(c=>`<option value="${esc(c.lid)}">${esc(c.lid)} — ${esc(tqShort(c.title,28)||'(untitled)')}</option>`).join('')}</select>`;
    if(coCand.length) html += `<select class="conn-add-sel" onchange="tqAddConnection(${i},'conn',this.value)"><option value="">+ connect…</option>${coCand.map(c=>`<option value="${esc(c.lid)}">${esc(c.lid)} — ${esc(tqShort(c.title,28)||'(untitled)')}</option>`).join('')}</select>`;
    html += `</div>`;
  }
  html += `</div>`;

  // Relations: primary first, then capture, then goals.
  const order = {primary:0, capture:1, goals:2};
  const relIdx = f.rels.map((r,ri)=>({r,ri})).sort((a,b)=>(order[a.r.kind]??9)-(order[b.r.kind]??9));
  for(const {r, ri} of relIdx){ html += renderRelRow(r, i, ri); }

  // Add-relation controls
  html += `<div class="add-rel-wrap">
    <button class="add-rel-btn" onclick="tqAddRelation(${i},'capture')">+ Capture relation</button>
    <button class="add-rel-btn" style="margin-top:4px" onclick="tqAddRelation(${i},'goals')">+ Goals relation</button>
  </div>`;

  html += `</div>`;
  return html;
}

function renderRelRow(rel, fi, ri){
  const kindLabel = rel.kind==='primary' ? 'Primary Source'
                  : rel.kind==='goals' ? 'Goals'
                  : 'Capture';
  const kindCls = rel.kind==='primary' ? 'rel-kind-primary'
                : rel.kind==='goals' ? 'rel-kind-goals'
                : 'rel-kind-capture';

  // Status indicator
  let stat = '';
  if(rel.fromInherit && rel.status==='ok'){
    stat = `<span class="rel-stat rel-stat-found">⤵ inherited ✅</span>`;
  } else if(rel.status==='checking'){
    stat = `<span class="rel-stat rel-stat-checking"><span class="spin"></span></span>`;
  } else if(rel.status==='ok'){
    stat = `<span class="rel-stat rel-stat-found">✅ Found</span>`;
  } else if(rel.status==='needsinstance'){
    stat = `<span class="rel-stat rel-stat-checking">— no instance —</span>`;
  } else {
    stat = `<span class="rel-stat rel-stat-missing">❌ Not Found</span>`;
  }

  const shownInstance = rel.matchTitle || rel.instance || '';
  let html = `<div class="rel-row">
    <span class="rel-kind ${kindCls}">${kindLabel}</span>
    <span class="rel-text"><span class="rel-db">${esc(rel.db||'?')}:</span> ${esc(shownInstance)||'<i style="color:var(--dim)">none</i>'}</span>
    ${stat}
    <button class="rel-pencil" title="Search & edit relation" onclick="tqRelOpenPicker(${fi},${ri})">✏️</button>
    ${rel.kind!=='primary'?`<button class="rel-del" title="Remove" onclick="tqRelRemove(${fi},${ri})">✕</button>`:''}
  </div>`;

  if(rel.picking){
    // DB switcher: capture + goals databases
    const dbOpts = REL_DB_REGISTRY.map(d=>{
      const grouplabel = d.kind==='goals' ? 'Goals' : 'Capture';
      return `<option value="${esc(d.name)}" ${d.name===rel.db?'selected':''}>${grouplabel}: ${esc(d.name)}</option>`;
    }).join('');
    let results = '';
    if(rel.searchSt==='loading') results = `<div class="rel-search-hint"><span class="spin"></span> searching…</div>`;
    else if(rel.searchSt==='error') results = `<div class="rel-search-hint" style="color:var(--danger)">${esc(rel.err||'search failed')}</div>`;
    else if(rel.results){
      if(!rel.results.length) results = `<div class="rel-search-hint">No matches in ${esc(rel.db)}.</div>`;
      else results = `<div class="rel-results">` + rel.results.map(o=>
        `<button class="rel-result" onclick="tqRelPick(${fi},${ri},'${o.id}', this.getAttribute('data-t'))" data-t="${esc(o.title)}">${esc(o.title)}</button>`
      ).join('') + `</div>`;
    }
    html += `<div class="rel-search">
      <div class="rel-search-bar">
        <select class="rel-db-sel" onchange="tqRelSetDb(${fi},${ri},this.value)">${dbOpts}</select>
        <input class="rel-search-input" placeholder="Search ${esc(rel.db)}…" value="${esc(rel.query||'')}"
          oninput="tqRelOnInput(${fi},${ri},this.value)" id="relsearch-${fi}-${ri}">
      </div>
      ${results}
    </div>`;
  }
  return html;
}

// Auto-grow a textarea to fit its content (no inner scrollbar).
function tqAutoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}
// Grow all fragment textareas after each render.
function tqAutoGrowAll(){
  document.querySelectorAll('.tq-autogrow').forEach(tqAutoGrow);
}

/* ── Fragment target picker (shared by KB topics and bulk relation assign) ──
 * scope: 'kb' uses ts.kbTargetMode/ts.kbTargets; 'bulk' uses ts.bulk.targetMode
 * /ts.bulk.targets. A target set is a Set of fragment indices (into ts.fragments).
 * mode 'all' ignores the set and targets every live fragment. */
function tqLiveFragIdx(){
  const out = [];
  ts.fragments.forEach((f,i)=>{ if(!f.excluded && f.title.trim()) out.push(i); });
  return out;
}
function tqTargetState(scope){
  if(scope==='kb') return {get mode(){return ts.kbTargetMode;}, set mode(v){ts.kbTargetMode=v;},
                           get set(){return ts.kbTargets;}, set set(v){ts.kbTargets=v;}};
  const b = ts.bulk;
  return {get mode(){return b.targetMode||'all';}, set mode(v){b.targetMode=v;},
          get set(){return b.targets;}, set set(v){b.targets=v;}};
}
// Resolve the effective list of target fragment indices for a scope.
function tqResolveTargets(scope){
  const st = tqTargetState(scope);
  const liveIdx = tqLiveFragIdx();
  if(st.mode!=='selected' || !st.set) return liveIdx;
  return liveIdx.filter(i => st.set.has(i));
}
function tqSetTargetMode(scope, mode){
  const st = tqTargetState(scope);
  st.mode = mode;
  if(mode==='selected' && !st.set) st.set = new Set(tqLiveFragIdx()); // default: all checked
  if(scope==='kb'){ ts.kbApplySt=null; ts.kbApplyMsg=''; }
  else if(ts.bulk){ ts.bulk.applyMsg=''; }
  render();
}
function tqToggleTarget(scope, idx){
  const st = tqTargetState(scope);
  if(!st.set) st.set = new Set(tqLiveFragIdx());
  if(st.set.has(idx)) st.set.delete(idx); else st.set.add(idx);
  if(scope==='kb'){ ts.kbApplySt=null; ts.kbApplyMsg=''; }
  else if(ts.bulk){ ts.bulk.applyMsg=''; }
  render();
}
function tqTargetSelectAll(scope, on){
  const st = tqTargetState(scope);
  st.set = on ? new Set(tqLiveFragIdx()) : new Set();
  if(scope==='kb'){ ts.kbApplySt=null; ts.kbApplyMsg=''; }
  else if(ts.bulk){ ts.bulk.applyMsg=''; }
  render();
}
function renderFragmentTargetPicker(scope){
  const st = tqTargetState(scope);
  const liveIdx = tqLiveFragIdx();
  const selSet = st.set || new Set(liveIdx);
  const selCount = st.mode==='selected' ? liveIdx.filter(i=>selSet.has(i)).length : liveIdx.length;
  let html = `<div class="tgt-mode">
    <button class="tgt-mode-btn ${st.mode==='all'?'active':''}" onclick="tqSetTargetMode('${scope}','all')">All fragments</button>
    <button class="tgt-mode-btn ${st.mode==='selected'?'active':''}" onclick="tqSetTargetMode('${scope}','selected')">Choose fragments…</button>
    <span class="tgt-count">${selCount} selected</span>
  </div>`;
  if(st.mode==='selected'){
    html += `<div class="tgt-bulkbtns">
      <button onclick="tqTargetSelectAll('${scope}',true)">Select all</button>
      <button onclick="tqTargetSelectAll('${scope}',false)">Clear</button>
    </div>`;
    html += `<div class="tgt-list">`;
    for(const i of liveIdx){
      const f = ts.fragments[i];
      const tc = typeCssClass(f.type);
      const t = (f.title||'').trim();
      const short = t.length>90 ? t.slice(0,90)+'…' : t;
      html += `<label class="tgt-item">
        <input type="checkbox" ${selSet.has(i)?'checked':''} onchange="tqToggleTarget('${scope}',${i})">
        <span class="tgt-fid ${tc}">${esc(f.localId)}</span>
        <span class="tgt-txt">${esc(short)}</span>
      </label>`;
    }
    html += `</div>`;
  }
  return html;
}

/* ── Knowledge Bank topic actions ── */
function tqKbInput(v){ ts.kbNewTopic = v; _tqFocusKey = 'kb-new-input'; }
function tqKbAdd(){
  const t = (ts.kbNewTopic||'').trim();
  if(t && !ts.kbTopics.some(x=>x.toLowerCase()===t.toLowerCase())){
    ts.kbTopics.push(t);
    if(ts.kbSel) ts.kbSel.add(t);   // new topics start selected
  }
  ts.kbNewTopic = ''; ts.kbApplySt=null; ts.kbApplyMsg='';
  _tqFocusKey = 'kb-new-input';
  render();
}
function tqKbRemove(ti){
  const t = ts.kbTopics[ti];
  ts.kbTopics.splice(ti,1);
  if(ts.kbSel && t!=null) ts.kbSel.delete(t);
  ts.kbApplySt=null; ts.kbApplyMsg=''; render();
}
// Which topics are currently selected to apply (null kbSel = all selected).
function tqKbSelectedTopics(){ return ts.kbTopics.filter(t => !ts.kbSel || ts.kbSel.has(t)); }
function tqKbToggleSel(ti){
  const t = ts.kbTopics[ti]; if(t==null) return;
  if(!ts.kbSel) ts.kbSel = new Set(ts.kbTopics);   // materialize "all", then toggle
  if(ts.kbSel.has(t)) ts.kbSel.delete(t); else ts.kbSel.add(t);
  ts.kbApplySt=null; ts.kbApplyMsg=''; render();
}
function tqKbSelectAllTopics(on){
  ts.kbSel = on ? new Set(ts.kbTopics) : new Set();
  ts.kbApplySt=null; ts.kbApplyMsg=''; render();
}

// Resolve each KB topic against the Knowledge Bank DB, then add the resolved
// ones as a Knowledge Bank relation on every (non-excluded) fragment.
async function tqKbApplyAll(){
  const kb = relDbByName('Knowledge Bank');
  if(!kb) return;
  const topics = tqKbSelectedTopics();
  if(!topics.length){ ts.kbApplySt='error'; ts.kbApplyMsg='Select at least one topic to apply.'; render(); return; }
  ts.kbApplySt='loading'; ts.kbApplyMsg=''; render();
  let pages;
  try{ pages = await tqGetDbPages(kb.dbId); }
  catch(e){ ts.kbApplySt='error'; ts.kbApplyMsg=e.message; render(); return; }
  const resolved = [];      // {topic, id, title}
  const toCreate = [];
  for(const topic of topics){
    const needle = topic.trim().toLowerCase();
    const hit = pages.find(p=>p.title.trim().toLowerCase()===needle)
             || pages.find(p=>p.title.toLowerCase().includes(needle));
    if(hit) resolved.push({topic, id:hit.id, title:hit.title});
    else toCreate.push(topic);
  }
  // Topics not already in the Knowledge Bank are created as new pages, then linked.
  const created = [];
  for(const topic of toCreate){
    try{ const np = await tqCreateInstance(kb.dbId, topic.trim()); resolved.push({topic, id:np.id, title:np.title}); created.push(topic); }
    catch(e){ /* leave unresolved; reported below */ }
  }
  const failed = toCreate.filter(t=>!created.includes(t));
  // Add each resolved topic as a KB relation on every targeted fragment (dedup).
  const targetIdx = tqResolveTargets('kb');
  const targets = targetIdx.map(i=>ts.fragments[i]);
  for(const f of targets){
    for(const r of resolved){
      const dup = f.rels.some(x=>x.kind==='capture' && x.relProp===kb.relProp && x.matchId===r.id);
      if(dup) continue;
      const rel = makeRel('capture', 'Knowledge Bank', r.title);
      rel.matchId = r.id; rel.matchTitle = r.title; rel.status='ok'; rel.fromInherit=true;
      f.rels.push(rel);
    }
  }
  ts.kbApplySt = failed.length ? 'error' : 'done';
  const scopeLabel = ts.kbTargetMode==='selected' ? `${targets.length} selected fragment${targets.length!==1?'s':''}` : `all ${targets.length} fragments`;
  ts.kbApplyMsg = `Added ${resolved.length} topic${resolved.length!==1?'s':''} to ${scopeLabel}`
    + (created.length?`. Created ${created.length} new topic${created.length!==1?'s':''}: ${created.join(', ')}`:'')
    + (failed.length?`. Could not create: ${failed.join(', ')}`:'') + '.';
  render();
}

/* ── Bulk relation assignment (Primary Source / Capture / Goals → chosen fragments) ── */
function renderBulkAssign(liveCount){
  const b = ts.bulk || (ts.bulk = {kind:'capture', db:'Content Vault', query:'', results:null, searchSt:null, matchId:null, matchTitle:'', msg:'', targetMode:'all', targets:null});

    .map(d=>`<option value="${esc(d.name)}" ${d.name===b.db?'selected':''}>${esc(d.name)}</option>`).join('');

  return `<div class="block">

    <div class="rel-search-bar">
      <select class="rel-db-sel" onchange="tqBulkSetKind(this.value)">
        <option value="primary" ${b.kind==='primary'?'selected':''}>Primary Source</option>
        <option value="capture" ${b.kind==='capture'?'selected':''}>Capture system</option>

      </select>

    </div>
    <div class="rel-search-bar">

        oninput="tqBulkInput(this.value)" id="bulk-search-input">

    ${renderFragmentTargetPicker('bulk')}
    <button class="btn btn-primary btn-sm btn-full" style="margin-top:8px" onclick="tqBulkApply()" ${!b.matchId||!bTgtCount?'disabled':''}>

function tqBulkSetKind(kind){
  const b = ts.bulk;
  b.kind = kind;
  // Reset DB to a sensible default for the kind
  if(kind==='goals') b.db = 'Goals';
  else b.db = 'Content Vault';
  b.results=null; b.searchSt=null; b.matchId=null; b.matchTitle=''; b.applyMsg='';
  tqBulkRunSearch(b.query||'');
  render();
}
function tqBulkSetDb(dbName){
  const b = ts.bulk; b.db = dbName;
  b.results=null; b.searchSt=null; b.matchId=null; b.matchTitle='';
  tqBulkRunSearch(b.query||'');
  render();
}
let _bulkTimer = null;
function tqBulkInput(v){
  ts.bulk.query = v; _tqFocusKey = 'bulk-search-input';
  clearTimeout(_bulkTimer);
  _bulkTimer = setTimeout(()=>tqBulkRunSearch(v), 220);
}
async function tqBulkRunSearch(v){
  const b = ts.bulk; const reg = relDbByName(b.db);
  if(!reg){ b.results=[]; b.searchSt='error'; b.msg='Unknown DB'; render(); return; }
  b.searchSt='loading'; render();
  try{
    const pages = await tqGetDbPages(reg.dbId);
    const q = (v||'').trim().toLowerCase();
    const res = !q ? pages.slice(0,25)
      : pages.filter(p=>p.title.toLowerCase().includes(q))
             .sort((a,b2)=>a.title.length-b2.title.length).slice(0,25);
    b.results=res; b.searchSt='ok';
  }catch(e){ b.results=[]; b.searchSt='error'; b.msg=e.message; }
  render();
}
function tqBulkPick(id, title){
  const b = ts.bulk; b.matchId=id; b.matchTitle=title; b.applyMsg=''; _tqFocusKey=null; render();
}
function tqBulkApply(){
  const b = ts.bulk; const reg = relDbByName(b.db);
  if(!b.matchId || !reg) return;
  const kind = b.kind==='goals' ? 'goals' : (b.kind==='primary' ? 'primary' : 'capture');
  const targetIdx = tqResolveTargets('bulk');
  const targets = targetIdx.map(i=>ts.fragments[i]);
  for(const f of targets){
    if(kind==='primary'){
      // Replace any existing primary relation
      f.rels = f.rels.filter(r=>r.kind!=='primary');
      const rel = makeRel('primary', b.db, b.matchTitle);
      rel.matchId=b.matchId; rel.matchTitle=b.matchTitle; rel.status='ok';
      f.rels.unshift(rel);
    } else {
      const dup = f.rels.some(r=>r.relProp===reg.relProp && r.matchId===b.matchId);
      if(dup) continue;
      const rel = makeRel(kind, b.db, b.matchTitle);
      rel.matchId=b.matchId; rel.matchTitle=b.matchTitle; rel.status='ok';
      rel.fromInherit = (kind==='goals');
      f.rels.push(rel);
    }
  }
  if(kind==='goals') tqPropagateGoals();
  const scopeLabel = b.targetMode==='selected' ? `${targets.length} selected fragment${targets.length!==1?'s':''}` : `all ${targets.length} fragments`;
  b.applyMsg = `Applied "${b.matchTitle}" to ${scopeLabel}`;
  render();
}
