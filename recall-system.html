const TYPE_COLORS = {
  'Core Idea':'#16a34a',      // green
  'Referential C':'#8b5cf6',  // purple
  'Referential CQ':'#2563eb', // blue
  'Open Loop':'#eab308',      // yellow
  'Pattern':'#0e7490',        // deep cyan
  'Story':'#be185d',          // rose
  'Stand Alone Idea':'#0d9488', // teal — the stand-alone collection
  '(untyped)':'#94a3b8'
};
const TYPE_SHORT = {'Core Idea':'C','Pattern':'P','Story':'S','Referential C':'RC','Referential CQ':'RCQ','Open Loop':'OL','Stand Alone Idea':'SA','(untyped)':'?'};
function typeColor(t){ return TYPE_COLORS[t]||'#94a3b8'; }

// Strip a leading emoji (and following space) from a string, for comparing the
// emoji-prefixed Thread Identifier against bare relation titles.
function stripLeadEmoji(s){
  return String(s||'').replace(/^\s*[\p{Extended_Pictographic}\u200d\uFE0F\u20E3]+\s*/u, '');
}

// Distinct facet values across all components, for the picker suggestions.
// For 'source' with a chosen DB, returns the instance titles within that DB.
function vizFacetValues(facet){
  const s = new Set();
  for(const c of vs.comps){
    if(facet==='goal') c.goals.forEach(v=>s.add(v));
    else if(facet==='kb') c.kb.forEach(v=>s.add(v));
    else if(facet==='source'){
      // step 2 → list capture-system DBs that appear as a Primary Source;
      // step 3 (a DB chosen) → list instance titles within that DB.
      if(!vs.fSourceDb){ c.sources.forEach(v=>s.add(v)); }
      else { (c.captureInstances||[]).forEach(o=>{ if(o.system===vs.fSourceDb) s.add(o.title); }); }
    }
  }
  return Array.from(s).sort((a,b)=>a.localeCompare(b));
}

// Does a single fragment node match the active facet filter? Used both to decide
// component inclusion and to HIGHLIGHT the specific matching fragment(s).
function vizNodeMatchesFacet(n){
  if(vs.fFacet==='all') return false;
  if(vs.fFacet==='goal'){
    if(!vs._goalClosureTitles) return false;
    // A fragment matches if any of its inherited goals titles is in the
    // downward-alignment closure of the selected goal item.
    return (n.goals||[]).some(g=>vs._goalClosureTitles.has(g.title||g));
  }
  if(vs.fFacet==='kb'){
    if(!vs.fValues || !vs.fValues.length) return false;
    return (n.kb||[]).some(k=>vs.fValues.includes(k));
  }
  if(vs.fFacet==='source'){
    if(!vs.fSourceDb) return false;
    if(!vs.fValue){
      // DB chosen, no specific instance → match if this fragment's Primary Source is that DB
      return n.primarySource===vs.fSourceDb;
    }
    return (n.captureInstances||[]).some(o=>o.system===vs.fSourceDb && o.title===vs.fValue);
  }
  return false;
}

// Does a fragment match the ACTIVE filters (facet OR free-text search)? Used to
// draw the red highlight border on the specific fragment(s) that caused their
// thread to be included. A fragment is highlighted if it matches the armed facet
// or if its title contains the current search text.
function vizNodeHighlighted(n){
  if(!n) return false;
  if(!vs.fHighlight) return false;   // highlighting toggled off
  if(vizFacetArmed() && vizNodeMatchesFacet(n)) return true;
  const q = (vs.fSearch||'').trim().toLowerCase();
  if(q && (n.title||'').toLowerCase().includes(q)) return true;
  return false;
}

// Is the facet filter "armed" (has enough selection to actually filter)?
function vizFacetArmed(){
  if(vs.fFacet==='all') return false;
  if(vs.fFacet==='kb') return (vs.fValues||[]).length>0;
  if(vs.fFacet==='source') return !!vs.fSourceDb;   // DB alone filters; instance narrows
  if(vs.fFacet==='goal') return !!vs.fGoalItemId && !!vs._goalClosureTitles;
  return false;
}

// Components passing the current filters. A component matches a facet if ANY of
// its fragments matches — then the WHOLE component is returned. Each surviving
// component is tagged with `matchIds` (the fragments that actually matched) so
// the UI can highlight them.
function vizFilteredComps(){
  const q = (vs.fSearch||'').trim().toLowerCase();
  const armed = vizFacetArmed();
  const out = [];
  for(const c of vs.comps){
    const forced = !!(vs.forceShow && vs.forceShow[c.idx]);   // reached via a cross-thread jump → shown until the filters change
    if(!forced){
      if(vs.fOpen==='open' && !c.open) continue;
      if(vs.fOpen==='resolved' && c.open) continue;
      if(vs.fVetted==='vetted'   && !vizThreadVetted(c)) continue;
      if(vs.fVetted==='unvetted' &&  vizThreadVetted(c)) continue;
    }
    let facetIds = null;
    if(armed && !forced){
      facetIds = c.nodeIds.filter(id=>vizNodeMatchesFacet(vs.byId[id]));
      if(!facetIds.length) continue;
    }
    let searchIds = null;
    if(q && !forced){
      searchIds = c.nodeIds.filter(id=>(vs.byId[id].title||'').toLowerCase().includes(q));
      if(!searchIds.length) continue;
    }
    // matchIds = the union of fragments that matched the facet and/or the search,
    // so both the list "matches" row and the map's red border highlight them.
    const union = new Set([...(facetIds||[]), ...(searchIds||[])]);
    c.matchIds = Array.from(union);
    out.push(c);
  }
  return _applyCompOrder(out);   // honour the manual top-to-bottom thread order
}

// Stable key for a whole thread (component): its lowest member id. Survives
// re-indexing, so manual thread order persists across reloads/edits.
function vizCompKey(comp){ return comp.nodeIds.reduce((a,b)=>a<b?a:b); }
// Reorder threads by the saved manual order. Listed threads come first in saved
// order; the rest keep default order appended after — so a new thread is never
// hidden by the override.
function _applyCompOrder(arr){
  const ov = vs.threadOrder;
  if(!ov || !ov.length || arr.length<2) return arr;
  const rank={}; ov.forEach((k,i)=>{ rank[k]=i; });
  const tagged = arr.map(c=>({c, k:vizCompKey(c)}));
  const listed = tagged.filter(o=>rank[o.k]!=null).sort((a,b)=>rank[a.k]-rank[b.k]).map(o=>o.c);
  const rest   = tagged.filter(o=>rank[o.k]==null).map(o=>o.c);
  return listed.length ? [...listed, ...rest] : arr;
}
// A thread is "vetted" when any of its members carries the Vetted flag (so it
// survives anchor changes).
function vizThreadVetted(comp){ return !!(comp && comp.nodeIds.some(id=>vs.byId[id] && vs.byId[id].vetted)); }

function vizThreadLabel(comp){
  // A custom Thread Name (stored on a member) overrides the anchor title.
  const custom = vizThreadCustomName(comp);
  if(custom) return custom;
  // Default: the thread's anchor (the rendered tree root) so the label matches the map.
  const a = vizAnchorNode(comp);
  return a ? a.title : '(empty thread)';
}

// The member fragment that carries the thread's custom name, if any. A name is
// component-level metadata: we READ it from whichever member holds one, with a
// deterministic preference so the label is unambiguous even after threads merge:
// pinned anchor → computed anchor → lowest-id member. Returns a node or null.
function vizThreadNameMember(comp){
  if(!comp) return null;
  const named = comp.nodeIds.filter(id=>vs.byId[id] && (vs.byId[id].threadName||'').trim());
  if(!named.length) return null;
  const pinned = named.find(id=>vs.pinAnchor && vs.pinAnchor[id]);
  if(pinned) return vs.byId[pinned];
  const a = vizAnchorNode(comp);
  if(a && named.includes(a.id)) return a;
  return vs.byId[named.reduce((x,y)=>x<y?x:y)];
}
function vizThreadCustomName(comp){
  const m = vizThreadNameMember(comp);
  return m ? (m.threadName||'').trim() : '';
}
// The fragment a (re)name is WRITTEN onto: whichever member already holds a name
// (so renaming overwrites in place), else the thread's anchor.
function vizThreadNameTarget(comp){
  return vizThreadNameMember(comp) || vizAnchorNode(comp);
}

// The ANCHOR fragment of a thread: the ROOT of the rendered tree — the most
// foundational fragment (largest Builds On subtree), the jumping-off point of
// the thinking process. This is the same node the mindmap roots at, so the
// label and the map always agree (previously the label used spine[0], the first
// node in topological order, which could be a different root).
function vizAnchorNode(comp){
  const tree = mmBuildTree(comp);
  if(tree && tree.root && vs.byId[tree.root]) return vs.byId[tree.root];
  const sp = vizThreadSpine(comp.idx);
  if(sp.spine.length) return vs.byId[sp.spine[0]];
  const coreId = comp.nodeIds.find(id=>isSpineType(vs.byId[id].type));
  return vs.byId[coreId || comp.nodeIds[0]];
}

// Decide how to render the thread-identifier pill for an anchor node.
// Returns {text, kind} where kind ∈ 'purpose'(purple) | 'purposeless'(yellow) | 'type'(type color).
function vizIdentifierPill(anchor){
  const id = (anchor.identifier||'').trim();
  const status = (anchor.threadStatus||'').trim().toLowerCase();
  const idLower = id.toLowerCase();
  const emptyish = !id || idLower==='purposeless - no source' || idLower==='purposeless – no source' || idLower==='purposeless — no source';
  if(emptyish){
    return {text: anchor.type, kind:'type'};   // fall back to the fragment type, in its type color
  }
  if(status.includes('purpose-defined') || status==='purpose defined'){
    return {text:id, kind:'purpose'};
  }
  if(status.includes('purposeless')){
    return {text:id, kind:'purposeless'};
  }
  // Unknown status but a real identifier exists → show it neutrally as purpose-defined-style
  return {text:id, kind:'purpose'};
}

// ── Thread renaming ─────────────────────────────────────────────────────────
// Inline editor to give a thread a custom name (overrides the anchor title on
// the list, the collapsed map node, and the reader header). Writes the
// Thread Name property on the thread's anchor; clearing it wipes the name from
// every member so the label reverts to the anchor title.
function vizRenameStart(ev, compIdx){
  if(ev) ev.stopPropagation();
  const comp = vs.comps[compIdx]; if(!comp) return;
  vs.rename = {compIdx, value: vizThreadCustomName(comp), busy:false, err:''};
  _tqFocusKey = 'viz-rename';
  render();
}
function vizRenameInput(v){ if(vs.rename){ vs.rename.value = v; _tqFocusKey = 'viz-rename'; } }
function vizRenameCancel(ev){ if(ev) ev.stopPropagation(); vs.rename = null; render(); }
async function vizRenameSave(ev){
  if(ev) ev.stopPropagation();
  const r = vs.rename; if(!r) return;
  const comp = vs.comps[r.compIdx];
  if(!comp){ vs.rename = null; render(); return; }
  const name = (r.value||'').trim();
  r.busy = true; r.err = ''; render();
  try{
    if(name){
      const target = vizThreadNameTarget(comp);
      if(!target) throw new Error('No fragment to attach the name to.');
      await nPatch('/pages/'+fmtId(target.id), {properties:{'Thread Name':{rich_text:[{type:'text',text:{content:name}}]}}});
      target.threadName = name;
    } else {
      // Clearing → wipe the name from every member that currently holds one.
      const holders = comp.nodeIds.filter(id=>vs.byId[id] && (vs.byId[id].threadName||'').trim());
      for(const id of holders){
        await nPatch('/pages/'+fmtId(id), {properties:{'Thread Name':{rich_text:[]}}});
        vs.byId[id].threadName = '';
      }
    }
    vs.rename = null; render();
  }catch(e){
    r.busy = false;
    r.err = /Thread Name is not a property|could not find property/i.test(e.message||'')
      ? 'Add a "Thread Name" text property to Info Processing first.'
      : (e.message || 'Rename failed');
    render();
  }
}
// Reusable inline editor markup (used by list row, reader header, collapsed map node).
function vizRenameEditorHtml(){
  const r = vs.rename; if(!r) return '';
  return `<span class="viz-rename" onclick="event.stopPropagation()">
    <input id="viz-rename" class="viz-rename-input" value="${esc(r.value||'')}" placeholder="Thread name…"
      oninput="vizRenameInput(this.value)"

    <button class="viz-rename-btn ok" ${r.busy?'disabled':''} onclick="vizRenameSave(event)" title="Save name">${r.busy?'…':'✓'}</button>
    <button class="viz-rename-btn" ${r.busy?'disabled':''} onclick="vizRenameCancel(event)" title="Cancel">✕</button>
    ${r.err?`<span class="viz-rename-err">${esc(r.err)}</span>`:''}

}
function vizRenameTriggerHtml(compIdx){
  return `<button class="viz-rename-trigger" onclick="vizRenameStart(event,${compIdx})" title="Name this thread">✎</button>`;
}

// Resolve the recent-anchor list into a deduped, recency-ordered array of
// component objects (the same shape renderVizList / renderVizMap consume), plus
// the count of stale anchors that no longer resolve in the current load.
function vizRecentComps(){
  const recent = vs.recent||[];
  const comps = [];
  const seen = new Set();
  let stale = 0;
  for(const r of recent){
    const n = vs.byId[r.key];
    if(!n || n.comp==null || n.comp<0){ stale++; continue; }
    const c = vs.comps[n.comp];
    if(!c || seen.has(c.idx)) continue;
    seen.add(c.idx);
    comps.push(c);
  }
  return {comps, stale};
}

// Recently-Viewed landing screen: the default when the latticework first loads
// and no filter is active. Renders the recent threads THROUGH the active view
// (List or Map) so the landing matches the chosen view type, with a header and
// a "Browse all" action on top.
function renderVizRecent(){
  const {comps, stale} = vizRecentComps();
  const head = `<div class="recent-head">
      <div class="recent-title">Recently viewed</div>
      <button class="btn btn-sm" onclick="vizBrowseAll()">Browse all threads →</button>
    </div>`;
  let body;
  if(!comps.length){
    body = `<div class="reader-empty">No recently-viewed threads yet. Pick a filter or browse all to start exploring.</div>`;
  } else {
    body = (vs.view==='map') ? renderVizMap(comps) : renderVizList(comps);
  }
  const staleNote = stale ? `<div class="recent-stale-note">${stale} recent thread${stale!==1?'s':''} not in the current load.</div>` : '';
  return `<div class="recent-wrap">${head}${body}${staleNote}</div>`;
}
function vizRelTime(ts){
  if(!ts) return '';
  const d = Date.now()-ts, m=60000, h=3600000, day=86400000;
  if(d<m) return 'just now';
  if(d<h) return Math.floor(d/m)+'m ago';
  if(d<day) return Math.floor(d/h)+'h ago';
  if(d<7*day) return Math.floor(d/day)+'d ago';
  return new Date(ts).toLocaleDateString();
}

function renderVizList(filtered){
  if(!filtered.length) return `<div class="reader-empty">No threads match these filters.</div>`;
  let html='';
  for(const c of filtered){
    const label = vizThreadLabel(c);
    const anchor = vizAnchorNode(c);
    const pill = vizIdentifierPill(anchor);

    // Section 1: the thread identifier pill (conditional color)
    const pillClass = pill.kind==='purpose' ? 'idpill-purpose'
                    : pill.kind==='purposeless' ? 'idpill-purposeless'
                    : 'idpill-type';
    const pillStyle = pill.kind==='type' ? ` style="background:${typeColor(anchor.type)}1a;color:${typeColor(anchor.type)};border-color:${typeColor(anchor.type)}55"` : '';
    const idSection = `<div class="thread-idrow"><span class="idpill ${pillClass}"${pillStyle}>${esc(pill.text)}</span></div>`;

    // Section 2: the rest of the relational pills, each with its system emoji.
    // Capture pills show INSTANCE names (not the DB name). Events in Time has no
    // instance rollup in the IP schema, so fall back to its name.
    const capObjs = c.captureInstances.map(o=>({emoji:REL_EMOJI[o.system]||'', title:o.title}));
    if(c.sources.has('Events in Time')) capObjs.push({emoji:REL_EMOJI['Events in Time'], title:'Events in Time'});
    let goalObjs = c.goalsObjs ? c.goalsObjs.map(o=>({emoji:REL_EMOJI[o.system]||'🎯', title:o.title})) : [];
    let kb = c.kb ? [...c.kb] : [];
    let capList = capObjs;
    // De-dupe: if section 1 shows a real Thread Identifier (not the type
    // fallback), don't repeat that same value in section 2. The identifier text
    // carries a leading emoji from the formula (e.g. "🔗 Adaptive Markets" or
    // "⛰️ Build webapp"); compare on the BARE title with any leading emoji stripped.
    if(pill.kind!=='type'){
      const dupe = stripLeadEmoji(pill.text).trim().toLowerCase();
      const notDupeStr = v => stripLeadEmoji(v).trim().toLowerCase() !== dupe;
      capList = capList.filter(o=>notDupeStr(o.title));
      goalObjs = goalObjs.filter(o=>notDupeStr(o.title));
      kb = kb.filter(notDupeStr);
    }
    const capShown = capList.slice(0,4);
    const goalShown = goalObjs.slice(0,3);
    kb = kb.slice(0,3);
    const relPills =
      capShown.map(o=>`<span class="thread-chip chip-src">${o.emoji?esc(o.emoji)+' ':''}${esc(o.title)}</span>`).join('') +
      goalShown.map(o=>`<span class="thread-chip chip-goal">${esc(o.emoji)} ${esc(o.title)}</span>`).join('') +
      kb.map(k=>`<span class="thread-chip chip-kb">${esc(REL_EMOJI['Knowledge Bank'])} ${esc(k)}</span>`).join('');
    const imgCount = c.nodeIds.filter(id=>(vs.byId[id].images||[]).length).length;
    const relSection = (relPills||imgCount) ? `<div class="thread-meta">${relPills}${imgCount?`<span class="thread-chip chip-img" title="fragments with images">🖼 ${imgCount}</span>`:''}</div>` : '';

    // Bottom: type squares, always ordered Core Idea → Referential C →
    // Referential CQ → Open Loop (then any untyped), with the fragment count
    // to their right. (Order is by type, independent of graph order.)
    const TYPE_ORDER = FRAGMENT_TYPES;
    const ordered = [];
    for(const t of TYPE_ORDER) for(const id of c.nodeIds) if(vs.byId[id].type===t) ordered.push(id);
    for(const id of c.nodeIds) if(!TYPE_ORDER.includes(vs.byId[id].type)) ordered.push(id);  // untyped/other last
    const sparkIds = ordered.slice(0,18);
    const spark = sparkIds.map(id=>`<span class="sd" style="background:${typeColor(vs.byId[id].type)}" title="${esc(vs.byId[id].type)}"></span>`).join('');
    const moreSquares = c.total>18 ? `<span class="spark-more">+${c.total-18}</span>` : '';

    html += `<div class="thread-card ${c.open?'':'is-resolved'}" onclick="vizOpenReader(${c.idx})">
      <div class="thread-card-top">
        ${(vs.rename && vs.rename.compIdx===c.idx) ? vizRenameEditorHtml()
          : `<span class="thread-title">${esc(label)}</span>${vizRenameTriggerHtml(c.idx)}`}
        ${vizThreadVetted(c) ? `<span class="vetted-badge" title="Vetted — foundational work done">✓ Vetted</span>` : ''}
        <span class="thread-badge ${c.open?'tb-open':'tb-resolved'}">${c.open?'open':'resolved'}</span>
      </div>
      ${idSection}
      ${relSection}
      <div class="thread-spark">
        <span class="spark-squares">${spark}${moreSquares}</span>
        <span class="spark-count">${c.total} fragment${c.total!==1?'s':''}${c.resolvedCount?` · ${c.resolvedCount} resolved`:''}</span>
      </div>
    </div>`;
  }
  return html;
}

/* ── Mindmap (force-directed, vanilla SVG) ──
 * Lays each visible component as its own cluster, packed left-to-right. A simple
 * spring/repulsion simulation runs a fixed number of iterations (deterministic,
 * seeded by node order) so the layout is stable across renders. */
/* ── Interactive mindmap (NotebookLM-style horizontal tree) ──
 * Renders ONE thread (component) as a left→right tree. The Builds-On chain is
 * the spine (collapsible via < / > carets); each spine node's RC/RCQ/OL tangents
 * hang off a separate toggle on the connecting line. Cards are absolutely
 * positioned HTML inside a pan/zoom scene. Node heights are estimated from title
 * length + whether the relational pills are expanded. */
const MM_NODEW = 260;          // node card width (px, scene units)
const MM_HGAP = 80;            // horizontal gap between depth columns
const MM_VGAP = 22;            // vertical gap between sibling subtrees
const MM_LINEH = 17;           // approx line height for title wrapping
const MM_CHARS_PER_LINE = 34;  // approx chars per line at MM_NODEW
const TTOGGLE_CLEARANCE = 20;  // extra vertical room for the "+N↳" toggle drawn below a node

function mmEstHeight(node){
  const n = vs.byId[node]; if(!n) return 44;
  // If we've measured this card's real rendered height (after a paint), trust it
  // — that's what makes spacing exact regardless of how the pills wrap.
  const mh = vs.mm.measuredH && vs.mm.measuredH[node];
  if(mh != null) return mh;
  const title = n.title||'';
  // Word-wrapping breaks on spaces, so the rendered line count is usually higher
  // than a naive length/charsPerLine. Use a conservative chars-per-line (smaller
  // than the true average) and add one line of headroom so the estimate never
  // UNDER-counts — under-counting is what makes "non-overlapping" boxes actually
  // touch once rendered.
  const CONSERVATIVE_CPL = 30;
  const lines = Math.max(1, Math.ceil(title.length / CONSERVATIVE_CPL)) + (title.length > CONSERVATIVE_CPL ? 1 : 0);
  let h = 20 + lines*MM_LINEH;           // padding + title (+headroom)
  h += 20;                               // bottom toggle row
  if(vs.mm.openPills[node]){
    // Pills wrap by WIDTH (not 2-per-row): a long capture-instance title can take
    // a whole row while short KB tags pack several. Estimate rows by packing each
    // pill's approximate pixel width into the card's content width.
    const labels = [];
    (n.captureInstances||[]).forEach(o=>labels.push((o.title||'').length + 2));
    (n.goals||[]).forEach(g=>labels.push((g.title||'').length + 2));
    (n.kb||[]).forEach(k=>labels.push((k||'').length + 2));
    if(!labels.length){ h += 24; }
    else {
      const AVAIL = MM_NODEW - 26 - 6;     // content width minus card padding + fudge
      const GAP = 4, ROW_H = 19;           // pill gap + per-row height (incl wrap gap)
      let rowW = 0, rows = 1;
      for(const len of labels){
        const w = len*6 + 22;              // ~6px/char (10px bold) + emoji + padding
        if(rowW > 0 && rowW + GAP + w > AVAIL){ rows++; rowW = w; }
        else rowW += (rowW>0?GAP:0) + w;
      }
      h += rows*ROW_H + 12;                // pills block + its top margin/gap
    }
  }
  return h;
}

// Build the spine tree for the focused component: returns {root, childrenOf, tangentsOf}.
let _treeCache = {};

// Return the DIRECTIONAL buildsOn for a node: the set of nodes that this node
// truly depends on (its parents in the spine tree).
//
// Resolution order, most authoritative first:
//
//   (1) If the IP DB has the "Builds On" inverse property configured (e.g.
//       "Refined By"), we have CANONICAL direction data straight from Notion.
//       A node X builds on Y iff X appears in Y.refinedBy. We compute the
//       reverse-index once (vs._childrenIndex) so this helper is O(children).
//       This is the sustainable path — works for parser-created data, future
//       map-view edits, manual Notion edits, anything.
//
//   (2) If the inverse isn't configured (symmetric self-relation), use raw
//       n.buildsOn directly. This is the same as the old behavior and gives
//       the wrong direction for symmetrically-mirrored data, but at least
//       respects whatever the data says. The UI surfaces a warning in the
//       Visualize tab when this fallback is active.
//
// We deliberately removed the created_time heuristic — it can't tell direction
// when fragments are created in the same second, and breaks silently as data
// ages or is edited.
function buildsOnDir(n){
  if(!n) return [];
  // Path (1): inverse property gives us a reverse-index of children. Use it
  // to derive THIS node's parents: parents(n) = { p | n ∈ children(p) }. The
  // reverse-index is built lazily once per load by ensureDirIndex().
  if(vs.ipSchema && vs.ipSchema.buildsOnInverse){
    ensureDirIndex();
    return vs._parentsIndex[n.id] || [];
  }
  // Path (2): no inverse → raw buildsOn (legacy behavior).
  return (n.buildsOn || []).slice();
}

// Lazily build the reverse-index from the inverse property. For each node Y,
// Y.refinedBy lists nodes that build on Y. Inverting gives, for each node X,
// the set of nodes X builds on (X's parents).
function ensureDirIndex(){
  if(vs._dirIndexBuilt) return;
  vs._parentsIndex = {};
  vs._childrenIndex = {};
  for(const n of vs.nodes){
    const children = n.refinedBy || [];
    vs._childrenIndex[n.id] = children.slice();
    for(const childId of children){
      if(!vs._parentsIndex[childId]) vs._parentsIndex[childId] = [];
      if(!vs._parentsIndex[childId].includes(n.id)) vs._parentsIndex[childId].push(n.id);
    }
  }
  vs._dirIndexBuilt = true;
}

// A thread's root group has no real parent node; key its manual order by the
// component's stable id (its lowest member id) so it survives re-indexing.
function vizRootsKey(comp){ return 'roots:'+comp.nodeIds.reduce((a,b)=>a<b?a:b); }
// Reorder a sibling array by a saved manual order. Listed siblings come first in
// the saved order; any not listed (e.g. fragments added since) keep their default
// (densest-first) order, appended after — so the override never hides a sibling.
function _applyChildOrder(arr, key){
  const ov = vs.childOrder && vs.childOrder[key];
  if(!ov || !ov.length || !arr || arr.length<2) return arr;
  const rank={}; ov.forEach((id,i)=>{ rank[id]=i; });
  const listed = arr.filter(x=>rank[x]!=null).sort((a,b)=>rank[a]-rank[b]);
  const rest   = arr.filter(x=>rank[x]==null);
  return listed.length ? [...listed, ...rest] : arr;
}

function mmBuildTree(comp){
  if(_treeCache[comp.idx]) return _treeCache[comp.idx];
  const sp = vizThreadSpine(comp.idx);
  const spineSet = new Set(sp.spine);
  const childrenOf = {};                 // spine nodeId → [child spine nodeIds]
  sp.spine.forEach(id=>{ childrenOf[id]=[]; });
  // A spine node B is a child of one of its in-spine Builds-On targets. When B
  // builds on targets in DIFFERENT chains (e.g. it bridges chain A and chain B),
  // attach it to the chain where it has the MOST connections (Builds On either
  // direction + Connected). Ties keep it in the chain that holds its existing
  // Builds-On dependents (its "home"), then fall back to spine order — stable, so
  // it stops flip-flopping between chains on re-layout. spine[] is topological, so
  // candidates are always EARLIER nodes (no cyclic parent graph).
  const orderIndex={}; sp.spine.forEach((id,i)=>orderIndex[id]=i);
  const parentOf = {};
  const compIds = comp.nodeIds;
  // Connected pieces of the component with node X removed, linked by Builds On +
  // Connected. Tells us which "side" each of X's neighbours sits on.
  function piecesExcluding(x){
    const par={}; compIds.forEach(i=>{ if(i!==x) par[i]=i; });
    const find=a=>{ while(par[a]!==a) a=par[a]=par[par[a]]; return a; };
    for(const i of compIds){ if(i===x) continue; const ni=vs.byId[i]; if(!ni) continue;
      for(const r of [...buildsOnDir(ni), ...(ni.connected||[])]){
        if(r===x || par[r]==null) continue; const ra=find(i), rb=find(r); if(ra!==rb) par[ra]=rb;
      }
    }
    return find;
  }
  function pickParent(x, cands){
    if(cands.length===1) return cands[0];
    const find=piecesExcluding(x);
    const nx=vs.byId[x];
    const conns=new Set();   // all of X's connections (both Builds-On directions + Connected)
    [...buildsOnDir(nx), ...(nx.connected||[])].forEach(t=>{ if(t!==x && find(t)!=null) conns.add(t); });
    for(const o of sp.spine){ if(o!==x && buildsOnDir(vs.byId[o]).includes(x)) conns.add(o); }
    const cnt={}, childCnt={}, sizeByRoot={};
    compIds.forEach(i=>{ if(i!==x){ const p=find(i); if(p!=null) sizeByRoot[p]=(sizeByRoot[p]||0)+1; } });
    conns.forEach(c=>{ const p=find(c); if(p!=null) cnt[p]=(cnt[p]||0)+1; });
    for(const o of sp.spine){ if(o!==x && buildsOnDir(vs.byId[o]).includes(x)){ const p=find(o); if(p!=null) childCnt[p]=(childCnt[p]||0)+1; } }
    let best=cands[0], bestC=-1, bestCk=-1, bestS=-1, bestO=Infinity;
    for(const c of cands){ const p=find(c); const k=(p!=null?cnt[p]:0)||0, ck=(p!=null?childCnt[p]:0)||0, s=(p!=null?sizeByRoot[p]:0)||0;
      // most connections → then X's own dependents' side → then the larger/more
      // established chain (keeps it "home" on a tie) → then stable spine order.
      if(k>bestC || (k===bestC && ck>bestCk) || (k===bestC && ck===bestCk && s>bestS) || (k===bestC && ck===bestCk && s===bestS && orderIndex[c]<bestO)){ best=c; bestC=k; bestCk=ck; bestS=s; bestO=orderIndex[c]; }
    }
    return best;
  }
  for(const id of sp.spine){
    const n = vs.byId[id];
    const cands = buildsOnDir(n).filter(t=>spineSet.has(t) && orderIndex[t] < orderIndex[id]);
    if(!cands.length) continue;
    const parent = pickParent(id, cands);
    parentOf[id]=parent; childrenOf[parent].push(id);
  }
  // Multi-root handling. A component can contain multiple Core Ideas with no
  // Builds On — typically an "anchor" Core plus other Cores joined only via
  // Connected Fragments. The canonical root is the one with the largest
  // Builds-On subtree (most developed branch = most meaningful entry point).
  // OTHER roots ("secondary roots") are NOT attached as children of the
  // canonical — that would invent a parent-child relationship that doesn't
  // exist in the data. Instead they keep their own subtrees and the layout
  // positions them below the main spine, horizontally aligned to whatever
  // canonical-spine node they're Connected to (their lateral anchor). The
  // actual connecting edge is drawn from the lateral-edge pass.
  function subtreeSize(id, seen=new Set()){
    if(seen.has(id)) return 0;
    seen.add(id);
    let total = 1;
    for(const c of (childrenOf[id]||[])) total += subtreeSize(c, seen);
    return total;
  }
  // Subtree size per spine node (order-independent), then order children and
  // roots by largest Builds-On subtree first (ties → spine/topological order),
  // mirroring the editor's tqLocalTree so the reader, map, and editor agree on
  // the order fragments are walked.
  const sizeOf = {}; sp.spine.forEach(id=>{ sizeOf[id] = subtreeSize(id); });
  const bySize = (a,b)=> (sizeOf[b]-sizeOf[a]) || (orderIndex[a]-orderIndex[b]);
  sp.spine.forEach(id=>{ (childrenOf[id]||[]).sort(bySize); });
  // Manual sibling-chain order (persisted) overrides densest-first under each parent.
  sp.spine.forEach(id=>{ childrenOf[id] = _applyChildOrder(childrenOf[id]||[], id); });
  let roots = sp.spine.filter(id=>parentOf[id]==null);
  roots.sort(bySize);
  // If the user pinned an anchor and it's a root of this thread, make it THE
  // anchor (top) so editing doesn't re-root the thread out from under them.
  const pinIdx = roots.findIndex(r => vs.pinAnchor && vs.pinAnchor[r]);
  if(pinIdx > 0){ const [p] = roots.splice(pinIdx, 1); roots.unshift(p); }
  // Manual order for the root group's chains. The anchor (current top) always
  // stays on top — change the top via the anchor pin, reorder the rest here.
  const anchorRoot = roots.length ? roots[0] : null;
  roots = _applyChildOrder(roots, vizRootsKey(comp));
  if(anchorRoot) roots = [anchorRoot, ...roots.filter(r=>r!==anchorRoot)];
  const root = roots.length ? roots[0] : sp.spine[0];
  const secondaryRoots = roots.slice(1);

  // Compute the canonical reachable set (every node in the canonical subtree)
  // so we can find each secondary root's lateral anchor — the first node in
  // that subtree that the secondary root is Connected to. A secondary root
  // may also reach the spine indirectly through its own descendants, so we
  // walk the secondary's full subtree looking for a Connected partner in the
  // canonical set, not just the secondary's direct connections.
  const canonicalReachable = new Set();
  (function walk(id){
    if(!id || canonicalReachable.has(id)) return;
    canonicalReachable.add(id);
    for(const c of (childrenOf[id]||[])) walk(c);
  })(root);

  const lateralAnchorOf = {};
  for(const sr of secondaryRoots){
    const seen = new Set();
    const stack = [sr];
    let anchor = null;
    while(stack.length && !anchor){
      const id = stack.pop();
      if(seen.has(id)) continue;
      seen.add(id);
      const n = vs.byId[id];
      if(!n) continue;
      for(const t of (n.connected||[])){
        if(canonicalReachable.has(t)){ anchor = t; break; }
      }
      if(!anchor) for(const c of (childrenOf[id]||[])) stack.push(c);
    }
    if(anchor) lateralAnchorOf[sr] = anchor;
  }

  // displayOrder = DFS pre-order across roots (canonical first): walk each
  // anchor's entire Builds-On subtree before moving to the next root. This is
  // the linear "reads like a book" order the editor lays fragments out in, and
  // the order the reader propagates them.
  const displayOrder=[]; const placedD=new Set();
  const dfsOrder = node=>{ if(node==null||placedD.has(node)) return; placedD.add(node); displayOrder.push(node); for(const c of (childrenOf[node]||[])) dfsOrder(c); };
  for(const r of roots) dfsOrder(r);
  sp.spine.forEach(id=>{ if(!placedD.has(id)){ placedD.add(id); displayOrder.push(id); } });

  // Ancestor set per spine node (via the chosen primary parent chain). Two nodes
  // are "on the same chain" when one is an ancestor of the other.
  const ancestorsOf={};
  for(const id of sp.spine){ const set=new Set(); let p=parentOf[id]; let guard=0;
    while(p!=null && !set.has(p) && guard++<10000){ set.add(p); p=parentOf[p]; } ancestorsOf[id]=set; }
  const onSameChain=(a,b)=> a===b || (ancestorsOf[a]&&ancestorsOf[a].has(b)) || (ancestorsOf[b]&&ancestorsOf[b].has(a));
  // Cross-branch extra Builds-On edges: a node's NON-primary Builds-On parents
  // get a drawn edge ONLY when they're on a different branch (not already an
  // ancestor/descendant). Same-chain ones stay omitted — the chain already shows
  // the relationship, so an extra edge would be redundant.
  const extraBuilds=[];
  for(const id of sp.spine){ const n=vs.byId[id]; if(!n) continue;
    for(const y of buildsOnDir(n)){
      if(!spineSet.has(y) || y===parentOf[id]) continue;
      if(onSameChain(id,y)) continue;
      extraBuilds.push({parent:y, child:id});
    }
  }

  const result = {root, childrenOf, parentOf, tangentsOf:sp.tangentsOf, spine:sp.spine, orphans:sp.orphans, secondaryRoots, lateralAnchorOf, displayOrder, ancestorsOf, extraBuilds};
  _treeCache[comp.idx] = result;
  return result;
}

// Lay out one thread's tree starting at (x0,y0). Builds-On children branch to
// the RIGHT (spine). Each Core Idea's connected RC/RCQ/OL tangents branch BELOW
// it as their own cards (new tree nodes) when its tangent-toggle is open; tangents
// recurse through their own connected tangents. Cycle-safe and O(n). Returns
// {nodes, edges, carets, ttoggles, w, h} in absolute coords.
// Lateral/cross-branch edge routing. Decides how a Connected (or cross-branch
// Builds-On) edge curves between two cards so it maneuvers AROUND any cards in
// between rather than cutting through them. Pulled out to module scope so it can
// be re-run after a node is dragged/locked into a new spot (with the final
// position map) — that's how a moved fragment's edges re-route by the original
// rules. `pos` is the map of every placed card {id→{x,y,w,h}}.
function _mmLateralRoute(a, b, pos){
  const aL=a.x, aR=a.x+a.w, aT=a.y, aB=a.y+a.h;
  const bL=b.x, bR=b.x+b.w, bT=b.y, bB=b.y+b.h;
  const aCy=(aT+aB)/2, bCy=(bT+bB)/2;
  const overlapX = aR > bL && bR > aL;
  if(overlapX){
    const colL = Math.max(aL, bL), colR = Math.min(aR, bR);
    const upperB = Math.min(aB, bB), lowerT = Math.max(aT, bT);
    let between = false;
    for(const oid in pos){
      const c = pos[oid];
      if(!c || c === a || c === b) continue;
      if(c.x + c.w <= colL || c.x >= colR) continue;       // not in shared column
      if(c.y + c.h <= upperB || c.y >= lowerT) continue;   // not in between zone
      between = true; break;
    }
    if(between){
      const bowX = Math.max(aR, bR) + MM_HGAP * 0.4;
      return {ax:aR, ay:aCy, bx:bR, by:bCy, dir:'around-right', bowX};
    }
    const xMid = (colL + colR) / 2;
    if(aB <= bT) return {ax:xMid, ay:aB, bx:xMid, by:bT, dir:'vertical'};
    return                {ax:xMid, ay:aT, bx:xMid, by:bB, dir:'vertical'};
  }
  const leftIsA = aR <= bL;
  const Lc = leftIsA ? a : b, Rc = leftIsA ? b : a;
  const lx = Lc.x + Lc.w, ly = (Lc.y*2 + Lc.h)/2;
  const rx = Rc.x,         ry = (Rc.y*2 + Rc.h)/2;
  const yLo = Math.min(ly, ry), yHi = Math.max(ly, ry);
  let topMost = Infinity, botMost = -Infinity, obsL = Infinity, obsR = -Infinity, blocked = false;
  for(const oid in pos){
    const c = pos[oid];
    if(!c || c === a || c === b) continue;
    if(c.x + c.w <= lx + 1 || c.x >= rx - 1) continue;      // not horizontally between
    if(c.y + c.h <= yLo - 6 || c.y >= yHi + 6) continue;    // not within the y band
    blocked = true;
    topMost = Math.min(topMost, c.y); botMost = Math.max(botMost, c.y + c.h);
    obsL = Math.min(obsL, c.x);       obsR = Math.max(obsR, c.x + c.w);
  }
  if(!blocked) return {ax:lx, ay:ly, bx:rx, by:ry, dir:'horizontal'};
  const overY = topMost - MM_VGAP, underY = botMost + MM_VGAP, nat = (ly + ry)/2;
  const midY = (Math.abs(overY - nat) <= Math.abs(underY - nat)) ? overY : underY;
  return {ax:lx, ay:ly, bx:rx, by:ry, dir:'detour', midY, obsL, obsR};
}

function mmLayout(comp, x0, y0){
  const tree = mmBuildTree(comp);
  // Secondary roots that join the tree via a Connected edge to a node in the
  // canonical subtree get placed to the RIGHT of that anchor (like a child),
  // not dumped below. Group them by anchor so place() can lay them out in line.
  const lateralKids = {};
  for(const sr of (tree.secondaryRoots||[])){
    const anchor = (tree.lateralAnchorOf||{})[sr];
    if(anchor!=null){ (lateralKids[anchor] = lateralKids[anchor] || []).push(sr); }
  }
  const mm = vs.mm;
  const inComp = new Set(comp.nodeIds);
  const placed=[], edges=[], carets=[], ttoggles=[];
  const pos={};                       // nodeId → placed entry (O(1) lookup, no .find)
  const visited=new Set();            // global guard: every node placed at most once
  let yCursor = y0;

  // A fragment's connected tangents within this component — computed ONCE per node.
  const _tcCache={};
  function tangentChildren(nodeId){
    if(_tcCache[nodeId]) return _tcCache[nodeId];
    const n=vs.byId[nodeId];
    if(!n){ _tcCache[nodeId]=[]; return []; }
    const out=new Set();
    [...(n.buildsOn||[]), ...(n.connected||[])].forEach(t=>{ if(inComp.has(t)) out.add(t); });
    comp.nodeIds.forEach(mid=>{ const m=vs.byId[mid]; if(m && [...(m.buildsOn||[]),...(m.connected||[])].includes(nodeId)) out.add(mid); });
    out.delete(nodeId);
    const r=[...out].filter(id=>vs.byId[id] && !isSpineType(vs.byId[id].type));
    _tcCache[nodeId]=r; return r;
  }
  const mid2 = arr => arr.length ? (Math.min(...arr)+Math.max(...arr))/2 : 0;

  // Place a tangent fragment (and, if open, its not-yet-placed sub-tangents).
  // xBase lets a separate subtree start at a column other than x0 (used when
  // laying out secondary roots aligned to their lateral anchor's column).
  function placeTangent(nodeId, depth, xBase){
    if(xBase == null) xBase = x0;
    if(visited.has(nodeId)) return pos[nodeId] ? pos[nodeId].y + pos[nodeId].h/2 : yCursor;
    visited.add(nodeId);
    const x = xBase + depth*(MM_NODEW+MM_HGAP);
    const h = mmEstHeight(nodeId);
    const allChildren = tangentChildren(nodeId);
    const tOpen = mm.openTangents[nodeId] !== false;   // connected branches open by default
    const subs = tOpen ? allChildren.filter(id=>!visited.has(id)) : [];
    // Remember where this subtree begins so the node's own box can never start
    // above it (which would overlap the previously-placed sibling).
    const subtreeTop = yCursor;
    const childCenters=[];
    for(const sid of subs){ if(!visited.has(sid)) childCenters.push(placeTangent(sid, depth+1, xBase)); }
    let cy;
    if(childCenters.length){
      cy = mid2(childCenters);
      // If centering on the children would push this node's top above where the
      // subtree started, drop it down so its top aligns with subtreeTop.
      if(cy - h/2 < subtreeTop) cy = subtreeTop + h/2;
    } else {
      cy = yCursor + h/2;
    }
    const entry={id:nodeId, kind:'tangent', x, y:cy-h/2, w:MM_NODEW, h, depth};
    placed.push(entry); pos[nodeId]=entry;
    // Reserve the node's full height plus, if it shows a connected-fragments
    // toggle below it, the toggle's clearance — otherwise the next node in this
    // column overlaps that toggle.
    const toggleClear = allChildren.length ? TTOGGLE_CLEARANCE : 0;
    yCursor = Math.max(yCursor, cy + h/2 + toggleClear + MM_VGAP);
    const x2=x+MM_NODEW;
    for(const sid of subs){ const c=pos[sid]; if(c) edges.push({x1:x2,y1:cy,x2:c.x,y2:c.y+c.h/2,kind:'tangent',from:nodeId,to:sid}); }
    if(allChildren.length){ ttoggles.push({x:x2+6, y:cy, nodeId, open:tOpen, count:allChildren.length}); }
    return cy;
  }

  // Place a spine Core Idea: Builds-On children to the right, tangents below.
  // xBase parameterizes the leftmost column (depth 0) so secondary roots can
  // be laid out below the canonical spine, aligned to their lateral anchor.
  function place(nodeId, depth, xBase){
    if(xBase == null) xBase = x0;
    if(visited.has(nodeId)) return pos[nodeId] ? pos[nodeId].y + pos[nodeId].h/2 : yCursor;
    visited.add(nodeId);
    const x = xBase + depth*(MM_NODEW+MM_HGAP);
    const h = mmEstHeight(nodeId);
    const collapsed = !!mm.collapsedSpine[nodeId];
    const spineChildren = (collapsed ? [] : (tree.childrenOf[nodeId]||[])).filter(id=>!visited.has(id));
    const tangents = tree.tangentsOf[nodeId]||[];
    const tOpen = mm.openTangents[nodeId] !== false;   // connected branches open by default

    const subtreeTop = yCursor;
    const childCenters=[];
    for(const cid of spineChildren){ if(!visited.has(cid)) childCenters.push(place(cid, depth+1, xBase)); }
    const tangentCenters=[];
    if(tOpen){ for(const tid of tangents){ if(!visited.has(tid)) tangentCenters.push(placeTangent(tid, depth+1, xBase)); } }
    // Secondary roots Connected to this node: lay them out to the right, like a
    // child, so the Connected relation reads as a rightward branch (matching how
    // a Builds-On child branches) instead of floating below in this column.
    const lateralKidCenters=[];
    for(const lk of (lateralKids[nodeId]||[])){ if(!visited.has(lk)) lateralKidCenters.push(place(lk, depth+1, xBase)); }

    let cy;
    const allC=[...childCenters, ...tangentCenters, ...lateralKidCenters];
    if(allC.length){
      cy = mid2(allC);
      if(cy - h/2 < subtreeTop) cy = subtreeTop + h/2;
    } else {
      cy = yCursor + h/2;
    }
    const entry={id:nodeId, kind:'spine', x, y:cy-h/2, w:MM_NODEW, h, depth};
    placed.push(entry); pos[nodeId]=entry;
    // Reserve this node's own height (plus toggle clearance when a tangent toggle
    // shows below it) so a sibling below can't overlap it or its toggle.
    const toggleClear = tangents.length ? TTOGGLE_CLEARANCE : 0;
    yCursor = Math.max(yCursor, cy + h/2 + toggleClear + MM_VGAP);

    const x2=x+MM_NODEW;
    // Spine children are real Builds-On dependents (secondary roots are no
    // longer mixed in here — they're laid out separately).
    for(const cid of spineChildren){
      const c=pos[cid];
      if(c && c.kind==='spine') edges.push({x1:x2,y1:cy,x2:c.x,y2:c.y+c.h/2,kind:'spine',from:nodeId,to:cid});
    }
    if(tOpen){ for(const tid of tangents){ const c=pos[tid]; if(c) edges.push({x1:x2,y1:cy,x2:c.x,y2:c.y+c.h/2,kind:'tangent',from:nodeId,to:tid}); } }
    // Connected edge from this node to each secondary root branching off it.
    for(const lk of (lateralKids[nodeId]||[])){ const c=pos[lk]; if(c) edges.push({x1:x2,y1:cy,x2:c.x,y2:c.y+c.h/2,kind:'tangent',from:nodeId,to:lk}); }
    if(tangents.length){ ttoggles.push({x:x2+6, y:cy, nodeId, open:tOpen, count:tangents.length}); }
    return cy;
  }

  if(tree.root) place(tree.root, 0);

  // Secondary roots: separate Cores with no Builds-On into the canonical tree
  // but in the same component (joined via Connected Fragments). Lay each one
  // out as its own subtree BELOW the canonical spine, with its leftmost column
  // aligned to its lateral anchor's column so the Connected edge that joins
  // it to the spine is geometrically natural.
  for(const sr of (tree.secondaryRoots || [])){
    if(visited.has(sr)) continue;
    const anchor = (tree.lateralAnchorOf||{})[sr];
    const anchorX = (anchor && pos[anchor]) ? pos[anchor].x : x0;
    yCursor += MM_VGAP * 2;     // visual separation between main spine and secondary
    place(sr, 0, anchorX);
  }

  // any spine nodes not reached from root (defensive), then orphans
  for(const sid of (tree.spine||[])){ if(!visited.has(sid)) place(sid, 0); }
  for(const oid of (tree.orphans||[])){
    if(visited.has(oid)) continue;
    visited.add(oid);
    const h=mmEstHeight(oid);
    const entry={id:oid, kind:'tangent', x:x0, y:yCursor, w:MM_NODEW, h, depth:0};
    placed.push(entry); pos[oid]=entry;
    yCursor += h+MM_VGAP;
  }

  // Lateral edges (Connected Fragments between Cores in this component).
  // Tangent attachments — non-Core → Core via Connected Fragments — are
  // already drawn as tangent branches below their Core, so we only emit a
  // lateral edge when BOTH endpoints are Core Ideas. Each undirected pair is
  // emitted once.
  //
  // Anchor selection by relative geometry:
  //   • Same/overlapping x-range AND nothing between → simple vertical curve.
  //   • Same/overlapping x-range WITH other cards between → route AROUND the
  //     column using both right-edge anchors and a control bow that sits in
  //     the column gap to the right. Column gaps are empty by construction,
  //     so the curve cannot cross any card body.
  //   • Disjoint x-ranges → horizontal curve through the midline; that midline
  //     is in the column gap between the two cards, so it also can't cross a
  //     card body.
  //
  // Each edge stores the anchors, a routing tag, and (for around-right) the
  // bow x-coordinate so the renderer can produce the matching cubic Bezier.
  // Lateral routing now lives at module scope (_mmLateralRoute) so it can be
  // re-run for dragged/locked nodes with the final positions.
  const pickLateralRoute = (a, b) => _mmLateralRoute(a, b, pos);
  const inCompSet = new Set(comp.nodeIds);
  const seenPair = new Set();
  const _anc = tree.ancestorsOf || {};
  const _spineSet = new Set(tree.spine);
  const onSameChain=(a,b)=> a===b || (_anc[a]&&_anc[a].has(b)) || (_anc[b]&&_anc[b].has(a));
  for(const id of comp.nodeIds){
    const n = vs.byId[id];
    if(!n || !_spineSet.has(id)) continue;            // any spine node, not just Core Ideas
    for(const t of (n.connected||[])){
      if(!inCompSet.has(t)) continue;
      const tn = vs.byId[t];
      if(!tn || !_spineSet.has(t)) continue;          // (non-spine connecteds draw as tangent branches)
      if(onSameChain(id, t)) continue;        // already linked along a chain → no extra edge
      const key = id < t ? id+'|'+t : t+'|'+id;
      if(seenPair.has(key)) continue;
      seenPair.add(key);
      const pA = pos[id], pB = pos[t];
      if(!pA || !pB) continue;
      const r = pickLateralRoute(pA, pB);
      const e = { kind:'lateral', x1:r.ax, y1:r.ay, x2:r.bx, y2:r.by, routing:r.dir, from:id, to:t };
      if(r.bowX != null) e.bowX = r.bowX;
      if(r.midY != null) e.midY = r.midY;
      if(r.obsL != null){ e.obsL = r.obsL; e.obsR = r.obsR; }
      edges.push(e);
    }
  }
  // Cross-branch extra Builds-On edges (a node's non-primary parents that sit on
  // a different branch). Routed like lateral edges so they curve around cards,
  // but styled as Builds-On so the relationship reads correctly.
  for(const eb of (tree.extraBuilds||[])){
    const pA = pos[eb.parent], pB = pos[eb.child];
    if(!pA || !pB) continue;
    const r = pickLateralRoute(pA, pB);
    const e = { kind:'lateral', cls:'mm-edge mm-edge-xbuild', x1:r.ax, y1:r.ay, x2:r.bx, y2:r.by, routing:r.dir, from:eb.parent, to:eb.child };
    if(r.bowX != null) e.bowX = r.bowX;
    if(r.midY != null) e.midY = r.midY;
    if(r.obsL != null){ e.obsL = r.obsL; e.obsR = r.obsR; }
    edges.push(e);
  }

  let maxX=x0, maxY=y0;
  placed.forEach(p=>{ maxX=Math.max(maxX,p.x+p.w); maxY=Math.max(maxY,p.y+p.h); });
  // Lateral edges now anchor on card edges and route through gaps, so they
  // never extend beyond the placed nodes' bounding box — no extra height needed.
  return {nodes:placed, edges, carets, ttoggles, w:maxX, h:Math.max(maxY, yCursor)};
}

// Seed sensible defaults the first time the filtered set is shown.
function mmInitForComp(){
  vs.mm.collapsedSpine={}; vs.mm.openPills={}; vs.mm.openTangents={};
  vs.mm.measuredH={};
  vs.mm.pan={x:0,y:0}; vs.mm.zoom=1; vs.mm.inited=true;
}

function renderVizMap(filtered){
  if(!filtered.length) return `<div class="reader-empty">No threads match these filters.</div>`;
  if(!vs.mm.inited) mmInitForComp();

  // Lay out every filtered thread as its own tree, stacked vertically on one canvas.
  // Cap the number rendered at once so an unfiltered "all threads" view can't
  // build thousands of DOM nodes and freeze the page.
  const MM_MAX_THREADS = 40;
  const capped = filtered.length > MM_MAX_THREADS;
  const toRender = capped ? filtered.slice(0, MM_MAX_THREADS) : filtered;
  const z = vs.mm.zoom, px=vs.mm.pan.x, py=vs.mm.pan.y;
  const THREAD_GAP = 60;
  let yOff = 30, sceneW = 0;
  let edgesSvgInner = '', cards = '', controls = '', labels = '';
  toRender.forEach((comp, ti)=>{
    const collapsed = !!vs.mm.collapsedThreads[comp.idx];
    const lbl = vizThreadLabel(comp);
    // Thread separator row. The collapse toggle always shows (it's how you flip
    // the state). When EXPANDED, the separator is just the dotted line — the
    // anchor-fragment text is omitted (it's already the first node of the tree
    // below). When COLLAPSED, the tree is hidden, so the anchor-fragment text
    // stands in for it and the dotted line is omitted.
    const dividerY = yOff - 14;
    labels += `<div class="mm-thread-toggle" style="left:6px;top:${dividerY-14}px" onclick="event.stopPropagation();vizMmToggleThread(${comp.idx})" title="${collapsed?'expand thread':'collapse thread'}">${collapsed?'+':'−'}</div>`;
    if(collapsed){
      const renamingThis = vs.rename && vs.rename.compIdx===comp.idx;
      const moveArrows = `<span class="mm-thread-move" onpointerdown="event.stopPropagation()">`
        + `<button class="mm-thread-move-btn" ${ti>0?'':'disabled'} onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();vizMoveThread(event,${comp.idx},-1)" title="Move thread up">▲</button>`
        + `<button class="mm-thread-move-btn" ${ti<toRender.length-1?'':'disabled'} onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();vizMoveThread(event,${comp.idx},1)" title="Move thread down">▼</button>`
        + `</span>`;
      const vetMark = vizThreadVetted(comp) ? `<span class="mm-vetted" title="Vetted">✓</span> ` : '';
      labels += renamingThis
        ? `<div class="mm-thread-label" style="left:42px;top:${dividerY-7}px">${moveArrows} ${vizRenameEditorHtml()}</div>`
        : `<div class="mm-thread-label" style="left:42px;top:${dividerY-7}px">${moveArrows} ${vetMark}${esc(lbl)} · <span style="font-weight:500">${comp.total} fragment${comp.total!==1?'s':''}</span> · <span style="font-style:italic">collapsed</span> ${vizRenameTriggerHtml(comp.idx)}</div>`;
      // Reserve just enough height for the toggle + label row; render no tree.
      sceneW = Math.max(sceneW, 260);
      yOff = yOff + 24 + THREAD_GAP;
      return;
    }
    // Expanded: dotted divider only (skip on the first thread so the canvas top
    // isn't a stray line).
    if(ti>0){
      labels += `<div class="mm-thread-divider" style="left:6px;top:${dividerY}px;width:${Math.max(sceneW, 260)+28}px"></div>`;
    }

    const L = mmLayout(comp, 36, yOff);
    const treeC = mmBuildTree(comp);   // for sibling-chain reorder controls (parentOf / groups)
    // Manual position overrides (free-form drag). A node the user dragged carries
    // its own offset; its revealed connected branch (tangent descendants) inherits
    // that same offset so the branch travels WITH the node instead of staying at
    // the old computed spot and overlapping things. Incident edges re-route to
    // stay attached.
    if(vs.nodePos){
      const byId={}; L.nodes.forEach(p=>byId[p.id]=p);
      // own offsets (and accepted flag)
      const eff={};
      L.nodes.forEach(p=>{ const o=vs.nodePos[p.id]; if(o){ eff[p.id]={dx:o.dx,dy:o.dy}; p._ownMove=true; p._ok=!!o.ok; } });
      // build tangent-child map from edges, then propagate each own offset down it
      const tkids={};
      for(const e of L.edges){ if(e.kind==='tangent' && e.from!=null && e.to!=null){ (tkids[e.from]=tkids[e.from]||[]).push(e.to); } }
      const propagate=(root, delta, guard)=>{ if(guard>5000) return; for(const c of (tkids[root]||[])){ if(eff[c]==null){ eff[c]=delta; propagate(c, delta, guard+1); } } };
      Object.keys(eff).forEach(id=>{ if(byId[id] && byId[id]._ownMove) propagate(id, eff[id], 0); });
      let moved=false;
      L.nodes.forEach(p=>{ const o=eff[p.id]; if(o){ p.x+=o.dx; p.y+=o.dy; p._moved=true; moved=true; L.w=Math.max(L.w,p.x+p.w); L.h=Math.max(L.h,p.y+p.h); } });
      if(moved){
        // Final positions of every card after the manual offsets — the routing
        // rules need the whole map to maneuver around.
        const posFinal={}; L.nodes.forEach(p=>{ posFinal[p.id]=p; });
        for(const e of L.edges){
          const a=byId[e.from], b=byId[e.to];
          if(!(a && b && (a._moved||b._moved))) continue;
          // Re-run the obstacle-avoiding routing at the final positions for EVERY
          // edge touching a moved card — Builds-On (spine) and connected-branch
          // (tangent) edges included, not just lateral ones — so a locked
          // fragment's edges maneuver AROUND other cards instead of cutting
          // straight through them.
          const r=_mmLateralRoute(a, b, posFinal);
          e.x1=r.ax; e.y1=r.ay; e.x2=r.bx; e.y2=r.by; e.routing=r.dir;
          e.bowX = (r.bowX!=null) ? r.bowX : undefined;
          e.midY = (r.midY!=null) ? r.midY : undefined;
          if(r.obsL!=null){ e.obsL=r.obsL; e.obsR=r.obsR; } else { e.obsL=undefined; e.obsR=undefined; }
          e._reroute = true;   // render via the routing tags regardless of kind (keeps its arrowhead/style)
        }
      }
    }
    // edges
    for(const e of L.edges){
      let pathD;
      if(e._moved){
        // An endpoint was manually repositioned — draw a simple curve between the
        // facing sides chosen in _edgeAnchors (precise routing no longer applies).
        if(Math.abs(e.x2-e.x1) >= Math.abs(e.y2-e.y1)){ const mx=(e.x1+e.x2)/2; pathD=`M ${e.x1} ${e.y1} C ${mx} ${e.y1}, ${mx} ${e.y2}, ${e.x2} ${e.y2}`; }
        else { const my=(e.y1+e.y2)/2; pathD=`M ${e.x1} ${e.y1} C ${e.x1} ${my}, ${e.x2} ${my}, ${e.x2} ${e.y2}`; }
      } else if(e.kind === 'lateral' || e._reroute){
        // Anchor selection was done in mmLayout (or re-run for a moved card);
        // here we just pick the appropriate cubic Bezier control points for the
        // chosen routing.
        if(e.routing === 'vertical'){
          // Same/overlapping column with nothing between: a vertical S with
          // a small rightward side bow so it reads as a curve rather than
          // a tree-edge straight line.
          const sideBow = 16;
          const dy = e.y2 - e.y1;
          pathD = `M ${e.x1} ${e.y1} C ${e.x1+sideBow} ${e.y1 + dy*0.35}, ${e.x2+sideBow} ${e.y2 - dy*0.35}, ${e.x2} ${e.y2}`;
        } else if(e.routing === 'around-right'){
          // Same column with cards between: anchors on the right edge of
          // both cards, control points bowed into the right-side column gap,
          // producing a clean parenthesis-shaped curve that loops around
          // the cards in between.
          const bowX = e.bowX;
          pathD = `M ${e.x1} ${e.y1} C ${bowX} ${e.y1}, ${bowX} ${e.y2}, ${e.x2} ${e.y2}`;
        } else if(e.routing === 'detour'){
          // Disjoint columns WITH cards between them. A single curve sags toward
          // a far endpoint and dips back into the cards, so instead route a real
          // FLAT segment at the clear Y across the obstacle span (a straight line
          // can't sag), with smooth S-corners rising into and falling out of it.
          const clearY = e.midY;
          const oL = Math.max(e.obsL != null ? e.obsL : (e.x1+e.x2)/2, e.x1 + 4);
          const oR = Math.min(e.obsR != null ? e.obsR : (e.x1+e.x2)/2, e.x2 - 4);
          if(oR <= oL){
            const midX = (e.x1 + e.x2) / 2;
            pathD = `M ${e.x1} ${e.y1} C ${midX} ${clearY}, ${midX} ${clearY}, ${e.x2} ${e.y2}`;
          } else {
            const rc = (e.x1 + oL) / 2, fc = (oR + e.x2) / 2;
            pathD = `M ${e.x1} ${e.y1} C ${rc} ${e.y1}, ${rc} ${clearY}, ${oL} ${clearY}`
                  + ` L ${oR} ${clearY}`
                  + ` C ${fc} ${clearY}, ${fc} ${e.y2}, ${e.x2} ${e.y2}`;
          }
        } else {
          // Horizontal routing: control points sit on the midline x between
          // the two cards. That midline falls inside the column gap (cards
          // don't occupy column gaps), so the curve cannot pass through any
          // card body.
          const midX = (e.x1 + e.x2) / 2;
          pathD = `M ${e.x1} ${e.y1} C ${midX} ${e.y1}, ${midX} ${e.y2}, ${e.x2} ${e.y2}`;
        }
      } else {
        const midx = (e.x1+e.x2)/2;
        pathD = `M ${e.x1} ${e.y1} C ${midx} ${e.y1}, ${midx} ${e.y2}, ${e.x2} ${e.y2}`;
      }
      const cls = e.cls || (e.kind && e.kind!=='spine' ? `mm-edge ${e.kind}` : 'mm-edge');
      // Builds-On edges (spine + cross-branch) carry an arrowhead pointing AT the
      // dependent fragment (the one that builds on the source). Connected edges don't.
      const isBuilds = e.kind==='spine' || (e.cls && e.cls.indexOf('mm-edge-xbuild')>=0);
      const marker = isBuilds ? ' marker-end="url(#mm-arrow)"' : '';
      edgesSvgInner += `<path class="${cls}" d="${pathD}"${marker}/>`;
    }
    // node cards — two toggles below the node: pills (in-card) and fragments (branches)
    for(const p of L.nodes){
      const n=vs.byId[p.id]; if(!n) continue;
      const col = typeColor(n.type);
      const pillsOpen = !!vs.mm.openPills[p.id];
      let pillsHtml='';
      if(pillsOpen){
        const pills=[];
        (n.captureInstances||[]).forEach(o=>pills.push(`<span class="mm-pill">${esc(REL_EMOJI[o.system]||'')} ${esc(o.title)}</span>`));
        (n.goals||[]).forEach(g=>pills.push(`<span class="mm-pill">${esc(REL_EMOJI[g.system]||'🎯')} ${esc(g.title)}</span>`));
        (n.kb||[]).forEach(k=>pills.push(`<span class="mm-pill">${esc(REL_EMOJI['Knowledge Bank'])} ${esc(k)}</span>`));
        pillsHtml = pills.length ? `<div class="mm-node-rels">${pills.join('')}</div>` : `<div class="mm-node-rels"><span class="mm-pill" style="opacity:.6">no relations</span></div>`;
      }
      const hasPills = (n.captureInstances&&n.captureInstances.length)||(n.goals&&n.goals.length)||(n.kb&&n.kb.length);
      // only Core Ideas carry a "fragments" toggle on the spine; tangents get theirs via L.ttoggles
      const isSpine = p.kind==='spine';
      const matched = vizNodeHighlighted(n);
      const borderCss = matched ? `2.5px solid var(--danger)` : `1.5px solid ${col}`;
      const pending = p._ownMove && !p._ok;       // user-dragged, not yet accepted
      // Sibling-chain reorder controls: shown on a spine node that sits in a
      // group of ≥2 reorderable siblings (children of a common parent, or the
      // thread's secondary roots — the anchor stays pinned on top).
      let reorderHtml='';
      if(p.kind==='spine'){
        const parent = treeC.parentOf[p.id];
        const group = (parent!=null) ? (treeC.childrenOf[parent]||[]) : (treeC.secondaryRoots||[]);
        const gi = group.indexOf(p.id);
        if(group.length>=2 && gi>=0){
          reorderHtml = `<span class="mm-reorder" onpointerdown="event.stopPropagation()">
            <button class="mm-reorder-btn" ${gi>0?'':'disabled'} onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();vizMoveChain(event,'${p.id}',-1)" title="Move this chain up">▲</button>
            <button class="mm-reorder-btn" ${gi<group.length-1?'':'disabled'} onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();vizMoveChain(event,'${p.id}',1)" title="Move this chain down">▼</button>
          </span>`;
        }
      }
      cards += `<div data-ftype="${typeCssClass(n.type)}" class="mm-node ${n.resolved?'is-resolved':''}${matched?' mm-node-match':''}${pending?' mm-node-moved':''}" data-mmid="${p.id}" data-node="${p.id}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;background:${col}33;border:${borderCss}" onpointerdown="vizNodeDragStart(event,'${p.id}')" onclick="vizMmNodeClick(event,'${p.id}')">
        ${pending?`<span class="mm-node-accept" onpointerdown="event.stopPropagation()" onclick="vizAcceptNodePos(event,'${p.id}')" title="Keep this as its position">✓</span><span class="mm-node-reset" onpointerdown="event.stopPropagation()" onclick="vizResetNodePos(event,'${p.id}')" title="Reset to auto position">⤺</span>`:''}
        <div class="mm-node-title">${esc(n.title)}</div>
        ${(n.images||[]).length?`<div class="mm-node-img" onclick="event.stopPropagation();vizLightbox('${p.id}',0)"><img src="${esc(vizImgSrc(n,0))}" data-img-frag="${p.id}" data-img-i="0" alt="" loading="lazy" onerror="vizImgErr(this)">${n.images.length>1?`<span class="mm-img-more">+${n.images.length-1}</span>`:''}</div>`:''}
        <div class="mm-node-bottom">
          <span class="mm-toggle ${pillsOpen?'on':''}" onclick="event.stopPropagation();vizMmTogglePills('${p.id}')" title="Knowledge Bank / capture / goals">${pillsOpen?'▾':'▸'} pills${hasPills?'':' ·'}</span>
          ${(n.cross||[]).length?`<span class="mm-toggle mm-cross" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();vizCrossMenu(event,'${p.id}')" title="Linked fragments in other threads">⇄ ${(n.cross||[]).length}</span>`:''}
          ${reorderHtml}
        </div>
        ${pillsHtml}
      </div>`;
    }
    // tangent toggles — below the node, opening connected fragments as downward branches
    for(const t of L.ttoggles){
      const node=L.nodes.find(p=>p.id===t.nodeId);
      const ty = node ? (node.y+node.h-2) : t.y;       // just below the node card
      const tx = node ? (node.x+18) : t.x;
      controls += `<div class="mm-ttoggle ${t.open?'on':''}" style="left:${tx}px;top:${ty}px" onclick="event.stopPropagation();vizMmToggleTangents('${t.nodeId}')" title="connected fragments">${t.open?'−':'+'} ${t.count}↳</div>`;
    }
    sceneW = Math.max(sceneW, L.w);
    yOff = L.h + THREAD_GAP;
  });
  const sceneH = yOff;
  const edgesSvg = `<svg class="mm-edges" width="${Math.round(sceneW+40)}" height="${Math.round(sceneH)}"><defs><marker id="mm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>${edgesSvgInner}</svg>`;

  const legendHtml = `<div class="mm-legend">${FRAGMENT_TYPES.map(t=>`<span class="lg" data-ftype="${typeCssClass(t)}"><span class="dot" style="background:${TYPE_COLORS[t]}"></span>${esc(t)}</span>`).join('')}</div>`;
  const topbar = `<div class="mm-topbar">${legendHtml}<span class="mm-count">${capped?`showing ${MM_MAX_THREADS} of ${filtered.length} — narrow the filter`:`${filtered.length} thread${filtered.length!==1?'s':''}`}</span></div>`;

  let pickBanner='';
  if(vs.linkPick){
    const f=vs.byId[vs.linkPick.fromId];
    const xt=esc(tqShort((f&&f.title)||'',36));
    const rel = vs.linkPick.connKind==='builds-rev' ? `builds on “${xt}”`
              : vs.linkPick.connKind==='connected'  ? `connects with “${xt}”`
              : vs.linkPick.connKind==='cross'      ? `cross-links (in another thread) with “${xt}”`
              : `“${xt}” builds on`;
    pickBanner = `<div class="mm-pickbar">🔗 Tap the fragment that <b>${rel}</b><button class="mm-pick-cancel" onclick="vizLinkPickCancel()">Cancel</button></div>`;
  }
  // Edit controls on the map: undo/redo + draft toggle (mirrors the reader editor).
  const mmDraftOn = _draftOn();
  const mmHasPos = Object.keys(vs.nodePos||{}).length>0;
  const mmEditBar = `<div class="mm-editbar">
    <button class="mm-eb-btn" ${_undo.length?'':'disabled'} onclick="vizUndo()" title="Undo">↶</button>
    <button class="mm-eb-btn" ${_redo.length?'':'disabled'} onclick="vizRedo()" title="Redo">↷</button>
    <button class="mm-eb-btn ${mmDraftOn?'on':''}" onclick="vizDraftToggle()" title="Draft mode — stage connection edits and Commit/Discard as a batch">✎</button>
    ${mmHasPos ? `<button class="mm-eb-btn" onclick="vizResetAllPositions()" title="Return every moved fragment to its auto-layout (propagation-rule) position — undoable">⟲ Auto</button>` : ''}
  </div>`;
  let mmDraftBar='';
  if(mmDraftOn){
    const d=vs.draft, n=_draftCount();
    mmDraftBar = `<div class="mm-draftbar">
      <span class="draft-tag">✎ Draft</span>
      <span style="color:var(--dim)">${n?`${n} changed · unsaved`:'edits stage here'}</span>
      <button class="fe-btn" ${d.busy?'disabled':''} onclick="vizDraftDiscard()">Discard</button>
      <button class="fe-btn primary" ${(!n||d.busy)?'disabled':''} onclick="vizDraftCommit()">${d.busy?'Committing…':`Commit${n?' '+n:''}`}</button>
      ${!n?`<button class="fe-btn" onclick="vizDraftToggle()">Exit</button>`:''}
    </div>`;
  }
  return `<div class="mm-wrap ${vs.mm.full?'mm-full':''} ${(vs.mm.full && vs.reader && !vs.linkPick)?'with-reader-over':''}">
    ${pickBanner}
    ${mmEditBar}
    ${mmDraftBar}
    <div class="mm-canvas" id="mm-canvas" onmousedown="vizMmDragStart(event)" onwheel="vizMmWheel(event)" ontouchstart="vizMmTouchStart(event)">
      <div class="mm-scene" id="mm-scene" style="transform:translate(${px}px,${py}px) scale(${z})">
        ${edgesSvg}
        ${labels}
        ${cards}
        ${controls}
      </div>
    </div>
    ${topbar}
    <div class="mm-controls">
      <div class="mm-ctrl-btn" onclick="vizMmToggleFull()" title="${vs.mm.full?'Exit full screen (Esc)':'Full screen'}">${vs.mm.full?'✕':'⛶'}</div>
      <div class="mm-ctrl-btn" onclick="vizMmZoom(1.2)">+</div>
      <div class="mm-ctrl-btn" onclick="vizMmZoom(0.83)">−</div>
      <div class="mm-ctrl-btn" onclick="vizMmReset()" title="Reset view">⤢</div>
      ${vizMmAllCollapsed()
        ? `<div class="mm-ctrl-btn mm-ctrl-wide" onclick="vizMmCollapseAll(false)" title="Expand all threads">⊞</div>`
        : `<div class="mm-ctrl-btn mm-ctrl-wide" onclick="vizMmCollapseAll(true)" title="Collapse all threads into their toggles">⊟</div>`}
    </div>
    <div class="mm-hint">drag to pan · scroll to zoom · drag a card to a spot then ✓ keep / ⤺ reset · ▸ pills · +N↳ connected fragments · <span style="color:#94a3b8">dashed curve</span> = Connected · <span style="color:var(--danger)">red border</span> = matches filter</div>
  </div>`;
}

/* ── Reader (right panel) ── */
function renderReader(){
  const R = vs.reader; if(!R) return '';
  const comp = vs.comps[R.compIdx];
  if(!comp) return `<div class="reader-empty">Thread not found.</div>`;
  const sp = vizThreadSpine(R.compIdx);
  const tree = mmBuildTree(comp);
  const label = vizThreadLabel(comp);
  const renamingThis = vs.rename && vs.rename.compIdx===R.compIdx;

  let html = `<div class="reader-head">
    <span class="thread-badge ${comp.open?'tb-open':'tb-resolved'}">${comp.open?'open':'resolved'}</span>
    ${renamingThis ? vizRenameEditorHtml() : `<span class="reader-title">${esc(label)}</span>${vizRenameTriggerHtml(R.compIdx)}`}
    <button class="reader-x" onclick="vizCloseReader()" title="Close">×</button>
  </div>`;

  const selOn = vs.sel && vs.sel.active && vs.sel.compIdx===R.compIdx;
  const draftOn = _draftOn();
  const vetted = vizThreadVetted(comp);
  const delArm = !!R.delArm;
  html += `<div class="reader-controls">
    <span style="color:var(--dim)">${comp.total} fragments · ${sp.spine.length} core idea${sp.spine.length!==1?'s':''}</span>
    <span class="viz-vetted ${vetted?'on':''}" onclick="${R.vetBusy?'':'vizToggleVetted('+comp.idx+')'}" title="${vetted?'Vetted — foundational work done. Click to unmark.':'Mark vetted once the connections, map positions, and RC/RCQ/OL fragments are tightened.'}">${R.vetBusy?'…':(vetted?'✓ Vetted':'○ Mark vetted')}</span>
    <span style="margin-left:auto;display:flex;gap:12px;align-items:center">
      ${(sp.spine.some(id=>(sp.tangentsOf[id]||[]).length)) ? `<a style="cursor:pointer;color:var(--accent,#2563eb)" onclick="vizToggleAllTangents()">${R.expanded && R.expanded.size ? 'collapse all' : 'expand all'}</a>` : ''}
      ${selOn ? '' : `<a style="cursor:pointer;color:var(--accent,#2563eb)" onclick="vizSelStart()" title="Select fragments to save into a new Info Processing page">⬇ Save…</a>`}
      ${(selOn||draftOn) ? '' : `<a style="cursor:pointer;color:var(--dim)" onclick="vizDraftToggle()" title="Stage connection edits in memory and Commit/Discard them as a batch (live writes off)">✎ Draft</a>`}
      ${(selOn||draftOn) ? '' : (delArm
        ? `<span class="viz-del-confirm">Delete all ${comp.total}? <a onclick="vizDeleteThread(${comp.idx})">${R.delBusy?'Deleting…':'Confirm'}</a> <a class="cancel" onclick="vizDeleteThreadCancel()">Cancel</a></span>`
        : `<a style="cursor:pointer;color:var(--danger)" onclick="vizDeleteThreadArm()" title="Archive every fragment in this thread in Notion">🗑 Delete thread</a>`)}
    </span>
  </div>`;

  if(draftOn){
    const d=vs.draft, n=_draftCount();
    html += `<div class="draft-bar">
      <span class="draft-tag">✎ Draft mode</span>
      <span style="color:var(--dim)">${n?`${n} fragment${n!==1?'s':''} changed · not yet saved`:'live writes paused — edits stage here'}</span>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button class="fe-btn" ${d.busy?'disabled':''} onclick="vizDraftDiscard()">Discard</button>
        <button class="fe-btn primary" ${(!n||d.busy)?'disabled':''} onclick="vizDraftCommit()">${d.busy?'Committing…':`Commit${n?' '+n:''}`}</button>
        ${!n?`<button class="fe-btn" onclick="vizDraftToggle()">Exit</button>`:''}
      </span>
    </div>`;
    if(d.msg) html += `<div class="sel-msg err">${esc(d.msg)}</div>`;
  }

  if(selOn){
    const s=vs.sel; const n=s.ids.size;
    html += `<div class="sel-bar">
      <span class="sel-count">${n} selected</span>
      <a class="sel-link" onclick="vizSelAll()">Select all</a>
      <a class="sel-link" onclick="vizSelClear()">Clear</a>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        ${s.st==='ok' && s.url ? `<a class="sel-link" style="color:var(--success,#16a34a)" href="${esc(s.url)}" target="_blank">✓ Open page ↗</a>` : ''}
        <button class="fe-btn" ${!n?'disabled':''} onclick="vizPillsBulkStart()" title="Add capture / goals / Knowledge Bank relations to all selected fragments">🔖 Relations</button>
        <button class="fe-btn" onclick="vizSelCancel()">Done</button>
        <button class="fe-btn primary" ${(!n||s.busy)?'disabled':''} onclick="vizSaveCreate()">${s.busy?'Saving…':`Save ${n||''} → IP page`}</button>
      </span>
    </div>`;
    if(s.msg) html += `<div class="sel-msg ${s.st==='error'?'err':'ok'}">${esc(s.msg)}</div>`;
    if(vs.pillsEdit && vs.pillsEdit.bulk) html += renderPillsEditor();
  }

  // The spine in reading order: anchor first, then each Builds-On subtree
  // walked depth-first (matches the editor + map), each Core with its tangents.
  html += `<div class="reader-body">`;
  if(!tree.displayOrder.length && !sp.orphans.length) html += `<div class="reader-empty">Empty thread.</div>`;
  tree.displayOrder.forEach((id, i)=>{
    html += renderSpineItem(R, id, i+1, sp.tangentsOf[id]||[]);
  });
  if(sp.orphans.length){
    html += `<div class="spine-num" style="padding:14px 18px 4px">Unattached</div>`;
    sp.orphans.forEach(id=> html += renderSpineItem(R, id, null, []));
  }
  html += `</div>`;
  return html;
}

// A spine fragment (Core Idea) + its tangent chips. Expanded tangents render
// inline beneath, recursively (a tangent can have its own sub-tangents).
function renderSpineItem(R, id, num, tangents){
  const n = vs.byId[id]; if(!n) return '';
  const isCore = isSpineType(n.type);
  const selOn = vs.sel && vs.sel.active;
  const picked = selOn && vs.sel.ids.has(id);
  let html = `<div class="spine-item ${picked?'sel-on':''}" id="spine-${id}" data-frag="${id}">`;
  const editing = vs.edit && vs.edit.id===id;
  html += `<div style="display:flex;align-items:center;gap:7px">
    ${selOn?`<span class="sel-check ${picked?'on':''}">${picked?'✓':''}</span>`:''}
    <span class="type-dot" style="background:${typeColor(n.type)}"></span>
    <span class="spine-num">${num?('— '+num+' —'):''} ${esc(n.type)}${n.resolved?' · ✓ resolved':''}</span>
    ${selOn?'':`<button class="fe-edit-btn ${(vs.pillsEdit&&!vs.pillsEdit.bulk&&vs.pillsEdit.ids[0]===id)?'on':''}" style="margin-left:auto" onclick="vizPillsToggle(event,'${id}')" title="Add / remove capture, goals & Knowledge Bank relations">${(vs.pillsEdit&&!vs.pillsEdit.bulk&&vs.pillsEdit.ids[0]===id)?'▾ pills':'🔖 pills'}</button>`}
    ${selOn?'':`<button class="fe-edit-btn ${editing?'on':''}" style="margin-left:0" onclick="vizEditToggle(event,'${id}')" title="Edit · connect · add">${editing?'▾ editing':'✎ edit'}</button>`}
  </div>`;
  html += `<div class="spine-text ${isCore?'is-core':''}">${esc(n.title)}</div>`;
  html += renderFragImages(n);
  html += renderCrossRow(n);
  if(tangents && tangents.length){
    html += `<div class="spine-tangents">`;
    for(const tid of tangents){
      html += renderTangentChip(R, tid);
    }
    html += `</div>`;
    // expanded tangents render inline, below the chip row
    for(const tid of tangents){
      if(R.expanded && R.expanded.has(tid)){
        html += renderTangentInline(R, tid, new Set([id]));
      }
    }
  }
  if(editing) html += renderFragEditor(id);
  if(vs.pillsEdit && !vs.pillsEdit.bulk && vs.pillsEdit.ids[0]===id) html += renderPillsEditor();
  html += `</div>`;
  return html;
}

function renderTangentChip(R, tid){
  const tn = vs.byId[tid]; if(!tn) return '';
  const cls = tn.type==='Open Loop'?'tc-ol':tn.type==='Referential CQ'?'tc-rcq':'tc-rc';
  const open = R.expanded && R.expanded.has(tid);
  return `<span class="tangent-chip ${cls} ${open?'tc-open':''}" onclick="vizToggleTangent(event,'${tid}')"><span class="caret">${open?'▾':'▸'}</span><span class="type-dot" style="background:${typeColor(tn.type)}"></span>${esc(TYPE_SHORT[tn.type]||'?')}: ${esc(tn.title.length>46?tn.title.slice(0,46)+'…':tn.title)}${(tn.images||[]).length?' 🖼':''}</span>`;
}

// Inline-expanded tangent: full text + metadata, plus chips for ITS own
// connected fragments (sub-tangents) so you can keep going deeper in place.
// `ancestry` guards against cycles.
function renderTangentInline(R, tid, ancestry){
  const tn = vs.byId[tid]; if(!tn) return '';
  const comp = vs.comps[R.compIdx];
  const inComp = new Set(comp.nodeIds);
  // Fragments already shown as top-level tangents of a Core Idea live on the
  // spine; don't also list them as sub-tangents here (avoids the same fragment
  // expanding inline in two places).
  const sp = vizThreadSpine(R.compIdx);
  const spineTangents = new Set();
  for(const cid of sp.spine) (sp.tangentsOf[cid]||[]).forEach(t=>spineTangents.add(t));
  const editing = vs.edit && vs.edit.id===tid;
  const selOn = vs.sel && vs.sel.active;
  const picked = selOn && vs.sel.ids.has(tid);
  let html = `<div class="tangent-inline tc-border-${tn.type==='Open Loop'?'ol':tn.type==='Referential CQ'?'rcq':'rc'} ${picked?'sel-on':''}" data-frag="${tid}">
    <div style="display:flex;align-items:center;gap:7px">
      ${selOn?`<span class="sel-check ${picked?'on':''}">${picked?'✓':''}</span>`:''}
      <span class="type-dot" style="background:${typeColor(tn.type)}"></span>
      <span class="spine-num">${esc(tn.type)}${tn.resolved?' · ✓ resolved':''}</span>
      ${selOn?'':`<button class="fe-edit-btn ${(vs.pillsEdit&&!vs.pillsEdit.bulk&&vs.pillsEdit.ids[0]===tid)?'on':''}" style="margin-left:auto" onclick="vizPillsToggle(event,'${tid}')" title="Add / remove capture, goals & Knowledge Bank relations">${(vs.pillsEdit&&!vs.pillsEdit.bulk&&vs.pillsEdit.ids[0]===tid)?'▾ pills':'🔖 pills'}</button>`}
      ${selOn?'':`<button class="fe-edit-btn ${editing?'on':''}" style="margin-left:0" onclick="vizEditToggle(event,'${tid}')" title="Edit · connect · add">${editing?'▾ editing':'✎ edit'}</button>`}
    </div>
    <div class="spine-text">${esc(tn.title)}</div>`;
  html += renderFragImages(tn);
  html += renderCrossRow(tn);
  if(editing) html += renderFragEditor(tid);
  if(vs.pillsEdit && !vs.pillsEdit.bulk && vs.pillsEdit.ids[0]===tid) html += renderPillsEditor();

  // sub-tangents: this fragment's own connections within the thread, minus
  // ancestry (cycle guard) and minus anything already on the spine.
  const subs = new Set();
  [...tn.buildsOn, ...tn.connected].forEach(t=>{ if(inComp.has(t)) subs.add(t); });
  comp.nodeIds.forEach(mid=>{
    const m=vs.byId[mid];
    if([...m.buildsOn, ...m.connected].includes(tid)) subs.add(mid);
  });
  ancestry.forEach(a=>subs.delete(a));
  subs.delete(tid);
  // only RC/RCQ/OL that aren't themselves spine-level tangents
  const subList = [...subs].filter(sid=>!isSpineType(vs.byId[sid].type) && !spineTangents.has(sid));
  if(subList.length){
    html += `<div class="spine-tangents" style="margin-top:8px">`;
    for(const sid of subList) html += renderTangentChip(R, sid);
    html += `</div>`;
    const nextAnc = new Set(ancestry); nextAnc.add(tid);
    for(const sid of subList){
      if(R.expanded && R.expanded.has(sid)) html += renderTangentInline(R, sid, nextAnc);
    }
  }
  html += `</div>`;
  return html;
}

function renderDenseMeta(n){
  const chips=[];
  // capture instances (with system emoji); fall back to the Primary Source name
  (n.captureInstances||[]).forEach(o=>chips.push(`<span class="dense-chip chip-src">${esc(REL_EMOJI[o.system]||'')} ${esc(o.title)}</span>`));
  if(!(n.captureInstances||[]).length && n.primarySource)
    chips.push(`<span class="dense-chip chip-src">${esc(REL_EMOJI[n.primarySource]||'')} ${esc(n.primarySource)}</span>`);
  (n.goals||[]).forEach(g=>chips.push(`<span class="dense-chip chip-goal">${esc(REL_EMOJI[g.system]||'🎯')} ${esc(g.title)}</span>`));
  n.kb.forEach(k=>chips.push(`<span class="dense-chip chip-kb">${esc(REL_EMOJI['Knowledge Bank'])} ${esc(k)}</span>`));
  if(!chips.length) return '';
  return `<div class="spine-densemeta">${chips.join('')}</div>`;
}

function vizOpenReader(compIdx){
  vs.reader={compIdx, expanded:new Set()};
  vs.edit=null; vs.sel=null;
  if(vs.rename && vs.rename.compIdx!==compIdx) vs.rename=null;
  if(vs.selectedComp!==compIdx){ vs.selectedComp=compIdx; vs.mm.inited=false; }
  const comp = vs.comps[compIdx];
